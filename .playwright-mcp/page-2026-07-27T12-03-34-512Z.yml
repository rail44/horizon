                  - generic [ref=e418]: キューされたメッセージ
              - paragraph [ref=e426]: Agent が現在のタスクに取り組んでいるあいだも、フォローアップメッセージをキューに追加できます。指示は順番に待機し、準備ができ次第自動的に実行されます。
              - heading [level=3] [ref=e428]:
