              - heading [level=2] [ref=e397]:
                - link "Copy link to -1" [ref=e398] [cursor=pointer]:
                  - /url: "#-1"
                  - generic [ref=e399]: チェックポイント
              - paragraph [ref=e407]: チェックポイントは、Agent セッション中にコードベースのスナップショットを保存します。Agent は大きな変更を加える前に自動的にチェックポイントを作成し、変更されたすべてのファイルの状態をキャプチャします。
              - paragraph [ref=e408]:
                - text: Agent が誤った方向に進んだ場合は、チャットタイムライン内の任意のチェックポイントをクリックして、その時点でのファイルをプレビューし、その後復元してすべてのファイルをその状態に戻せます。過去のリクエスト上の
                - code [ref=e409]: Restore Checkpoint
                - text: ボタン、またはメッセージにカーソルを重ねたときに表示される + ボタンから復元することもできます。
              - paragraph [ref=e410]: チェックポイントは、探索的な作業、複雑なリファクタリング、安全にロールバックできるポイントが欲しい反復的な開発に役立ちます。
              - alert [ref=e411]:
                - paragraph [ref=e415]: チェックポイントはローカルに保存され、Git とは分離されています。Agent の変更を元に戻す目的だけに使用し、永続的なバージョン管理には Git を使用してください。
              - heading [level=2] [ref=e416]:
