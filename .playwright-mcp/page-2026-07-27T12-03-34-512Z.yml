              - paragraph [ref=e298]: "Agent は次の 3 つのコンポーネントで構成されています:"
              - list [ref=e299]:
                - listitem [ref=e300]:
                  - strong [ref=e301]: Instructions
                  - text: ": Agent の挙動を制御する system prompt と"
                  - link "rules" [ref=e302] [cursor=pointer]:
                    - /url: /docs/rules
                - listitem [ref=e303]:
                  - strong [ref=e304]: Tools
                  - text: ": ファイル編集、コードベースの検索、ターミナル実行など"
                - listitem [ref=e305]:
                  - strong [ref=e306]: Model
                  - text: ": タスクに合わせて選ぶ agent モデル"
              - paragraph [ref=e307]: Cursor の agent は、サポートしている各モデルごとにこれらのコンポーネントを組み合わせて動かし、あらゆる最先端モデル向けに Instructions と Tools を個別にチューニングします。新しいモデルが登場しても、Cursor がモデル固有の最適化を処理するため、あなたはソフトウェア開発に集中できます。
              - heading [level=2] [ref=e308]:
                - link "Copy link to" [ref=e309] [cursor=pointer]:
                  - /url: "#"
                  - generic [ref=e310]: ツール
              - paragraph [ref=e318]: ツール は Agent の基本的な構成要素です。コードベースや Web を検索して関連情報を見つけたり、ファイルを編集したり、ターミナルコマンドを実行したりするために使われます。
              - paragraph [ref=e319]:
