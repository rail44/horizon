              - paragraph [ref=f38e132]: Admins can enable the router per team or group, restrict which optimization modes members can use, set the default mode, and allow or block underlying models.
              - paragraph [ref=f38e133]: Cursor Router is available across desktop, web, iOS, CLI, and our SDK. It is on by default for Teams plans. Enterprise admins can enable it from the dashboard.
