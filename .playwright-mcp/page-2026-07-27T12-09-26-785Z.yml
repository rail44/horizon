              - paragraph [ref=f38e91]: "Select Auto, then choose how the router optimizes:"
              - list [ref=f38e92]:
                - listitem [ref=f38e93]:
                  - strong [ref=f38e94]: "Intelligence:"
                  - text: Frontier quality, matching the most expensive and powerful models that might be out of reach for daily use.
                - listitem [ref=f38e95]:
                  - strong [ref=f38e96]: "Balance:"
                  - text: Strong quality, matching the frontier models that most people like to daily drive.
                - listitem [ref=f38e97]:
                  - strong [ref=f38e98]: "Cost:"
                  - text: Good quality, reaching the highest available intelligence while optimizing token spend.
              - paragraph [ref=f38e99]: Balance and Intelligence bill at the routed model’s rate. Each mode moves you along the cost-intelligence pareto frontier.
