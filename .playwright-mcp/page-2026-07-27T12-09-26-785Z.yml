            - generic [ref=f38e270]:
              - paragraph [ref=f38e271]:
                - link "Cursor for iOS" [ref=f38e272] [cursor=pointer]:
                  - /url: https://cursor.com/blog/ios-mobile-app
                - text: is now available in public beta on all paid plans. Launch and manage always-on agents from anywhere.
              - heading [level=2] [ref=f38e273]:
                - link "Link to this section" [ref=f38e274] [cursor=pointer]:
                  - /url: "#cloud-agents-on-mobile"
                  - text: "#"
                - text: Cloud agents on mobile
              - paragraph [ref=f38e275]: Open the Cursor mobile app, choose a repo, and launch an agent the same way you would on the desktop app. Pick any frontier model, describe ideas out loud with voice input, and use slash commands to guide Cursor in the right direction.
              - figure [ref=f38e276]
              - paragraph [ref=f38e279]: Cloud agents run in isolated virtual machines with full development environments to test, verify, and demo work. Move sessions from local to cloud to keep them running with your laptop closed.
              - heading [level=2] [ref=f38e280]:
                - link "Link to this section" [ref=f38e281] [cursor=pointer]:
                  - /url: "#remote-control"
                  - text: "#"
                - text: Remote Control
              - paragraph [ref=f38e282]:
                - text: Use
                - link "Remote Control" [ref=f38e283] [cursor=pointer]:
                  - /url: https://cursor.com/docs/cloud-agent/mobile#remote-control
                - text: in the
                - link "Agents Window" [ref=f38e284] [cursor=pointer]:
                  - /url: https://cursor.com/docs/agent/agents-window
                - text: to take an agent you're running on your computer and keep directing it from your phone.
              - figure [ref=f38e285]:
                - img "Remote Control" [ref=f38e287]
              - paragraph [ref=f38e288]: You can also turn on a setting to keep your computer awake, so your machine stays reachable while you're away from your desk.
              - paragraph [ref=f38e289]:
                - text: On Teams and Enterprise plans, admins must enable Remote Control from the
                - link "Cursor Dashboard" [ref=f38e290] [cursor=pointer]:
                  - /url: https://cursor.com/dashboard/cloud-agents#self-hosted
                - text: .
              - heading [level=2] [ref=f38e291]:
                - link "Link to this section" [ref=f38e292] [cursor=pointer]:
                  - /url: "#live-activities-and-push-notifications"
                  - text: "#"
                - text: Live Activities and push notifications
              - paragraph [ref=f38e293]: Track the status of your agents with Live Activities on your lock screen. Get push notifications when an agent finishes, needs input, or is ready for review.
              - figure [ref=f38e294]
              - heading [level=2] [ref=f38e297]:
                - link "Link to this section" [ref=f38e298] [cursor=pointer]:
                  - /url: "#artifacts-and-scm"
                  - text: "#"
                - text: Artifacts and SCM
              - paragraph [ref=f38e299]: Review demos, screenshots, logs, and diffs from your phone. Leave follow-up instructions, or merge the PR directly from the app.
              - figure [ref=f38e300]
              - paragraph [ref=f38e303]:
                - link "Download Cursor for iOS" [ref=f38e304] [cursor=pointer]:
                  - /url: https://apps.apple.com/app/cursor/id6767085653
                - text: to start building from your phone. Read our
