      - article [ref=f38e143]:
        - generic [ref=f38e144]:
          - paragraph [ref=f38e146]:
            - link [ref=f38e147] [cursor=pointer]:
              - /url: /changelog/slack-improvements
              - time [ref=f38e148]: Jul 17, 2026
          - generic [ref=f38e150]:
            - heading [level=1] [ref=f38e152]:
              - link "Improvements to Cursor in Slack" [ref=f38e153] [cursor=pointer]:
                - /url: /changelog/slack-improvements
            - generic [ref=f38e154]:
              - paragraph [ref=f38e155]: Cursor in Slack now shares a plan before it starts, runs in multi-repo environments, and can work across channels and threads.
              - heading [level=2] [ref=f38e156]:
                - link "Link to this section" [ref=f38e157] [cursor=pointer]:
                  - /url: "#interaction-improvements"
                  - text: "#"
                - text: Interaction improvements
              - paragraph [ref=f38e158]: Cursor now responds with a plan before it begins, so you can jump in and redirect early. As it works, it updates its status so you can follow each step.
              - figure
              - paragraph [ref=f38e159]: We also refined how Cursor's responses look in Slack. In-message buttons are gone, replaced by compact footer links. Tables, PRs, and artifacts now render more cleanly.
              - heading [level=2] [ref=f38e160]:
                - link "Link to this section" [ref=f38e161] [cursor=pointer]:
                  - /url: "#multi-repo-environment-support"
                  - text: "#"
                - text: Multi-repo environment support
              - paragraph [ref=f38e162]: From Slack, Cursor can now start in a named multi-repo environment instead of a single default repository. If your frontend, backend, and shared code live in separate repos, Cursor reads your request and targets the environment that gives it access to all of them.
              - paragraph [ref=f38e163]:
                - text: Mid-task, when Cursor needs a repo outside the current environment, it prompts you with a
                - strong [ref=f38e164]: Switch repository
                - text: button. Click it, choose the repo or environment, and Cursor picks up right where it left off.
              - heading [level=2] [ref=f38e165]:
                - link "Link to this section" [ref=f38e166] [cursor=pointer]:
                  - /url: "#cross-channel-workflows"
                  - text: "#"
                - text: Cross-channel workflows
              - paragraph [ref=f38e167]: Cursor can now read from and send messages to other Slack channels and threads. During a task, it can pull context from elsewhere in the workspace and post updates back in the original thread or the relevant channel.
              - paragraph [ref=f38e168]:
                - text: Learn more in our
                - link "Slack docs" [ref=f38e169] [cursor=pointer]:
                  - /url: https://cursor.com/docs/integrations/slack
                - text: .
      - article [ref=f38e170]:
        - generic [ref=f38e171]:
          - paragraph [ref=f38e173]:
            - link "3.11 Jul 10, 2026" [ref=f38e174] [cursor=pointer]:
              - /url: /changelog/side-chat
              - generic [ref=f38e175]: "3.11"
              - time [ref=f38e177]: Jul 10, 2026
          - generic [ref=f38e179]:
            - heading [level=1] [ref=f38e181]:
              - link "Side Chats and Conversation Search" [ref=f38e182] [cursor=pointer]:
                - /url: /changelog/side-chat
            - generic [ref=f38e183]:
              - paragraph [ref=f38e184]: This release makes it easier to stay in flow with side chats that run alongside your main chat, the ability to search agent transcripts, and simplified project and repo pickers.
              - heading [level=2] [ref=f38e185]:
                - link "Link to this section" [ref=f38e186] [cursor=pointer]:
                  - /url: "#side-chats"
                  - text: "#"
                - text: Side chats
              - paragraph [ref=f38e187]:
                - text: Open a side chat to ask questions, explore ideas, and investigate tangents without interrupting your main agent conversation. Use
                - code [ref=f38e188]: /side
                - text: ","
                - code [ref=f38e189]: /btw
                - text: ", or the plus button at the top of the chat panel to create a new side chat that has context from the main chat."
              - figure
              - paragraph [ref=f38e190]: Each side chat is a durable, full agent conversation that you can follow up on, revisit later, and at-mention to pull context back into the main thread.
              - paragraph [ref=f38e191]: By default, side chats focus on reading, searching, and answering. Use them to ask clarification questions, research alternatives without committing to a pivot, and sanity-check a decision while the main agent continues running.
              - heading [level=2] [ref=f38e192]:
                - link "Link to this section" [ref=f38e193] [cursor=pointer]:
                  - /url: "#conversation-search"
                  - text: "#"
                - text: Conversation search
              - paragraph [ref=f38e194]:
                - text: Find past agent chats faster with search results that go beyond names and PR numbers. In the
                - link "Agents Window" [ref=f38e195] [cursor=pointer]:
                  - /url: https://cursor.com/docs/agent/agents-window
                - text: ", you can search agent transcripts from the command palette (Cmd+K). Cursor builds a local search index that scales search to thousands of conversations with snappy performance."
              - figure
              - paragraph [ref=f38e196]: You can also search within an existing conversation using Cmd+F. Jump between matches, see a match counter, and keep searching as you scroll through long transcripts.
              - heading [level=2] [ref=f38e197]:
                - link "Link to this section" [ref=f38e198] [cursor=pointer]:
                  - /url: "#redesigned-project-and-repo-pickers"
                  - text: "#"
                - text: Redesigned project and repo pickers
              - paragraph [ref=f38e199]: We've simplified the project and repo pickers and made them more powerful. You can now stay in the picker for workflows that used to send you elsewhere. For example, you can create a project and connect GitHub, GitLab, or Azure DevOps without leaving the picker.
              - figure [ref=f38e200]:
                - img "Redesigned project and repo pickers" [ref=f38e202]
              - paragraph [ref=f38e203]: Search is now scoped to where you're working—This Computer, Cloud, or a specific remote machine—instead of one global search box. You can also remove projects from Recents with one click.
              - heading [level=2] [ref=f38e204]:
                - link "Link to this section" [ref=f38e205] [cursor=pointer]:
                  - /url: "#new-cloud-agent-hooks"
                  - text: "#"
                - text: New cloud agent hooks
              - paragraph [ref=f38e206]:
                - text: "Cloud agents already support team hooks around tool execution and file/shell work. We've added new hooks that let you observe and control the agent conversation itself: prompts, responses, thinking, subagents, compaction, and turn completion. See all the supported hooks in our"
                - link "docs" [ref=f38e207] [cursor=pointer]:
                  - /url: https://cursor.com/docs/hooks#cloud-agent-support
                - text: .
              - paragraph [ref=f38e208]:
                - text: New hooks like
                - code [ref=f38e209]: beforeSubmitPrompt
                - text: ","
                - code [ref=f38e210]: afterAgentResponse
                - text: ","
                - code [ref=f38e211]: afterAgentThought
                - text: ","
                - code [ref=f38e212]: stop
                - text: ","
                - code [ref=f38e213]: subagentStart
                - text: ", and more allow you to better observe output and reasoning, control subagents, and build self-correcting loops with cloud agents."
              - generic [ref=f38e215]:
                - heading [level=3] [ref=f38e216]:
                  - button [ref=f38e217] [cursor=pointer]:
                    - text: Picker Improvements
                    - generic [ref=f38e218]: ↓
                - region "Picker Improvements"
