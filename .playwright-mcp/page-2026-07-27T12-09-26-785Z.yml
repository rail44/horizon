            - generic [ref=f38e55]:
              - paragraph [ref=f38e56]: Auto mode is now powered by Cursor Router.
              - paragraph [ref=f38e57]:
                - link "Cursor Router" [ref=f38e58] [cursor=pointer]:
                  - /url: https://cursor.com/blog/router
                - text: is our intelligent model router. It analyzes each request and sends it to the right model for the job. Frontier models handle work that demands them. Price-efficient models handle the rest.
