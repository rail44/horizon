            - generic [ref=f13e429] [cursor=pointer]: File & folder condensation
          - generic [ref=f13e430]:
            - text: "While chat summarization handles long conversations, Cursor uses a different strategy for managing large files and folders:"
            - strong [ref=f13e431]: smart condensation
            - text: . When you include files in your conversation, Cursor determines the best way to present them based on their size and available context space.
          - generic [ref=f13e432]: "Here are the different states a file/folder can be in:"
          - heading "Navigate to header Condensed" [level=3] [ref=f13e433]:
            - link "Navigate to header" [ref=f13e434] [cursor=pointer]:
              - /url: "#condensed"
            - generic [ref=f13e438] [cursor=pointer]: Condensed
          - generic [ref=f13e439]: When files or folders are too large to fit within the context window, Cursor automatically condenses them. Condensing shows the model key structural elements like function signatures, classes, and methods. From this condensed view, the model can choose to expand specific files if needed. This approach maximizes effective use of the available context window.
          - img "Context menu" [ref=f13e447]
          - heading "Navigate to header Significantly condensed" [level=3] [ref=f13e448]:
            - link "Navigate to header" [ref=f13e449] [cursor=pointer]:
              - /url: "#significantly-condensed"
            - generic [ref=f13e453] [cursor=pointer]: Significantly condensed
          - generic [ref=f13e454]: When a file name appears with a “Significantly Condensed” label, the file was too large to include in full, even in condensed form. Only the file name will be shown to the model.
          - heading "Navigate to header Not included" [level=3] [ref=f13e455]:
            - link "Navigate to header" [ref=f13e456] [cursor=pointer]:
              - /url: "#not-included"
            - generic [ref=f13e460] [cursor=pointer]: Not included
          - generic [ref=f13e461]: When a warning icon appears next to a file or folder, the item is too large to be included in the context window, even in condensed form. This helps you understand which parts of your codebase are accessible to the model.
