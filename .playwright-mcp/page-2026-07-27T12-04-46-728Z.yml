            - generic [ref=f13e369] [cursor=pointer]: Message summarization
          - generic [ref=f13e370]: As conversations grow longer, Cursor automatically summarizes and manages context to keep your chats efficient. Learn how to use the context menu and understand how files are condensed to fit within model context windows.
