                      - 'heading "Navigate to header Wave 13: Merry Shipmas" [level=1] [ref=f34e2178]':
                        - link "Navigate to header" [ref=f34e2179] [cursor=pointer]:
                          - /url: "#wave-13-merry-shipmas"
                        - generic [ref=f34e2184] [cursor=pointer]: "Wave 13: Merry Shipmas"
                      - generic [ref=f34e2185]: Wave 13 brings first-class support for parallel, multi-agent sessions in Windsurf, along with Git worktrees, side-by-side Cascade panes, and a dedicated terminal profile for more reliable agent execution.
                      - heading "Navigate to header SWE-1.5 Free" [level=2] [ref=f34e2186]:
                        - link "Navigate to header" [ref=f34e2187] [cursor=pointer]:
                          - /url: "#swe-1-5-free"
                        - generic [ref=f34e2192] [cursor=pointer]: SWE-1.5 Free
                      - generic [ref=f34e2193]: Our near-frontier model, SWE-1.5, is now available for free to all users for the next 3 months. SWE-1.5 Free has the full intelligence of SWE-1.5, with the same coding performance on SWE-Bench-Pro, but delivered at standard throughput speeds. The original variant of SWE-1.5 hosted on Cerebras will continue to be available for paid users. SWE-1.5 Free will replace SWE-1 as the default model in Windsurf starting today.
                      - heading "Navigate to header Git Worktree Support" [level=2] [ref=f34e2194]:
                        - link "Navigate to header" [ref=f34e2195] [cursor=pointer]:
                          - /url: "#git-worktree-support"
                        - generic [ref=f34e2200] [cursor=pointer]: Git Worktree Support
                      - generic [ref=f34e2201]: Windsurf now supports Git worktrees, letting you spawn multiple Cascade sessions in the same repository without conflicts. Git worktrees check out different branches into separate directories while sharing the same Git history.
                      - heading "Navigate to header Multi-Cascade Panes & Tabs" [level=2] [ref=f34e2202]:
                        - link "Navigate to header" [ref=f34e2203] [cursor=pointer]:
                          - /url: "#multi-cascade-panes-&-tabs"
                        - generic [ref=f34e2208] [cursor=pointer]: Multi-Cascade Panes & Tabs
                      - generic [ref=f34e2209]: You can already run multiple Cascade sessions in Windsurf at the same time. Now, you can view and interact with them in separate panes and tabs within the same window. This lets you monitor progress and compare outputs of sessions side-by-side, or even turn Windsurf into a big Cascade dashboard.
                      - heading "Navigate to header Cascade Dedicated Terminal (Beta)" [level=2] [ref=f34e2210]:
                        - link "Navigate to header" [ref=f34e2211] [cursor=pointer]:
                          - /url: "#cascade-dedicated-terminal-beta"
                        - generic [ref=f34e2216] [cursor=pointer]: Cascade Dedicated Terminal (Beta)
                      - generic [ref=f34e2217]: Windsurf introduces a new approach for letting agents execute terminal commands. Instead of your default shell, Cascade will now run commands in a dedicated zsh shell specifically configured for reliability. The Cascade Dedicated Terminal can use the environment variables you set in your .zshrc configuration and is interactive, which means you can answer any prompts from shell scripts without having to break your flow. This should improve the reliability and speed of shell commands, especially for users with complicated prompts (e.g., powerlevel10k).
                      - generic [ref=f34e2218]: In this version, the Cascade Dedicated Terminal will be opt-in for Windsurf Stable on macOS. If you are experiencing issues with the older legacy terminal, we recommend switching to the new terminal early. We expect to make this feature the default in the future, while maintaining the legacy terminal extension for backwards compatibility purposes. You can opt-in in the Windsurf User Settings -> Disable Windsurf Legacy Terminal Profile.
                      - heading "Navigate to header Context Window Indicator" [level=2] [ref=f34e2219]:
                        - link "Navigate to header" [ref=f34e2220] [cursor=pointer]:
                          - /url: "#context-window-indicator"
                        - generic [ref=f34e2225] [cursor=pointer]: Context Window Indicator
                      - generic [ref=f34e2226]: When a model’s context window grows too long, earlier context can be dropped without warning and performance can degrade. Cascade already extends the window by occasionally summarizing messages and clearing history. This release adds a visual indicator to see how much of your context window is currently in use, helping you anticipate limits and decide when to start a new session.
                      - heading "Navigate to header Cascade Hooks" [level=2] [ref=f34e2227]:
                        - link "Navigate to header" [ref=f34e2228] [cursor=pointer]:
                          - /url: "#cascade-hooks"
                        - generic [ref=f34e2233] [cursor=pointer]: Cascade Hooks
                      - generic [ref=f34e2234]: Execute custom commands at key points during Cascade’s workflow, including on model response for auditing purposes.
                      - heading "Navigate to header System-level Rules & Workflows" [level=2] [ref=f34e2235]:
                        - link "Navigate to header" [ref=f34e2236] [cursor=pointer]:
                          - /url: "#system-level-rules-&-workflows"
                        - generic [ref=f34e2241] [cursor=pointer]: System-level Rules & Workflows
                      - generic [ref=f34e2242]: Enterprises can deploy rules and workflows via MDM policies, allowing organizations to place rules and workflows files on users’ machines.
