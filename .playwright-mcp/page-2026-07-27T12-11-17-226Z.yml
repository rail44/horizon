sure). ## Safe Harbor Windsurf supports safe harbor for security researchers who: * Make a good faith effort to avoid privacy violations, destruction of data, and interruption or degradation of our services * Only interact with accounts you own or with explicit permission of the account holder * Do not exploit a security issue you discover for any reason other than testing * Report any vulnerability you've discovered promptly * Follow the guidelines outlined in this document We will not take legal action against you or administrative action against your account if you act according to this policy. *Last updated: December 10, 2024* # Tab Source: https://docs.windsurf.com/tab/overview A powerful next-intent prediction experience routed to a single keystroke. **Windsurf Tab** has evolved from a simple autocomplete tool into a contextually aware diff-suggestion and navigation engine for writing code. It is powered by SWE-1-mini, our in-house model trained from scratch to optimize for speed and flow awareness. <Frame> <video autoPlay muted loop playsInline src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/tabdemo.mp4\" /> </Frame> Suggestions are based on the context of your code, terminal, Cascade chat history, your prior actions around the editor, and even your clipboard (must opt in via advanced Settings). Tab is able to make edits *both before and after* your current cursor position. You can press `esc` to cancel a suggestion. Suggestions will also disappear if you continue typing or navigating without accepting them. ## Keyboard Shortcuts * **Accept suggestion**: `tab` * **Cancel suggestion**: `esc` * **Accept suggestion word-by-word**: `⌘+→` (VS Code), `⌥+⇧+\\` (JetBrains) * **Next/previous suggestion**: `⌥+]`/`⌥+[` ## Tab to Jump Windsurf can also anticipate your next cursor position and prompt you with a `Tab to Jump` label at a certain line in the editor, allowing you to easily navigate through your file. If you accept by simply pressing `tab`, then you will be taken to that next position. <Frame> <video style={{ transform: 'scale(1.12)' }} autoPlay muted loop playsInline src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/tab-to-jump.mp4\" /> </Frame> ## Tab to Import After defining a new dependency to use in a file, just simply hit `tab` to import it at the top of the file once the hint shows. Your cursor will stay in the same position. <Frame> <video autoPlay muted loop playsInline src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/tab-import.mp4\" /> </Frame> ## Settings Windsurf Tab is split up into two main configurable parts: Autocomplete and Supercomplete. Autocompletes typically appear at your cursor, and Supercompletes appear either in small windows around your cursor, which can suggest both deletions and additions. Autocomplete and Supercomplete can be toggled on and off. Autocomplete speeds can also be configured between Slow, Default, and Fast modes. You can also opt-in to using your clipboard as context. This means if you copy something to your clipboard, Windsurf will be able to use it as context. You can also toggle Tab to Import and Tab to Jump functionalities, and choose whether or not you want to highlight the code after an accepted Tab suggestion. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/tab-settings.png\" /> </Frame> ## Fill In The Middle (FIM) Windsurf Tab can Fill In The Middle (FIM), meaning it can make suggestions while your cursor is in the middle of a line of code. <Frame> <video autoPlay muted loop playsInline src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/inline-fim.mp4\" /> </Frame> Read more about in-line FIM on our blog [here](https://windsurf.com/blog/inline-fim-code-suggestions). ## Terminal Context Awareness Windsurf Tab is also context aware of your the content of your terminal. <Frame> <video autoPlay muted loop playsInline src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/tab-terminal-context.mp4\" /> </Frame> # General Issues Source: https://docs.windsurf.com/troubleshooting/plugins-common-issues ### I subscribed to Pro but I'm stuck on the Free tier First, give it a few minutes to update. If that doesn't work, try logging out of Windsurf on the website, restarting your IDE, and logging back into Windsurf. Additionally, please make sure you have the latest version of Windsurf installed. ### How do I cancel my Pro/Teams subscription? You can cancel your paid plan by going to your Profile by clicking your icon on the top right of the [Windsurf website](https://windsurf.com/profile). To cancel your Pro subscription, navigate to the `Billing` page in the navigation panel on the left and click \"Cancel Plan\". To cancel your Teams subscription, navigate to the `Manage Team` page in the navigation panel on the left and click \"Cancel Plan\". ### How do I disable code snippet telemetry? As mentioned in our [security page](https://windsurf.com/security), you can opt out of code snippet telemetry by going to your settings [account settings](https://windsurf.com/settings). For more information, please visit our [Terms of Service](https://windsurf.com/terms-of-service-individual). ### How do I delete my account? You can delete your account by going to your settings [account settings](https://windsurf.com/settings), scrolling down and clicking on \"Delete Account\". <Note>If you are a member within an organization, please reach out to your administrator.</Note> ### How do I request a feature? You can vote, comment, and request features on our [feature request forum](https://codeium.canny.io/feature-requests). You can also reach out to us on Twitter/X! [@windsurf\\_ai](https://x.com/windsurf_ai) ### My Windsurf Chat panel goes blank Please reach out to us if this happens! A screen recording would be much appreciated. This can often be solved by clearing your chat history. ### How do I download diagnostic logs to send to the support team? Please see the intructions for various plugins [here](/troubleshooting/gathering-logs) # Eclipse Source: https://docs.windsurf.com/troubleshooting/plugins-enterprise/eclipse # Supported Versions Version 4.25+ (2022-09+) # Gathering extension logs In Eclipse, logs are written to the following paths: * **Mac/Linux**: \\~/.codeium/codeium.log * **Windows**: C:\\Users\\<username>.codeium\\codeium.log # How to reset or change your Enterprise URL 1. Open the settings/preferences dialog. 2. Select Codeium. 3. Set the Portal URL to `<NEW_URL>`. Then click the Apply and Close button. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/plugins/troubleshooting-eclipse-portal-url.jpg\" /> </Frame> # Known IDE issues and solutions ## Codeium isn't starting If Codeium isn't starting up, use the logs to debug what the cause could be (See above). If you are not able to resolve the issue, file a help request by submitting a ticket at help.codeium.com. Make sure to include the logs referenced above to help our team debug the issue as quickly as possible. ## Codeium Chat shows an empty screen If you are using Windows 10, it's possible you need to install **WebView2** to switch the Eclipse web renderer from Internet Explorer to Edge. You can see if this is the case by right-clicking --> `Properties` and seeing if there is an Internet Explorer icon. ## Certificate issue This issue may be indicated by the following errors in the logs: ``` Failed to fetch extension version at <YourDomainURL> javax.net.ssl.SSLHandshakeException: PKIX path building failed: sun.security.provider.certpath.SunCertPathBuilderException: unable to find valid certification path to requested target ``` Unlike other IDEs, Eclipse does not use the OS certificate store. You will have to load the certificates to the Java keystore. * SaaS users will have to load the Codeium Github URL * Self-hosted (On-prem) users will have to load their Codeium Enterprise domain URL as well as the Codeium Github URL **Note**: This is an example for SaaS users, but the process is the same. *For enterprise users - Your certificate is issued and managed by your local IT or Admin team. Please reach out to them for assistance with installing the necessary certificates on your system.* 1. Export the certificate for [https://exafunction.github.io/](https://exafunction.github.io/) from the browser as `githubio.cer` file In Chrome: navigate to the website, click the padlock, click `Connection is secure`, click `Certificate is valid`, go to the `Details` tab, press the `Copy to File...` button 2. Import in JDK/JRE keystore: (Need to run from cmd prompt opened with \"Administrator\" privilege) ``` keytool -import -noprompt -trustcacerts -alias codeiumgithub -file githubio.cer -keystore \"%JAVA_HOME%/jre/lib/security/ cacerts\" -storepass changeit ``` 3. Verify that the certificate is added to the Keystore by executing: ``` keytool -list -keystore \"%JAVA_HOME%/jre/lib/security/ cacerts\" | findstr codeium ``` Enter the Keystore password. 4. Restart Eclipse and browse the marketplace extension from an internal browser. You should be directed to trust the unsigned content. 5. In some cases you might also need to pass the certificates path in VM arguments by editing your eclipse.ini file and adding the path: ``` -Djavax.net.ssl.trustStore=\"path-to-your-certificates\" ``` # JetBrains Source: https://docs.windsurf.com/troubleshooting/plugins-enterprise/jetbrains # Supported Versions Version 2022.3 or greater. * JetBrains Fleet or Reshaper are not supported * IDEs with remote SSH support require version 2023.3 or greater # Gathering extension logs Starting in extension version 1.10.0, the Chat Panel has an Extension Diagnostics button on the Settings page. This button will automatically collect relevant logs and parameters into a text file that can be downloaded. For older versions of the extension: 1. Logs are written to the idea.log file. To locate this file, go to the `Help > Show Log in Finder/Explorer` menu option 2. Export or copy the logs # How to reset or change your Enterprise URL 1. Go to `Tools → Codeium Enterprise → Reset Codeium Enterprise Updater`. 2. Enter the new URL ensuring no leading or trailing whitespace. 3. Restart your IDE. 4. After restarting, you will be prompted to log in. # Known IDE issues and solutions ## Codeium Chat doesn't work (or Codeium doesn't work at all) If the Codeium JetBrains extension isn't working, a good first step is to try and reset the plugin by going to `Help > Find Action > Reset Codeium Enterprise Updater`. If the issue is isolated to a few users, this is likely because the Enterprise Domain URL certificate is not loaded to your IDE. Your team's admin should know how to do this. ## Codeium Chat not being displayed Usually, you will see the following error in the logs: ``` JCEF is not supported in this env or failed to initialize ``` JCEF is a browser needed to display Codeium Chat. To fix this, go to `Help > Find Actions > Choose Java Boot Runtime` and pick a version that has JCEF bundled. ## Certificate Issues If you encounter the following errors: ``` Failed to fetch extension base URL at <YourDomainURL> ``` ``` PKIX path building failed: sun.security.provider.certpath.SunCertPathBuilderException: unable to find valid certification path to requested target ``` This suggests that the Codeium extension is unable to trust the TLS connection to your enterprise portal / API server because it does not trust the certificate being presented. This either means that the certificate presented by the Codeium deployment is untrusted or a certificate presented by a corporate proxy intercepting the request is untrusted. In either case, the most preferable solution is to ensure that the root certificate that signed this certificate is properly installed on end-user machines in the appropriate location. JetBrains IDEs and most other IDEs load certificates from the operating system's default location. Your certificate is issued and managed by your local IT or Admin team. Please reach out to them for assistance with installing the necessary certificates on your system. It is important that the full certificate chain is being presented from wherever TLS is being terminated. Oftentimes, if only the leaf certificate is presented, JetBrains IDE and other IDEs are unable to verify its authenticity because they are not aware of the intermediate certificate which validates the leaf certificate and is validated by the root certificate. Browsers are often able to work around this issue as users will likely have encountered a different website that does present the full certificate chain, so the intermediate cert is seen and cached, but applications like JetBrains IDEs don't have this advantage. **Note**: In JetBrains family products **2024.3** a bug was introduced in which the IDE is failing to accept the OS certificates ([JetBrains issue report](https://youtrack.jetbrains.com/issue/IJPL-171446/Unable-to-find-valid-certification-path-to-requested-target-exception-in-Settings-Sync-when-proxy-is-used)). To solve this, users can do any of the following: * Downgrade JB products to earlier versions * Use the 2024.3.1 preview version (beta version) * Add `-Djavax.net.ssl.trustStoreType=Windows-ROOT` as a custom JVM option # Troubleshooting Checklist Source: https://docs.windsurf.com/troubleshooting/plugins-enterprise/troubleshooting-checklist Running into issues with Codeium? Use this checklist of common debugging techniques to try and resolve the issue, otherwise file a support ticket on help.windsurf.com. ## 1. Make sure the Codeium plugin has been installed properly If you are a Codeium Enterprise user, make sure to follow the instructions that are available at your enterprise portal URL (https\\://\\[YOUR\\_PORTAL\\_URL]/install). Furthermore, remember to install the Codeium Enterprise Updater plugin, not the standard Codeium plugin. Finally, ensure that the enterprise portal url that you set in the plugin's settings is correct and formatted correctly (https\\://\\[YOUR\\_PORTAL\\_URL]) If you are on Teams or Codeium's free tier, follow the instructions outlined at windsurf.com/download. In either case, make sure that your current IDE version is supported by Codeium. ## 2. Check Codeium's Feature Reference guide If a particular feature is unavailable, it could be because it is not yet supported in your IDE. You can check which features are available on which IDEs using the feature reference guides linked below. Codeium is constantly expanding our coverage and striving to bring all features to all IDEs. Codeium SaaS Feature Reference Guide Codeium Self Host Feature Reference Guide ## 3. Try some common troubleshooting techniques Sometimes a good old restart does the trick. Some things we recommend trying: * *Try reloading your IDE*. Sometimes reloading the IDE fixes the issue. On JetBrains IDEs, you can try and reset the Codeium extension by going to `Help` --> `Find Action` --> `Reset Codeium`. * *Try logging in and out of Codeium*. Enterprise users can sign out by navigating to their Enterprise Portal URL in the browser, clicking on their Profile icon, scrolling down to the bottom and clicking \"Sign Out\". Teams and free tier users can sign out by navigating to windsurf.com, clicking on their Profile icon, and selecting \"Sign Out\" from the dropdown menu. * *Try uninstalling and reinstalling the plugin*. Sometimes conflicting plugins or IDE settings can cause issues that are resolved by simply removing the plugin and reinstalling it. ## 4. Look through the help center articles with fixes to common issues We have documented issues that users commonly run into in the following help center articles. Be sure to look through these -- it's likely that someone has experienced the same issue as you! [Common VSCode IDE Issues](/troubleshooting/plugins-enterprise/vscode) [Common JetBrains IDE Issues](/troubleshooting/plugins-enterprise/jetbrains) [Common Visual Studio IDE Issues](/troubleshooting/plugins-enterprise/visualstudio) [Common Eclipse IDE Issues](/troubleshooting/plugins-enterprise/eclipse) ## 5. Grab the logs and file a Support Request Still no luck? At this point, you might want to file a support request by submitting a help ticket on help.windsurf.com. *Make sure to attach logs and other useful debug info to your ticket*! This enables the Windsurf team to resolve your issue as fast as possible. Instructions on how to get logs for each specific IDE can be found in the \"IDE and Extension troubleshooting\" section in the left menu. # Visual Studio Source: https://docs.windsurf.com/troubleshooting/plugins-enterprise/visualstudio # Supported Versions Visual Studio 17.5.5 or greater. # Gathering extension logs Go to `View > Output`, select `Codeium` in the dropdown, and copy the logs. # How to reset or change your Enterprise URL 1. Open the settings/preferences dialog (Tools → Options). 2. Select Codeium. 3. Set the Portal URL to `<NEW_URL>` and set the API URL to `<NEW_URL>/_route/api_server`. 4. Click OK and restart Visual Studio. 5. Upon restart, you will be prompted to sign in to the enterprise portal. # Known IDE issues and solutions ## Don't see Codeium in the VS Marketplace Make sure that you are using VS version 2022 17.5.5 or greater. ## Seeing overlapping autocomplete suggestions This happens if Visual Studio's IntelliCode suggestions are displayed at the same time as Codeium's. Disable all IntelliCode options as shown below: <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/plugins/troubleshooting-visualstudio-disable-intellicode.jpg\" /> </Frame> ## Tab key is not always accepting completions You can rebind this to a different keyboard shortcut in your settings: <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/plugins/troubleshooting-visualstudio-keybindings.jpg\" /> </Frame> # Visual Studio Code (VSCode) Source: https://docs.windsurf.com/troubleshooting/plugins-enterprise/vscode VS Code 1.89 or greater are supported! # Gathering extension logs Starting in VS Code Extension 1.10.0, the Extension Diagnostics are accessible for download via the Settings page. This download will contain a collection of relevant logs and parameters into a text file. *For full output logs of VSCode:* 1. Go to the Command Palette (`Ctrl/Cmd + Shift + P` or go to View > Command Palette) 2. Type in \"Show logs\" and select the option that reads `Developer: Show Logs` 3. From the dropdown, select `Extension Host` 4. You should see something similar to the image below: <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/plugins/troubleshooting-vscode-showlogs.jpg\" /> </Frame> 5. Change the dropdown in the top right that reads \"Extension Host\" and select \"Codeium\" 6. Export or copy the logs # How to reset or change your Enterprise URL 1. Navigate to the Codeium Enterprise extension settings by pressing Ctrl+Shift+X. Choose the Enterprise Updater (purple extension) <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/plugins/troubleshooting-vscode-enterprise-updater.jpg\" /> </Frame> 2. Click on the gear icon and select `Extension Settings` <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/plugins/troubleshooting-vscode-enterprise-settings.jpg\" /> </Frame> 3. In the extension settings, click the gear icon and select `Reset Setting` for each box populated with a URL <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/plugins/troubleshooting-vscode-enterprise-reset-settings.jpg\" /> </Frame> 4. Reload VSCode by going to View -> Command Palette. Once the command palette is open type \"Reload window\" and press enter. 5. Once reloaded, you should be prompted to Set URL. From here, type in the new URL. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/plugins/troubleshooting-vscode-enterprise-url.jpg\" /> </Frame> 6. Close out of the Setting tab. 7. Reload VSCode by going to View -> Command Palette. Once the command palette is open type 'Reload window' and press enter. 8. After reloading, you should see a pop-up in the bottom right prompting you to sign in to Codeium. If not, go to the bottom left Accounts tab and click Sign in with Auth to use Codeium. Either method will redirect you to your Codeium Enterprise portal. # Known IDE issues and solutions ## e.split is not defined You are using an unsupported VS Code version, please update to a supported version and try again. You can find a list of supported versions [here](/plugins/compatibility). ## Using the wrong API Server If a user changes their API Server/Portal URL in their **workspace** settings, this will override their user settings and may result in an error where the extension is communicating with the wrong API server. Make sure that your API Server/Portal URL is set correctly and not overridden accidentally by the workspace settings. ## Not seeing Codeium Chat responses If you are trying to send messages to Codeium chat but not seeing responses, check if you can cancel the response. If you are unable to cancel the response, this means that the response was completed but not displayed. This can happen if the Chat Web Server loses connection to the extension. Reloading VS Code and opening the Codeium Chat panel again should show the responses. ## Unable to read file .../package.json ``` Unable to read file .../.vscode/extensions/codeium.codeium-<version>/package.json ``` If the above error shows up in the Codeium logs, try deleting the extension folder (.../.vscode/extensions/codeium.codeium-\\<version>) and reinstall the extension. ## VS Code Enterprise Updater Loop \"Codeium Enterprise Updated\" every time you open VSCode, try restarting all extensions 1. Open the command palette ( CTRL + SHIFT + P ) 2. Run 'Disable All Installed Extensions' 3. Run 'Enable all Extensions' 4. Restart VS Code Make sure all extensions are enabled again. ## Enterprise updater doesn't install Codeium extension The Enterprise updater is installed, but no extension is being downloaded or installed in VSCode. No extension logs option is available in VSCode output window drop down. The only available log you can see is: ``` [info] ExtensionService#_doActivateExtension Codeium.codeium-enterprise-updater, startup: false, activationEvent: 'onStartupFinished' ``` If you have previously disabled the Codeium extension and later uninstalled it, VSCode will not clear the disabled flag. In order to do so manually: 1. Open the command palette ( CTRL + SHIFT + P ) 2. Run 'Codeium Enterprise: Reset' 3. Select \"Help\" from the popup 4. Select \"Show Disabled Extensions\" 5. Re-enable your Codeium Extension ## Proxy / Network Issues Unchecking `Detect Proxy` in Codeium settings in VSCode can sometimes resolve issues where the extension is incorrectly attempting to use a proxy. ## Certificate Issues If you encounter the following errors: ``` ConnectError: [internal] unable to get issuer certificate ``` ``` [ERROR]: [internal] unable to verify the first certificate ``` ``` tls: failed to verify certificate: x509: \"<yourdomainurl>\" certificate is not standards compliant ``` This suggests that the Codeium extension is unable to trust the TLS connection to your enterprise portal / API server because it does not trust the certificate being presented. This either means that the certificate presented by the Codeium deployment is untrusted or a certificate presented by a corporate proxy intercepting the request is untrusted. In either case, the most preferable solution is to ensure that the root certificate that signed this certificate is properly installed on end-user machines in the appropriate location. VS Code and most other IDEs load certificates from the operating system's default location. Your certificate is issued and managed by your local IT or Admin team. Please reach out to them for assistance with installing the necessary certificates on your system. It is important that the full certificate chain is being presented from wherever TLS is being terminated. Oftentimes, if only the leaf certificate is presented, VS Code and other IDEs are unable to verify its authenticity because they are not aware of the intermediate certificate which validates the leaf certificate and is validated by the root certificate. Browsers are often able to work around this issue as users will likely have encountered a different website that does present the full certificate chain, so the intermediate cert is seen and cached, but applications like VS Code don't have this advantage. The Network Proxy Text VS Code extension is useful for debugging certificate issues. # Gathering Logs Source: https://docs.windsurf.com/troubleshooting/plugins-gathering-logs If you're having issues, the first step in the troubleshooting process is to retrieve the logs from your IDE. Here's how you can get Windsurf logs for each of the major IDEs: ## VS Code 1. Go to the Command Palette (`Ctrl/Cmd + Shift + P` or go to View > Command Palette) 2. Type in \"Show logs\" and select the option that reads \"Developer: Show Logs\" 3. From the dropdown, select \"Extension Host\" 4. You should see something similar to the image below: <Frame style={{ border: 'none', background: 'none' }}> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/extension-diagnostics-log.png\" /> </Frame> 5. Change the dropdown in the top right that reads \"Extension Host\" and select \"Windsurf\" 6. Export or copy the logs ## JetBrains IDEs Starting in extension version 1.10.0, the Chat Panel has an Extension Diagnostics button on the Settings page. This button will automatically collect relevant logs and parameters into a text file that can be downloaded. 1. Logs are written to the idea.log file. To locate this file, go to the Help > Show Log in Finder/Explorer menu option 2. Export or copy the logs ## Eclipse In Eclipse, logs are written to the following paths: * **Mac/Linux**: \\~/.codeium/codeium.log * **Windows**: C:\\Users\\<username>.codeium\\codeium.log ## Visual Studio Go to **view > output**, select \"Windsurf\" in the dropdown, and copy the logs. ## NeoVim Set `g:codeium_log_file` to a path to a file in their vimrc and then relaunch vim. Then the logs should be written to that file. # Common Windsurf Issues Source: https://docs.windsurf.com/troubleshooting/windsurf-common-issues ### General FAQ <AccordionGroup> <Accordion title=\"I subscribed to Pro so why am I stuck on the Free tier?\"> First, give it a few minutes to update. If that doesn't work, try logging out of Windsurf on the website, restarting your IDE, and logging back into Windsurf. Additionally, please make sure you have the latest version of Windsurf installed. </Accordion> <Accordion title=\"How do I cancel my Pro/Teams subscription?\"> You can cancel your paid plan by going to your Profile by clicking your icon on the top right of the [Windsurf website](https://windsurf.com/profile). To cancel your Pro subscription, navigate to the `Billing` page in the navigation panel on the left and click \"Cancel Plan\". To cancel your Teams subscription, navigate to the `Manage Team` page in the navigation panel on the left and click \"Cancel Plan\". </Accordion> <Accordion title=\"How do I disable code snippet telemetry?\"> As mentioned in our [security page](https://windsurf.com/security), you can opt out of code snippet telemetry by going to your settings [account settings](https://windsurf.com/settings). For more information, please visit our [Terms of Service](https://windsurf.com/terms-of-service-individual). </Accordion> <Accordion title=\"How do I delete my account?\"> You can delete your account by going to your settings [account settings](https://windsurf.com/settings), scrolling down and clicking on \"Delete Account\". <Note>If you are a member within an organization, please reach out to your administrator.</Note> </Accordion> <Accordion title=\"How do I request a feature?\"> You can vote, comment, and request features on our [feature request forum](https://codeium.canny.io/feature-requests). You can also reach out to us on Twitter/X! [@windsurf\\_ai](https://x.com/windsurf_ai) </Accordion> </AccordionGroup> ### I'm experiencing rate limiting issues We're subject to rate limits and unfortunately sometimes hit capacity for the premium models we work with. We are actively working on getting these limits increased and fairly distributing the capacity that we have! This should not be an issue forever. If you get this error, please wait a few moments and try again. ### Pylance or Pyright isn't working / Python syntax highlighting is broken or subpar We've gone ahead and developed a [Pyright extension specifically for Windsurf](/windsurf/advanced/#windsurf-extensions). Please search for \"Windsurf Pyright\" or paste `@id:codeium.windsurfPyright` into the extension search. ### How do I download Diagnostic logs to send to the Windsurf support team? You can download diagnostic logs by going to your Cascade Panel, tapping the three dots in the top right corner, and then clicking \"Download Diagnostics\". <Frame style={{ border: 'none', background: 'none' }}> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/windsurf-download-diagnostics.png\" /> </Frame> ### On MacOS, I see a pop-up: 'Windsurf' is damaged and cannot be opened. This pop-up is due to a false positive in MacOS security features. You can usually resolve this by going to \"System Settings -> Privacy & Security\" and clicking \"Allow\" or \"Open anyway\" for Windsurf. If this fails or is not possible, try the following steps: 1. Ensure that Windsurf is placed under your `/Applications` folder and that you are running it from there. 2. Check your processor type: if your Mac has an Intel chip, make sure you have the Intel version. If it's Apple Silicon (like M1, M2 or M3), make sure you have the Apple Silicon version. You can select the processor type from the [Mac download page](https://windsurf.com/windsurf/download_mac). 3. Try redownloading the DMG and reinstalling from [the official download page](https://windsurf.com/windsurf/download_mac), as the failing security feature is usually triggered on download. 4. Make sure Windsurf (and the \"Windsurf is Damaged\" pop-up) is closed, and run `xattr -c \"/Applications/Windsurf.app/\"`. ### I received an error message about updates on Windows, or updates are not appearing on Windows. For example: > Updates are disabled because you are running the user-scope installation of Windsurf as Administrator. We cannot auto-update Windsurf when it is run as Administrator. Please re-run Windsurf with User scope to update. ### What domains should I whitelist for network filters/firewalls, VPNs, or proxies? If you're using any network filtering, firewalls, VPN services, or working in environments with restricted network access, you may experience connectivity issues with Windsurf. To ensure smooth operation, please whitelist the following domains in your network configuration: * \\*.codeium.com * \\*.windsurf.com * \\*.codeiumdata.com ### On Linux, Windsurf quietly doesn't launch, or crashes on launch This is usually due to an Electron permissions issue, which VSCode also has, and is expected when using the tarball on Linux. The easiest way to fix it is to run the following: ```bash sudo chown root:root /path/to/windsurf/chrome-sandbox sudo chown 4755 /path/to/windsurf/chrome-sandbox ``` You should then be able to launch Windsurf. You can also just run `windsurf` with the flag `--no-sandbox`, though we don't encourage this. If this fails, then try the below. ### I received an error message saying 'Windsurf failed to start' Please delete the following folder: Windows: `C:\\Users\\<YOUR_USERNAME>\\.codeium\\windsurf\\cascade` Linux/Mac: `~/.codeium/windsurf/cascade` <Warning>Deleting these folders will remove your conversation history.</Warning> and try restarting the IDE. ### I received an error message about updates on Windows, or updates are not appearing on Windows. An example: > Updates are disabled because you are running the user-scope installation of Windsurf as Administrator. We cannot auto-update Windsurf when it is run as Administrator. Please re-run Windsurf with User scope to update. ### My Cascade panel goes blank Please reach out to us if this happens! A screen recording would be much appreciated. This can often be solved by clearing your chat history (`~/.codeium/windsurf/cascade`). # Gathering Logs Source: https://docs.windsurf.com/troubleshooting/windsurf-gathering-logs If you're having issues, the first step in the troubleshooting process is to retrieve the logs from your IDE. Here's how you can get Windsurf logs for each of the major IDEs: ## Windsurf 1. Open the Command Palette (`Ctrl/Cmd + Shift + P` or go to View > Command Palette) 2. Type in \"Download Windsurf Logs\" and select the option that reads \"Download Windsurf Logs File\" 3. Export or copy the logs and attach the file to your ticket. Alternatively, you can also click on the three dots in the top right corner of the Cascade panel and select \"Download Diagnostics\". <Frame style={{ border: 'none', background: 'none', width: '75%', margin: '0 auto', display: 'flex'}}> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/windsurf-download-diagnostics.png\" /> </Frame> # Windsurf Browser Source: https://docs.windsurf.com/windsurf-browser/overview The Windsurf Browser is a fully functional browser that bridges the gap between your development workflow and web-based activities. Windsurf Browser runs a Chromium app on your device. Your storage, cookies, logins, Chrome profiles, etc. are securely stored locally and persisted between sessions. This empowers workflows by exposing browser content and logs to Cascade, eliminating the need for copy-pasting, and providing instant debugging capabilities. <Note>**The Windsurf Browser is currently in beta** and available to all free, Pro, and Teams users. Enterprise users will be rolling — reach out to learn more</Note> <Frame> <video autoPlay muted loop playsInline src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/browser/browser-adding-components-nobg.mp4\" /> </Frame> ## How to Open <Steps> <Step title=\"Open the Windsurf Browser\"> The Windsurf Browser can be launched by clicking the following button on the top right of the Windsurf surface: <Frame> <video autoPlay muted loop playsInline src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/browser/browser-open-from-windsurf-nobg.mp4\" /> </Frame> Alternatively, you can also prompt Cascade to open the Browser by typing \"Open Windsurf Browser\". This will invoke an `open-browser` tool call. Clicking any links from within the conversation panel will also open the Windsurf Browser. </Step> <Step title=\"Browse normally\"> Search the web and view webpages, documentation, Github issues etc and debug apps, just how you would normally use any other browser! </Step> <Step title=\"Send components as context to Cascade\"> Send page content like text, diagrams, logs, and more to Cascade. <Frame> <video autoPlay muted loop playsInline src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/browser/browser-console-logs-docs-nobg.mp4\" /> </Frame> </Step> </Steps> ## What Cascade Can Access * **Page content** - Text, code snippets * **Console logs** - JavaScript errors and debug output * **DOM structure** - HTML elements and page layout * **Multiple tabs** - Content across all open browser tabs * **Interactive diagrams** - Interactive figures, charts, and other components For example, here are some useful things our team has tested and found value from: <CardGroup cols={3}> <Card title=\"Diagrams\" icon=\"chart-mixed\"> Send JS-rendered interactive charts from Grafana, Google Analytics, Firebase Analytics, etc back into Cascade. </Card> <Card title=\"Analytics and Logs\" icon=\"gear-complex-code\"> Send logs from Jenkins and Github back into Cascade. </Card> <Card title=\"Technical Documentation\" icon=\"book\"> Works especially well in conjuction with our [web and docs search](/windsurf/cascade/web-search) tool. </Card> </CardGroup> ## Technical Notes * Built on Chromium in debug mode * Complete Chrome DevTools access * We use a dedicated debugging user profile for Windsurf * Works with all modern web standards <Card title=\"Chromium\" horizontal={true} icon=\"chrome\" href=\"https://chromium.googlesource.com/chromium/src/+/refs/heads/main/docs/README.md\"> Access the official Chromium documentation for more information. </Card> # Windsurf PR Reviews Source: https://docs.windsurf.com/windsurf-reviews/windsurf-reviews Windsurf PR Reviews helps teams streamline code reviews with AI-powered feedback on GitHub pull requests. This feature is currently in beta for Teams and Enterprise customers using GitHub Cloud. <Frame style={{ border: 'none', background: 'none', margin: '0 auto', display: 'flex'}}> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/external-apps/github-bot-pr.png\" /> </Frame> ## How It Works Once enabled, Windsurf automatically reviews eligible pull requests in selected repositories and provides feedback as GitHub review comments. Reviews can be manually triggered when you mark a PR as “ready for review” or you type `/windsurf-review` in a PR comment. You can also edit a PR title by typing `/windsurf` into the PR title. Example workflow: 1. Developer opens a pull request in an enabled repository 2. Developer marks the PR as ready for review or types “@windsurf /review” in a PR comment 3. Windsurf reviews the PR and posts feedback as GitHub review comments 4. Developer addresses feedback and updates the PR <Note>Organization-wide limit of 500 reviews/month.</Note> ## Setup An organization admin must connect the Windsurf GitHub bot to your GitHub Cloud organization to enable Windsurf PR Reviews: 1. Navigate to the Windsurf Team Settings page and click on Github Integration, or click [here](https://windsurf.com/team/team_settings/windsurf_settings/github) 2. During installation on the Github side, select which repositories to enable for PR reviews 3. Back in the Windsurf settings, configure toggles for allowing reviews/edits, define PR Guidelines for Reviews and Descriptions 4. All users in the organization can then receive PR reviews on their pull requests <Warning>Reviews are not triggered on draft pull requests.</Warning> ## Disabling PR Reviews To disable Windsurf PR Reviews, disconnect the Windsurf GitHub bot from your organization or remove it from specific repositories via GitHub settings. ## Best Practices For effective PR reviews: * Use natural language in PR Guidelines * Don't be too vague about the purpose of your changes * Include detailed examples where helpful # Analytics Source: https://docs.windsurf.com/windsurf/accounts/analytics ## Individuals <Card title=\"User Analytics\" horizontal={true} icon=\"user\" href=\"https://windsurf.com/profile\"> User analytics are available for viewing and sharing on your own [profile](https://windsurf.com/profile) page. </Card> See your completion stats, [refer](https://windsurf.com/referral) your friends, look into your language breakdown, and unlock achievement badges by using Windsurf in your daily workflow. ## Teams <Card title=\"Team Analytics\" horizontal={true} icon=\"users\" href=\"https://windsurf.com/team/analytics\"> Windsurf makes managing your team easy from one dashboard. </Card> <Note> You will need team admin privileges in order to view the following team links. </Note> Team leads and managers can also see an aggregate of their team members' usage patterns and analytics, including Percent of Code Written (PCW) by AI, total lines of code written, total tool calls, credit consumption, and more. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/teams/team-analytics-pcw.jpg\" /> </Frame> # Analytics API (Enterprise SaaS) Source: https://docs.windsurf.com/windsurf/accounts/analytics-api ## Overview Windsurf supports an API for custom analytics. It allows querying for data from autocomplete, chat, and command, and a variety of filters, groupings, and aggregations. We provide all examples in curl; it can then be translated into HTTP requests in other languages. <Note>The Analytics API is available for Enterprise plans</Note> ## User Data Analytics API specification Data from the Users table on the teams page can be obtained with the following command: ```sh curl -X POST --header \"Content-Type: application/json\" \\ --data '{ \"service_key\": \"<SERVICE_KEY>, \"group_name\": \"<GROUP_NAME>\", \"start_timestamp\": \"<START_TIMESTAMP>\", \"end_timestamp\": \"<END_TIMESTAMP>\" }' \\ https://server.codeium.com/api/v1/UserPageAnalytics ``` **SERVICE\\_KEY**: The service key - an admin user can create one from the service key section of the settings page. The role of the service key must have \"Teams Read-only\" permissions. **GROUP\\_NAME**: The name of a group to filter on. This field is optional. **START\\_TIMESTAMP/END\\_TIMESTAMP**: Timestamps in RFC 3339 format, so e.g. 2023-01-01T00:00:00Z #### **Example output** ```json { \"userTableStats\": [ { \"name\": \"Alice\", \"email\": \"alice@windsurf.com\", \"lastUpdateTime\": \"2024-10-10T22:56:10.771591Z\", \"apiKey\": \"aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa\", \"activeDays\": 178 }, { \"name\": \"Bob\", \"email\": \"bob@windsurf.com\", \"lastUpdateTime\": \"2024-10-10T18:11:23.980237Z\", \"apiKey\": \"bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb\", \"activeDays\": 462 }, { \"name\": \"Charlie\", \"email\": \"charlie@windsurf.com\", \"lastUpdateTime\": \"2024-10-10T16:43:46.117870Z\", \"apiKey\": \"cccccccc-cccc-cccc-cccc-cccccccccccc\", \"activeDays\": 237 } ] } ``` ## Cascade Analytics API Specification The Cascade specific data seen on the [analytics page](https://windsurf.com/team/analytics) can be queried via API. ```sh curl -X POST --header \"Content-Type: application/json\" \\ --data '{ \"service_key\": \"<SERVICE_KEY>\", \"group_name\": \"<GROUP_NAME>\", \"start_timestamp\": \"<START_TIMESTAMP>\", \"end_timestamp\": \"<END_TIMESTAMP>\", \"emails\": [\"<EMAIL>\",\"<EMAIL>,...\"], \"ide_types\": [\"<IDE_TYPE>\",\"<IDE_TYPE>,...\"], \"query_requests\": [ { \"<CASCADE_DATA_SOURCE>\": {} } ] }' \\ https://server.codeium.com/api/v1/CascadeAnalytics ``` **SERVICE\\_KEY**: The service key - an admin user can create a new one from [https://windsurf.com/team/team\\_settings](https://windsurf.com/team/team_settings) **GROUP\\_NAME**: The name of a group to filter on. This field is optional. Can not be set if emails is set. **START\\_TIMESTAMP/END\\_TIMESTAMP**: Timestamps in RFC 3339 format, so e.g. 2023-01-01T00:00:00Z **EMAILS**: A list of emails to filter on. This field is optional. Can not be set if group\\_name is set. **IDE\\_TYPES**: A list of IDE types to filter on. This field is optional. The possible values are described below. **QUERY\\_REQUESTS**: A list of query requests to make. This field is required. The possible values of CASCADE\\_DATA\\_SOURCE are described below. #### Example Query ```sh curl -X POST --header \"Content-Type: application/json\" \\ --data '{ \"service_key\": \"my_random_test_key\", \"group_name\": \"my_group_name\", \"start_timestamp\": \"2025-01-01T00:00:00Z\", \"end_timestamp\": \"2025-01-02T00:00:00Z\", \"emails\": [\"my_email@windsurf.com\", \"my_email2@windsurf.com\"], \"ide_types\": [\"editor\"], \"query_requests\": [ { \"cascade_lines\": {} }, { \"cascade_runs\": {} } ] }' \\ https://server.codeium.com/api/v1/CascadeAnalytics ``` ### IDE Types We split cascade data in to two categories, the Editor and the JetBrains Plugin. Excluding the ide\\_types field in the query returns data for both. If you would like to query data for only one of the IDEs, you can use either of the two options: * \"editor\" for the Windsurf Editor * \"jetbrains\" for the JetBrains Plugin ### Cascade Data Sources There are three possible values for CASCADE\\_DATA\\_SOURCE #### Source: cascade\\_lines Use cascade\\_lines to query for data on cascade lines suggested and accepted per day. Example output: ```json { \"queryResults\": [ { \"cascadeLines\": { \"cascadeLines\": [ { \"day\": \"2025-05-01T00:00:00Z\", \"linesSuggested\": \"206\", \"linesAccepted\": \"157\" }, { \"day\": \"2025-05-02T00:00:00Z\", \"linesSuggested\": \"16\" }, { \"day\": \"2025-05-03T00:00:00Z\", \"linesSuggested\": \"169\", \"linesAccepted\": \"168\" } ] } } ] } ``` **linesSuggested**: The number of lines suggested on the given day. **linesAccepted**: The number of lines accepted on the given day. #### Source: cascade\\_runs Use cascade\\_runs to query for data on model usage, credit consumption, and mode. Example output: ```json { \"queryResults\": [ { \"cascadeRuns\": { \"cascadeRuns\": [ { \"day\": \"2025-05-01T00:00:00Z\", \"model\": \"Claude 3.7 Sonnet (Thinking)\", \"mode\": \"CONVERSATIONAL_PLANNER_MODE_DEFAULT\", \"messagesSent\": \"1\", \"cascadeId\": \"0d35c1f7-0a85-41d0-ac96-a04cd2d64444\" }, { \"day\": \"2025-05-01T00:00:00Z\", \"model\": \"SWE-1\", \"mode\": \"UNKNOWN\", \"promptsUsed\": \"125\", \"cascadeId\": \"0d35c1f7-0a85-41d0-ac96-a04cd2d64444\" }, { \"day\": \"2025-05-01T00:00:00Z\", \"model\": \"GPT-4.1 (promo)\", \"mode\": \"CONVERSATIONAL_PLANNER_MODE_DEFAULT\", \"messagesSent\": \"5\", \"cascadeId\": \"1f450ba3-06aa-4ba5-9e12-d3b98c2d33d3\" }, ] } } ] } ``` **day**: The date of the run. **model**: The model used for the message. **mode**: The mode of the run. One of CONVERSATIONAL\\_PLANNER\\_MODE\\_DEFAULT (for write mode), CONVERSATIONAL\\_PLANNER\\_MODE\\_READ\\_ONLY (for read mode), CONVERSATIONAL\\_PLANNER\\_MODE\\_NO\\_TOOL (for legacy mode), or UNKNOWN. **messagesSent**: The number of messages sent. **cascadeId**: The ID of the run. This id can be used to understand how many distinct converstations have been started (as opposed to how many times the user sends a message). **promptsUsed**: The number of credits used. The data returned by the api is in a raw format, which may explain any \"UNKNOWN\" values. If using this data source for your own metrics, it is recommended to aggregate by the specific metrics you are interested in (eg, count up the promptsUsed field to understand user usage patterns, messagesSent to understand user engagement, etc), as it is possible for mode and prompt data to be split across entries. #### Source: cascade\\_tool\\_usage Use cascade\\_tool\\_usage to query for data on tool usage. Note that this returns an aggregate count of tool in the provided period. Example output: ```json { \"queryResults\": [ { \"cascadeToolUsage\": { \"cascadeToolUsage\": [ { \"tool\": \"CODE_ACTION\", \"count\": \"15\" }, { \"tool\": \"LIST_DIRECTORY\", \"count\": \"20\" }, { \"tool\": \"MCP_TOOL\", \"count\": \"12\" }, { \"tool\": \"MEMORY\", \"count\": \"4\" } ] } } ] } ``` **tool**: The tool used for the message. **count**: The number of times the tool was used. Here is a map of the returned enums and the human readable name, as it is displayed in the UI: * CODE\\_ACTION: 'Code Edit' * VIEW\\_FILE: 'View File' * RUN\\_COMMAND: 'Run Command' * FIND: 'Find tool' * GREP\\_SEARCH: 'Grep Search' * VIEW\\_FILE\\_OUTLINE: 'View File Outline' * MQUERY: 'Riptide' * LIST\\_DIRECTORY: 'List Directory' * MCP\\_TOOL: 'MCP Tool' * PROPOSE\\_CODE: 'Propose Code' * SEARCH\\_WEB: 'Search Web' * MEMORY: 'Memory' * PROXY\\_WEB\\_SERVER: 'Browser Preview' * DEPLOY\\_WEB\\_APP: 'Deploy Web App' ## Custom Analytics API specification Certain data sources allow for customizable queries via the Custom Analytics API. **Full schemas for selections, filters, aggregations, and orderings are in the following section, in JSON format. Example queries and for each of the three data sources, as well as query debugging tips, will be at the end of the document.** ```sh curl -X POST --header \"Content-Type: application/json\" \\ --data '{ \"service_key\": \"<SERVICE_KEY>\", \"group_name\": \"<GROUP_NAME>\", \"query_requests\": [ { \"data_source\": \"QUERY_DATA_SOURCE_<DATA_SOURCE>\", \"selections\": [ <LIST OF SELECTIONS> ], \"filters\": [ <LIST OF FILTERS> ], \"aggregations\": [ <LIST OF AGGREGATIONS> ], } ] }' \\ https://server.codeium.com/api/v1/Analytics ``` **DATA\\_SOURCE**: select either USER\\_DATA, CHAT\\_DATA, or COMMAND\\_DATA depending on whether you are looking for autocomplete, chat, or command data. **SERVICE\\_KEY**: The service key - an admin user can create a new one from [https://windsurf.com/team/team\\_settings](https://windsurf.com/team/team_settings) **GROUP\\_NAME**: The name of a group to filter on. This field is optional. ## Schemas ### Selections Selections are **required**. Each selection corresponds to a value to be queried. ```json { \"field\": \"<FIELD_NAME>\", \"name\": \"<NAME>\", \"aggregation_function\": \"QUERY_AGGREGATION_<AGGREGATION_FUNCTION>\" } ``` **FIELD\\_NAME**: The field you wish to query. See the Available Fields section below. **NAME**: An alias for the field. If not specified, will be the lowercase version of \\<AGGREGATION\\_FUNCTION>\\_\\<FIELD\\_NAME>, e.g. sum\\_num\\_acceptances. Must be distinct from all other field and aggregation names. **AGGREGATION\\_FUNCTION**: should be one of UNSPECIFIED, COUNT, SUM, AVG, MAX, MIN. If \"aggregation\\_function\" is not provided, defaults to UNSPECIFIED. ### Filters Filters are used to narrow down the data to only contain elements that meet certain criteria. They are optional. ```json { \"name\": \"<NAME>\", \"value\": \"<VALUE>\", \"filter\": \"QUERY_FILTER_<FILTER>\" } ``` **NAME**: The name of the field you wish to filter. If the filtered item is the same as a Selection/Aggregation, this must be equal to the name of the field/aggregation. **VALUE**: the value being compared. **FILTER**: One of EQUAL, NOT\\_EQUAL, GREATER\\_THAN, LESS\\_THAN, GE (greater than or equal), LE (less than or equal). ### Aggregations Aggregations are used to split the data into groups based off a specified criteria. They are optional. ```json { \"field\": <FIELD_NAME>, \"name\": <NAME> } ``` FIELD\\_NAME: The field you wish to query. See the Available Fields section. NAME: An alias for the field. Must be distinct from all other field and aggregation names. ## Available Fields ### User Data All data from the USER\\_DATA source is aggregated per user, per hour. Note: PCW (percent code written) now has its own table, and does not rely on the user\\_data table. | **Field Name** | **Description** | **Valid Aggregations** | | -------------------------- | ----------------------------------------------------------------------------------------------------------------------------------- | ---------------------- | | api\\_key | A hash of the user API key. | UNSPECIFIED, COUNT | | date | The UTC date of the autocompletion(s). | UNSPECIFIED, COUNT | | date UTC-x | The date of the autocompletion, with a time zone offset. For example, PST would be \"date UTC-8\". | UNSPECIFIED, COUNT | | hour | The UTC hour of the autocompletions(s). | UNSPECIFIED, COUNT | | language | The programming language being used. | UNSPECIFIED, COUNT | | ide | The IDE that was being used. | UNSPECIFIED, COUNT | | version | The Windsurf version used | UNSPECIFIED, COUNT | | num\\_acceptances | The number of times the user accepted an autocomplete. This occurs when the user writes some code, sees grey text, and presses tab. | SUM, MAX, MIN, AVG | | num\\_lines\\_accepted | Lines of code accepted from autocomplete. | SUM, MAX, MIN, AVG | | num\\_bytes\\_accepted | Bytes accepted from autocomplete. | SUM, MAX, MIN, AVG | | distinct\\_users | Distinct users. | UNSPECIFIED, COUNT | | distinct\\_developer\\_days | Distinct (users, day) tuples. | UNSPECIFIED, COUNT | | distinct\\_developer\\_hours | Distinct (users, hour of day) tuples. | UNSPECIFIED, COUNT | ### Chat Data Note that all data provided in the chat data API are for the chat model responses, not the user questions. | **Field Name** | **Description** | **Valid Aggregations** | | -------------------------- | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | ---------------------- | | api\\_key | A hash of the user API key | UNSPECIFIED, COUNT | | model\\_id | The chat model's ID, set during deployment time. | UNSPECIFIED, COUNT | | date | The UTC date of the chat response. | UNSPECIFIED, COUNT | | date UTC-x | The date of the chat response, with a time zone offset. For example, PST would be \"date UTC-8\". | UNSPECIFIED, COUNT | | ide | The IDE that was being used | UNSPECIFIED, COUNT | | version | The Windsurf version used | UNSPECIFIED, COUNT | | latest\\_intent\\_type | Whether the model response is generated from a code lens or a regular chat. Regular chats will correspond to:<br /><br />CHAT\\_INTENT\\_GENERIC<br /><br />while code lenses will correspond to one of:<br /><br />CHAT\\_INTENT\\_FUNCTION\\_EXPLAIN<br />CHAT\\_INTENT\\_FUNCTION\\_DOCSTRING<br />CHAT\\_INTENT\\_FUNCTION\\_REFACTOR<br />CHAT\\_INTENT\\_CODE\\_BLOCK\\_EXPLAIN<br />CHAT\\_INTENT\\_CODE\\_BLOCK\\_REFACTOR<br />CHAT\\_INTENT\\_PROBLEM\\_EXPLAIN<br />CHAT\\_INTENT\\_FUNCTION\\_UNIT\\_TESTS | UNSPECIFIED, COUNT | | num\\_chats\\_received | Number of chats messages sent from Windsurf to the user. | SUM, MAX, MIN, AVG | | chat\\_accepted | True if a code block was sent in Windsurf's chat response, and the Thumbs up button is clicked. | SUM, COUNT | | chat\\_inserted\\_at\\_cursor | True if a code block was sent in Windsurf's chat response, and the \"Insert\" button is clicked. | SUM, COUNT | | chat\\_applied | True if a code block was sent in Windsurf's chat response, and the \"Apply Diff\" button is clicked. | SUM, COUNT | | chat\\_loc\\_used | Lines of code used, if a code block was sent in Windsurf's chat, and any of the \"Insert\", \"Copy\", or \"Apply Diff\" buttons are pressed. | SUM, MAX, MIN, AVG | ### Command Data Note that the Command Data source contains **all** commands, including those which were declined. The \"accepted\" field can be used to filter for only accepted commands. | **Field Name** | **Description** | **Valid Aggregations** | | ---------------- | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | ---------------------- | | api\\_key | A hash of the user API key. | UNSPECIFIED, COUNT | | date | The UTC date of the command. | UNSPECIFIED, COUNT | | timestamp | The UTC timestamp of the command. | UNSPECIFIED, COUNT | | language | The programming language being used. | UNSPECIFIED, COUNT | | ide | The IDE that was being used. | UNSPECIFIED, COUNT | | version | The Windsurf version used | UNSPECIFIED, COUNT | | command\\_source | The reason that the command was triggered. Valid values are,<br /><br />COMMAND\\_REQUEST\\_SOURCE\\_LINE\\_HINT\\_CODE\\_LENS<br />COMMAND\\_REQUEST\\_SOURCE\\_DEFAULT<br />COMMAND\\_REQUEST\\_SOURCE\\_RIGHT\\_CLICK\\_REFACTOR<br />COMMAND\\_REQUEST\\_SOURCE\\_FUNCTION\\_CODE\\_LENS<br />COMMAND\\_REQUEST\\_SOURCE\\_FOLLOWUP<br />COMMAND\\_REQUEST\\_SOURCE\\_CLASS\\_CODE\\_LENS<br />COMMAND\\_REQUEST\\_SOURCE\\_PLAN<br />COMMAND\\_REQUEST\\_SOURCE\\_SELECTION\\_HINT\\_CODE\\_LENS<br /><br />COMMAND\\_REQUEST\\_SOURCE\\_DEFAULT corresponds to the typical command usage. | UNSPECIFIED, COUNT | | provider\\_source | Determines whether command was triggered in generation or edit mode. Valid values are,PROVIDER\\_SOURCE\\_COMMAND\\_GENERATE PROVIDER\\_SOURCE\\_COMMAND\\_EDIT | UNSPECIFIED, COUNT | | lines\\_added | Number of lines of code added by the command. | SUM, MAX, MIN, AVG | | lines\\_removed | Number of lines of code removed by the command. | SUM, MAX, MIN, AVG | | bytes\\_added | Number of bytes added by the command. | SUM, MAX, MIN, AVG | | bytes\\_removed | Number of bytes removed by the command. | SUM, MAX, MIN, AVG | | selection\\_lines | Number of lines of code selected by the command. Should always be zero for generations. | SUM, MAX, MIN, AVG | | selection\\_bytes | Number of bytes selected by the command. Should always be zero for generations. | SUM, MAX, MIN, AVG | | accepted | Whether the command was accepted. | SUM, COUNT | ### PCW Data #### Valid Selections | **Field Name** | **Description** | **Valid Aggregations** | | --------------------------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | ---------------------- | | percent\\_code\\_written | Percent code written. Calculated as (number of windsurf bytes generated) / (number of windsurf bytes generated + number of user bytes generated). This metric can have high variance within single days or users, so we recommend aggregating over weeks for this. | UNSPECIFIED | | windsurf\\_bytes | total number of windsurf bytes, which is equal to windsurf\\_bytes\\_by\\_autocomplete + windsurf\\_bytes\\_by\\_command | UNSPECIFIED | | user\\_bytes | total number of user bytes | UNSPECIFIED | | total\\_bytes | windsurf\\_bytes + user\\_bytes | UNSPECIFIED | | windsurf\\_bytes\\_by\\_autocomplete | total number of windsurf bytes generated from autocomplete | UNSPECIFIED | | windsurf\\_bytes\\_by\\_command | total number of windsurf bytes generated from command | UNSPECIFIED | #### Valid Filters | | | | | -------------- | ------------------------------------ | ----------------- | | **Field Name** | **Description** | **Some Examples** | | api\\_key | A hash of the user API key. | | | language | The programming language being used. | KOTLIN, GO, JAVA | | ide | The IDE that was being used. | jetbrains, vscode | | version | The Windsurf version used | 1.28.0, 130.0 | To filter by date, use start\\_timestamp and end\\_timestamp, which should be in RFC 3339 format (e.g. 2023-01-01T00:00:00Z, see in the example below). ## Examples ### User Data ```sh curl -X POST --header \"Content-Type: application/json\" \\ --data '{ \"service_key\": SERVICE_KEY, \"query_requests\": [ { \"data_source\": \"QUERY_DATA_SOURCE_USER_DATA\", \"selections\": [ { \"field\": \"num_acceptances\", \"name\": \"num_acceptances\", \"aggregation_function\": \"QUERY_AGGREGATION_SUM\" } ], \"filters\": [ { \"name\": \"hour\", \"filter\": \"QUERY_FILTER_GE\", \"value\": \"2024-01-01\" }, { \"name\": \"hour\", \"filter\": \"QUERY_FILTER_LE\", \"value\": \"2024-02-01\" } ] } ] }' \\ https://server.codeium.com/api/v1/Analytics ``` This query calculates the overall Percent Code Written over the month of January 2024. Example response (JSON formatted for readability): ```json { \"queryResults\": [ { \"responseItems\": [ { \"item\": { \"num_acceptances\": \"125\", \"num_lines_accepted\": \"863\" } } ] } ] } ``` ### Chat Data ```sh curl -X POST --header \"Content-Type: application/json\" \\ --data '{ \"service_key\": SERVICE_KEY, \"query_requests\": [ { \"data_source\": \"QUERY_DATA_SOURCE_CHAT_DATA\", \"selections\": [ { \"field\": \"chat_loc_used\", \"name\": \"chat_loc_used\", \"aggregation_function\": \"QUERY_AGGREGATION_SUM\" } ], \"filters\": [ { \"name\": \"latest_intent_type\", \"filter\": \"QUERY_FILTER_EQUAL\", \"value\": \"CHAT_INTENT_FUNCTION_DOCSTRING\" } ], \"aggregations\": [ { \"field\": \"ide\", \"name\": \"ide\" } ] } ] }' \\ https://server.codeium.com/api/v1/Analytics ``` This query shows the number of lines of code accepted from the \"Generate Docstring\" code lens, for all time, grouped by IDE. Example response: ```json { \"queryResults\": [ { \"responseItems\": [ { \"item\": { \"chat_loc_used\": \"74\", \"ide\": \"jetbrains\" }, }, { \"item\": { \"chat_loc_used\":\"41\", \"ide\":\"vscode\" }, } ] } ] } ``` ### Command Data ```sh curl -X POST --header \"Content-Type: application/json\" \\ --data '{ \"service_key\": SERVICE_KEY, \"query_requests\": [ { \"data_source\": \"QUERY_DATA_SOURCE_COMMAND_DATA\", \"selections\": [ { \"field\": \"lines_added\", \"name\": \"lines_added\", \"aggregation_function\": \"QUERY_AGGREGATION_SUM\" }, { \"field\": \"lines_removed\", \"name\": \"lines_removed\", \"aggregation_function\": \"QUERY_AGGREGATION_SUM\" } ], \"filters\": [ { \"name\": \"provider_source\", \"filter\": \"QUERY_FILTER_EQUAL\", \"value\": \"PROVIDER_SOURCE_COMMAND_EDIT\" }, { \"name\": \"accepted\", \"filter\": \"QUERY_FILTER_EQUAL\", \"value\": \"true\" } ], \"aggregations\": [ { \"field\": \"language\", \"name\": \"language\" } ] } ] }' \\ https://server.codeium.com/api/v1/Analytics ``` This query gets the number of lines added and removed from \"edit\" commands, grouped by programming language. Example response: ```json { \"queryResults\": [ { \"responseItems\": [ { \"item\": { \"language\": \"SHELL\", \"lines_added\": \"5\", \"lines_removed\": \"3\" } }, { \"item\": { \"language\": \"GO\", \"lines_added\": \"31\", \"lines_removed\": \"27\" } }, { \"item\": { \"language\": \"PYTHON\", \"lines_added\": \"21\", \"lines_removed\": \"5\" } }, { \"item\": { \"language\": \"UNSPECIFIED\", \"lines_added\": \"91\", \"lines_removed\": \"71\" } }, { \"item\": { \"language\": \"STARLARK\", \"lines_added\": \"13\", \"lines_removed\": \"1\" } } ] } ] } ``` ### PCW Data ```sh curl -X POST --header \"Content-Type: application/json\" \\ --data '{ \"service_key\": SERVICE_KEY, \"start_timestamp\": \"2024-01-01T00:00:00Z\", \"end_timestamp\": \"2024-12-22T00:00:00Z\" \"query_requests\": [ { \"data_source\": \"QUERY_DATA_SOURCE_PCW_DATA\", \"selections\": [ { \"field\": \"percent_code_written\", \"name\": \"percent_code_written\" }, { \"field\": \"codeium_bytes\", \"name\": \"codeium_bytes\" }, { \"field\": \"total_bytes\", \"name\": \"total_bytes\" }, { \"field\": \"codeium_bytes_by_autocomplete\", \"name\": \"codeium_bytes_by_autocomplete\" }, { \"field\": \"codeium_bytes_by_command\", \"name\": \"codeium_bytes_by_command\" } ], \"filters\": [ { \"filter\": \"QUERY_FILTER_EQUAL\", \"name\": \"language\", \"value\": \"GO\" } ] } ], }' \\ https: //server.codeium.com/api/v1/Analytics ``` This query gets the PCW (Percent Code Written) data, along with bytes filtered by language go. Example response: ```json { \"queryResults\": [ { \"responseItems\": [ { \"item\": { \"codeium_bytes\": \"6018\", \"codeium_bytes_by_autocomplete\": \"4593\", \"codeium_bytes_by_command\": \"1425\", \"percent_code_written\": \"0.61\", \"total_bytes\": \"9900\" } } ] } ] } ``` ## Query debugging From 1.10.0 and on, invalid queries will return an error message. This section has some common error messages, what they mean, and how to debug the corresponding queries. <table> <thead> <tr> <th>Error Message</th> <th>Explanation</th> </tr> </thead> <tbody> <tr> <td>at least one field or aggregation is required</td> <td>Did not detect any selections or aggregations - make sure the query request contains at least one.</td> </tr> <tr> <td>invalid aggregation function for string type field ide: QUERY\\_AGGREGATION\\_SUM</td> <td>One of the selections used an invalid aggregation function. In this case we tried to use SUM on the \"ide\" field, but it only supports COUNT and UNSPECIFIED</td> </tr> <tr> <td>invalid query table: QUERY\\_DATA\\_SOURCE\\_UNSPECIFIED</td> <td>There is likely a typo in the data\\_source field, double check the spelling.</td> </tr> <tr> <td>all selection fields should have an aggregation function, or none of them should</td> <td> If there are multiple selection fields, either all should contain an aggregation\\_function, or none of them should. For example, this selection is invalid because num\\_acceptances is summed, but num\\_lines\\_accepted is not: ```json \"selections\": [ { \"field\": \"num_acceptances\", \"name\": \"total_acceptances\", \"aggregation_function\": \"QUERY_AGGREGATION_SUM\" }, { \"field\": \"num_lines_accepted\", \"name\": \"total_lines_accepted\", \"aggregation_function\": \"QUERY_AGGREGATION_UNSPECIFIED\" } ] ``` Note: PCW is always considered aggregated. If no aggregation\\_function is explicitly chosen, it is considered unspecified. If you would like information about both of these fields, use two seperate queries. </td> </tr> <tr> <td>invalid aggregation function for string type field ide: QUERY\\_AGGREGATION\\_SUM</td> <td>Not every field supports every aggregation function; see the available fields section for the matches. In this case, the query used a QUERY\\_AGGREGATION\\_SUM aggregation function with the \"ide\" field, which is invalid.</td> </tr> <tr> <td>tried to aggregate on a distinct field: distinct\\_developer\\_days. Consider aggregating on the non-distinct fields instead: \\[api\\_key date]</td> <td> Fields with the pattern \"distinct\\_\\*\" can not be in the aggregations section; the error suggests an alternative field(s) to aggregate on instead. So instead of: ```json \"aggregations\": [ { \"field\": \"distinct_developer_days\", \"name\": \"distinct_developer_days\" } ] ``` Try: ```json \"aggregations\": [ { \"field\": \"api_key\", \"name\": \"api_key\" }, { \"field\": \"date\", \"name\": \"date\" } ] ``` </td> </tr> <tr> <td>duplicate field alias for selection/aggregation: num\\_acceptances</td> <td>All selections and aggregations must have a different name. Keep in mind that if the name is not specified, by default it is set to \\<AGGREGATION\\_FUNCTION>\\_\\<FIELD\\_NAME>.</td> </tr> <tr> <td>invalid group name: GroupName</td> <td>The group with the specified name was not found, double check the spelling.</td> </tr> </tbody> </table> # Setting up SSO & SCIM Source: https://docs.windsurf.com/windsurf/accounts/sso-scim This feature is only available to Teams and Enterprise users. <Tabs> <Tab title=\"Google SSO\"> Windsurf now supports sign in with Single Sign-On (SSO) via SAML. If your organization uses Microsoft Entra, Okta, Google Workspaces, or some other identity provider that supports SAML, you will be able to use SSO with Windsurf. <Note>Windsurf only supports SP-initiated SSO; IDP-initiated SSO is NOT currently supported.</Note> ### Configure IDP Application On the google admin console (admin.google.com) click **Apps -> Web and mobile apps** on the left. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-google.png\" /> </Frame> Click on **Add app**, and then **Add custom SAML app**. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-google2.png\" /> </Frame> Fill out **App name** with `Windsurf`, and click **Next**. The next screen (Google Identity Provider details) on Google’s console page has data you’ll need to copy to Windsurf’s SSO settings on [www.windsurf.com/team/team\\_settings](http://www.windsurf.com/team/team_settings). * Copy **SSO URL** from Google’s console page to Windsurf’s settings under **SSO URL** * Copy **Entity ID** from Google’s console page to Windsurf’s settings under **Idp Entity ID** * Copy **Certificate** from Google’s console page to Windsurf’s settings under **X509 Certificate** * Click **Continue** on Google’s console page The next screen on Google’s console page requires you to copy data from Codeium’s settings page * Copy **Callback URL** from Codeium’s settings page to Google’s console page under **ACS URL** * Copy **SP Entity ID** from Codeium’s settings page to Google’s console page under **SP Entity ID** * Change **Name ID** format to **EMAIL** * Click **Continue** on Google’s console page The next screen on Google’s console page requires some configuration * Click on **Add Mapping**, select **First name** and set the **App attributes** to **firstName** * Click on **Add Mapping**, select **Last name** and set the **App attributes** to **lastName** * Click **Finish** <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-google3.png\" /> </Frame> On Codeium’s settings page, click **Enable Login with SAML**, and then click **Save**. Make sure to click on **Test Login** to make sure login works as expected. All users now will have SSO login enforced. </Tab> <Tab title=\"Azure AD SSO\"> Windsurf Enterprise now supports sign in with Single Sign-On (SSO) via SAML. If your organization uses Microsoft Azure AD, you will be able to use SSO with Windsurf. <Note> that Windsurf only supports SP-initiated SSO; IDP-initiated SSO is NOT currently supported.</Note> ### Configure IDP Application Create an Enterprise Application with your identity provider. Click on **Add**, and then **Enterprise Application**. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-azure.png\" /> </Frame> Click on **Create your own application**. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-azure2.png\" /> </Frame> Name your application **Windsurf**, select *Integrate any other application you don’t find in the gallery*, and then click **Create**. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-azure3.png\" /> </Frame> Configure your enterprise application with SAML * Click on Set up single sign on in the new Windsurf application, and then Click on SAML * Click on Edit under Basic SAML Configuration, and open up the Windsurf Teams SSO settings at [https://www.codeium.com/team/team\\_settings](https://www.codeium.com/team/team_settings) * On Entra’s SAML configuration form and Windsurf SSO settings page * For Identifier (Entity ID), copy the SP Entity ID value in the SSO settings page * For Reply URL (Assertion Consumer Service URL), copy the Callback URL value in the SSO settings page * Click Save at the top * Pick the SSO ID you want to use, which creates a login portal for your team. Note that this is not changeable after this is saved. * Fill out IdP Entity ID in the settings page with the value in Entra ID under Set up Windsurf -> Microsoft Entra Identifier * Fill out SSO URL in the settings page with the value in Entra ID under Login URL * Download the SAML certificate (Base64), get the text content of the file, and paste it to X509 Certificate on the Windsurf settings page * Click on Enable Login with SAML * Click Save in the Windsurf settings page * We also need to set up name claims. This step is important in order for Windsurf to know the display name of the user. * Under Attributes & Claims under Entra ID, click on Edit * Create 2 new claims. You can do so by clicking on Add new claim * The first claim should have ‘firstName’ as the Name, and ‘user.givenname’ as the Source attribute * The second claim should have ‘lastName’ as the Name, and ‘user.surname’ as the Source attribute * At this point you should have successfully configured SSO. Under Save in the settings page, click on Test Login to make sure everything works as expected. </Tab> <Tab title=\"Okta SSO\"> Windsurf Enterprise now supports sign in with Single Sign-On (SSO) via SAML. If your organization uses Microsoft Entra, Okta, Google Workspaces, or some other identity provider that supports SAML, you will be able to use SSO with Windsurf. <Note>Windsurf only supports SP-initiated SSO; IDP-initiated SSO is NOT currently supported.</Note> ### Configure IDP Application Click on Applications on the left sidebar, and then Create App Integration <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-okta1.png\" /> </Frame> Select SAML 2.0 as the sign-in method <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-okta2.png\" /> </Frame> Set the app name as Windsurf (or to any other name), and click Next Configure the SAML settings as * Single sign-on URL to [https://auth.windsurf.com/\\_\\_/auth/handler](https://auth.windsurf.com/__/auth/handler) * Audience URI (SP Entity ID) to [www.codeium.com](http://www.codeium.com) * NameID format to EmailAddress * Application username to Email Configure the attribute statements as following, and then click **Next**. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-okta3.png\" /> </Frame> In the feedback section, select “This is an internal app that we have created”, and click **Finish**. ### Register Okta as a SAML provider You should be redirected to the Sign on tab under your custom SAML application. Now you’ll want to take the info in this page and fill it out in Windsurf’s SSO settings. * Open [www.windsurf.com/team/team\\_settings](http://www.windsurf.com/team/team_settings), and click on Configure SAML * Copy the text after ‘Issuer’ in Okta’s application page and paste it under Idp Entity ID * Copy the text after ‘Sign on URL’ in Okta’s application page and paste it under SSO URL * Download the Signing Certificate and paste it under X509 certificate * Check Enable Login with SAML and then click Save * Test the login with the Test Login button. You should see a success message: <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-okta4.png\" /> </Frame> At this point everything should have been configured, and can now add users to the new Windsurf Okta application. You should share your organization's custom Login Portal URL with your users and ask them to sign in via that link. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-okta5.png\" /> </Frame> Users who login to Windsurf via SSO will be auto-approved into the team. ### Caveats Note that Windsurf does not currently support IDP-initiated login flows. We also do not yet support OIDC. # Troubleshooting ### Login with SAML config failed: Firebase: Error (auth/operation-not-allowed) <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-okta6.png\" /> </Frame> This points to your an invalid SSO ID, or your SSO URL being incorrect, make sure it is alphanumeric and has no extra spaces or invalid characters. Please go over the steps in the guide again and make sure you use the correct values. ### Login with SAML config failed: Firebase: SAML Response \\<Issuer> mismatch. (auth/invalid-credential) <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-okta7.png\" /> </Frame> This points to your IdP entity ID being invalid, please make sure you copy it correctly from the Okta portal, without any extra characters or spaces before or after the string. ### Failed to verify the signature in samlresponse This points to an incorrect value of your X509 certificate, please make sure you copy the correct key, and that it is formatted as: ``` -----BEGIN CERTIFICATE----- value ------END CERTIFICATE------ ``` </Tab> <Tab title=\"Azure SCIM\"> Windsurf supports SCIM synchronization for users and groups with Microsoft Entra ID / Azure AD. It isn't necessary to setup SSO to use SCIM synchronization, but it is highly recommended. You'll need: * Admin access to Microsoft Entra ID / Azure AD * Admin access to Windsurf * An existing Windsurf Application on Entra ID (normally from your existing SSO application) ## Step 1: Navigate to the existing Windsurf Application Go to Microsoft Entra ID on Azure, click on Enterprise applications on the left sidebar, and then click on the existing Windsurf application in the list. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/scim-azure.png\" /> </Frame> ## Step 2: Setup SCIM provisioning Click on Get started under Provision User Accounts in the middle (step 3), and then click on Get started again. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/scim-azure2.png\" /> </Frame> Under the Provisioning setup page, select the following options. Provisioning Mode: Automatic Admin Credentials > Tenant URL: [https://server.codeium.com/scim/v2](https://server.codeium.com/scim/v2) Leave the Azure provisioning page open, now go to the Windsurf web portal, and click on the profile icon in the NavBar on the top of the page. Under Team Settings, select Service Key and click on Add Service Key. Enter any key name (such as 'Azure Provisioning Key') and click Create Service Key. Copy the output key, go back to the Azure page, paste it to Secret Token. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/scim-azure3.png\" /> </Frame> (What you should see after creating the key on Windsurf) On the Provisioning page, click on Test Connection and that should have verified the SCIM connection. Now above the Provisioning form click on Save. ## Step 3: Configure SCIM Provisioning After clicking on Save, a new option Mappings should have appeared in the Provisioning page. Expand Mappings, and click on Provision Microsoft Entra ID Users <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/scim-azure4.png\" /> </Frame> Under attribute Mappings, delete all fields under displayName, leaving only the fields userName, active, and displayName. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/scim-azure5.png\" /> </Frame> For active, now click on Edit. Under Expression, modify the field to ``` NOT([IsSoftDeleted]) ``` Then click Ok. Your user attributes should look like <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/scim-azure6.png\" /> </Frame> In the Attribute Mapping page, click on Save on top, and navigate back to the Provisioning page. Now click on the same page, under Mappings click on Provision Microsoft Entra ID Groups. Now only click delete for externalId, and click Save on top. Navigate back to the Provisioning page. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/scim-azure7.png\" /> </Frame> On the Provisioning page at the bottom, there should also be a Provisioning Status toggle. Set that to On to enable SCIM syncing. Now every 40 minutes your users and groups for the Entra ID application will be synced to Windsurf. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/scim-azure8.png\" /> </Frame> Click on Save to finish, you have now enabled user and group syncing for SCIM. Only users and groups assigned to the application will be synced to Windsurf. Note that removing users only disables them access to Windsurf (and stops them from taking up a seat) rather than deleting users due to Azure's SCIM design. </Tab> <Tab title=\"Okta SCIM\"> Windsurf supports SCIM synchronization for users and groups with Okta. It isn't necessary to setup SSO to use SCIM synchronization, but it is highly recommended. You'll need: * Admin access to Okta * Admin access to Windsurf * An existing Windsurf Application on Okta (normally from your existing SSO application) ## Step 1: Navigate to the existing Windsurf Application Go to Okta, click on Applications, Applications on the left sidebar, and then click on the existing Windsurf application in the application list. ## Step 2: Enable SCIM Provisioning Under the general tab, App Settings click on Edit on the top right. Then tick the 'Enable SCIM Provisioning' checkbox, then click Save. A new provisioning tab should have showed up on the top. Now go to provisioning, click Edit and input in the following fields: SCIM connector base URL: [https://server.codeium.com/scim/v2](https://server.codeium.com/scim/v2) Unique identifier field for users: email Supported provisioning actions: Push New Users, Push Profile Updates, Push Groups Authentication Mode: HTTP Header For HTTP Header - Authorization, you can generate the token from * [https://windsurf.com/team/team\\_settings](https://windsurf.com/team/team_settings) and go to the SCIM tab on the left * Click on Add API Key, and give your API key a name * Copy the API key, go back to Okta and paste it to HTTP Header - Authorization Click on Save after filling out Provisioning Integration. ## Step 3: Setup Provisioning Under the provisioning tab, on the left there should be two new tabs. Click on To App, and Edit Provisioning to App. Tick the checkbox for Create Users, Update User Attributes, and Deactivate Users, and click Save. After this step, all users assigned to the group will now be synced to Windsurf. ## Step 4: Setup Group Provisioning (Optional) In order to sync groups to Windsurf, you will have to specify which groups to push. Under the application, click on the Push Groups tab on top. Now click on + Push Groups -> Find Groups by name. Filter for the group you would like to add, make sure Push group memberships immediately is checked, and then click Save. The group will be created and group members will be synced to Windsurf. Groups can then be used to filter for group analytics in the analytics page. </Tab> <Tab title=\"SCIM API\"> This guide shows how to create and maintain groups in Windsurf with the SCIM API. There are reasons one may want to provision groups manually rather than with their Identity Provider (Azure/Okta). Companies may want Groups provisioned from a different internal source (HR website, Sourcecode Management Tool etc.) that Windsurf doesn't have access to, or companies may finer control to Groups than what their Idendity Provider provides. Groups can thus be created with an API via HTTP request instead. The following provides examples on the HTTP request via CURL. There are 5 main APIs here, Create Group, Add group members, Replace group members, Delete Group, and List Users in a Group. ### Create Group ``` curl -k -X POST https://server.codeium.com/scim/v2/Groups -d '{ \"displayName\": \"<group name>\", \"schemas\": [\"urn:ietf:params:scim:schemas:core:2.0:Group\"] }' -H \"Authorization: Bearer <api secret key>\" -H \"Content-Type: application/scim+json\" ``` ### Add Group Members ``` curl -X PATCH https://server.codeium.com/scim/v2/Groups/<group name> -d '{\"schemas\": [\"urn:ietf:params:scim:api:messages:2.0:PatchOp\"], \"Operations\":[ { \"op\": \"add\", \"path\":\"members\", \"value\": [{\"value\": \"<email 1>\"}, {\"value\": \"<email 2>\"}] }]}' -H \"Authorization: Bearer <api secret key>\" -H \"Content-Type: application/scim+json\" ``` ### Replace Group Members ``` curl -X PATCH https://server.codeium.com/scim/v2/Groups/<group name> -d '{\"schemas\": [\"urn:ietf:params:scim:api:messages:2.0:PatchOp\"], \"Operations\":[ { \"op\": \"replace\", \"path\":\"members\", \"value\": [{\"value\": \"<email 1>\"}, {\"value\": \"<email 2>\"}] }]}' -H \"Authorization: Bearer <api secret key>\" -H \"Content-Type: application/scim+json\" ``` ### Delete Group ``` curl -X DELETE https://server.codeium.com/scim/v2/Groups/<group name> -H \"Authorization: Bearer <api secret key>\" -H \"Content-Type: application/scim+json\" ``` ### List Group ``` curl -X GET -H \"Authorization: Bearer <api secret key>\" \"https://server.codeium.com/scim/v2/Groups\" ``` ### List Users in a Group ``` curl -X GET -H \"Authorization: Bearer <api secret key>\" \"https://server.codeium.com/scim/v2/Groups/<group_id>\" ``` You'll have to at least create the group first, and then replace group to create a group with members in them. You'll also need to URL encode the group names if your group name has a special character like space, so a Group name such as 'Engineering Group' will have to be 'Engineering%20Group' in the URL. Note that users need to be created in Windsurf (through SCIM or manually creating the account) before they can be added to a group. ## User APIs There are also APIs for users as well. The following are some of the common SCIM APIs that Windsurf supports. Disable a user (Enable by replacing false to true): ``` curl -X PATCH \\ https://server.codeium.com/scim/v2/Users/<user api key> \\ -H 'Content-Type: application/scim+json' \\ -H 'Authorization: Bearer <api secret key>' \\ -d '{ \"schemas\": [\"urn:ietf:params:scim:api:messages:2.0:PatchOp\"], \"Operations\": [ { \"op\": \"replace\", \"path\": \"active\", \"value\": false } ] }' ``` Create a user: ``` curl -X POST \\ https://server.codeium.com/scim/v2/Users \\ -H 'Content-Type: application/scim+json' \\ -H 'Authorization: Bearer <api secret key>' \\ -d '{ \"schemas\": [\"urn:ietf:params:scim:schemas:core:2.0:User\"], \"userName\": \"<email>\", \"displayName\": \"<full name>\", \"active\": true, }' ``` Update name: ``` curl -X PATCH \\ 'https://<enterprise portal url>/_route/api_server/scim/v2/Users/<user api key>' \\ -H 'Authorization: Bearer <service key>' \\ -H 'Content-Type: application/scim+json' \\ -d '{ \"schemas\": [\"urn:ietf:params:scim:api:messages:2.0:PatchOp\"], \"Operations\": [ { \"op\": \"Replace\", \"path\": \"displayName\", \"value\": \"<new name>\" } ] }' ``` ## Creating Api Secret Key Go to [https://www.windsurf.com/team/team\\_settings](https://www.windsurf.com/team/team_settings). Under Service Key, click on Add Service Key. Enter any key name (such as 'Azure Provisioning Key') and click Create Service Key. Copy the output key and save it, you can now use the key to authorize the above APIs. </Tab> <Tab title=\"Duo\"> ## Prerequisites This guide assumes that you have Duo configured and acts as your organizational IDP, or has external IDP configured. You will need administrator access to both Duo and Windsurf accounts. ## Configure Duo for Windsurf 1. Navigate to Applications, and add a Generic SAML service provider <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/duo-sso-1.png\" /> </Frame> 2. Navigate to SSO in Team Settings <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/windsurf-sso-team-settings.png\" /> </Frame> 3. When enabling SAML for the first time, you will be required to set up your SSO ID. **You will not be able to change it later.** It is advised to set this to your organization or team name with alphanumeric characters only. 4. Copy the `Entity ID` value from the Duo portal and paste it into the `IdP Entity ID` field in the Windsurf portal. 5. Copy the `Single Sign-On URL` value from the Duo portal and paste it into the `SSO URL` field in the Windsurf portal. 6. Copy the certificate value from the Duo portal and paste it in the `X509 Certificate` field in the Windsurf portal <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/duo-sso-3.png\" /> </Frame> 7. Copy the `SP Identity ID` value from the Windsurf portal and paste it into the `Entity ID` field in the Duo portal. 8. Copy the `Callback URL (Assertion Consumer Service URL)` from the Windsurf portal and paste it into the `Assertion Consumer Service (ACS) URL` field in the Duo portal. 9. In the Duo portal, configure the attribute statements as following: <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/duo-sso-4.png\" /> </Frame> 10. Enable the SAML login in the Windsurf portal so you can test it. **NOTE: DO NOT LOGOUT OR CLOSE THE WINDOW AT THIS POINT.** If you get an error or it times out, troubleshoot your settings, otherwise you have to disable your SAML Settings in the Windsurf portal. **If you logout or close the window without confirming a successful test - you may get locked out.** 11. Once your test was successfully completed, you may logout. You can now use SSO sign in when browsing to your team/organization page with the SSO ID you have configured in step 3. [https://www.codeium.com/yourssoid/login](https://www.codeium.com/yourssoid/login) </Tab> <Tab title=\"PingID\"> ## Prerequisites This guide assumes that you have PingID configured and acts as your organizational IDP, or has external IDP configured. You will need administrator access to both PingID and Windsurf accounts. ## Configure PingID for Windsurf 1. Navigate to Applications and add Windsurf as a SAML Application <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/pingid-1.png\" /> </Frame> 2. Navigate to SSO in Team Settings <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/windsurf-sso-team-settings.png\" /> </Frame> 3. When enabling SAML for the first time, you will be required to set up your SSO ID. **You will not be able to change it later.** It is advised to set this to your organization or team name with alphanumeric characters only. 4. In PingID - choose to manually enter the configuration and fill out the fields with the following values: * ACS URLs - this is the `Callback URL (Assertion Consumer Service URL)` from the Windsurf portal. * Entity ID - this is the `SP Entity ID` from the Windsurf portal. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/pingid-3.png\" /> </Frame> 5. Copy the `Issuer ID` from PingID to the `IdP Entity ID` value in the Windsurf portal. 6. Copy the `Single Signon Service` value from PingID to the `SSO URL` value in the Windsurf portal. 7. Download the Signing Certificate from PingID as X509 PEM (.crt), open the file and copy its contents to the `X509 Certificate` value in the Windsurf portal. **Note**: make sure you have the fill begin and end lines with 5 dashes (-) and no other characters are copied! 8. In attribute mappings, make sure to map: * `saml_subject` - Email Address * `firstName` - Given Name * `lastName` - Family Name <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/pingid-4.png\" /> </Frame> 9. Add/edit any other policies and access as required by your setup/organization 10. Enable the SAML login in the Windsurf portal so you can test it. **NOTE: DO NOT LOGOUT OR CLOSE THE WINDOW AT THIS POINT.** If you get an error or it times out, troubleshoot your settings, otherwise you have to disable your SAML Settings in the Windsurf portal. **If you logout or close the window without confirming a successful test - you may get locked out.** 11. Once your test was successfully completed, you may logout. You can now use SSO sign in when browsing to your team/organization page with the SSO ID you have configured in step 3. [https://www.codeium.com/yourssoid/login](https://www.codeium.com/yourssoid/login) </Tab> </Tabs> # Getting started with Teams and Enterprise Source: https://docs.windsurf.com/windsurf/accounts/teams-getting-started Windsurf scales from solo projects to large-scale enterprise codebases. Our Teams and Enterprise plans unlock collaboration features such as team management, Single Sign-On (SSO), advanced analytics, and priority support. <Note>If your organisation requires extra security or compliance, please [contact our sales team](https://windsurf.com/contact/enterprise).</Note> ## Setup <Steps> <Step title=\"Choose a plan\"> Visit [windsurf.com/pricing](https://windsurf.com/pricing) and select the `Teams` or `Enterprise` tier. </Step> <Step title=\"Select seat count\"> Enter the number of users you want to include in the subscription. <Frame> <img width=\"500\" src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/teams/teams-select-user-count.jpg\" /> </Frame> </Step> <Step title=\"Manage and invite team members\"> <Card title=\"Manage Team Members\" horizontal={true} icon=\"users\" href=\"https://windsurf.com/team\"> Windsurf makes managing your team easy from one dashboard. </Card> To add members to your team, first navigate to the [invite page](https://windsurf.com/team/invite). Simply click on the \"invite\" button and then either add via email or share a unique invite link. </Step> <Step title=\"Configure team settings (optional)\"> <Card title=\"Team Settings\" horizontal={true} icon=\"gear\" href=\"https://windsurf.com/team/team_settings/windsurf_settings\"> Configurable settings for your team. </Card> Select and approve models, MCP servers, SSO configurations, service keys, role management, and more. </Step> <Step title=\"Set up Authentication (optional)\"> <Card title=\"Authentication\" horizontal={true} icon=\"lock\" href=\"/windsurf/accounts/sso-scim\"> Set up SSO, SCIM, Duo, or PingID for your team. </Card> For Teams plans, SSO must be purchased as an add-on [here](https://windsurf.com/team/manage), which also comes with access controls and subteam analytics. </Step> </Steps> ## Manage Team <Note>You must be a team admin to make changes to the team.</Note> To add or remove members from your team, navigate to the [Manage team page](https://windsurf.com/team/manage). From here, you can invite and view your team, add SSO, update the number of seats in your team, or even cancel or switch your plan. <Frame> <img width=\"500\" src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/teams-invite-members.png\" /> </Frame> ## User Groups <Note>This feature is only available in Enterprise plans and for teams with SSO enabled.</Note> Windsurf now supports creating user groups. For each group you can now view analytics per group. You can also configure group administrators who can view analytics for the specific groups they manage. ### Existing Subscription Already subscribed on Pro and want to upgrade? Head to your [Plan Management](https://windsurf.com/subscription/plan-management), click `Switch Plan`, and select the appropriate Teams or Enterprise plan. # Plans and Credit Usage Source: https://docs.windsurf.com/windsurf/accounts/usage Prompt credits are consumed whenever a message is sent to Cascade with a premium model. Every model has it's own credit multiplier with the default message costing 1 credit. You can view all available models and their associated costs on the [models page.](/windsurf/models) Upon using all of your credits, select premium models will no longer be accessible; however, you will still be able to use several other models that we've made available for free. ## Plans The [Free](#using-a-free-plan) plan includes: * 25 prompt credits * Unlimited Windsurf Tab * Unlimited Previews * 1 App Deploy per day The 2 week [Pro Trial](#using-a-free-pro-trial) includes: * 100 prompt credits * Unlimited Windsurf Tab * Unlimited Previews * 10 App Deploys per day The [Pro](#using-pro-plan) plan includes everything in Free, but with: * 500 prompt credits * Add-on prompt credits at \\$10/250 credits * All premium models The [Teams](#using-teams-plan) plan includes everything in Pro, but with: * 500 prompt credits/user/month * Add-on prompt credits at \\$40/1000 credits * Centralized billing * Admin dashboard with analytics * Priority support * Access control features available to add The [Enterprise](#using-enterprise-plan) plan includes everything in Teams, but with: * 1000 prompt credits/user/month * Add-on prompt credits at \\$40/1000 credits * Role-Based Access Control (RBAC) * SSO & SCIM * Highest priority support * Longer context If you run out of credits on any paid plan, you will have the option of [purchasing additional credits](#purchasing-additional-credits) or setting up [Automatic Credit Refills](#automatic-credit-refills). After upgrading, your paid plan will start immediately and you'll have access to premium models again. To learn more about the quotas and features per pricing plan, [click here](https://windsurf.com/pricing). ## Errors If a user message is unsuccessful, prompt credits will not be consumed. For example, if Cascade attempts to write to a file but that file has unsaved changes, the operation will fail and it will not consume a credit. ## Viewing your usage There are a few ways to view your usage. Go to the Cascade usage directly by clicking on the overflow menu, and then selecting \"Cascade Usage\". <Frame> <img style={{ maxHeight: \"300px\" }} src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/plan-info/usage-entry-cascade.png\" /> </Frame> View the settings panel by clicking on \"Windsurf Settings\" on the status bar, followed by selecting the \"Plan Info\" tab. You can also view it on your plan page at [windsurf.com/plan](https://windsurf.com/plan) after you're authenticated. ## Upgrading to a paid plan To learn more about paid features or to upgrade to a paid plan, [click here](https://windsurf.com/plan). Paid plans include Pro for individuals, Teams for organizations, and Enterprise for larger companies. We accept all major credit cards, Apple Pay, Cash App Pay, Google Pay, Link, WeChat Pay, and Alipay. If you have a payment method not listed, please reach out to us at [support](https://windsurf.com/support). You may need to disable your VPN to view the relevant payment methods for your region. ## What happens when you run out of prompt credits? If you no longer have prompt credits, you have two options: * You can purchase additional prompt credits to continue using premium models * You can use Write or Chat mode with the models that cost 0 credits! ## Automatic Credit Refills We've introduced Automatic Credit Refills so that you no longer need to manually purchase additional credits. Under your plan settings page on the Windsurf website, you can specify a maximum amount of credits and other refill settings. The system will automatically \"top-up\" your credits as you start running low (below 15 credits). Automatic Credit Refills are purchased in configurable increments (multiples of $10 for Pro and $40 for Teams) and subject to maximum monthly budget caps ($50 by default for Pro users and $160 for Teams users). This ensures you won't lose access to Cascade during critical work. ## Purchasing additional credits If you run out of prompt credits, you can purchase additional credits in the [billing website](https://windsurf.com/plan). Additional prompt credits can be purchased at a rate of \\$10 for 250 credits for Pro users. For Team and Enterprise plans, additional credits are purchased within and treated as a pool amongst all members of the team at a rate of \\$40 for 1000 pooled credits. Please contact your Teams admin to purchase more credits if you're on a team plan. ## Usage examples To explain how credits work, here's a simple example: When you send a message to Cascade with a premium model, 1 Prompt credit is consumed. It doesn't matter how many actions Cascade takes to fulfill your request - whether it searches your codebase, analyzes files, or makes edits - you only pay for the initial prompt. This simplified system makes it much easier to predict and manage your usage. No more complicated calculations of flow actions or different credit types. ## Plan Usage ### Using a Free Pro Trial The Pro Trial lasts for 2 weeks and includes unlimited Windsurf Tab, 100 prompt credits, Previews, and Deploys. When you're on a Pro Trial, you'll have access to premium features! To get started, ask Cascade a question. In Write and Chat mode, Cascade is optimized to fully understand your codebase and leverages tool calls to assist you. By default, all of your requests will use premium models until you run out of credits. After your trial period ends, you'll need to upgrade to a paid plan to continue using premium models. If you don't upgrade during the Free Trial period, you'll be downgraded to our Free plan which includes 25 prompt credits per month. ### Using Pro Plan The Pro plan costs \\$15/month and includes: * 500 prompt credits/month * All premium models * Previews * App Deploys Additional prompt credits can be purchased at a rate of \\$10 for 250 credits. While on Pro, you'll have access to a monthly quota of prompt credits. You can view how many credits you have remaining in the Windsurf Settings panel that's accessible in the status bar. If you're running low on credits, Cascade will notify you so that you can purchase additional credits or enable Automatic Credit Refills. To purchase additional credits, visit the billing website and select \"Purchase credits\". The credits purchased will rollover to the following usage month if there are any remaining. If you want to reduce your consumption of prompt credits, there are several available models that cost 0 credits! In addition to prompt credits, Pro comes with unlimited Fast Autocomplete and unlimited premium model requests with Command. ### Using Teams Plan The Teams plan costs \\$30/user/month (up to 200 users) and includes: * 500 prompt credits/user/month * Everything in Pro, plus: * Centralized billing * Admin dashboard with analytics * Priority support Additional prompt credits can be purchased at a rate of \\$40 for 1000 pooled credits. The Teams plan has a seat cap of 200 users. Coming soon, there will be an option to add Access Control features for +\\$10/user/month. While on the Teams plan, each user will have access to a monthly quota of prompt credits. Unlike the previous system, base prompt credits are not pooled - each user has their own credit limit. However, purchased add-on prompt credits are pooled across the organization. You can view how many credits your team has remaining in the Windsurf Settings panel. If your team is running low on credits, your administrator can purchase additional credits or enable Automatic Credit Refills. These add-on prompt credits purchased will rollover to the following usage month if there are any remaining. ### Using Enterprise Plan The Enterprise plan costs \\$60/user/month (up to 200 users) and includes everything in Teams plus: * 1000 prompt credits/user/month * Role-Based Access Control (RBAC) * SSO & SCIM (included) * Longer model context lengths * Highest priority support Additional prompt credits can be purchased at a rate of \\$40 for 1000 pooled credits. Coming soon, Enterprise will be self-serviceable with month-to-month pricing. The Enterprise plan includes self-serve SSO integration and enhanced security features. ### Using a Free plan The Free plan comes with: * 25 prompt credits/month * Unlimited Windsurf Tab * Unlimited Previews * 1 App Deploy per day Windsurf can still be used for free after your credits are exhausted! There are several models available that cost 0 credits to use. When editing code, you'll have access to unlimited Tab completions and AI command instructions. To learn more about features in Free and in paid tiers, [click here](https://codeium.com/pricing). ## Canceling your paid plan To cancel your paid plan, visit the billing website. Upon canceling your paid plan, you'll still have access to all of your credits from your monthly quota and add-on prompt credits until the end of the usage month. After the usage month, all add-on prompt credits will expire and you'll be downgraded to the Free plan where you'll be provided a limited number of prompt credits. If you change your mind and decide not to cancel before the end of the usage month, you can renew your plan by visiting the billing page. # Advanced Source: https://docs.windsurf.com/windsurf/advanced All advanced configurations can be found in Windsurf Settings which can be accessed by the top right dropdown → Windsurf Settings or Command Palette (Ctrl/⌘+Shift+P) → Open Windsurf Settings Page. # Enabling Cascade access to .gitignore files To provide Cascade with access to files that match patterns in your project's .gitignore , go to your Windsurf Settings and go to \"Cascade Gitignore Access\". By default, it is turned off. To provide access, turn it on by clicking the toggle. # SSH Support The usual SSH support in VSCode is licensed by Microsoft, so we have implemented our own just for Windsurf. It does require you to have [OpenSSH](https://www.openssh.com/) installed, but otherwise has minimal dependencies, and should \"just work\" like you're used to. You can access SSH under `Remote-SSH` in the Command Palette, or via the `Open a Remote Window` button in the bottom left. This extension has worked great for our internal development, but there are some known caveats and bugs: * We currently only support SSHing into Linux-based remote hosts. * The usual Microsoft \"Remote - SSH\" extension (and the [open-remote-ssh](https://github.com/jeanp413/open-remote-ssh) extension) will not work—please do not install them, as they conflict with our support. * We don't have all the features of the Microsoft SSH extension right now. We mostly just support the important thing: connecting to a host. If you have feature requests, let us know! * Connecting to a remote host via SSH then accessing a devcontainer on that remote host won't work like it does in VSCode. (We're working on it!) For now, if you want to do this, we recommend instead manually setting up an SSH daemon inside your devcontainer. Here is the set-up which we've found to work, but please be careful to make sure it's right for your use-case. 1. Inside the devcontainer, run this once (running multiple times may mess up your `sshd_config`): ``` sudo -s -- <<HERE sed -i '/SSO SSH Config START/Q' /etc/ssh/sshd_config echo \"Port 2222\" >> /etc/ssh/sshd_config ssh-keygen -A HERE ``` 2. Inside the devcontainer, run this in a terminal you keep alive (e.g. via tmux): ``` sudo /usr/sbin/sshd -D ``` 3. Then just connect to your remote host via SSH in windsurf, but using the port 2222. * SSH agent-forwarding is on by default, and will use Windsurf's latest connection to that host. If you're having trouble with it, try reloading the window to refresh the connection. * On Windows, you'll see some `cmd.exe` windows when it asks for your password. This is expected—we'll get rid of them soon. * If you have issues, please first make sure that you can ssh into your remote host using regular `ssh` in a terminal. If the problem persists, include the output from the `Output > Remote SSH (Windsurf)` tab in any bug reports! ## Notes * SSH + Dev Containers is not currently supported in Windsurf, but we plan to support it in the future. * You can only SSH into Linux-based remote hosts at the moment (though you should be able to SSH from all platforms.) We plan to support Windows and macOS in the future. # Dev Containers (Beta) Windsurf has beta support for dev containers for Mac, Windows, and Linux. To use this feature, Docker must be installed on your machine and be accessible from the Windsurf terminal. If you would like to run a development container locally, you can use the following commands: 1. `Open Folder in Container` * Open a new workspace with a specified devcontainer.json file 2. `Reopen in Container` * Reopen the current workspace in a new container, specifying a devcontainer.json file to configure the container. 3. `Attach to Running Container` * If you already have a Docker container running, you can attach a remote server to the container and connect your current workspace to it. If the container does not follow the [Development Container Specificaton](https://containers.dev/implementors/spec/), we will try our best effort to infer the remote user and set things up accordingly. 4. `Reopen Folder Locally` * If currently connected to a development container, you can disconnect from the container and reopen the current workspace locally. These will also appear if you click on the `Open a Remote Window` button in the bottom left. # WSL (Beta) As of version 1.1.0, Windsurf has beta support for Windows Subsystem for Linux. You must already have WSL set up and configured on your Windows machine. You can access WSL by clicking on the `Open a Remote Window` button in the bottom left, or under `Remote-WSL` in the Command Palette. # Extension Marketplace You can change the marketplace you use to download extensions from. To do this, go to `Windsurf Settings` and modify the Marketplace URL settings under the `General` section. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/marketplace.png\" /> </Frame> ## Windsurf Plugins <AccordionGroup> <Accordion title=\"Windsurf Pyright\"> Search \"Windsurf Pyright\" or paste in `@id:codeium.windsurfPyright` in the extensions search bar. </Accordion> </AccordionGroup> # AI Commit Messages Source: https://docs.windsurf.com/windsurf/ai-commit-message Generate git commit messages with a single click. This feature analyzes your code changes and creates meaningful commit messages that describe what you've done. Available with no limits to all paid users! <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/ai-commit-message.png\" /> </Frame> # How It Works When you're ready to commit changes: 1. Stage your files in the Git panel 2. Click the sparkle (✨) icon next to the commit message field 3. Review the generated message and edit if needed 4. Complete your commit The AI analyzes your recent code changes and creates a meaningful commit message that describes what you've done. # Best Practices For better results: * Apply general best practices for commit scope: group together small, meaningful units of changes * Review the message before committing # Limitations * Large or complex commits may result in more generic messages * Specialized terminology might not always be captured perfectly * Generated messages are suggestions and may need editing # Privacy Your code and commit messages remain private. We don't store your code changes or use them for training our models. # App Deploys Source: https://docs.windsurf.com/windsurf/cascade/app-deploys App Deploys lets you deploy web applications and sites directly within Windsurf through Cascade tool calls. This feature helps you share your work through public URLs, update your deployments, and claim projects for further customization. This feature is in beta and support for additional frameworks, more robust builds, etc. are coming soon. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/app-deploys-ui.png\" /> </Frame> ## Overview With App Deploys, you can: * Deploy a website or JS web app to a public domain * Re-deploy to the same URL after making changes * Claim the project to your personal account <Warning> App Deploys are intended primarily for preview purposes. For production applications with sensitive data, we recommend claiming your deployment and following security best practices. </Warning> ## Supported Providers We currently support the following deployment provider: * **Netlify** - For static sites and web applications <Note>Support for additional providers are planned for future releases.</Note> ## How It Works When you use App Deploys, your code is uploaded to our server and deployed to the provider under our umbrella account. The deployed site will be available at a public URL formatted as: ``` <SUBDOMAIN_NAME>.windsurf.build ``` <video autoPlay muted loop playsInline className=\"w-full aspect-video\" src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/app-deploys-demo1.mp4\" /> ### Deployment Process 1. Cascade analyzes your project to determine the appropriate framework 2. Your project files are securely uploaded to our server 3. The deployment is created on the provider's platform 4. You receive a public URL and a claim link ### Project Configuration To facilitate redeployment, we create a `windsurf_deployment.yaml` file at the root of your project. This file contains information for future deployments, such as a project ID and framework. ## Using App Deploys To deploy your application, simply ask Cascade something like: ``` \"Deploy this project to Netlify\" \"Update my deployment\" ``` Cascade will guide you through the process and help troubleshoot common issues. ## Team Deploys <Note> You will need Team admin priveleges to toggle this feature.</Note> Users on Teams and Enterprise plans can connect their Netlify accounts with their Windsurf accounts and deploy to their Netlify Team. This can be toggled in Team Settings, which you can access via the Profile page or by clicking [here](https://windsurf.com/team/team_settings/windsurf_settings/deploys). ## Security Considerations <Warning> Your code will be uploaded to our servers for deployment. Only deploy code that you're comfortable sharing publicly. </Warning> We take several precautions to ensure security: * File size limits and validation * Rate limiting based on your account tier * Secure handling of project files For added privacy, visit [clear-cookies.windsurf.build](https://clear-cookies.windsurf.build) to check for and clear any cookies set by sites under `windsurf.build`. If any cookies show up, they shouldn't be there, and clearing them helps prevent cross-site cookie issues and keeps your experience clean. Windsurf sites are built by humans and AI, and while we encourage the AI to make best practice decisions, it's smart to stay cautious. Windsurf isn't responsible for issues caused by sites deployed by our users. ## Claiming Your Deployment After deploying, you'll receive a claim URL. By following this link, you can claim the project on your personal provider account, giving you: * Full control over the deployment * Access to provider-specific features * Ability to modify the domain name * Direct access to logs and build information <Note> Unclaimed deployments may be deleted after a certain period. We recommend claiming important projects promptly. </Note> ## Rate Limits To prevent abuse, we apply these tier-based rate limits: | Plan | Deployments per day | Max unclaimed sites | | ---- | ------------------- | ------------------- | | Free | 1 | 1 | | Pro | 10 | 5 | ## Supported Frameworks App Deploys works with most popular JavaScript frameworks, including: * Next.js * React * Vue * Svelte * Static HTML/CSS/JS sites ## Troubleshooting ### Failed Deployment Build If your deployment fails: 1. Check the build logs provided by Cascade 2. Ensure your project can build locally (run `npm run build` to test) 3. Verify that your project follows the framework's recommended structure 4. View the documentation for how to deploy [your framework to Netlify via `netlify.toml`](https://docs.netlify.com/configure-builds/file-based-configuration/) 5. Consider claiming the project to access detailed logs on the provider's dashboard <Warning> We cannot provide direct support for framework-specific build errors. If your deployment fails due to code issues, debug locally or claim the project to work with the provider's support team. </Warning> ### Netlify Site Not Found <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/netlify-site-not-found.png\" /> </Frame> This likely means that your build failed. Please claim your site (you can find it on your [deploy history](https://windsurf.com/deploy)) and check the build logs for more details. Often times you can paste your build logs into Cascade and ask for help. ### Changing Your Subdomain / URL #### Updating `netlify.app` domain You can change your subdomain by claiming your deployment and updating the Netlify site settings. This will update your `.netlify.app` domain. #### Updating custom `.windsurf.build` subdomain <Warning> You cannot change your custom `.windsurf.build` subdomain after you've deployed. Instead, you'll need to deploy a new site with a new subdomain. </Warning> To update your custom `.windsurf.build` subdomain, you'll need to deploy a new site with a new subdomain: 1. Delete the `windsurf_config.yaml` file from your project 2. Ask Cascade to deploy a new site with a new subdomain and tell it which one you want 3. It can help to start a new conversation or clear your auto-generated memories so that Cascade doesn't try to re-deploy to the old subdomain 4. When you create a new deployment, you'll be able to press the \"Edit\" button on the subdomain UI to update it prior to pressing \"Deploy\" ### Error: `Unable to get project name for project ID` This error occurs when your project ID is not found in our system of records or if Cascade is using the subdomain as the project ID incorrectly. To fix this: 1. Check that the project still exists in your Netlify account (assuming it is claimed). 2. Check that the project ID is in the `windsurf_deployment.yaml` file. If it is not in the file, you can download your config file from your [deploy history](https://windsurf.com/deploy) dropdown. 3. Try redeploying and telling Cascade to use the `project_id` from the `windsurf_deployment.yaml` file more explicitly <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/app-deploys-download-config-file.png\" /> </Frame> # Overview Source: https://docs.windsurf.com/windsurf/cascade/cascade Windsurf's Cascade unlocks a new level of collaboration between human and AI. To open Cascade, press `Cmd/Ctrl+L`click the Cascade icon in the top right corner of the Windsurf window. Any selected text in the editor or terminal will automatically be included. ### Quick links to features <CardGroup cols={2}> <Card title=\"Web Search\" icon=\"globe-pointer\" href=\"/windsurf/web-search\"> Search the web for information to be referenced in Cascade's suggestions. </Card> <Card title=\"Memories & Rules\" icon=\"cloud-word\" href=\"/windsurf/memories\"> Memories and rules help customize behavior. </Card> </CardGroup> <CardGroup cols={2}> <Card title=\"MCP\" icon=\"hammer\" href=\"/windsurf/mcp\"> MCP servers extend the agent's capabilities. </Card> <Card title=\"Terminal\" icon=\"terminal\" href=\"/windsurf/terminal\"> An upgraded Terminal experience. </Card> </CardGroup> <CardGroup cols={2}> <Card title=\"Workflows\" icon=\"list\" href=\"/windsurf/cascade/workflows\"> Automate repetitive trajectories. </Card> <Card title=\"App Deploys\" icon=\"rocket\" href=\"/windsurf/cascade/app-deploys\"> Deploy applications in one click. </Card> </CardGroup> # Model selection Select your desired model from the selection menu below the Cascade conversation input box. Click below too see the full list of the available models and their availability across different plans, pricing, and their ability to accept image upload, can be found below. <Card title=\"Models\" icon=\"gear-code\" href=\"/windsurf/models\" horizontal={true}> Model availability in Windsurf. </Card> # Write/Chat Modes Cascade comes in two modes: **Write** and **Chat**. Write mode allows Cascade to create and make modifications to your codebase, while Chat mode is optimized for questions around your codebase or general coding principles. While in Chat mode, Cascade may propose new code to you. If you accept it, it will be added to your codebase. <video autoPlay muted loop playsInline className=\"w-1/4 aspect-video\" src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/cascade-write-chat-modes.mp4\" /> # Tool Calling Cascade has a variety of tools at its disposal, such as Search, Analyze, [Web Search](/windsurf/web-search), [MCP](/windsurf/mcp), and the [terminal](/windsurf/terminal). It can detect which packages and tools that you're using, which ones need to be installed, and even install them for you. Just ask Cascade how to run your project and press Accept. <Note>Cascade can make up to 20 tool calls per prompt. If the trajectory stops, simply press the `continue` button and Cascade will resume from where it left off. However, each `continue` will count as a new prompt credit due to tool calling costs.</Note> # Revert to previous steps You have the ability to revert changes that Cascade has made if you want to. Simply hover your mouse over the original prompt and click on the revert arrow on the right, or revert directly from the table of contents. This will revert all code changes back to the state of your codebase at the desired step. <Warning>Reverts are currently irreversible, so be careful!</Warning> <video autoPlay controls muted loop playsInline className=\"w-full aspect-video\" src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/cascade-revert.mp4\" /> # Real-time awareness A unique capability of Windsurf and Cascade is that it is aware of your real-time actions, removing the need to prompt with context on your prior actions. Simply instruct Cascade to \"Continue\". <video autoPlay controls muted loop playsInline className=\"w-full aspect-video\" src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf-continue.mp4\" /> # Send problems to Cascade When you have problems in your code which show up in the Problems panel at the bottom of the editor, simply click the `Send to Cascade` button to bring them into the Cascade panel as an @ mention. <Frame> <img style={{ maxHeight: \"500px\" }} src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/send-problems-to-cascade.png\" /> </Frame> # Explain and fix For any errors that you run into from within the editor, you can simply highlight the error and click `Explain and Fix` to have Cascade fix it for you. <Frame> <img style={{ maxHeight: \"500px\" }} src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/windsurf-explain-fix.png\" /> </Frame> # Ignoring files If you'd like Cascade to ignore files, you can add your files to `.codeiumignore` at the root of your workspace. This will prevent Cascade from viewing, editing or creating files inside of the paths designated. You can declare the file paths in a format similar to `.gitignore`. # Linter integration Cascade can automatically fix linting errors on generated code. This is turned on by default, but it can be disabled by clicking `Auto-fix` on the tool call, and clicking `disable`. This edit will not consume any credits. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/auto-fix-lint.png\" /> </Frame> When Cascade makes an edit with the primary goal of fixing lints that it created and auto-detected, it may discount the edit to be free of credit charge. This is in recognition of the fact that fixing lint errors increases the number of tool calls that Cascade makes. # Sounds for Cascade Play a sound when Cascade finishes a trajectory to let you know when it's done. You can enable it via `Windsurf Settings` > `Cascade` > `Enable Sounds for Cascade`. # Sharing your conversation <Note>This feature is currently only available for Teams and Enterprise customers. Currently not available to Hybrid customers.</Note> You can share your Cascade trajectories with your team by clicking the `...` Additional options button in the top right of the Cascade panel, and clicking `Share Conversation`. # Simultaneous Cascades Users can have multiple Cascades running simultaneously. You can navigate between them using the dropdown menu in the top left of the Cascade panel. <Warning>If two Cascades edit the same file at the same time, the edits can race, and sometimes the second edit will fail.</Warning> # Model Context Protocol (MCP) Source: https://docs.windsurf.com/windsurf/cascade/mcp **MCP (Model Context Protocol)** is a protocol that enables LLMs to access custom tools and services. An MCP client (Cascade, in this case) can make requests to MCP servers to access tools that they provide. Cascade now natively integrates with MCP, allowing you to bring your own selection of MCP servers for Cascade to use. See the [official MCP docs](https://modelcontextprotocol.io/) for more information. <Note>Enterprise users must manually turn this on via settings</Note> ## Adding a new MCP plugin New MCP plugins can be added from the Plugin Store, which you can access by clicking on the `Plugins` icon in the top right menu in the Cascade panel, or from the `Windsurf Settings` > `Cascade` > `Plugins` section. If you cannot find your desired MCP plugin, you can add it manually by editing the raw `mcp_config.json` file. Official MCP plugins will show up with a blue checkmark, indicating that they are made by the parent service company. When you click on a plugin, simply click `Install` to expose the server and its tools to Cascade. Windsurf supports two [transport types](https://modelcontextprotocol.io/docs/concepts/transports) for MCP servers: `stdio` and `/sse`. For `/sse` servers, the URL should reflect that of the endpoint and resemble `https://<your-server-url>/sse`. <Note>Make sure to press the refresh button after you add a new MCP plugin.</Note> <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/mcp/mcp-plugin-store.png\" /> </Frame> ## Configuring MCP tools Each plugin has a certain number of tools it has access to. Cascade has a limit of 100 total tools that it has access to at any given time. At the plugin level, you can navigate to the Tools tab and toggle the tools that you wish to enable. Or, from the `Windsurf Settings`, you can click on the `Manage plugins` button. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/mcp/mcp-manage-plugin-tools.png\" /> </Frame> ## mcp\\_config.json The `~/.codeium/windsurf/mcp_config.json` file is a JSON file that contains a list of servers that Cascade can connect to. The JSON should follow the same schema as the config file for Claude Desktop. Here’s an example configuration, which sets up a single server for GitHub: ```json { \"mcpServers\": { \"github\": { \"command\": \"npx\", \"args\": [ \"-y\", \"@modelcontextprotocol/server-github\" ], \"env\": { \"GITHUB_PERSONAL_ACCESS_TOKEN\": \"<YOUR_PERSONAL_ACCESS_TOKEN>\" } } } } ``` It's important to note that for SSE servers, the configuration is slightly different and requires a `serverUrl` field. Here's an example configuration for a SSE server: ```json { \"mcpServers\": { \"figma\": { \"serverUrl\": \"<your-server-url>/sse\" } } } ``` Be sure to provide the required arguments and environment variables for the servers that you want to use. See the [official MCP server reference repository](https://github.com/modelcontextprotocol/servers) or [OpenTools](https://opentools.com/) for some example servers. ## Admin Controls (Teams & Enterprises) Team admins can toggle MCP access for their team, as well as whitelist approved MCP servers for their team to use: <Card title=\"MCP Team Settings\" horizontal={true} icon=\"hammer\" href=\"https://windsurf.com/team/team_settings/windsurf_settings/mcp\"> Configurable MCP settings for your team. </Card> <Warning>The above link will only work if you have admin privileges for your team.</Warning> By default, users within a team will be able to configure their own MCP servers. By whitelisting any MCP servers, admins are electing to configure the entirety of the MCP experience for their team. Once even a single MCP server is whitelisted for the team, all other MCP servers will be blacklisted. To whitelist an MCP server, admins must input the desired `Server ID` and `Server Config (JSON)`. The `Server Config (JSON)` payload inputed here should exactly match the payload that would be inputed into the `mcp_config.json` file. If no `Server Config (JSON)` is provided, the server will be whitelisted with default configurations if it exists in the [Windsurf MCP Plugin Store](/windsurf/cascade/mcp#adding-a-new-mcp-plugin). For example: <Tabs> <Tab title=\"Github (stdio)\"> `Server ID` = github-mcp-server ```json { \"command\": \"docker\", \"args\": [ \"run\", \"-i\", \"--rm\", \"-e\", \"GITHUB_PERSONAL_ACCESS_TOKEN\", \"ghcr.io/github/github-mcp-server\" ], \"env\": { \"GITHUB_PERSONAL_ACCESS_TOKEN\": \"\" } } ``` </Tab> <Tab title=\"Custom MCP Server (sse)\"> `Server ID` = custom-mcp-server-sse ```json { \"type\": \"sse\", \"url\": \"http://localhost:8080/sse\", \"headers\": { \"Authorization\": \"none\", \"Content-Type\": \"application/json\", \"VERSION\": \"1.0\" } } ``` </Tab> </Tabs> ## Notes * Since MCP tool calls can invoke code written by arbitrary server implementers, we do not assume liability for MCP tool call failures. To reiterate: * We currently support an MCP server's [tools](https://modelcontextprotocol.io/docs/concepts/tools) and [resources](https://modelcontextprotocol.io/docs/concepts/resources), not [prompts](https://modelcontextprotocol.io/docs/concepts/prompts). # Memories & Rules Source: https://docs.windsurf.com/windsurf/cascade/memories `Memories` is the system for sharing and persisting context across conversations. There are two mechanisms for this in Windsurf: Memories, which can be automatically generated by Cascade, and rules, which are manually defined by the user at both the local and global levels. ## How to Manage Memories Memories and Rules can be accessed and configured at any time by clicking on the `Customizations` icon in the top right slider menu in Cascade, or via “Windsurf - Settings” in the bottom-right hand corner. To edit an existing memory, simply click into it and then click the `Edit` button. <video autoPlay controls muted loop playsInline className=\"aspect-video\" src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/memories-rules.mp4\" /> ## Memories During conversation, Cascade can automatically generate and store memories if it encounters context that it believes is useful to remember. Additionally, you can ask Cascade to create a memory at any time. Just prompt Cascade to \"create a memory of ...\". Cascade's autogenerated memories are associated with the workspace that they were created in and Cascade will retrieve them when it believes that they are relevant. Memories generated in one workspace will not be available in another. <Tip>Creating and using auto-generated memories do NOT consume credits</Tip> ## Rules Users can explicitly define their own rules for Cascade to follow. Rules can be defined at either the global level or the workspace level. `global_rules.md` - rules applied across all workspaces `.windsurf/rules` - workspace level repo containing rules that are tied to globs or natural language descriptions. To get started with Rules, click on the `Customizations` icon in the top right slider menu in Cascade, then navigate to the `Rules` panel. Here, you can click on the `+ Global` or `+ Workspace` button to create new rules at either the global or workspace level, respectively. <Tip>You can find example rule templates curated by the Windsurf team at [https://windsurf.com/editor/directory](https://windsurf.com/editor/directory) to help you get started.</Tip> Rules files are limited to 12000 characters each. ### Activation Modes At the rule level, you can define how a rule should be activated for Cascade. There are 4 modes: 1. **Manual**: This rule can be manually activated via `@mention` in Cascade's input box 2. **Always On**: This rule will always be applied 3. **Model Decision**: Based on a natural language description of the rule the user defines, the model decides whether to apply the rule. 4. **Glob**: Based on the glob pattern that the user defines (e.g. *.js, src/\\*\\*/*.ts), this rule will be applied to all files that match the pattern. ### Best Practices To help Cascade follow your rules effectively, follow these best practices: * Keep rules simple, concise, and specific. Rules that are too long or vague may confuse Cascade. * There's no need to add generic rules (e.g. \"write good code\"), as these are already baked into Cascade's training data. * Format your rules using bullet points, numbered lists, and markdown. These are easier for Cascade to follow compared to a long paragraph. For example: ``` # Coding Guidelines - My project's programming language is python - Use early returns when possible - Always add documentation when creating new functions and classes ``` * XML tags can be an effective way to communicate and group similar rules together. For example: ``` <coding_guidelines> - My project's programming language is python - Use early returns when possible - Always add documentation when creating new functions and classes </coding_guidelines> ``` # Planning Mode Source: https://docs.windsurf.com/windsurf/cascade/planning-mode Planning Mode introduces a native interface for collaborating with AI on long-term thinking. It provides Cascade with the ability to generate, track, and evolve a persistent planning file. When toggled on, Cascade generates a local markdown file that it refers back to throughout the project. You can manually open and edit this plan, or simply ask Cascade to make updates for you. <Note>Planning Mode is currently only available to Pro, Teams, and Enterprise users.</Note> <Frame> <video autoPlay muted loop playsInline src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/create-plan-planning-mode-nobg.mp4\" /> </Frame> # Behavior The planning document will be saved and persisted into a subdirectory within `~/.codeium/windsurf/brain` directory so it won't be checked into version control. In Planning Mode, Cascade will frequently refer to the plan as it completes the task. It will also try to look for approval before implementing steps in the plan. After implementing steps, Cascade will update the plan and summarize the changes for the user before proceeding to the next step(s). In the background, a specialized planning agent is being used to iterate on the long-term plan as you use your selected model to take short-term actions conditional on the plan. # Plan Creation By default, planning mode is disabled. You can create a new plan by toggling Planning Mode. Simply click the button below the Cascade input box and start or continue your conversation. <Frame> <video autoPlay muted loop playsInline src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/toggle-planning-mode-nobg.mp4\" width=\"50%\" /> </Frame> # Updating Plans Plans can be updated directly in the markdown file, or by prompting Cascade to make updates for you. Cascade may also automatically make updates to the plan as it picks up new information (such as a [Memory](/windsurf/memories)) during the course of a conversation. <Frame> <video autoPlay muted loop playsInline src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/update-planning-mode-nobg.mp4\" /> </Frame> # Web and Docs Search Source: https://docs.windsurf.com/windsurf/cascade/web-search Cascade can now intuitively parse through and chunk up web pages and documentation, providing realtime context to the models. The key way to understand this feature is that Cascade will browse the Internet as a human would. Our web tools are designed in such a way that gets only the information that is necessary in order to efficiently use your credits. ## Overview To help you better understand how Web Search works, we've recorded a short video covering the key concepts and best practices. <iframe width=\"560\" height=\"315\" src=\"https://www.youtube.com/embed/moIySJ4d0UY\" title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen /> ### Quick Start The fastest way to get started is to activate web search in your Windsurf Settings in the bottom right corner of the editor. You can activate it a couple of different ways: 1. Ask a question that probably needs the Internet (ie. \"What's new in the latest version of React?\"). 2. Use `@web` to force a docs search. 3. Use `@docs` to query over a list of docs that we are confident we can read with high quality. 4. Paste a URL into your message. ## Search the web Cascade can deduce that certain prompts from the user may require a real-time web search to provide the optimal response. In these cases, Cascade will perform a web search and provide the results to the user. This can happen automatically or manually using the `@web` mention. <Frame style={{ border: \"none\", background: \"none\" }}> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/cascade-search-web.png\" /> </Frame> ## Reading Pages Cascade can read individual pages for things like documentation, blog posts, and GitHub files. The page reads happen entirely on your device within your network so if you're using a VPN you shouldn't have any problems. Pages are picked up either from web search results, inferred based on the conversation, or from URLs pasted directly into your message. We break pages up into multiple chunks, very similar to how a human would read a page: for a long page we skim to the section we want then read the text that's relevant. This is how Cascade operates as well. <Frame style={{ border: \"none\", background: \"none\" }}> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/cascade-parse-url.png\" /> </Frame> It's worth noting that not all pages can be parsed. We are actively working on improving the quality of our website reading. If you have specific sites you'd like us to handle better, feel free to file a feature request! # Workflows Source: https://docs.windsurf.com/windsurf/cascade/workflows Workflows enable users to define a series of steps to guide Cascade through a repetitive set of tasks, such as deploying a service or responding to PR comments. These Workflows are saved as markdown files, allowing users and their teams an easy repeatable way to run key processes. Once saved, Workflows can be invoked in Cascade via a slash command with the format of `/[name-of-workflow]` ## How it works Rules generally provide large language models with guidance by providing persistent, reusable context at the prompt level. Workflows extend this concept by providing a structured sequence of steps or prompts at the trajectory level, guiding the model through a series of interconnected tasks or actions. <Frame> <img style={{ maxHeight: \"400px\" }} src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/use-workflow-pr.png\" /> </Frame> To execute a Workflow, users simply invoke it in Cascade using the `/[workflow-name]` command. <Tip>You can call other Workflows from within a Workflow! <br /><br />For example, /workflow-1 can include instructions like \"Call /workflow-2\" and \"Call /workflow-3\".</Tip> Upon invocation, Cascade sequentially processes each step defined in the Workflow, performing actions or generating responses as specified. ## How to create a Workflow To get started with Workflows, click on the `Customizations` icon in the top right slider menu in Cascade, then navigate to the `Workflows` panel. Here, you can click on the `+ Workflow` button to create a new Workflow. Workflows are saved as markdown files within the repository root of `.windsurf/workflows/` and contains a title, description, and a series of steps with specific instructions for Cascade to follow. Workflow files are limited to 12000 characters each. <video autoPlay controls muted loop playsInline className=\"w-full aspect-video\" src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/create-workflow.mp4\" /> ### Generate a Workflow with Cascade You can also ask Cascade to generate Workflows for you! This works particularly well for Workflows involving a series of steps in a particular CLI tool. <video autoPlay controls muted loop playsInline className=\"w-full aspect-video\" src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/create-workflow-with-cascade.mp4\" /> ## Example Workflows There are a myriad of use cases for Workflows, such as: <Card title=\"/address-pr-comments\"> This is a Workflow our team uses internally to address PR comments: ``` 1. Check out the PR branch: `gh pr checkout [id]` 2. Get comments on PR bash gh api --paginate repos/[owner]/[repo]/pulls/[id]/comments | jq '.[] | {user: .user.login, body, path, line, original_line, created_at, in_reply_to_id, pull_request_review_id, commit_id}' 3. For EACH comment, do the following. Remember to address one comment at a time. a. Print out the following: \"(index). From [user] on [file]:[lines] — [body]\" b. Analyze the file and the line range. c. If you don't understand the comment, do not make a change. Just ask me for clarification, or to implement it myself. d. If you think you can make the change, make the change BEFORE moving onto the next comment. 4. After all comments are processed, summarize what you did, and which comments need the USER's attention. ``` </Card> <Card title=\"/git-workflows\"> Commit using predefined formats and create a pull requests with standardized title and descriptions using the appropriate CLI commands. </Card> <Card title=\"/dependency-management\"> Automate the installation or updating of project dependencies based on a configuration file (e.g., requirements.txt, package.json). </Card> <Card title=\"/code-formatting\"> Automatically run code formatters (like Prettier, Black) and linters (like ESLint, Flake8) on file save or before committing to maintain code style and catch errors early. </Card> <Card title=\"/run-tests-and-fix\"> Run or add unit or end-to-end tests and fix the errors automatically to ensure code quality before committing, merging, or deploying. </Card> <Card title=\"/deployment\"> Automate the steps to deploy your application to various environments (development, staging, production), including any necessary pre-deployment checks or post-deployment verifications. </Card> <Card title=\"/security-scan\"> Integrate and trigger security vulnerability scans on your codebase as part of the CI/CD pipeline or on demand. </Card> # Getting started with Windsurf Source: https://docs.windsurf.com/windsurf/getting-started Tomorrow's editor, today. Windsurf is a next-generation AI IDE built to keep you in the flow. On this page, you'll find instructions on how to install Windsurf on your computer, navigate the onboarding flow, and get started with your first AI-powered project. <Card title=\"Cascade\" icon={ <svg width=\"25\" height=\"25\" viewBox=\"0 0 1292 1292\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" > <path d=\"M1195 599C1195 848.08 993.08 1050 744 1050C494.92 1050 293 848.08 293 599C293 349.92 494.92 148 744 148C993.08 148 1195 349.92 1195 599ZM411.5 599C411.5 782.635 560.365 931.5 744 931.5C927.635 931.5 1076.5 782.635 1076.5 599C1076.5 415.365 927.635 266.5 744 266.5C560.365 266.5 411.5 415.365 411.5 599Z\" fill=\"#34E8BB\" /> <path d=\"M1096.19 1053.62C1116.8 1078.03 1113.86 1114.77 1087.65 1133.04C1002.41 1192.46 903.441 1229.92 799.584 1241.61C676.505 1255.46 552.082 1232.51 442.049 1175.65C332.016 1118.79 241.314 1030.58 181.415 922.172C130.87 830.693 104.172 728.301 103.33 624.396C103.071 592.449 131.338 568.79 163.173 571.479C195.007 574.168 218.29 602.208 219.218 634.143C221.573 715.175 243.206 794.78 282.679 866.22C331.512 954.6 405.457 1026.51 495.161 1072.87C584.866 1119.22 686.302 1137.94 786.643 1126.64C867.75 1117.51 945.198 1089.11 1012.66 1044.15C1039.24 1026.44 1075.58 1029.21 1096.19 1053.62Z\" fill=\"#34E8BB\" /> <path d=\"M177.334 450.08C146.261 442.514 126.947 411.072 137.349 380.829C160.687 312.983 195.56 249.512 240.566 193.267C285.571 137.023 339.851 89.0802 400.928 51.4326C428.153 34.6511 463.065 46.5999 477.261 75.2582C491.457 103.917 479.508 138.389 452.641 155.738C406.542 185.506 365.436 222.584 330.994 265.627C296.552 308.67 269.39 356.906 250.456 408.411C239.421 438.428 208.408 457.646 177.334 450.08Z\" fill=\"#34E8BB\" /> </svg> } href=\"/windsurf/cascade\" > Your agentic chatbot that can collaborate with you like never before. </Card> <CardGroup cols={2}> <Card title=\"Usage\" icon=\"bars-progress\" href=\"/windsurf/cascade/usage\"> Credits and usage. </Card> <Card title=\"Terminal\" icon=\"terminal\" href=\"/windsurf/terminal\"> An upgraded Terminal experience. </Card> </CardGroup> <CardGroup cols={2}> <Card title=\"MCP\" icon=\"hammer\" href=\"/windsurf/cascade/mcp\"> MCP servers extend the agent's capabilities. </Card> <Card title=\"Memories\" icon=\"cloud-word\" href=\"/windsurf/cascade/memories\"> Memories and rules help customize behavior. </Card> <Card title=\"Context Awareness\" icon=\"brain\" href=\"/context-awareness/overview\"> Instantly understands your codebase. </Card> <Card title=\"Advanced\" icon=\"gears\" href=\"/windsurf/advanced\"> Advanced configuration options. </Card> </CardGroup> <CardGroup cols={2}> <Card title=\"Workflows\" icon=\"list\" href=\"/windsurf/cascade/workflows\"> Automate repetitive trajectories. </Card> <Card title=\"App Deploys\" icon=\"rocket\" href=\"/windsurf/cascade/app-deploys\"> Deploy applications in one click. </Card> </CardGroup> <Tip> See what's new with Windsurf in our [changelog](https://windsurf.com/changelog)! </Tip> ## Set Up To get started, please ensure that your device meets the requirements, click the download link, and follow the instructions to install and run Windsurf. [Click here](#update-windsurf) if you're looking for how to update Windsurf. <Tabs> <Tab title=\"Mac\"> Minimum OS Version: OS X Yosemite <a href=\"https://windsurf.com/windsurf/download_mac\" target=\"_blank\" rel=\"noopener noreferrer\"> <button style={{width: '170px', backgroundColor: '#34E8BB', color: 'white', padding: '5px 10px', border: 'none', borderRadius: '5px', cursor: 'pointer', fontSize: '0.8rem', display: 'flex', justifyContent: 'center'}}>Download for Mac</button> </a> </Tab> <Tab title=\"Windows\"> Minimum OS Version: Windows 10 <a href=\"https://windsurf.com/windsurf/download\" target=\"_blank\" rel=\"noopener noreferrer\"> <button style={{width: '170px', backgroundColor: '#34E8BB', color: 'white', padding: '5px 10px', border: 'none', borderRadius: '5px', cursor: 'pointer', fontSize: '0.8rem', display: 'flex', justifyContent: 'center'}}>Download for Windows</button> </a> </Tab> <Tab title=\"Ubuntu\"> Minimum OS Version: >= 20.04 (or glibc >= 2.31, glibcxx >= 3.4.26) <a href=\"https://windsurf.com/windsurf/download_linux\" target=\"_blank\" rel=\"noopener noreferrer\"> <button style={{width: '170px', backgroundColor: '#34E8BB', color: 'white', padding: '5px 10px', border: 'none', borderRadius: '5px', cursor: 'pointer', fontSize: '0.8rem', display: 'flex', justifyContent: 'center'}}>Download for Ubuntu</button> </a> </Tab> <Tab title=\"Other Linux distributions\"> Minimum OS Version: glibc >= 2.28, glibcxx >= 3.4.25 <a href=\"https://windsurf.com/windsurf/download_linux\" target=\"_blank\" rel=\"noopener noreferrer\"> <button style={{width: '170px', backgroundColor: '#34E8BB', color: 'white', padding: '5px 10px', border: 'none', borderRadius: '5px', cursor: 'pointer', fontSize: '0.8rem', display: 'flex', justifyContent: 'center'}}>Download for Linux</button> </a> </Tab> </Tabs> ## Onboarding Once you have Windsurf running, you will see the page below. Let's get started! Note that you can always restart this onboarding flow with the \"Reset Onboarding\" command. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/onboarding/welcome.png\" /> </Frame> ### 1. Select setup flow If you're coming from VS Code or Cursor, you can easily import your configurations. Otherwise, select \"Start fresh\". You can also optionally install `windsurf` in PATH such that you can run `windsurf` from your command line. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/onboarding/setup.png\" /> </Frame> <Tabs> <Tab title=\"Start fresh\"> Choose your keybindings here, either default VS Code bindings or Vim bindings. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/onboarding/keybind.png\" /> </Frame> </Tab> <Tab title=\"Import from VS Code\"> You can migrate your settings, extensions, or both here. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/onboarding/vscode_migration.png\" /> </Frame> </Tab> <Tab title=\"Import from Cursor\"> You can migrate your settings, extensions, or both here. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/onboarding/vscode_migration.png\" /> </Frame> </Tab> </Tabs> ### 2. Choose editor theme Choose your favorite color theme from these defaults! Don't worry, you can always change this later. Note that if you imported from VS Code, your imported theme will override this. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/onboarding/theme.png\" /> </Frame> ### 3. Sign up / Log in To use Windsurf, you need to use your Windsurf account or create one if you don't have one. Signing up is completely free! <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/onboarding/auth.png\" /> </Frame> Once you've authenticated correctly, you should see this page. Hit \"Open Windsurf\" and you're good to go! <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/onboarding/authenticated.png\" /> </Frame> #### Having Trouble? If you're having trouble with this authentication flow, you can also log in and manually provide Windsurf with an authentication code. <Tabs> <Tab title=\"1. Select &#x22;Having Trouble?&#x22;\"> Click the \"Copy link\" button to copy an authentication link to your clipboard and enter this link into your browser. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/onboarding/manual_auth.png\" /> </Frame> </Tab> <Tab title=\"2. Enter Authentication Code\"> Copy the authentication code displayed in the link and enter it into Windsurf. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/onboarding/manual_auth_onboarding.png\" /> </Frame> </Tab> </Tabs> ### 4. Let's Surf! <Frame> <video autoPlay muted loop playsInline src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/onboarding/lets_surf.mp4\" /> </Frame> ## Update Windsurf To update Windsurf, you can click on the \"Restart to Update ->\" button in the top right corner of the menu bar. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/update-windsurf.png\" /> </Frame> If you are not seeing this button, you can: 1. Click on your Profile icon dropdown > Check for Updates 2. In the Command Palette (`Cmd/Ctrl+Shift+P`) > \"Check for Updates\" ## Things to Try Now that you've successfully opened Windsurf, let's try out some of the features! These are all conveniently accessible from the starting page. :) <AccordionGroup> <Accordion title=\"Write with Cascade\"> <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade.png\" /> </Frame> On the right side of the IDE, you'll notice a new panel called \"Cascade\". This is your AI-powered code assistant! You can chat, write code, and run code with Cascade! Learn more about how it works [here](/windsurf/cascade). </Accordion> <Accordion title=\"Generate a project with Cascade\"> <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade_generate.png\" /> </Frame> You can create brand new projects with Cascade! Click the \"New Project\" button to get started. </Accordion> <Accordion title=\"Open Folder / Connect to Remote Server\"> <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/open_workspace.png\" /> </Frame> You can open a folder or connect to a remote server via SSH or a local dev container. Learn more [here](/windsurf/advanced). </Accordion> <Accordion title=\"Configure Windsurf Settings\"> <Frame> <img style={{width: '50%', display: 'block', margin: 'auto'}} src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/windsurf-settings-panel.png\" /> </Frame> Click on the \"Windsurf - Settings\" button on the bottom right to pop up the settings panel. To access Advanced Settings, click on the button in this panel or select \"Windsurf Settings\" in the top right profile dropdown. </Accordion> <Accordion title=\"Open Command Palette\"> <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/command_palette.png\" /> </Frame> You can open the command palette with the `⌘+⇧+P` (on Mac) or `Ctrl+Shift+P` (on Windows/Linux) shortcut. Explore the available commands! </Accordion> </AccordionGroup> ## Forgot to Import VS Code Configurations? You can easily import your VS Code/Cursor configuration into Windsurf if you decide to do so after the onboarding process. Open the command palette (Mac: `⌘+⇧+P`, Windows/Linux: `Ctrl+Shift+P`) and type in the following: <Tabs> <Tab title=\"VS Code\"> <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/import-vscode.png\" /> </Frame> </Tab> <Tab title=\"Cursor\"> <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/import-cursor.png\" /> </Frame> </Tab> </Tabs> ## Incompatible Extensions There are a few extensions that are incompatible with Windsurf. These include other AI code complete extensions and proprietary extensions. You cannot install extensions through any marketplace on Windsurf. ## Custom App Icons (beta) For paying users of Windsurf, you can choose between different Windsurf icons while it sits in your dock. Currently, this feature is only available for Mac OS, with other operating systems coming soon. To change your app icon, simply click the profile/settings icon in the top right corner of the editor and select \"Customize App Icon\". ## Windsurf Next Windsurf Next is prerelease version of Windsurf which users can choose to opt-in to access the newest features and capabilities as early as possible, even if the features are not fully polished. Features will typically be rolled out to Windsurf Next first, and then into the stable release shortly after. You can opt-in to Windsurf Next simply by [downloading it here](https://windsurf.com/editor/download-next). ## Uninstall Windsurf To uninstall Windsurf from your system, follow these steps: <Steps> <Step title=\"Close Windsurf\"> Ensure that Windsurf is not currently running before proceeding with the uninstallation. </Step> <Step title=\"Delete the Windsurf application\"> <Tabs> <Tab title=\"Mac\"> Drag the Windsurf application from the Applications folder to the Trash. </Tab> <Tab title=\"Windows\"> The application is usually located in one of these folders: * `C:\\Program Files\\Windsurf` * `C:\\Users\\[YourUsername]\\AppData\\Local\\Programs\\Windsurf` Delete the Windsurf folder from the appropriate location. </Tab> <Tab title=\"Linux\"> Remove the Windsurf folder from the location where you installed it. </Tab> </Tabs> </Step> <Step title=\"Remove configuration files\"> <Tabs> <Tab title=\"Mac/Linux\"> Delete the Windsurf configuration folder: ```bash rm -rf ~/.codeium/windsurf ``` </Tab> <Tab title=\"Windows\"> Delete the Windsurf configuration folder: ``` C:\\Users\\[YourUsername]\\.codeium\\windsurf ``` </Tab> </Tabs> </Step> <Step title=\"Additional cleanup\"> <ul> <li>If you installed Windsurf in PATH, remove it from your system's PATH environment variable.</li> <li>If you installed Windsurf using your system's package manager or control panel, you can also use that to uninstall it.</li> <li>Empty your Trash or Recycle Bin to complete the uninstallation.</li> </ul> </Step> </Steps> # Models Source: https://docs.windsurf.com/windsurf/models In the Cascade panel `Ctrl/⌘ + L` you can easily switch between different models of your choosing. Depending on the model you select, each of your input prompts will consume a different number of [prompt credits](/windsurf/cascade/usage). Under the text input box, you will see a model selection dropdown menu. You will see the following models available: | Model | Prompt credits | Free | Pro/Trial | Teams | Enterprise | Images? | | :--------------------------- | :----------------------------------------------------------------------------------: | :--: | :-----------------: | :---: | :--------: | :-----: | | SWE-1 | 0<sup>1</sup> | ✓ | ✓ | ✓ | ✓ | `true` | | SWE-1-lite | 0 | ✓ | ✓ | ✓ | ✓ | | | GPT-4o | 1 | ✓ | ✓ | ✓ | ✓ | `true` | | GPT-4.1 | 0.25<sup>1</sup> | ✓ | ✓ | ✓ | ✓ | `true` | | o3 | 1 | ✓ | ✓ | ✓ | ✓ | ✓ | | o3 (high reasoning) | 1 | ✓ | ✓ | ✓ | ✓ | ✓ | | o3-mini (medium reasoning) | 1 | | ✓ | ✓ | ✓ | | | o4-mini (medium reasoning) | 0.25<sup>1</sup> | ✓ | ✓ | ✓ | ✓ | `true` | | o4-mini (high reasoning) | 0.25<sup>1</sup> | ✓ | ✓ | ✓ | ✓ | `true` | | Claude 3.5 Sonnet | 1 | 🗝 | ✓ Pro<br />🗝 Trial | ✓ | ✓ | `true` | | Claude 3.7 Sonnet | 1 | 🗝 | ✓ Pro<br />🗝 Trial | ✓ | ✓ | `true` | | Claude 3.7 Sonnet (Thinking) | 1.25 | 🗝 | ✓ Pro<br />🗝 Trial | ✓ | ✓ | `true` | | Claude Sonnet 4 | [🗝](/windsurf/models#bring-your-own-key-byok) or [🪙](/windsurf/models#api-pricing) | 🗝 | 🗝 or 🪙 | 🪙 | 🪙 | `true` | | Claude Sonnet 4 (Thinking) | [🗝](/windsurf/models#bring-your-own-key-byok) or [🪙](/windsurf/models#api-pricing) | 🗝 | 🗝 or 🪙 | 🪙 | 🪙 | `true` | | Claude 4 Opus | [🗝](/windsurf/models#bring-your-own-key-byok) | 🗝 | 🗝 | | | `true` | | Claude 4 Opus (Thinking) | [🗝](/windsurf/models#bring-your-own-key-byok) | 🗝 | 🗝 | | | `true` | | DeepSeek-V3-0324 | 0 | | ✓ | | | | | DeepSeek-R1 | 0.5 | | ✓ | | | | | Gemini 2.0 Flash | 0.25 | | ✓ | ✓ | ✓ | | | Gemini 2.5 Flash | 0.1 | | ✓ | ✓ | ✓ | `true` | | Gemini 2.5 Flash (Thinking) | 0.15 | | ✓ | ✓ | ✓ | `true` | | Gemini 2.5 Pro | 0.75<sup>1</sup> | ✓ | ✓ | ✓ | ✓ | `true` | | xAI Grok-3 | 1 | | ✓ | | | | | xAI Grok-3 mini (Thinking) | 0.125 | | ✓ | | | | <sub>✓ Available via flat credit pricing</sub> <br /> <sub>🗝 Available via [BYOK](/windsurf/models#bring-your-own-key-byok)</sub> <br /> <sub>🪙 Available via [API Pricing](/windsurf/models#api-pricing)</sub> <br /> <sub><sup>1</sup> Promo pricing only available for a limited time</sub> # SWE-1 SWE-1 is our family of in-house frontier models built specifically for software engineering tasks. Based on our internal evals, it has performance nearing that of frontier models from the foundation labs. * `SWE-1`: High-reasoning, tool-capable, and Cascade-optimized. Claude 3.5-level performance at a fraction of the cost. * <Tooltip tip=\"Built with Qwen\">[`SWE-1-lite`](https://huggingface.co/Qwen/Qwen2.5-72B-Instruct/blob/main/LICENSE)</Tooltip>: Replaces Cascade Base — faster, better, and free for all. * `SWE-1-mini`: Powers passive suggestions in Windsurf Tab, optimized for real-time latency. # Bring your own key (BYOK) <Warning>This is only available to free and paid individual users.</Warning> For certain models, we allow users to bring their own API keys. In the model dropdown menu, individual users will see models labled with `BYOK`. Note that this is different from [API Pricing](/windsurf/models#api-pricing). To input your API key, navigate to [this page](https://windsurf.com/subscription/provider-api-keys) in the subscription settings and add your key. If you have not configured your API key, it will return an error if you try to use the BYOK model. Currently, we only support BYOK for these models: * `Claude 4 Sonnet` * `Claude 4 Sonnet (Thinking)` * `Claude 4 Opus` * `Claude 4 Opus (Thinking)` # API Pricing Unlike flat rate pricing, where a fixed number of credits are used for each user prompt, API pricing charges a fixed number of credits per token processed (i.e. proportional to compute). The number of credits per token processed is variable based on the model selected. Both API pricing and flat rate pricing consume the same pool of credits. Models with API pricing are clearly marked in the model selector. We charge the model’s API price plus a 20% margin. Each credit corresponds to \\$0.04. <Note>We utilize the same tokenizers as the model providers (Anthropic’s for Claude models, OpenAI’s for GPT models, etc) to ensure accurate and consistent token counting and pricing. View [OpenAI's tokenizer demo](https://platform.openai.com/tokenizer)</Note> API pricing charges for all tokens processed from your prompts, automatically retrieved context, tool calls, past conversation history, etc. Since token processing costs from model providers differ between input and output tokens, cached or non-cached, the number of credits consumed for the same overall number of tokens can differ given different distributions of these token types. Reasoning tokens from \"thinking\" models are charged as output tokens. Windsurf balances the context length with costs for prompt cache reads by summarizing the conversation when it gets too long; the resulting summary would be charged as non-cache input tokens. Fractional credit usage is rounded up to the nearest hundredth of a credit. Note that API pricing is separate from [BYOK](/windsurf/models#bring-your-own-key-byok) (bring-your-own-key). With BYOK all usage goes through your own API key, so Windsurf does not charge any credits. Here is the pricing for models that are available via API pricing in various plans: | Model | Plans with API Pricing | Input Tokens (Credits / Million Tokens)<sup>1</sup> | Cache Read Tokens (Credits / Million Tokens)<sup>2</sup> | Output Tokens (Credits / Million Tokens) | | :------------------------- | :------------------------------------------------------------------------------------- | :-------------------------------------------------: | :------------------------------------------------------: | :--------------------------------------: | | Claude Sonnet 4 | - Pro <br /> - Teams <br /> - Enterprise (contracted) <br /> - Enterprise (self-serve) | 90 | 9 | 450 | | Claude Sonnet 4 (Thinking) | - Pro <br /> - Teams <br /> - Enterprise (contracted) <br /> - Enterprise (self-serve) | 90 | 9 | 450 | <sub><sup>1</sup> For Anthropic models, prompt cache writes cost an extra 25% compared to uncached input. Most input tokens into Windsurf are written into the prompt cache for subsequent steps. Output tokens are written into the prompt cache for no extra cost. See Anthropic's API pricing for details.</sub> <br /> <sub><sup>2</sup> The prompt cache has a limited TTL (time-to-live) determined by the model provider (eg. approximately 5 minutes on Anthropic). Even within the TTL, the prompt cache is not guaranteed to hit. Prompt cache misses are charged as input tokens.</sub> ### Example Conversation To show how API pricing works in practice, let us walk through an example conversation with Cascade using Claude Sonnet 4 directly. | Role | Message | Tokens | Note | Cost per message | | :---------- | :------------------------------------------------------------------------------------------- | :------- | :------------------------------------------------------------------------------------- | :---------------- | | User | Refactor @my\\_function | 20k | Input (cache write). Note: Incl. full shared timeline, editor context & system prompt. | 2.25 Credits | | Windsurf | Let me first analyze my\\_function to come up with a plan to refactor it. | 1k | Output tokens. | 0.45 Credits | | `tool_call` | Analyze my\\_function | 23k | Input (cache read) + Input (cache write). | 0.42 Credits | | Windsurf | Here is a plan to refactor my\\_function \\[...] do you want me to continue with implementing? | 2k | Output tokens. | 0.90 Credits | | User | Yes, continue. | 46k | Input (cache read) + Input (cache write). | 0.52 Credits | | `tool_call` | Edit foo.py | 50k | Input (cache read) + Output tokens. | 2.22 Credits | | `tool_call` | Add bar.py | 56k | Input (cache read) + Output tokens. | 3.15 Credits | | Windsurf | I am done refactoring my\\_function. Here is a summary of my changes: \\[...] | 2k | Output tokens. | 0.90 Credits | | **Total** | | **200k** | | **10.81 Credits** | # Previews (Beta) Source: https://docs.windsurf.com/windsurf/previews Previews in Windsurf allow you to view the local deployment of your app either in the IDE or in the browser (optimized for Google Chrome, Arc, and Chromium based browsers) with listeners, allowing you to iterate rapidly by easily sending elements and errors back to Cascade as context. <video autoPlay muted loop playsInline className=\"w-full aspect-video\" src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/previews/browser-preview-demo.mp4\" /> Previews are opened via tool call, so just ask Cascade to preview your app to get started. Alternatively, you can also click the Web icon in the Cascade toolbar to automatically propagate the natural language prompt to enter the proxy. <Frame style={{ border: 'none', background: 'none' }}> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/previews/website-tools-icon.png\" /> </Frame> # Send Elements to Cascade In the Preview, you can select and send elements/components and errors directly to Cascade. Simply click on the \"Send element\" button on the bottom right and then proceed to select the element you want to send. The selected element will be inserted into your current Cascade prompt as an `@ mention`. You can add as many elements as you want in the prompt. # In-IDE Preview Windsurf can open a up a Preview as a new tab in your editor. This is a simple web view that enables you to view web app alongside your Cascade panel. Because these Previews are hosted locally, you can open them in your system browser as well, complete with all the listeners and ability to select and send elements and console errors to Cascade. <Warning>The listeners and the abilities to send elements and errors are optimized for Google Chrome, Arc, and Chromium based browsers.</Warning> # How to Disable When you click on the Web icon, it will give you the option to click on \"Disable previews\". You can also do this from Windsurf - Settings. This will prevent Cascade from making this tool call. # Recommended Plugins Source: https://docs.windsurf.com/windsurf/recommended-plugins Windsurf, being a fork of VS Code, is easy to adopt for developers from VS, Eclipse, or VS Code. It uses the Open VSX Registry for extensions, accessible via the Extensions panel or website. To help you get the most out of Windsurf for different programming languages, we’ve compiled a list of popular, community-recommended extensions from the Open VSX marketplace that other users have found helpful for replicating familiar IDE experiences. Be sure to check out the full Open VSX marketplace for other useful extensions that may suit your specific workflow needs! # General * [GitLens](https://open-vsx.org/extension/eamodio/gitlens) - Visualize code authorship at a glance via annotations and CodeLens * [GitHub Pull Requests](https://open-vsx.org/extension/GitHub/vscode-pull-request-github) - Review and manage your GitHub pull requests and issues directly * [GitLab Workflow](https://open-vsx.org/extension/gitlab/gitlab-workflow) - GitLab integration extension * [Mermaid Markdown Preview](https://open-vsx.org/extension/bierner/markdown-mermaid) - Adds diagram and flowchart support * [Visual Studio Keybindings](https://open-vsx.org/extension/ms-vscode/vs-keybindings) - Use Visual Studio keyboard shortcuts in Windsurf * [Eclipse Keymap](https://open-vsx.org/extension/alphabotsec/vscode-eclipse-keybindings) - Use Eclipse keyboard shortcuts in Windsurf # Python * [ms-python.python](https://open-vsx.org/extension/ms-python/python) - Core Python support: IntelliSense, linting, debugging, and virtual environment management * [Windsurf Pyright](https://open-vsx.org/extension/Codeium/windsurfPyright) - Fast, Pylance-like language server with strong type-checking and completions * [Ruff](https://open-vsx.org/extension/charliermarsh/ruff) - Linter and code formatter * [Python Debugger](https://open-vsx.org/extension/ms-python/debugpy) - Debugging support for Python applications # Java * [Extension Pack for Java](https://open-vsx.org/extension/vscjava/vscode-java-pack) - Bundle of essential Java tools: editing, refactoring, debugging, and project support (includes all below) * [redhat.java](https://open-vsx.org/extension/redhat/java) - Core Java language server for IntelliSense, navigation, and refactoring * [Java debug](https://open-vsx.org/extension/vscjava/vscode-java-debug) - Adds full Java debugging with breakpoints, variable inspection, etc. * [Java Test Runner](https://open-vsx.org/extension/vscjava/vscode-java-test) - Run/debug JUnit/TestNG tests inside the editor with a testing UI * [Maven](https://open-vsx.org/extension/vscjava/vscode-maven) - Maven support: manage dependencies, run goals, view project structure * [Gradle](https://open-vsx.org/extension/vscjava/vscode-gradle) - Gradle support: task explorer, project insights, and CLI integration * [Java Project Manager](https://open-vsx.org/extension/vscjava/vscode-java-dependency) - Visualize and manage Java project dependencies # Visual Basic * [Visual Basic Support](https://open-vsx.org/extension/vscode/vb) - Syntax highlighting, code snippets, bracket matching, code folding * [VB Script Support](https://open-vsx.org/extension/Serpen/vbsvscode) - VBScript editing support: syntax highlighting, code outline view * [C# support](https://open-vsx.org/extension/muhammad-sammy/csharp) - OmniSharp-based language server with IntelliSense and debugging * [Solution Explorer](https://open-vsx.org/extension/fernandoescolar/vscode-solution-explorer) - Manage .sln and .csproj files visually # C# / .NET * [DotRush](https://open-vsx.org/extension/nromanov/dotrush) - A lightweight, high-performance alternative to OmniSharp with Roslyn-based IntelliSense, built-in debuggers for .NET Core and Unity, test explorer, and code decompilation. DotRush is a powerful standalone C# extension that provides all essential features and can replace OmniSharp and several other extensions below. * [C# support](https://open-vsx.org/extension/muhammad-sammy/csharp) - OmniSharp-based language server with IntelliSense and debugging * [.Net Install Tool](https://open-vsx.org/extension/ms-dotnettools/vscode-dotnet-runtime) - Installs and manages different versions of the .NET SDK and Runtime * [Solution Explorer](https://open-vsx.org/extension/fernandoescolar/vscode-solution-explorer) - Manage .sln and .csproj files visually * [C# Extensions](https://open-vsx.org/extension/chrisatwindsurf/csharpextension) - Enhances the VS Code experience by providing features like adding C# classes, interfaces, and enums, as well as generating constructors from properties * [Unity-tools](https://open-vsx.org/extension/Tobiah/unity-tools) - Unity-specific workflow helpers (snippets, docs, folder structure) for game development # C++ * [Clangd](https://open-vsx.org/extension/llvm-vs-code-extensions/vscode-clangd) - Advanced code completion, syntax checking, and semantic highlighting. AST-based code navigation and symbol indexing * [Cmake tools](https://open-vsx.org/extension/ms-vscode/cmake-tools) - Manage CMake projects, build configurations, and debugging within VS Code. Automatically generates accurate compilation databases (compile\\_commands.json) for clangd * [Cmake](https://open-vsx.org/extension/twxs/cmake) - Offers syntax highlighting and basic editing features for CMakeLists.txt files * [C++ runner](https://open-vsx.org/extension/franneck94/c-cpp-runner) - Quickly compile and execute single-file or small projects within VS Code # Terminal Source: https://docs.windsurf.com/windsurf/terminal # Command in the terminal Use our [Command](/command/overview) modality in the terminal (`Cmd/Ctrl+I`) to generate the proper CLI syntax from prompts in natural language. <Frame style={{ border: 'none', background: 'none' }}> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf-terminal-command.png\" /> </Frame> # Send terminal selection to Cascade Highlight a portion of of the stack trace and press `Cmd/Ctrl+L` to send it to Cascade, where you can reference this selection in your next prompt. <Frame style={{ border: 'none', background: 'none' }}> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf-terminal-selection-mention.png\" /> </Frame> # Auto-executed Cascade commands Cascade has the ability to run terminal commands on its own with user permission. However, certain terminal commands can be accepted or rejected automatically through the Allow and Deny lists. By enabling Auto mode, it will rely on Cascade's judgement on whether the command requires the user's permission to be executed. This feature is only available for messages sent with premium models. ### Turbo Mode In Turbo mode, Cascade will always execute the command, unless it is in the deny list. You can toggle this via the Windsurf - Settings panel in the bottom right hand corner of the editor. <Frame> <img style={{ maxHeight: \"500px\" }} src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/cascade-turbo-mode.png\" /> </Frame> ### Allow list An allow list defines a set of terminal commands that will always auto-execute. For example, if you add `git`, then Cascade will always accept `git add -A`. The setting can be via Command Palette → Open Settings (UI) → Search for `windsurf.cascadeCommandsAllowList`. <Frame> <img style={{ maxHeight: \"500px\" }} src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/allow-list.png\" /> </Frame> ### Deny list A deny list defines a set of terminal commands that will never auto-execute. For example, if you add `rm`, then Cascade will always ask for permission to run `rm index.py`. The setting can be via Command Palette → Open Settings (UI) → Search for `windsurf.cascadeCommandsDenyList`. <Frame> <img style={{ maxHeight: \"500px\" }} src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/deny-list.png\" /> </Frame>"