  - generic [ref=f72e1]: "# Overview Source: https://docs.windsurf.com/autocomplete/overview **Windsurf Autocomplete** is powered by our own models, trained in-house from scratch to optimize for speed and accuracy. <Frame> <img src=\"https://exafunction.github.io/public/autocomplete/autocomplete-speed-fast.gif\" /> </Frame> Our autocomplete makes in-line and multi-line suggestions based on the context of your code. Suggestions appear in grey text as you type. You can press `esc` to cancel a suggestion. Suggestions will also disappear if you continue typing or navigating without accepting them. ## Keyboard Shortcuts ### General Shortcuts Here are the general shortcuts that apply for macOS. Replace `⌘` with `Ctrl` and `⌥` with `Alt` to get the corresponding shortcuts on Windows/Linux. * **Accept suggestion**: `⇥` * **Cancel suggestion**: `esc` * **Accept suggestion word-by-word**: `⌘+→` (VS Code), `⌥+⇧+\\` (JetBrains) * **Next/previous suggestion**: `⌥+]`/`⌥+[` * **Trigger suggestion**: `⌥+\\` ### JetBrains Shortcuts - 2.2.2 (stable) and 2.3.5 (pre-release) and later <Tabs> <Tab title=\"macOS\"> * **Accept suggestion**: `⇥` * **Accept next word**: `⌥→` * **Accept current line**: `⌘→` * **Trigger suggestion**: `⌥\\` </Tab> <Tab title=\"Windows/Linux\"> * **Accept suggestion**: `Tab` * **Accept next word**: `Ctrl+Right Arrow` * **Accept current line**: `End` * **Trigger suggestion**: `Alt+\\` </Tab> </Tabs> <Note> You can customize these keyboard shortcuts by * Hover over any completion text and select \"Custom\" from the dropdown. * Navigate to Settings > Keymap > Main Menu > Code > Code Completion. </Note> ## Autocomplete Speeds You can set the speed of the Autocomplete in your settings. <Note>Fast Autocomplete is currently only available to our Pro, Teams, and Enterprise Users.</Note> <Frame> <img src=\"https://exafunction.github.io/public/autocomplete/autocomplete-speeds-select.png\" /> </Frame> # Tips Source: https://docs.windsurf.com/autocomplete/tips ## Inline Comments You can instruct autocomplete with the use of comments in your code. Windsurf will read these comments and suggest the code to bring the comment to life. <Frame> <img src=\"https://exafunction.github.io/public/autocomplete/minimize_boilerplate.gif\" /> </Frame> This method can get you good mileage, but if you're finding value in writing natural-language instructions and having the AI execute them, consider using [Windsurf Command](/command/overview). ## Fill In The Middle (FIM) Windsurf's Autocomplete can Fill In The Middle (FIM). <video autoPlay muted loop playsInline className=\"w-full aspect-video\" src=\"https://exafunction.github.io/public/videos/inline_fim/inline_fim_codeium.mp4\" /> Read more about in-line FIM on our blog [here](https://windsurf.com/blog/inline-fim-code-suggestions). ## Snooze Click the Windsurf widget in the status bar towards the bottom right of your editor to see the option to switch Autocomplete off, either temporarily or until you reenable it. # Prompt Engineering Source: https://docs.windsurf.com/best-practices/prompt-engineering If you're reading this, you're probably someone that already understands some of the use cases and limitations of LLMs. The better prompt and context that provide to the model, the better the outcome will be. Similarly with Windsurf, there are best practices for crafting more effective prompts to get the most out of the tool, and get the best quality code possible to help you accelerate your workflows. <Tip>For more complex tasks that may require you to [@-Mention](/chat/overview/#mentions) specific code blocks, use [Chat](/chat/overview) instead of [Command](/command/overview). </Tip> ## Components of a high quality prompt * ***Clear objective or outcome*** * What are you asking the model to produce? * Are you asking the model for a plan? For new code? Is it a refactor? * ***All relevant context to perform the task(s)*** * Have you properly used @-Mentions to ensure that the proper context is included? * Is there any context that is customer specific that may be unclear to Windsurf? * ***Necessary constraints*** * Are there any specific frameworks, libraries, or languages that must be utilized? * Are there any space or time complexity constraints? * Are there any security considerations? ## Examples ***Example #1:*** * **Bad**: Write unit tests for all test cases for an Order Book object. * **Good**: Using `@class:unit-testing-module` write unit tests for `@func:src-order-book-add` testing for exceptions thrown when above or below stop loss ***Example #2***: * **Bad**: Refactor rawDataTransform. * **Good**: Refactor `@func:rawDataTransform` by turning the while loop into a for loop and using the same data structure output as `@func:otherDataTransformer` ***Example #3***: * **Bad**: Create a new Button for the Contact Form. * **Good**: Create a new Button component for the `@class:ContactForm` using the style guide in `@repo:frontend-components` that says “Continue” # Common Use Cases Source: https://docs.windsurf.com/best-practices/use-cases Windsurf serves a variety of use cases at a high level. However, we see certain use cases to be more common than others, especially among our enterprise customers within their production codebases. ## Code generation <AccordionGroup> <Accordion title=\"Boilerplate code\"> **Guidance:** Windsurf should work well for this use case. Windsurf features including single-line suggestions, multi-line suggestions, and fill-in-the-middle (FIM) completions. **Best Practices:** Ensuring usage of Next Completion (`⌥ + ]`), Context Pinning, @ Mentions, and Custom Context will provide best results. </Accordion> <Accordion title=\"Front-end development tasks\"> **Guidance:** Windsurf should work well for this use case. Windsurf features including single-line suggestions, multi-line suggestions, and fill-in-the-middle (FIM) completions. **Best Practices:** Ensuring usage of Next Completion (`⌥ + ]`), Context Pinning, @ Mentions, and Custom Context will provide best results. </Accordion> <Accordion title=\"Back-end development tasks\"> **Guidance:** Windsurf should work well for this use case. Windsurf features including single-line suggestions, multi-line suggestions, and fill-in-the-middle (FIM) completions. **Best Practices:** Ensuring usage of Next Completion (`⌥ + ]`), Context Pinning, @ Mentions, and Custom Context will provide best results. </Accordion> </AccordionGroup> ## Unit Test generation <AccordionGroup> <Accordion title=\"Generate unit tests and automatically remove redundant test cases\"> **Guidance:** Basic usage of Windsurf for generating unit tests should reliably generate 60-70% of unit tests. Edge case coverage will only be as good as the user prompting the model is. **Best Practices:** Use @ Mentions. Prompt Engineering best practices. Examples include: Write unit test for `@function-name` that tests all edge cases for X and for Y (e.g. email domain). Use `@testing-utility-class` to write a unit test for `@function-name`. </Accordion> <Accordion title=\"Generate sample data for test execution\"> **Guidance:** Good for low-hanging fruit use cases. For very specific API specs or in-house libraries, Windsurf will not know the intricacies well enough to ensure the quality of generated sample data. **Best Practices:** Be very specific about the interface you expect. Think about the complexity of the task (and if a single-shot LLM call will be sufficient to address). </Accordion> </AccordionGroup> ## Internal Code Commentary <AccordionGroup> <Accordion title=\"Generate in-line comments and code descriptions\"> **Guidance:** Windsurf should work well for this use case. Use Windsurf Command or Windsurf Chat to generate in-line comments and code descriptions. **Best Practices:** Use @ Mentions and use Code Lenses as much as possible to ensure the scope of the LLM call is correct. </Accordion> <Accordion title=\"Suggest improvements and clarifications\"> **Guidance:** Generally the Refactor button / Windsurf Command would be the best ways to prompt for improvements. Windsurf Chat is the best place to ask for explanations or clarifications. This is a little vague but Windsurf should be good at doing both. Windsurf Chat is the best place to ask for explanations or clarifications. This is a little vague but Windsurf should be good at doing both. **Best Practices**: Use the dropdown prompts (aka Windsurf's Refactor button) - we have custom prompts that are better engineered to deliver the answer you'd more likely expect. </Accordion> <Accordion title=\"Automate function headers (C/C++/C#)\"> **Guidance**: The best way to do this would be to create the header file, open chat, @ mention the function in the cpp file, and ask it to write the header function. Then do this iteratively for each in the cpp file. This is the best way to ensure no hallucinations along the way. **Best Practices**: Generally avoid trying to write a whole header file with one LLM call. Breaking down the granularity of the work makes the quality of the generated code significantly higher. </Accordion> </AccordionGroup> ## API Documentation and Integration <AccordionGroup> <Accordion title=\"Create documentation as APIs created and inform proper context\"> **Guidance**: This is similar to test coverage where parts of the API spec that are common across many libraries Windsurf would be able to accurately decorate. However, things that are built special for your in-house use case Windsurf might struggle to do at the quality that you expect. **Best Practices**: Similar to test coverage, as much as possible, walk Windsurf's model through the best way to think about what the API is doing and it will be able to decorate better. </Accordion> <Accordion title=\"Search repo for APIs with natural language and generate code for integrations\"> **Guidance**: Windsurf's context length for a single LLM call is 16,000 tokens. Thus, depending on the scope of your search, Windsurf's repo-wide search capability may not be sufficient. Repo-wide, multi-step, multi-edit tasks will be supported in upcoming future Windsurf products. This is fundamentally a multi-step problem that single-shot LLM calls (i.e. current functionality of all AI code assistants) are not well equipped to address. Additionally, accuracy of result must be much higher than other use cases as integrations are especially fragile. **Best Practices**: Windsurf is not well-equipped to solve this problem today. If you'd like to test the extent of Windsurf's existing functionality, build out a step-by-step plan and prompt Windsurf individually with each step and high level of details to guide the AI. </Accordion> </AccordionGroup> ## Code Refactoring <AccordionGroup> <Accordion title=\"Code simplification and modularization\"> **Guidance**: Ensure proper scoping using Windsurf Code Lenses or @ Mentions to make sure all of the necessary context is passed to the LLM. Context lengths for a single LLM call are finite. Thus, depending on the scope of your refactor, this finite context length may be an issue (and for that matter, any single-shot LLM paradigm). Repo-wide, multi-step, multi-edit tasks are now supported in Windsurf's [Cascade](/windsurf/cascade). **Best Practices**: Try to break down the prompt as much as possible. The simpler and shorter the command for refactoring the better. </Accordion> <Accordion title=\"Restructuring code to improve readability / maintainability\"> **Guidance**: Ensure proper scoping using Windsurf Code Lenses or @ Mentions to make sure all of the necessary context is passed to the LLM. Windsurf's context length for a single LLM call is 16,000 tokens. Thus, depending on the scope of your refactor, Windsurf's context length may be an issue (and for that matter, any single-shot LLM paradigm). Repo-wide, multi-step, multi-edit tasks will be supported in upcoming future Windsurf products. **Best Practices**: Try to break down the prompt as much as possible. The simpler and shorter the command for refactoring the better. </Accordion> </AccordionGroup> # Models Source: https://docs.windsurf.com/chat/models While we provide and train our own dedicated models for Chat, we also give you the flexibility choose your favorites. It's worth noting that the Windsurf models are tightly integrated with our reasoning stack, leading to better quality suggestions than external models for coding-specific tasks. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/chat_model_selection.png\" /> </Frame> Model selection can be found directly under the chat. ## Base Model ⚡ **Access:** All users Available for unlimited use to all users is a fast, high-quality Windsurf Chat model based on Meta's [Llama 3.1 70B](https://ai.meta.com/blog/meta-llama-3-1/). This model is optimized for speed, and is the **fastest** model available in Windsurf Chat. This is all while still being extremely accurate. ## Windsurf Premier 🚀 **Access:** Any paying users (Pro, Teams, Enterprise, etc.) Available in our paid tier is unlimited usage of our premier Windsurf Chat model based on Meta's [Llama 3.1 405B](https://ai.meta.com/blog/meta-llama-3-1/). This is the **highest-performing model** available for use in Windsurf, due to its size and integration with Windsurf's reasoning engine and native workflows. ## Other Models (GPT-4o, Claude 3.5 Sonnet) **Access:** Any paying users (Pro, Teams, Enterprise, etc.) Windsurf provides access to OpenAI's and Anthropic's flagship models. # Overview Source: https://docs.windsurf.com/chat/overview Converse with a codebase-aware AI <Note> Chat and its related features are only supported in: VS Code, JetBrains IDEs, Eclipse, X-Code, and Visual Studio. </Note> **Windsurf Chat** enables you to talk to your codebase from within your editor. Chat is powered by our [context awareness](/context-awareness/overview.mdx) engine. It combines built-in context retrieval with optional user guidance to provide accurate and grounded answers. <Tabs> <Tab title=\"VS Code\"> In VS Code, Windsurf Chat can be found by default on the left sidebar. If you wish to move it elsewhere, you can click and drag the Windsurf icon and relocate it as desired. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/chat_vscode_where_to_find.png\" /> </Frame> You can use `⌘+⇧+A` on Mac or `Ctrl+⇧+A` on Windows/Linux to open the chat panel and toggle focus between it and the editor. You can also pop the chat window out of the IDE entirely by clicking the page icon at the top of the chat panel. </Tab> <Tab title=\"JetBrains\"> In JetBrains IDEs, Windsurf Chat can be found by default on the right sidebar. If you wish to move it elsewhere, you can click and drag the Windsurf icon and relocate it as desired. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/chat_jetbrains_where_to_find.png\" /> </Frame> You can use `⌘+⇧+L` on Mac or `Ctrl+⇧+L` on Windows/Linux to open the chat panel while you are typing in the editor. You can also open the chat in a popped-out browser window by clicking `Tools > Windsurf > Open Windsurf Chat in Browser` in the top menu bar. </Tab> </Tabs> ## @-Mentions <Tip>An @-mention is a deterministic way of bringing in context, and is guaranteed to be part of the context used to respond to a chat.</Tip> In any given chat message you send, you can explicitly refer to context items from within the chat input by prefixing a word with `@`. Context items available to be @-mentioned: * Functions & classes * Only functions and classes in the local indexed * Also only available for languages we have built AST parsers for (Python, TypeScript, JavaScript, Go, Java, C, C++, PHP, Ruby, C#, Perl, Kotlin, Dart, Bash, COBOL, and more) * Directories and files in your codebase * Remote repositories * The contents of your in-IDE terminal (VS Code only). <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/at_mentions.png\" /> </Frame> You can also try `@diff`, which lets you chat about your repository's current `git diff` state. The `@diff` feature is currently in beta. <Tip>If you want to pull a section of code into the chat and you don't have @-Mentions available, you can: 1. highlight the code -> 2. right click -> 3. select 'Windsurf: Explain Selected Code Block'</Tip> ## Persistent Context You can instruct the chat model to use certain context throughout a conversation and across different conversations by clicking on the `Advanced` tab in the chat panel. <Frame caption=\"Chat shows you the context it is considering.\"> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/chat_context.png\" /> </Frame> In this tab, you can see: * **Custom Chat Instructions**: a short prompt guideline like \"Respond in Kotlin and assume I have little familiarity with it\" to orient the model towards a certain type of response. * **Pinned Contexts**: items from your codebase like files, directories, and code snippets that you would like explicitly for the model to take into account. See also [Context Pinning](/context-awareness/overview#context-pinning). * **Active Document**: a marker for your currently active file, which receives special focus. * **Local Indexes**: a list of local repositories that the Windsurf context engine has indexed. ## Slash Commands You can prefix a message with `/explain` to ask the model to explain something of your choice. Currently, `/explain` is the only supported slash command. [Let us know](https://codeium.canny.io/feature-requests/) if there are other common workflows you want wrapped in a slash command. ## Copy and Insert Sometimes, Chat responses will contain code blocks. You can copy a code block to your clipboard or insert it directly into the editor at your cursor position by clicking the appropriate button atop the code block. <Note> If you would like the AI to enact a change directly in your editor based on an instruction, consider using [Windsurf Command](/command/overview). </Note> ## Inline Citations Chat is aware of code context items, and its responses often contain linked references to snippets of code in your files. <Frame> <video autoPlay muted loop playsInline src=\"https://exafunction.github.io/public/videos/chat/inline-citations.mp4\" /> </Frame> ## Regenerate with Context By default, Windsurf makes a judgment call whether any given question is general or if it requires codebase context. You can force the model to use codebase context by submitting your question with `⌘⏎`. For a question that has already received a response, you rerun with context by clicking the sparkle icon. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/chat_regenerate_with_context.png\" /> </Frame> ## Stats for Nerds Lots of things happen under the hood for every chat message. You can click the stats icon to see these statistics for yourself. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/chat_stats_for_nerds.png\" /> </Frame> ## Chat History To revisit past conversations, click the history icon at the top of the chat panel. You can click the `+` to create a new conversation, and you can click the `⋮` button to export your conversation. This applies only for the Windsurf Plugins. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/chat_history.png\" /> </Frame> ## Settings Click on the gear icon to reach the `Settings` tab. Here, you can view settings that are applicable to your account. For example, you can update your theme preferences (light or dark), change autocomplete speed, view current plan, and change font size. The settings panel also gives you an option to download diagnostics, which are debug logs that can be helpful for the Windsurf team to debug an issue, should you encounter one. <Frame caption=\"On Windsurf Chat, click on the gear icon on the top right corner\"> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/chat_settings.png\" /> </Frame> ## Telemetry <Note>You may encounter issues with Chat if Telemetry is not enabled.</Note> <Tabs> <Tab title=\"VS Code\"> To enable telemetry, open your VS Code settings and navigate to User > Application > Telemetry. In the following dropdown, select \"all\". <img width=\"350\" src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/vscode_telemetry_settings.png\" /> </Tab> <Tab title=\"JetBrains\"> To enable telemetry in JetBrains IDEs, open your Settings and navigate to Appearance & Hehavior > System Settings > Data Sharing. <img width=\"350\" src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/jetbrains_telemetry_settings.png\" /> </Tab> </Tabs> # Overview Source: https://docs.windsurf.com/command/plugins-overview AI-powered in-line edits **Windsurf Command** generates new or edits existing code via natural language inputs, directly in the editor window. <Tabs> <Tab title=\"VS Code\"> To invoke Command, press `⌘+I` on Mac or `Ctrl+I` on Windows/Linux. From there, you can enter a prompt in natural language and hit the Submit button (or `⌘+⏎`/`Ctrl+⏎`) to forward the instruction to the AI. Windsurf will then provide a multiline suggestion that you can accept or reject. If you highlight a section of code before invoking Command, then the AI will edit the selection spanned by the highlighted lines. Otherwise, it will generate code at your cursor's location. <Frame> <video autoPlay muted loop playsInline src=\"https://exafunction.github.io/public/videos/codeium_command_vscode.mp4\" /> </Frame> You can accept, reject, or follow-up a generation by clicking the corresponding code lens above the generated diff, or by using the appropriate shortcuts (`⌥+A`/`Alt+A`, `⌥+R`/`Alt+R`, and `⌥+F`/`Alt+F`, respectively). </Tab> <Tab title=\"JetBrains\"> To invoke Command, press `⌘+I` on Mac or `Ctrl+I` on Windows/Linux. <Note> Some users have reported keyboard conflicts with this shortcut, so `⌘+⇧+I` and `⌘+\\`on Mac (`Ctrl+⇧+I` and `Ctrl+\\` on Windows/Linux) will also work. </Note> The Command invocation will open an interactive popup at the appropriate location in the code. You can enter a prompt in natural language and Windsurf will provide a multiline suggestion that you can accept or reject. If you highlight a section of code before invoking Command, then the AI will edit the selection spanned by the highlighted lines. Otherwise, it will generate code at your cursor's location. <Frame> <video autoPlay muted loop playsInline src=\"https://exafunction.github.io/public/videos/codeium_command_jetbrains.mp4\" /> </Frame> The Command popup will persist in the editor if you scroll around or focus your cursor elsewhere in the editor. It will act on your most recently highlighted selection of code or your most recent cursor position. While it is active, the Command popup gives you the following options: * **Cancel** (`Esc`): this will close the popup and undo any code changes that may have occured while the popup was open. * **Accept generation** (`⌘+⏎`): this option appears after submitting an instruction and receiving a generation. It will write the suggestion into the code editor and close the popup. * **Undo generation** (`⌘+⌫`): this option appears after submitting an instruction and receiving a generation. It will restore the code to its pre-Command state without closing the popup, while reinserting your most recent instruction into the input box. * **Follow-up**: this option appears after submitting an instruction and receiving a generation. You can enter a second (and third, fourth, etc.) instruction and submit it, which will undo the currently shown generation and rerun Command using your comma-concatenated instruction history. </Tab> </Tabs> # Best Practices Windsurf Command is great for file-scoped, in-line changes that you can describe as an instruction in natural language. Here are some pointers to keep in mind: * The model that powers Command is larger than the one powering autocomplete. It is slower but more capable, and it is trained to be especially good at instruction-following. * If you highlight a block of code before invoking Command, it will edit the selection. Otherwise, it will do a pure generation. * Using Command effectively can be an art. Simple prompts like \"Fix this\" or \"Refactor\" will likely work thanks to Windsurf's context awareness. A specific prompt like \"Write a function that takes two inputs of type `Diffable` and implements the Myers diff algorithm\" that contains a clear objective and references to relevant context may help the model even more. # Refactors, Docstrings, and More Source: https://docs.windsurf.com/command/related-features Features powered by Command Command enables streamlined experiences for a few common operations. ## Function Refactors and Docstring Generation Above functions and classes, Windsurf renders *code lenses*, which are small, clickable text labels that invoke Windsurf's AI capabilities on the labeled item. <Tip>You can disable code lenses by clicking the `✕` to the right of the code lens text.</Tip> The `Refactor` and `Docstring` code lenses in particular will invoke Command. * If you click `Refactor`, Windsurf will prompt you with a dropdown of selectable, pre-populated instructions that you can choose from. You can also write your own. This is equivalent to highlighting the function and invoking Command. * If you click `Docstring`, Windsurf will generate a docstring for you above the function header. (In Python, the docstring will be correctly generated *underneath* the function header.) <Frame caption=\"Encouraging readable and maintainable code, one docstring at a time.\"> <video autoPlay muted loop playsInline src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/jetbrains_docstrings.mp4\" /> </Frame> ## Smart Paste This feature allows you to copy code and paste it into a file in your IDE written in a different programming language. Use `⌘+⌥+V` (Mac) or `Ctrl+Alt+V` (Windows/Linux) to invoke Smart Paste. Behind the scenes, Windsurf will detect the language of the destination file and use Command to translate the code in your clipboard. Windsurf's context awareness will try to write it to fit in your code, for example by referencing proper variable names. <Frame> <video autoPlay muted loop playsInline src=\"https://exafunction.github.io/public/videos/demos/Smart_Paste_Demo_1080p.mp4\" /> </Frame> Some possible use cases: * **Migrating code**: you're rewriting JavaScript into TypeScript, or Java into Kotlin. * **Pasting from Stack Overflow**: you found a utility function online written in Go, but you're using Rust. * **Learning a new language**: you're curious about Haskell and want to see what your would look like if written in it. # Command Source: https://docs.windsurf.com/command/windsurf-overview Cmd/Ctrl + I for in-line code generations and edits **Command** generates new or edits existing code via natural language inputs, directly in the editor window. <Tip>Command does NOT consume any premium model credits.</Tip> To invoke Command, press `⌘+I` on Mac or `Ctrl+I` on Windows/Linux. You can enter a prompt in natural language and hit the Submit button (or `⌘+⏎`/`Ctrl+⏎`) to forward the instruction to the AI. If you highlight a section of code before invoking Command, then the AI will edit the selection spanned by the highlighted lines. Otherwise, it will generate code at your cursor's location. <Frame style={{ border: 'none', background: 'none' }}> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf-command.png\" /> </Frame> You can accept, reject, or follow-up a generation by clicking the corresponding code lens above the generated diff,or by using the appropriate shortcuts (`Cmd/Ctrl+Enter`/`Cmd/Ctrl+Delete`) # Models Command comes with its own set of models that are optimized for current-file edits. <Frame> <video autoPlay muted loop playsInline src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf-command-models.mp4\" /> </Frame> <Tip> Windsurf Fast is the fastest, most accurate model available.</Tip> # Terminal Command You can use Command in the terminal (`Cmd/Ctrl+I`) to generate the proper CLI syntax using prompts in natural language. <Frame style={{ border: 'none', background: 'none' }}> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf-terminal-command.png\" /> </Frame> # Best Practices Command is great for file-scoped, in-line changes that you can describe as an instruction in natural language. Here are some pointers to keep in mind: * The model that powers Command is larger than the one powering autocomplete. It is slower but more capable, and it is trained to be especially good at instruction-following. * If you highlight a block of code before invoking Command, it will edit the selection. Otherwise, it will do a pure generation. * Using Command effectively can be an art. Simple prompts like \"Fix this\" or \"Refactor\" will likely work thanks to Windsurf's context awareness. A specific prompt like \"Write a function that takes two inputs of type `Diffable` and implements the Myers diff algorithm\" that contains a clear objective and references to relevant context may help the model even more. # Code Lenses Source: https://docs.windsurf.com/command/windsurf-related-features Shortcuts for common operations ## Explain, Refactor, and Add Docstring At the top of the text editor, Windsurf gives exposes *code lenses* on functions and classes. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/windsurf-code-lenses.png\" /> </Frame> The `Explain` code lens will invoke Cascade, which will simply explain what the function or class does and how it works. The `Refactor` and `Docstring` code lenses in particular will invoke Command. * If you click `Refactor`, Windsurf will prompt you with a dropdown of selectable, pre-populated instructions that you can choose from. You can also write your own. This is equivalent to highlighting the function and invoking Command. * If you click `Docstring`, Windsurf will generate a docstring for you above the function header. (In Python, the docstring will be correctly generated *underneath* the function header.) <Frame> <video autoPlay muted loop playsInline src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/windsurf-refactor-code-lens.mp4\" /> </Frame> ## Smart Paste This feature allows you to copy code and paste it into a file in your IDE written in a different programming language. Use `⌘+⌥+V` (Mac) or `Ctrl+Alt+V` (Windows/Linux) to invoke Smart Paste. Behind the scenes, Windsurf will detect the language of the destination file and use Command to translate the code in your clipboard. Windsurf's context awareness will try to write it to fit in your code, for example by referencing proper variable names. <Frame> <video autoPlay muted loop playsInline src=\"https://exafunction.github.io/public/videos/demos/Smart_Paste_Demo_1080p.mp4\" /> </Frame> Some possible use cases: * **Migrating code**: you're rewriting JavaScript into TypeScript, or Java into Kotlin. * **Pasting from Stack Overflow**: you found a utility function online written in Go, but you're using Rust. * **Learning a new language**: you're curious about Haskell and want to see what your would look like if written in it. # Local Indexing Source: https://docs.windsurf.com/context-awareness/local-indexing The **Indexing Engine** is Windsurf's codebase awareness service that powers: * Codebase-Aware [Chat](/chat/overview) * Codebase-Aware [Autocomplete](/autocomplete/overview) Compared to regular context-aware Autocomplete and Chat, the Indexing Engine is able to retrieve context from across the entire codebase, not just files that you have recently interacted with. This significantly improves the quality of autocomplete and chat responses. <Note>Local Indexing is on by default for all Plugin users, and always on for Windsurf Users.</Note> ## How It Works The Indexing Engine works in part by generating embeddings for your codebase that capture the underlying meaning. These embeddings can queried using both Natural Language and related code snippets. Windsurf Indexing does send snippets of code to a remote server to generate embeddings. However, no code or embeddings are stored remotely -- all your data is stored on your own device. ## How to Toggle Indexing Engine <Tabs> <Tab title=\"VS Code\"> To toggle Indexing Engine in VS Code, go to your \"Settings (UI)\" page, and search for \"Windsurf Search\". You should see an option to enable search, and set the Max Workspace Size. Then restart your IDE and the change should be reflected. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/vscode-indexing1.png\" /> </Frame> You can see if your workspace is indexed by checking the \"Context\" pane in the \"Chat\" panel. If there is a green dot next to your workspace, then it is indexed and searchable. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/vscode-indexing2.png\" /> </Frame> </Tab> <Tab title=\"JetBrains\"> In the Preferences menu, navigate to Tools > Windsurf Settings. Click \"Enable/Disable Windsurf Indexing\", and set the appropriate value for \"Indexing Max Workspace Size (File Count)\" then restart your IDE. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/jetbrains-indexing.png\" /> </Frame> </Tab> </Tabs> ## WindsurfIgnore By default, Windsurf Indexing will ignore: * Paths specified in `gitignore` * Files in `node_modules` * Hidden pathnames (starting with \".\") When a file is ignored, it will not be indexed, and also does not count against the Indexing Max Workspace Size file counts. If you want to further configure files that Windsurf Indexing ignores, you can add a `.codeiumignore` file to your repo root, with the same syntax as `.gitignore` <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/codeiumignore.png\" /> </Frame> ## System Requirements When first enabled, Windsurf will consume a fraction of CPU while it indexes the workspace. Depending on your workspace size, this should take 5-10 minutes, and only needs to happen once per workspace. CPU usage will return to normal automatically. Windsurf Indexing also requires RAM (\\~300MB for a 5000-file workspace). The \"Max Workspace Size (File Count)\" setting determines the largest workspace for which Windsurf Indexing will try to index a particular workspace / module. If your workspace does not appear to be indexed, please try adjusting this number higher. For users with \\~10GB of RAM, we recommend setting this no higher than 10,000 files. # Overview Source: https://docs.windsurf.com/context-awareness/overview On codebase context and related features Windsurf's context engine builds a deep understanding of your codebase, past actions, and next intent. Historically, code-generation approaches focused on fine-tuning large language models (LLMs) on a codebase, which is difficult to scale to the needs of every individual user. A more recent and popular approach leverages retrieval-augmented generation (RAG), which focuses on techniques to construct highly relevant, context-rich prompts to elicit accurate answers from an LLM. We've implemented an optimized RAG approach to codebase context, which produces higher quality suggestions and fewer hallucinations. <Note> Windsurf offers full fine-tuning for enterprises, and the best solution combines fine-tuning with RAG. </Note> ## Default Context Out of the box, Windsurf takes multiple relevant sources of context into consideration. * The current file and other open files in your IDE, which are often very relevant to the code you are currently writing. * The entire local codebase is then indexed (including files that are not open), and relevant code snippets are sourced by Windsurf's retrieval engine as you write code, ask questions, or invoke commands. * For Pro users, we offer expanded context lengths increased indexing limits, and higher limits on custom context and pinned context items. * For Teams and Enterprise users, Windsurf can also index remote repositories. This is useful for companies whose development organization works across multiple repositories. ## Knowledge Base (Beta) <Note>Only available for Teams and Enterprise customers. Currently not available to Hybrid customers.</Note> This feature allows teams to pull in Google Docs as shared context or knowledge sources for their entire team. Currently, only Google Docs are supported. Images are not imported, but charts, tables, and formatted text are fully supported. <Card title=\"Knowledge Base\" icon=\"people-group\" href=\"https://windsurf.com/team/team_settings/windsurf_settings/knowledge\"> Configure knowledge base settings for your team. This page will only be visible with admin privileges. </Card> Admins must manually connect with Google Drive via OAuth, after which they can add up to 50 Google Docs as team knowledge sources. Cascade will have access to the docs specified in the Windsurf dashboard. These docs do not obey individual user access controls, meaning if an admin makes a doc available to the team, all users will have access to it regardless of access controls on the Google Drive side. ### Best Practices Context Pinning is great when your task in your current file depends on information from other files. Try to pin only what you need. Pinning too much may slow down or negatively impact model performance. Here are some ideas for effective context pinning: * Module Definitions: pinning class/struct definition files that are inside your repo but in a module separate from your currently active file. * Internal Frameworks/Libraries: pinning directories with code examples for using frameworks/libraries. * Specific Tasks: pinning a file or folder defining a particular interface (e.g., `.proto` files, abstract class files, config templates). * Current Focus Area: pinning the \"lowest common denominator\" directory containing the majority of files needed for your current coding session. * Testing: pinning a particular file with the class you are writing unit tests for. ## Chat-Specific Context Features When conversing with Windsurf Chat, you have various ways of leveraging codebase context, like [@-mentions](/chat/overview/#mentions) or custom guidelines. See the [Chat page](/chat/overview) for more information. <video autoPlay muted loop playsInline className=\"w-full aspect-video\" src=\"https://exafunction.github.io/public/videos/chat/inline-mention.mp4\" /> ## Frequently Asked Questions (FAQs) ### Does Windsurf index my codebase? Yes, Windsurf does index your codebase. It also uses LLMs to perform retrieval-augmented generation (RAG) on your codebase using our own [M-Query](https://youtu.be/DuZXbinJ4Uc?feature=shared\\&t=606) techniques. Indexing performance and features vary based on your workflow and your Windsurf plan. For more information, please visit our [context awareness page](https://windsurf.com/context). # Remote Indexing Source: https://docs.windsurf.com/context-awareness/remote-indexing <Note> This feature is only available in the Windsurf Plugins for Enterprise plans. </Note> While Local Indexing works great, the user may want to index codebases that they do not have stored locally for our models to take in as context. For this use case, organizations on Teams and Enterprise plans can use Windsurf's Indexing Service to globally import all the relevant repositories. The indexing and embedding is then performed by Windsurf's servers (on an isolated tenant), and once the index is created, it is available to be queried by any member of the Team. ## Adding a repository From [https://windsurf.com/indexing](https://windsurf.com/indexing) you can add a repository to index. Currently we support Git repositories from GitHub, GitLab, and BitBucket. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/remote-indexing-adding-repo.png\" /> </Frame> You can choose to index a particular branch and to automatically re-index the repository after some number of days. ## Security Guarantees We clone the repository in order to create the index, but once we finish creating embeddings for the codebase we delete all the code and code snippets **assuming that the Store Snippets setting is unchecked.** We don't persist anything other than the embeddings themselves, from which you cannot derive the original code. Furthermore, all indexing and embedding is performed on a single-tenant instance—nothing about the indexing process is shared between multiple Windsurf Teams customers. # Overview Source: https://docs.windsurf.com/context-awareness/windsurf-overview On codebase context and related features Windsurf's context engine builds a deep understanding of your codebase, past actions, and next intent. Historically, code-generation approaches focused on fine-tuning large language models (LLMs) on a codebase, which is difficult to scale to the needs of every individual user. A more recent and popular approach leverages retrieval-augmented generation (RAG), which focuses on techniques to construct highly relevant, context-rich prompts to elicit accurate answers from an LLM. We've implemented an optimized RAG approach to codebase context, which produces higher quality suggestions and fewer hallucinations. <Note> Windsurf offers full fine-tuning for enterprises, and the best solution combines fine-tuning with RAG. </Note> ## Default Context Out of the box, Windsurf takes multiple relevant sources of context into consideration. * The current file and other open files in your IDE, which are often very relevant to the code you are currently writing. * The entire local codebase is then indexed (including files that are not open), and relevant code snippets are sourced by Windsurf's retrieval engine as you write code, ask questions, or invoke commands. * For Pro users, we offer expanded context lengths increased indexing limits, and higher limits on custom context and pinned context items. * For Teams and Enterprise users, Windsurf can also index remote repositories. This is useful for companies whose development organization works across multiple repositories. ## Knowledge Base (Beta) <Note>Only available for Teams and Enterprise customers. Currently not available to Hybrid customers.</Note> This feature allows teams to pull in Google Docs as shared context or knowledge sources for their entire team. Currently, only Google Docs are supported. Images are not imported, but charts, tables, and formatted text are fully supported. <Card title=\"Knowledge Base\" icon=\"people-group\" href=\"https://windsurf.com/team/team_settings/windsurf_settings/knowledge\"> Configure knowledge base settings for your team. This page will only be visible with admin privileges. </Card> Admins must manually connect with Google Drive via OAuth, after which they can add up to 50 Google Docs as team knowledge sources. Cascade will have access to the docs specified in the Windsurf dashboard. These docs do not obey individual user access controls, meaning if an admin makes a doc available to the team, all users will have access to it regardless of access controls on the Google Drive side. ## Chat-Specific Context Features When conversing with Windsurf Chat, you have various ways of leveraging codebase context, like [@-mentions](/chat/overview/#mentions) or custom guidelines. See the [Chat page](/chat/overview) for more information. <video autoPlay muted loop playsInline className=\"w-full aspect-video\" src=\"https://exafunction.github.io/public/videos/chat/inline-mention.mp4\" /> ## Frequently Asked Questions (FAQs) ### Does Windsurf index my codebase? Yes, Windsurf does index your codebase. It also uses LLMs to perform retrieval-augmented generation (RAG) on your codebase using our own [M-Query](https://youtu.be/DuZXbinJ4Uc?feature=shared\\&t=606) techniques. Indexing performance and features vary based on your workflow and your Windsurf plan. For more information, please visit our [context awareness page](https://windsurf.com/context). # Analytics Source: https://docs.windsurf.com/plugins/accounts/analytics ## Individuals <Card title=\"User Analytics\" horizontal={true} icon=\"user\" href=\"https://windsurf.com/profile\"> User analytics are available for viewing and sharing on your own [profile](https://windsurf.com/profile) page. </Card> See your completion stats, [refer](https://windsurf.com/referral) your friends, look into your language breakdown, and unlock achievement badges by using Windsurf in your daily workflow. ## Teams <Card title=\"Team Analytics\" horizontal={true} icon=\"users\" href=\"https://windsurf.com/team/analytics\"> Windsurf makes managing your team easy from one dashboard. </Card> <Note> You will need team admin privileges in order to view the following team links. </Note> Team leads and managers can also see an aggregate of their team members' usage patterns and analytics, including Percent of Code Written (PCW) by AI, total lines of code written, total tool calls, credit consumption, and more. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/teams/team-analytics-pcw.jpg\" /> </Frame> # Analytics API (Enterprise SaaS) Source: https://docs.windsurf.com/plugins/accounts/analytics-api ## Overview Windsurf supports an API for custom analytics. It allows querying for data from autocomplete, chat, and command, and a variety of filters, groupings, and aggregations. We provide all examples in curl; it can then be translated into HTTP requests in other languages. ## User Data Analytics API specification Data from the Users table on the teams page can be obtained with the following command: ```sh curl -X POST --header \"Content-Type: application/json\" \\ --data '{ \"service_key\": \"<SERVICE_KEY>, \"group_name\": \"<GROUP_NAME>\", \"start_timestamp\": \"<START_TIMESTAMP>\", \"end_timestamp\": \"<END_TIMESTAMP>\" }' \\ https://server.codeium.com/api/v1/UserPageAnalytics ``` **SERVICE\\_KEY**: The service key - an admin user can create one from the service key section of the settings page. The role of the service key must have \"Teams Read-only\" permissions. **GROUP\\_NAME**: The name of a group to filter on. This field is optional. **START\\_TIMESTAMP/END\\_TIMESTAMP**: Timestamps in RFC 3339 format, so e.g. 2023-01-01T00:00:00Z #### **Example output** ```json { \"userTableStats\": [ { \"name\": \"Alice\", \"email\": \"alice@windsurf.com\", \"lastUpdateTime\": \"2024-10-10T22:56:10.771591Z\", \"apiKey\": \"aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa\", \"activeDays\": 178 }, { \"name\": \"Bob\", \"email\": \"bob@windsurf.com\", \"lastUpdateTime\": \"2024-10-10T18:11:23.980237Z\", \"apiKey\": \"bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb\", \"activeDays\": 462 }, { \"name\": \"Charlie\", \"email\": \"charlie@windsurf.com\", \"lastUpdateTime\": \"2024-10-10T16:43:46.117870Z\", \"apiKey\": \"cccccccc-cccc-cccc-cccc-cccccccccccc\", \"activeDays\": 237 } ] } ``` ## Cascade Analytics API Specification The Cascade specific data seen on the [analytics page](https://windsurf.com/team/analytics) can be queried via API. ```sh curl -X POST --header \"Content-Type: application/json\" \\ --data '{ \"service_key\": \"<SERVICE_KEY>\", \"group_name\": \"<GROUP_NAME>\", \"start_timestamp\": \"<START_TIMESTAMP>\", \"end_timestamp\": \"<END_TIMESTAMP>\", \"emails\": [\"<EMAIL>\",\"<EMAIL>,...\"], \"ide_types\": [\"<IDE_TYPE>\",\"<IDE_TYPE>,...\"], \"query_requests\": [ { \"<CASCADE_DATA_SOURCE>\": {} } ] }' \\ https://server.codeium.com/api/v1/CascadeAnalytics ``` **SERVICE\\_KEY**: The service key - an admin user can create a new one from [https://windsurf.com/team/team\\_settings](https://windsurf.com/team/team_settings) **GROUP\\_NAME**: The name of a group to filter on. This field is optional. Can not be set if emails is set. **START\\_TIMESTAMP/END\\_TIMESTAMP**: Timestamps in RFC 3339 format, so e.g. 2023-01-01T00:00:00Z **EMAILS**: A list of emails to filter on. This field is optional. Can not be set if group\\_name is set. **IDE\\_TYPES**: A list of IDE types to filter on. This field is optional. The possible values are described below. **QUERY\\_REQUESTS**: A list of query requests to make. This field is required. The possible values of CASCADE\\_DATA\\_SOURCE are described below. #### Example Query ```sh curl -X POST --header \"Content-Type: application/json\" \\ --data '{ \"service_key\": \"my_random_test_key\", \"group_name\": \"my_group_name\", \"start_timestamp\": \"2025-01-01T00:00:00Z\", \"end_timestamp\": \"2025-01-02T00:00:00Z\", \"emails\": [\"my_email@windsurf.com\", \"my_email2@windsurf.com\"], \"ide_types\": [\"editor\"], \"query_requests\": [ { \"cascade_lines\": {} }, { \"cascade_runs\": {} } ] }' \\ https://server.codeium.com/api/v1/CascadeAnalytics ``` ### IDE Types We split cascade data in to two categories, the Editor and the JetBrains Plugin. Excluding the ide\\_types field in the query returns data for both. If you would like to query data for only one of the IDEs, you can use either of the two options: * \"editor\" for the Windsurf Editor * \"jetbrains\" for the JetBrains Plugin ### Cascade Data Sources There are three possible values for CASCADE\\_DATA\\_SOURCE #### Source: cascade\\_lines Use cascade\\_lines to query for data on cascade lines suggested and accepted per day. Example output: ```json { \"queryResults\": [ { \"cascadeLines\": { \"cascadeLines\": [ { \"day\": \"2025-05-01T00:00:00Z\", \"linesSuggested\": \"206\", \"linesAccepted\": \"157\" }, { \"day\": \"2025-05-02T00:00:00Z\", \"linesSuggested\": \"16\" }, { \"day\": \"2025-05-03T00:00:00Z\", \"linesSuggested\": \"169\", \"linesAccepted\": \"168\" } ] } } ] } ``` **linesSuggested**: The number of lines suggested on the given day. **linesAccepted**: The number of lines accepted on the given day. #### Source: cascade\\_runs Use cascade\\_runs to query for data on model usage, credit consumption, and mode. Example output: ```json { \"queryResults\": [ { \"cascadeRuns\": { \"cascadeRuns\": [ { \"day\": \"2025-05-01T00:00:00Z\", \"model\": \"Claude 3.7 Sonnet (Thinking)\", \"mode\": \"CONVERSATIONAL_PLANNER_MODE_DEFAULT\", \"messagesSent\": \"1\", \"cascadeId\": \"0d35c1f7-0a85-41d0-ac96-a04cd2d64444\" }, { \"day\": \"2025-05-01T00:00:00Z\", \"model\": \"SWE-1\", \"mode\": \"UNKNOWN\", \"promptsUsed\": \"125\", \"cascadeId\": \"0d35c1f7-0a85-41d0-ac96-a04cd2d64444\" }, { \"day\": \"2025-05-01T00:00:00Z\", \"model\": \"GPT-4.1 (promo)\", \"mode\": \"CONVERSATIONAL_PLANNER_MODE_DEFAULT\", \"messagesSent\": \"5\", \"cascadeId\": \"1f450ba3-06aa-4ba5-9e12-d3b98c2d33d3\" }, ] } } ] } ``` **day**: The date of the run. **model**: The model used for the message. **mode**: The mode of the run. One of CONVERSATIONAL\\_PLANNER\\_MODE\\_DEFAULT (for write mode), CONVERSATIONAL\\_PLANNER\\_MODE\\_READ\\_ONLY (for read mode), CONVERSATIONAL\\_PLANNER\\_MODE\\_NO\\_TOOL (for legacy mode), or UNKNOWN. **messagesSent**: The number of messages sent. **cascadeId**: The ID of the run. This id can be used to understand how many distinct converstations have been started (as opposed to how many times the user sends a message). **promptsUsed**: The number of credits used. The data returned by the api is in a raw format, which may explain any \"UNKNOWN\" values. If using this data source for your own metrics, it is recommended to aggregate by the specific metrics you are interested in (eg, count up the promptsUsed field to understand user usage patterns, messagesSent to understand user engagement, etc), as it is possible for mode and prompt data to be split across entries. #### Source: cascade\\_tool\\_usage Use cascade\\_tool\\_usage to query for data on tool usage. Note that this returns an aggregate count of tool in the provided period. Example output: ```json { \"queryResults\": [ { \"cascadeToolUsage\": { \"cascadeToolUsage\": [ { \"tool\": \"CODE_ACTION\", \"count\": \"15\" }, { \"tool\": \"LIST_DIRECTORY\", \"count\": \"20\" }, { \"tool\": \"MCP_TOOL\", \"count\": \"12\" }, { \"tool\": \"MEMORY\", \"count\": \"4\" } ] } } ] } ``` **tool**: The tool used for the message. **count**: The number of times the tool was used. Here is a map of the returned enums and the human readable name, as it is displayed in the UI: * CODE\\_ACTION: 'Code Edit' * VIEW\\_FILE: 'View File' * RUN\\_COMMAND: 'Run Command' * FIND: 'Find tool' * GREP\\_SEARCH: 'Grep Search' * VIEW\\_FILE\\_OUTLINE: 'View File Outline' * MQUERY: 'Riptide' * LIST\\_DIRECTORY: 'List Directory' * MCP\\_TOOL: 'MCP Tool' * PROPOSE\\_CODE: 'Propose Code' * SEARCH\\_WEB: 'Search Web' * MEMORY: 'Memory' * PROXY\\_WEB\\_SERVER: 'Browser Preview' * DEPLOY\\_WEB\\_APP: 'Deploy Web App' ## Custom Analytics API specification Certain data sources allow for customizable queries via the Custom Analytics API. **Full schemas for selections, filters, aggregations, and orderings are in the following section, in JSON format. Example queries and for each of the three data sources, as well as query debugging tips, will be at the end of the document.** ```sh curl -X POST --header \"Content-Type: application/json\" \\ --data '{ \"service_key\": \"<SERVICE_KEY>\", \"group_name\": \"<GROUP_NAME>\", \"query_requests\": [ { \"data_source\": \"QUERY_DATA_SOURCE_<DATA_SOURCE>\", \"selections\": [ <LIST OF SELECTIONS> ], \"filters\": [ <LIST OF FILTERS> ], \"aggregations\": [ <LIST OF AGGREGATIONS> ], } ] }' \\ https://server.codeium.com/api/v1/Analytics ``` **DATA\\_SOURCE**: select either USER\\_DATA, CHAT\\_DATA, or COMMAND\\_DATA depending on whether you are looking for autocomplete, chat, or command data. **SERVICE\\_KEY**: The service key - an admin user can create a new one from [https://windsurf.com/team/team\\_settings](https://windsurf.com/team/team_settings) **GROUP\\_NAME**: The name of a group to filter on. This field is optional. ## Schemas ### Selections Selections are **required**. Each selection corresponds to a value to be queried. ```json { \"field\": \"<FIELD_NAME>\", \"name\": \"<NAME>\", \"aggregation_function\": \"QUERY_AGGREGATION_<AGGREGATION_FUNCTION>\" } ``` **FIELD\\_NAME**: The field you wish to query. See the Available Fields section below. **NAME**: An alias for the field. If not specified, will be the lowercase version of \\<AGGREGATION\\_FUNCTION>\\_\\<FIELD\\_NAME>, e.g. sum\\_num\\_acceptances. Must be distinct from all other field and aggregation names. **AGGREGATION\\_FUNCTION**: should be one of UNSPECIFIED, COUNT, SUM, AVG, MAX, MIN. If \"aggregation\\_function\" is not provided, defaults to UNSPECIFIED. ### Filters Filters are used to narrow down the data to only contain elements that meet certain criteria. They are optional. ```json { \"name\": \"<NAME>\", \"value\": \"<VALUE>\", \"filter\": \"QUERY_FILTER_<FILTER>\" } ``` **NAME**: The name of the field you wish to filter. If the filtered item is the same as a Selection/Aggregation, this must be equal to the name of the field/aggregation. **VALUE**: the value being compared. **FILTER**: One of EQUAL, NOT\\_EQUAL, GREATER\\_THAN, LESS\\_THAN, GE (greater than or equal), LE (less than or equal). ### Aggregations Aggregations are used to split the data into groups based off a specified criteria. They are optional. ```json { \"field\": <FIELD_NAME>, \"name\": <NAME> } ``` FIELD\\_NAME: The field you wish to query. See the Available Fields section. NAME: An alias for the field. Must be distinct from all other field and aggregation names. ## Available Fields ### User Data All data from the USER\\_DATA source is aggregated per user, per hour. Note: PCW (percent code written) now has its own table, and does not rely on the user\\_data table. | **Field Name** | **Description** | **Valid Aggregations** | | -------------------------- | ----------------------------------------------------------------------------------------------------------------------------------- | ---------------------- | | api\\_key | A hash of the user API key. | UNSPECIFIED, COUNT | | date | The UTC date of the autocompletion(s). | UNSPECIFIED, COUNT | | date UTC-x | The date of the autocompletion, with a time zone offset. For example, PST would be \"date UTC-8\". | UNSPECIFIED, COUNT | | hour | The UTC hour of the autocompletions(s). | UNSPECIFIED, COUNT | | language | The programming language being used. | UNSPECIFIED, COUNT | | ide | The IDE that was being used. | UNSPECIFIED, COUNT | | version | The Windsurf version used | UNSPECIFIED, COUNT | | num\\_acceptances | The number of times the user accepted an autocomplete. This occurs when the user writes some code, sees grey text, and presses tab. | SUM, MAX, MIN, AVG | | num\\_lines\\_accepted | Lines of code accepted from autocomplete. | SUM, MAX, MIN, AVG | | num\\_bytes\\_accepted | Bytes accepted from autocomplete. | SUM, MAX, MIN, AVG | | distinct\\_users | Distinct users. | UNSPECIFIED, COUNT | | distinct\\_developer\\_days | Distinct (users, day) tuples. | UNSPECIFIED, COUNT | | distinct\\_developer\\_hours | Distinct (users, hour of day) tuples. | UNSPECIFIED, COUNT | ### Chat Data Note that all data provided in the chat data API are for the chat model responses, not the user questions. | **Field Name** | **Description** | **Valid Aggregations** | | -------------------------- | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | ---------------------- | | api\\_key | A hash of the user API key | UNSPECIFIED, COUNT | | model\\_id | The chat model's ID, set during deployment time. | UNSPECIFIED, COUNT | | date | The UTC date of the chat response. | UNSPECIFIED, COUNT | | date UTC-x | The date of the chat response, with a time zone offset. For example, PST would be \"date UTC-8\". | UNSPECIFIED, COUNT | | ide | The IDE that was being used | UNSPECIFIED, COUNT | | version | The Windsurf version used | UNSPECIFIED, COUNT | | latest\\_intent\\_type | Whether the model response is generated from a code lens or a regular chat. Regular chats will correspond to:<br /><br />CHAT\\_INTENT\\_GENERIC<br /><br />while code lenses will correspond to one of:<br /><br />CHAT\\_INTENT\\_FUNCTION\\_EXPLAIN<br />CHAT\\_INTENT\\_FUNCTION\\_DOCSTRING<br />CHAT\\_INTENT\\_FUNCTION\\_REFACTOR<br />CHAT\\_INTENT\\_CODE\\_BLOCK\\_EXPLAIN<br />CHAT\\_INTENT\\_CODE\\_BLOCK\\_REFACTOR<br />CHAT\\_INTENT\\_PROBLEM\\_EXPLAIN<br />CHAT\\_INTENT\\_FUNCTION\\_UNIT\\_TESTS | UNSPECIFIED, COUNT | | num\\_chats\\_received | Number of chats messages sent from Windsurf to the user. | SUM, MAX, MIN, AVG | | chat\\_accepted | True if a code block was sent in Windsurf's chat response, and the Thumbs up button is clicked. | SUM, COUNT | | chat\\_inserted\\_at\\_cursor | True if a code block was sent in Windsurf's chat response, and the \"Insert\" button is clicked. | SUM, COUNT | | chat\\_applied | True if a code block was sent in Windsurf's chat response, and the \"Apply Diff\" button is clicked. | SUM, COUNT | | chat\\_loc\\_used | Lines of code used, if a code block was sent in Windsurf's chat, and any of the \"Insert\", \"Copy\", or \"Apply Diff\" buttons are pressed. | SUM, MAX, MIN, AVG | ### Command Data Note that the Command Data source contains **all** commands, including those which were declined. The \"accepted\" field can be used to filter for only accepted commands. | **Field Name** | **Description** | **Valid Aggregations** | | ---------------- | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | ---------------------- | | api\\_key | A hash of the user API key. | UNSPECIFIED, COUNT | | date | The UTC date of the command. | UNSPECIFIED, COUNT | | timestamp | The UTC timestamp of the command. | UNSPECIFIED, COUNT | | language | The programming language being used. | UNSPECIFIED, COUNT | | ide | The IDE that was being used. | UNSPECIFIED, COUNT | | version | The Windsurf version used | UNSPECIFIED, COUNT | | command\\_source | The reason that the command was triggered. Valid values are,<br /><br />COMMAND\\_REQUEST\\_SOURCE\\_LINE\\_HINT\\_CODE\\_LENS<br />COMMAND\\_REQUEST\\_SOURCE\\_DEFAULT<br />COMMAND\\_REQUEST\\_SOURCE\\_RIGHT\\_CLICK\\_REFACTOR<br />COMMAND\\_REQUEST\\_SOURCE\\_FUNCTION\\_CODE\\_LENS<br />COMMAND\\_REQUEST\\_SOURCE\\_FOLLOWUP<br />COMMAND\\_REQUEST\\_SOURCE\\_CLASS\\_CODE\\_LENS<br />COMMAND\\_REQUEST\\_SOURCE\\_PLAN<br />COMMAND\\_REQUEST\\_SOURCE\\_SELECTION\\_HINT\\_CODE\\_LENS<br /><br />COMMAND\\_REQUEST\\_SOURCE\\_DEFAULT corresponds to the typical command usage. | UNSPECIFIED, COUNT | | provider\\_source | Determines whether command was triggered in generation or edit mode. Valid values are,PROVIDER\\_SOURCE\\_COMMAND\\_GENERATE PROVIDER\\_SOURCE\\_COMMAND\\_EDIT | UNSPECIFIED, COUNT | | lines\\_added | Number of lines of code added by the command. | SUM, MAX, MIN, AVG | | lines\\_removed | Number of lines of code removed by the command. | SUM, MAX, MIN, AVG | | bytes\\_added | Number of bytes added by the command. | SUM, MAX, MIN, AVG | | bytes\\_removed | Number of bytes removed by the command. | SUM, MAX, MIN, AVG | | selection\\_lines | Number of lines of code selected by the command. Should always be zero for generations. | SUM, MAX, MIN, AVG | | selection\\_bytes | Number of bytes selected by the command. Should always be zero for generations. | SUM, MAX, MIN, AVG | | accepted | Whether the command was accepted. | SUM, COUNT | ### PCW Data #### Valid Selections | **Field Name** | **Description** | **Valid Aggregations** | | --------------------------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | ---------------------- | | percent\\_code\\_written | Percent code written. Calculated as (number of windsurf bytes generated) / (number of windsurf bytes generated + number of user bytes generated). This metric can have high variance within single days or users, so we recommend aggregating over weeks for this. | UNSPECIFIED | | windsurf\\_bytes | total number of windsurf bytes, which is equal to windsurf\\_bytes\\_by\\_autocomplete + windsurf\\_bytes\\_by\\_command | UNSPECIFIED | | user\\_bytes | total number of user bytes | UNSPECIFIED | | total\\_bytes | windsurf\\_bytes + user\\_bytes | UNSPECIFIED | | windsurf\\_bytes\\_by\\_autocomplete | total number of windsurf bytes generated from autocomplete | UNSPECIFIED | | windsurf\\_bytes\\_by\\_command | total number of windsurf bytes generated from command | UNSPECIFIED | #### Valid Filters | | | | | -------------- | ------------------------------------ | ----------------- | | **Field Name** | **Description** | **Some Examples** | | api\\_key | A hash of the user API key. | | | language | The programming language being used. | KOTLIN, GO, JAVA | | ide | The IDE that was being used. | jetbrains, vscode | | version | The Windsurf version used | 1.28.0, 130.0 | To filter by date, use start\\_timestamp and end\\_timestamp, which should be in RFC 3339 format (e.g. 2023-01-01T00:00:00Z, see in the example below). ## Examples ### User Data ```sh curl -X POST --header \"Content-Type: application/json\" \\ --data '{ \"service_key\": SERVICE_KEY, \"query_requests\": [ { \"data_source\": \"QUERY_DATA_SOURCE_USER_DATA\", \"selections\": [ { \"field\": \"num_acceptances\", \"name\": \"num_acceptances\", \"aggregation_function\": \"QUERY_AGGREGATION_SUM\" } ], \"filters\": [ { \"name\": \"hour\", \"filter\": \"QUERY_FILTER_GE\", \"value\": \"2024-01-01\" }, { \"name\": \"hour\", \"filter\": \"QUERY_FILTER_LE\", \"value\": \"2024-02-01\" } ] } ] }' \\ https://server.codeium.com/api/v1/Analytics ``` This query calculates the overall Percent Code Written over the month of January 2024. Example response (JSON formatted for readability): ```json { \"queryResults\": [ { \"responseItems\": [ { \"item\": { \"num_acceptances\": \"125\", \"num_lines_accepted\": \"863\" } } ] } ] } ``` ### Chat Data ```sh curl -X POST --header \"Content-Type: application/json\" \\ --data '{ \"service_key\": SERVICE_KEY, \"query_requests\": [ { \"data_source\": \"QUERY_DATA_SOURCE_CHAT_DATA\", \"selections\": [ { \"field\": \"chat_loc_used\", \"name\": \"chat_loc_used\", \"aggregation_function\": \"QUERY_AGGREGATION_SUM\" } ], \"filters\": [ { \"name\": \"latest_intent_type\", \"filter\": \"QUERY_FILTER_EQUAL\", \"value\": \"CHAT_INTENT_FUNCTION_DOCSTRING\" } ], \"aggregations\": [ { \"field\": \"ide\", \"name\": \"ide\" } ] } ] }' \\ https://server.codeium.com/api/v1/Analytics ``` This query shows the number of lines of code accepted from the \"Generate Docstring\" code lens, for all time, grouped by IDE. Example response: ```json { \"queryResults\": [ { \"responseItems\": [ { \"item\": { \"chat_loc_used\": \"74\", \"ide\": \"jetbrains\" }, }, { \"item\": { \"chat_loc_used\":\"41\", \"ide\":\"vscode\" }, } ] } ] } ``` ### Command Data ```sh curl -X POST --header \"Content-Type: application/json\" \\ --data '{ \"service_key\": SERVICE_KEY, \"query_requests\": [ { \"data_source\": \"QUERY_DATA_SOURCE_COMMAND_DATA\", \"selections\": [ { \"field\": \"lines_added\", \"name\": \"lines_added\", \"aggregation_function\": \"QUERY_AGGREGATION_SUM\" }, { \"field\": \"lines_removed\", \"name\": \"lines_removed\", \"aggregation_function\": \"QUERY_AGGREGATION_SUM\" } ], \"filters\": [ { \"name\": \"provider_source\", \"filter\": \"QUERY_FILTER_EQUAL\", \"value\": \"PROVIDER_SOURCE_COMMAND_EDIT\" }, { \"name\": \"accepted\", \"filter\": \"QUERY_FILTER_EQUAL\", \"value\": \"true\" } ], \"aggregations\": [ { \"field\": \"language\", \"name\": \"language\" } ] } ] }' \\ https://server.codeium.com/api/v1/Analytics ``` This query gets the number of lines added and removed from \"edit\" commands, grouped by programming language. Example response: ```json { \"queryResults\": [ { \"responseItems\": [ { \"item\": { \"language\": \"SHELL\", \"lines_added\": \"5\", \"lines_removed\": \"3\" } }, { \"item\": { \"language\": \"GO\", \"lines_added\": \"31\", \"lines_removed\": \"27\" } }, { \"item\": { \"language\": \"PYTHON\", \"lines_added\": \"21\", \"lines_removed\": \"5\" } }, { \"item\": { \"language\": \"UNSPECIFIED\", \"lines_added\": \"91\", \"lines_removed\": \"71\" } }, { \"item\": { \"language\": \"STARLARK\", \"lines_added\": \"13\", \"lines_removed\": \"1\" } } ] } ] } ``` ### PCW Data ```sh curl -X POST --header \"Content-Type: application/json\" \\ --data '{ \"service_key\": SERVICE_KEY, \"start_timestamp\": \"2024-01-01T00:00:00Z\", \"end_timestamp\": \"2024-12-22T00:00:00Z\" \"query_requests\": [ { \"data_source\": \"QUERY_DATA_SOURCE_PCW_DATA\", \"selections\": [ { \"field\": \"percent_code_written\", \"name\": \"percent_code_written\" }, { \"field\": \"codeium_bytes\", \"name\": \"codeium_bytes\" }, { \"field\": \"total_bytes\", \"name\": \"total_bytes\" }, { \"field\": \"codeium_bytes_by_autocomplete\", \"name\": \"codeium_bytes_by_autocomplete\" }, { \"field\": \"codeium_bytes_by_command\", \"name\": \"codeium_bytes_by_command\" } ], \"filters\": [ { \"filter\": \"QUERY_FILTER_EQUAL\", \"name\": \"language\", \"value\": \"GO\" } ] } ], }' \\ https: //server.codeium.com/api/v1/Analytics ``` This query gets the PCW (Percent Code Written) data, along with bytes filtered by language go. Example response: ```json { \"queryResults\": [ { \"responseItems\": [ { \"item\": { \"codeium_bytes\": \"6018\", \"codeium_bytes_by_autocomplete\": \"4593\", \"codeium_bytes_by_command\": \"1425\", \"percent_code_written\": \"0.61\", \"total_bytes\": \"9900\" } } ] } ] } ``` ## Query debugging From 1.10.0 and on, invalid queries will return an error message. This section has some common error messages, what they mean, and how to debug the corresponding queries. <table> <thead> <tr> <th>Error Message</th> <th>Explanation</th> </tr> </thead> <tbody> <tr> <td>at least one field or aggregation is required</td> <td>Did not detect any selections or aggregations - make sure the query request contains at least one.</td> </tr> <tr> <td>invalid aggregation function for string type field ide: QUERY\\_AGGREGATION\\_SUM</td> <td>One of the selections used an invalid aggregation function. In this case we tried to use SUM on the \"ide\" field, but it only supports COUNT and UNSPECIFIED</td> </tr> <tr> <td>invalid query table: QUERY\\_DATA\\_SOURCE\\_UNSPECIFIED</td> <td>There is likely a typo in the data\\_source field, double check the spelling.</td> </tr> <tr> <td>all selection fields should have an aggregation function, or none of them should</td> <td> If there are multiple selection fields, either all should contain an aggregation\\_function, or none of them should. For example, this selection is invalid because num\\_acceptances is summed, but num\\_lines\\_accepted is not: ```json \"selections\": [ { \"field\": \"num_acceptances\", \"name\": \"total_acceptances\", \"aggregation_function\": \"QUERY_AGGREGATION_SUM\" }, { \"field\": \"num_lines_accepted\", \"name\": \"total_lines_accepted\", \"aggregation_function\": \"QUERY_AGGREGATION_UNSPECIFIED\" } ] ``` Note: PCW is always considered aggregated. If no aggregation\\_function is explicitly chosen, it is considered unspecified. If you would like information about both of these fields, use two seperate queries. </td> </tr> <tr> <td>invalid aggregation function for string type field ide: QUERY\\_AGGREGATION\\_SUM</td> <td>Not every field supports every aggregation function; see the available fields section for the matches. In this case, the query used a QUERY\\_AGGREGATION\\_SUM aggregation function with the \"ide\" field, which is invalid.</td> </tr> <tr> <td>tried to aggregate on a distinct field: distinct\\_developer\\_days. Consider aggregating on the non-distinct fields instead: \\[api\\_key date]</td> <td> Fields with the pattern \"distinct\\_\\*\" can not be in the aggregations section; the error suggests an alternative field(s) to aggregate on instead. So instead of: ```json \"aggregations\": [ { \"field\": \"distinct_developer_days\", \"name\": \"distinct_developer_days\" } ] ``` Try: ```json \"aggregations\": [ { \"field\": \"api_key\", \"name\": \"api_key\" }, { \"field\": \"date\", \"name\": \"date\" } ] ``` </td> </tr> <tr> <td>duplicate field alias for selection/aggregation: num\\_acceptances</td> <td>All selections and aggregations must have a different name. Keep in mind that if the name is not specified, by default it is set to \\<AGGREGATION\\_FUNCTION>\\_\\<FIELD\\_NAME>.</td> </tr> <tr> <td>invalid group name: GroupName</td> <td>The group with the specified name was not found, double check the spelling.</td> </tr> </tbody> </table> # Setting up SSO & SCIM Source: https://docs.windsurf.com/plugins/accounts/sso-scim This feature is only available to Teams and Enterprise users. <Tabs> <Tab title=\"Google SSO\"> Windsurf now supports sign in with Single Sign-On (SSO) via SAML. If your organization uses Microsoft Entra, Okta, Google Workspaces, or some other identity provider that supports SAML, you will be able to use SSO with Windsurf. <Note>Windsurf only supports SP-initiated SSO; IDP-initiated SSO is NOT currently supported.</Note> ### Configure IDP Application On the google admin console (admin.google.com) click **Apps -> Web and mobile apps** on the left. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-google.png\" /> </Frame> Click on **Add app**, and then **Add custom SAML app**. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-google2.png\" /> </Frame> Fill out **App name** with `Windsurf`, and click **Next**. The next screen (Google Identity Provider details) on Google’s console page has data you’ll need to copy to Windsurf’s SSO settings on [www.windsurf.com/team/team\\_settings](http://www.windsurf.com/team/team_settings). * Copy **SSO URL** from Google’s console page to Windsurf’s settings under **SSO URL** * Copy **Entity ID** from Google’s console page to Windsurf’s settings under **Idp Entity ID** * Copy **Certificate** from Google’s console page to Windsurf’s settings under **X509 Certificate** * Click **Continue** on Google’s console page The next screen on Google’s console page requires you to copy data from Codeium’s settings page * Copy **Callback URL** from Codeium’s settings page to Google’s console page under **ACS URL** * Copy **SP Entity ID** from Codeium’s settings page to Google’s console page under **SP Entity ID** * Change **Name ID** format to **EMAIL** * Click **Continue** on Google’s console page The next screen on Google’s console page requires some configuration * Click on **Add Mapping**, select **First name** and set the **App attributes** to **firstName** * Click on **Add Mapping**, select **Last name** and set the **App attributes** to **lastName** * Click **Finish** <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-google3.png\" /> </Frame> On Codeium’s settings page, click **Enable Login with SAML**, and then click **Save**. Make sure to click on **Test Login** to make sure login works as expected. All users now will have SSO login enforced. </Tab> <Tab title=\"Azure AD SSO\"> Windsurf Enterprise now supports sign in with Single Sign-On (SSO) via SAML. If your organization uses Microsoft Azure AD, you will be able to use SSO with Windsurf. <Note> that Windsurf only supports SP-initiated SSO; IDP-initiated SSO is NOT currently supported.</Note> ### Configure IDP Application Create an Enterprise Application with your identity provider. Click on **Add**, and then **Enterprise Application**. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-azure.png\" /> </Frame> Click on **Create your own application**. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-azure2.png\" /> </Frame> Name your application **Windsurf**, select *Integrate any other application you don’t find in the gallery*, and then click **Create**. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-azure3.png\" /> </Frame> Configure your enterprise application with SAML * Click on Set up single sign on in the new Windsurf application, and then Click on SAML * Click on Edit under Basic SAML Configuration, and open up the Windsurf Teams SSO settings at [https://www.codeium.com/team/team\\_settings](https://www.codeium.com/team/team_settings) * On Entra’s SAML configuration form and Windsurf SSO settings page * For Identifier (Entity ID), copy the SP Entity ID value in the SSO settings page * For Reply URL (Assertion Consumer Service URL), copy the Callback URL value in the SSO settings page * Click Save at the top * Pick the SSO ID you want to use, which creates a login portal for your team. Note that this is not changeable after this is saved. * Fill out IdP Entity ID in the settings page with the value in Entra ID under Set up Windsurf -> Microsoft Entra Identifier * Fill out SSO URL in the settings page with the value in Entra ID under Login URL * Download the SAML certificate (Base64), get the text content of the file, and paste it to X509 Certificate on the Windsurf settings page * Click on Enable Login with SAML * Click Save in the Windsurf settings page * We also need to set up name claims. This step is important in order for Windsurf to know the display name of the user. * Under Attributes & Claims under Entra ID, click on Edit * Create 2 new claims. You can do so by clicking on Add new claim * The first claim should have ‘firstName’ as the Name, and ‘user.givenname’ as the Source attribute * The second claim should have ‘lastName’ as the Name, and ‘user.surname’ as the Source attribute * At this point you should have successfully configured SSO. Under Save in the settings page, click on Test Login to make sure everything works as expected. </Tab> <Tab title=\"Okta SSO\"> Windsurf Enterprise now supports sign in with Single Sign-On (SSO) via SAML. If your organization uses Microsoft Entra, Okta, Google Workspaces, or some other identity provider that supports SAML, you will be able to use SSO with Windsurf. <Note>Windsurf only supports SP-initiated SSO; IDP-initiated SSO is NOT currently supported.</Note> ### Configure IDP Application Click on Applications on the left sidebar, and then Create App Integration <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-okta1.png\" /> </Frame> Select SAML 2.0 as the sign-in method <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-okta2.png\" /> </Frame> Set the app name as Windsurf (or to any other name), and click Next Configure the SAML settings as * Single sign-on URL to [https://auth.windsurf.com/\\_\\_/auth/handler](https://auth.windsurf.com/__/auth/handler) * Audience URI (SP Entity ID) to [www.codeium.com](http://www.codeium.com) * NameID format to EmailAddress * Application username to Email Configure the attribute statements as following, and then click **Next**. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-okta3.png\" /> </Frame> In the feedback section, select “This is an internal app that we have created”, and click **Finish**. ### Register Okta as a SAML provider You should be redirected to the Sign on tab under your custom SAML application. Now you’ll want to take the info in this page and fill it out in Windsurf’s SSO settings. * Open [www.windsurf.com/team/team\\_settings](http://www.windsurf.com/team/team_settings), and click on Configure SAML * Copy the text after ‘Issuer’ in Okta’s application page and paste it under Idp Entity ID * Copy the text after ‘Sign on URL’ in Okta’s application page and paste it under SSO URL * Download the Signing Certificate and paste it under X509 certificate * Check Enable Login with SAML and then click Save * Test the login with the Test Login button. You should see a success message: <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-okta4.png\" /> </Frame> At this point everything should have been configured, and can now add users to the new Windsurf Okta application. You should share your organization's custom Login Portal URL with your users and ask them to sign in via that link. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-okta5.png\" /> </Frame> Users who login to Windsurf via SSO will be auto-approved into the team. ### Caveats Note that Windsurf does not currently support IDP-initiated login flows. We also do not yet support OIDC. # Troubleshooting ### Login with SAML config failed: Firebase: Error (auth/operation-not-allowed) <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-okta6.png\" /> </Frame> This points to your an invalid SSO ID, or your SSO URL being incorrect, make sure it is alphanumeric and has no extra spaces or invalid characters. Please go over the steps in the guide again and make sure you use the correct values. ### Login with SAML config failed: Firebase: SAML Response \\<Issuer> mismatch. (auth/invalid-credential) <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/sso-okta7.png\" /> </Frame> This points to your IdP entity ID being invalid, please make sure you copy it correctly from the Okta portal, without any extra characters or spaces before or after the string. ### Failed to verify the signature in samlresponse This points to an incorrect value of your X509 certificate, please make sure you copy the correct key, and that it is formatted as: ``` -----BEGIN CERTIFICATE----- value ------END CERTIFICATE------ ``` </Tab> <Tab title=\"Azure SCIM\"> Windsurf supports SCIM synchronization for users and groups with Microsoft Entra ID / Azure AD. It isn't necessary to setup SSO to use SCIM synchronization, but it is highly recommended. You'll need: * Admin access to Microsoft Entra ID / Azure AD * Admin access to Windsurf * An existing Windsurf Application on Entra ID (normally from your existing SSO application) ## Step 1: Navigate to the existing Windsurf Application Go to Microsoft Entra ID on Azure, click on Enterprise applications on the left sidebar, and then click on the existing Windsurf application in the list. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/scim-azure.png\" /> </Frame> ## Step 2: Setup SCIM provisioning Click on Get started under Provision User Accounts in the middle (step 3), and then click on Get started again. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/scim-azure2.png\" /> </Frame> Under the Provisioning setup page, select the following options. Provisioning Mode: Automatic Admin Credentials > Tenant URL: [https://server.codeium.com/scim/v2](https://server.codeium.com/scim/v2) Leave the Azure provisioning page open, now go to the Windsurf web portal, and click on the profile icon in the NavBar on the top of the page. Under Team Settings, select Service Key and click on Add Service Key. Enter any key name (such as 'Azure Provisioning Key') and click Create Service Key. Copy the output key, go back to the Azure page, paste it to Secret Token. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/scim-azure3.png\" /> </Frame> (What you should see after creating the key on Windsurf) On the Provisioning page, click on Test Connection and that should have verified the SCIM connection. Now above the Provisioning form click on Save. ## Step 3: Configure SCIM Provisioning After clicking on Save, a new option Mappings should have appeared in the Provisioning page. Expand Mappings, and click on Provision Microsoft Entra ID Users <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/scim-azure4.png\" /> </Frame> Under attribute Mappings, delete all fields under displayName, leaving only the fields userName, active, and displayName. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/scim-azure5.png\" /> </Frame> For active, now click on Edit. Under Expression, modify the field to ``` NOT([IsSoftDeleted]) ``` Then click Ok. Your user attributes should look like <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/scim-azure6.png\" /> </Frame> In the Attribute Mapping page, click on Save on top, and navigate back to the Provisioning page. Now click on the same page, under Mappings click on Provision Microsoft Entra ID Groups. Now only click delete for externalId, and click Save on top. Navigate back to the Provisioning page. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/scim-azure7.png\" /> </Frame> On the Provisioning page at the bottom, there should also be a Provisioning Status toggle. Set that to On to enable SCIM syncing. Now every 40 minutes your users and groups for the Entra ID application will be synced to Windsurf. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/scim-azure8.png\" /> </Frame> Click on Save to finish, you have now enabled user and group syncing for SCIM. Only users and groups assigned to the application will be synced to Windsurf. Note that removing users only disables them access to Windsurf (and stops them from taking up a seat) rather than deleting users due to Azure's SCIM design. </Tab> <Tab title=\"Okta SCIM\"> Windsurf supports SCIM synchronization for users and groups with Okta. It isn't necessary to setup SSO to use SCIM synchronization, but it is highly recommended. You'll need: * Admin access to Okta * Admin access to Windsurf * An existing Windsurf Application on Okta (normally from your existing SSO application) ## Step 1: Navigate to the existing Windsurf Application Go to Okta, click on Applications, Applications on the left sidebar, and then click on the existing Windsurf application in the application list. ## Step 2: Enable SCIM Provisioning Under the general tab, App Settings click on Edit on the top right. Then tick the 'Enable SCIM Provisioning' checkbox, then click Save. A new provisioning tab should have showed up on the top. Now go to provisioning, click Edit and input in the following fields: SCIM connector base URL: [https://server.codeium.com/scim/v2](https://server.codeium.com/scim/v2) Unique identifier field for users: email Supported provisioning actions: Push New Users, Push Profile Updates, Push Groups Authentication Mode: HTTP Header For HTTP Header - Authorization, you can generate the token from * [https://windsurf.com/team/team\\_settings](https://windsurf.com/team/team_settings) and go to the SCIM tab on the left * Click on Add API Key, and give your API key a name * Copy the API key, go back to Okta and paste it to HTTP Header - Authorization Click on Save after filling out Provisioning Integration. ## Step 3: Setup Provisioning Under the provisioning tab, on the left there should be two new tabs. Click on To App, and Edit Provisioning to App. Tick the checkbox for Create Users, Update User Attributes, and Deactivate Users, and click Save. After this step, all users assigned to the group will now be synced to Windsurf. ## Step 4: Setup Group Provisioning (Optional) In order to sync groups to Windsurf, you will have to specify which groups to push. Under the application, click on the Push Groups tab on top. Now click on + Push Groups -> Find Groups by name. Filter for the group you would like to add, make sure Push group memberships immediately is checked, and then click Save. The group will be created and group members will be synced to Windsurf. Groups can then be used to filter for group analytics in the analytics page. </Tab> <Tab title=\"SCIM API\"> This guide shows how to create and maintain groups in Windsurf with the SCIM API. There are reasons one may want to provision groups manually rather than with their Identity Provider (Azure/Okta). Companies may want Groups provisioned from a different internal source (HR website, Sourcecode Management Tool etc.) that Windsurf doesn't have access to, or companies may finer control to Groups than what their Idendity Provider provides. Groups can thus be created with an API via HTTP request instead. The following provides examples on the HTTP request via CURL. There are 5 main APIs here, Create Group, Add group members, Replace group members, Delete Group, and List Users in a Group. ### Create Group ``` curl -k -X POST https://server.codeium.com/scim/v2/Groups -d '{ \"displayName\": \"<group name>\", \"schemas\": [\"urn:ietf:params:scim:schemas:core:2.0:Group\"] }' -H \"Authorization: Bearer <api secret key>\" -H \"Content-Type: application/scim+json\" ``` ### Add Group Members ``` curl -X PATCH https://server.codeium.com/scim/v2/Groups/<group name> -d '{\"schemas\": [\"urn:ietf:params:scim:api:messages:2.0:PatchOp\"], \"Operations\":[ { \"op\": \"add\", \"path\":\"members\", \"value\": [{\"value\": \"<email 1>\"}, {\"value\": \"<email 2>\"}] }]}' -H \"Authorization: Bearer <api secret key>\" -H \"Content-Type: application/scim+json\" ``` ### Replace Group Members ``` curl -X PATCH https://server.codeium.com/scim/v2/Groups/<group name> -d '{\"schemas\": [\"urn:ietf:params:scim:api:messages:2.0:PatchOp\"], \"Operations\":[ { \"op\": \"replace\", \"path\":\"members\", \"value\": [{\"value\": \"<email 1>\"}, {\"value\": \"<email 2>\"}] }]}' -H \"Authorization: Bearer <api secret key>\" -H \"Content-Type: application/scim+json\" ``` ### Delete Group ``` curl -X DELETE https://server.codeium.com/scim/v2/Groups/<group name> -H \"Authorization: Bearer <api secret key>\" -H \"Content-Type: application/scim+json\" ``` ### List Group ``` curl -X GET -H \"Authorization: Bearer <api secret key>\" \"https://server.codeium.com/scim/v2/Groups\" ``` ### List Users in a Group ``` curl -X GET -H \"Authorization: Bearer <api secret key>\" \"https://server.codeium.com/scim/v2/Groups/<group_id>\" ``` You'll have to at least create the group first, and then replace group to create a group with members in them. You'll also need to URL encode the group names if your group name has a special character like space, so a Group name such as 'Engineering Group' will have to be 'Engineering%20Group' in the URL. Note that users need to be created in Windsurf (through SCIM or manually creating the account) before they can be added to a group. ## User APIs There are also APIs for users as well. The following are some of the common SCIM APIs that Windsurf supports. Disable a user (Enable by replacing false to true): ``` curl -X PATCH \\ https://server.codeium.com/scim/v2/Users/<user api key> \\ -H 'Content-Type: application/scim+json' \\ -H 'Authorization: Bearer <api secret key>' \\ -d '{ \"schemas\": [\"urn:ietf:params:scim:api:messages:2.0:PatchOp\"], \"Operations\": [ { \"op\": \"replace\", \"path\": \"active\", \"value\": false } ] }' ``` Create a user: ``` curl -X POST \\ https://server.codeium.com/scim/v2/Users \\ -H 'Content-Type: application/scim+json' \\ -H 'Authorization: Bearer <api secret key>' \\ -d '{ \"schemas\": [\"urn:ietf:params:scim:schemas:core:2.0:User\"], \"userName\": \"<email>\", \"displayName\": \"<full name>\", \"active\": true, }' ``` Update name: ``` curl -X PATCH \\ 'https://<enterprise portal url>/_route/api_server/scim/v2/Users/<user api key>' \\ -H 'Authorization: Bearer <service key>' \\ -H 'Content-Type: application/scim+json' \\ -d '{ \"schemas\": [\"urn:ietf:params:scim:api:messages:2.0:PatchOp\"], \"Operations\": [ { \"op\": \"Replace\", \"path\": \"displayName\", \"value\": \"<new name>\" } ] }' ``` ## Creating Api Secret Key Go to [https://www.windsurf.com/team/team\\_settings](https://www.windsurf.com/team/team_settings). Under Service Key, click on Add Service Key. Enter any key name (such as 'Azure Provisioning Key') and click Create Service Key. Copy the output key and save it, you can now use the key to authorize the above APIs. </Tab> <Tab title=\"Duo\"> ## Prerequisites This guide assumes that you have Duo configured and acts as your organizational IDP, or has external IDP configured. You will need administrator access to both Duo and Windsurf accounts. ## Configure Duo for Windsurf 1. Navigate to Applications, and add a Generic SAML service provider <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/duo-sso-1.png\" /> </Frame> 2. Navigate to SSO in Team Settings <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/windsurf-sso-team-settings.png\" /> </Frame> 3. When enabling SAML for the first time, you will be required to set up your SSO ID. **You will not be able to change it later.** It is advised to set this to your organization or team name with alphanumeric characters only. 4. Copy the `Entity ID` value from the Duo portal and paste it into the `IdP Entity ID` field in the Windsurf portal. 5. Copy the `Single Sign-On URL` value from the Duo portal and paste it into the `SSO URL` field in the Windsurf portal. 6. Copy the certificate value from the Duo portal and paste it in the `X509 Certificate` field in the Windsurf portal <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/duo-sso-3.png\" /> </Frame> 7. Copy the `SP Identity ID` value from the Windsurf portal and paste it into the `Entity ID` field in the Duo portal. 8. Copy the `Callback URL (Assertion Consumer Service URL)` from the Windsurf portal and paste it into the `Assertion Consumer Service (ACS) URL` field in the Duo portal. 9. In the Duo portal, configure the attribute statements as following: <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/duo-sso-4.png\" /> </Frame> 10. Enable the SAML login in the Windsurf portal so you can test it. **NOTE: DO NOT LOGOUT OR CLOSE THE WINDOW AT THIS POINT.** If you get an error or it times out, troubleshoot your settings, otherwise you have to disable your SAML Settings in the Windsurf portal. **If you logout or close the window without confirming a successful test - you may get locked out.** 11. Once your test was successfully completed, you may logout. You can now use SSO sign in when browsing to your team/organization page with the SSO ID you have configured in step 3. [https://www.codeium.com/yourssoid/login](https://www.codeium.com/yourssoid/login) </Tab> <Tab title=\"PingID\"> ## Prerequisites This guide assumes that you have PingID configured and acts as your organizational IDP, or has external IDP configured. You will need administrator access to both PingID and Windsurf accounts. ## Configure PingID for Windsurf 1. Navigate to Applications and add Windsurf as a SAML Application <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/pingid-1.png\" /> </Frame> 2. Navigate to SSO in Team Settings <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/windsurf-sso-team-settings.png\" /> </Frame> 3. When enabling SAML for the first time, you will be required to set up your SSO ID. **You will not be able to change it later.** It is advised to set this to your organization or team name with alphanumeric characters only. 4. In PingID - choose to manually enter the configuration and fill out the fields with the following values: * ACS URLs - this is the `Callback URL (Assertion Consumer Service URL)` from the Windsurf portal. * Entity ID - this is the `SP Entity ID` from the Windsurf portal. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/pingid-3.png\" /> </Frame> 5. Copy the `Issuer ID` from PingID to the `IdP Entity ID` value in the Windsurf portal. 6. Copy the `Single Signon Service` value from PingID to the `SSO URL` value in the Windsurf portal. 7. Download the Signing Certificate from PingID as X509 PEM (.crt), open the file and copy its contents to the `X509 Certificate` value in the Windsurf portal. **Note**: make sure you have the fill begin and end lines with 5 dashes (-) and no other characters are copied! 8. In attribute mappings, make sure to map: * `saml_subject` - Email Address * `firstName` - Given Name * `lastName` - Family Name <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/auth/pingid-4.png\" /> </Frame> 9. Add/edit any other policies and access as required by your setup/organization 10. Enable the SAML login in the Windsurf portal so you can test it. **NOTE: DO NOT LOGOUT OR CLOSE THE WINDOW AT THIS POINT.** If you get an error or it times out, troubleshoot your settings, otherwise you have to disable your SAML Settings in the Windsurf portal. **If you logout or close the window without confirming a successful test - you may get locked out.** 11. Once your test was successfully completed, you may logout. You can now use SSO sign in when browsing to your team/organization page with the SSO ID you have configured in step 3. [https://www.codeium.com/yourssoid/login](https://www.codeium.com/yourssoid/login) </Tab> </Tabs> # Getting started with Teams and Enterprise Source: https://docs.windsurf.com/plugins/accounts/teams-getting-started Windsurf scales from solo projects to large-scale enterprise codebases. Our Teams and Enterprise plans unlock collaboration features such as team management, Single Sign-On (SSO), advanced analytics, and priority support. <Note>If your organisation requires extra security or compliance, please [contact our sales team](https://windsurf.com/contact/enterprise).</Note> ## Setup <Steps> <Step title=\"Choose a plan\"> Visit [windsurf.com/pricing](https://windsurf.com/pricing) and select the `Teams` or `Enterprise` tier. </Step> <Step title=\"Select seat count\"> Enter the number of users you want to include in the subscription. <Frame> <img width=\"500\" src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/teams/teams-select-user-count.jpg\" /> </Frame> </Step> <Step title=\"Manage and invite team members\"> <Card title=\"Manage Team Members\" horizontal={true} icon=\"users\" href=\"https://windsurf.com/team/manage\"> Windsurf makes managing your team easy from one dashboard. </Card> To add members to your team, first navigate to the [invite page](https://windsurf.com/team/invite). Simply click on the \"invite\" button and then either add via email or share a unique invite link. </Step> <Step title=\"Configure team settings\"> <Card title=\"Team Settings\" horizontal={true} icon=\"gear\" href=\"https://windsurf.com/team/team_settings/windsurf_settings\"> Configurable settings for your team. </Card> Select and approve models, MCP servers, SSO configurations, service keys, role management, and more. </Step> <Step title=\"(Optional) Set up Authentication\"> <Card title=\"Authentication\" horizontal={true} icon=\"lock\" href=\"/windsurf/accounts/sso-scim\"> Set up SSO, SCIM, Duo, or PingID for your team. </Card> </Step> </Steps> ## Manage Team <Note>You must be a team admin to make changes to the team.</Note> To add or remove members from your team, navigate to the [Manage team page](https://windsurf.com/team/manage). From here, you can invite and view your team, add SSO, update the number of seats in your team, or even cancel or switch your plan. <Frame> <img width=\"500\" src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/teams-invite-members.png\" /> </Frame> ## User Groups <Note>This feature is only available in Enterprise plans.</Note> Windsurf now supports creating user groups. For each group you can now view analytics per group. You can also configure group administrators who can view analytics for the specific groups they manage. ### Existing Subscription Already subscribed on Pro and want to upgrade? Head to your [Plan Management](https://windsurf.com/subscription/plan-management), click `Switch Plan`, and select the appropriate Teams or Enterprise plan. # Plans and Credit Usage Source: https://docs.windsurf.com/plugins/accounts/usage Prompt credits are consumed whenever a message is sent to Cascade with a premium model. Every model has it's own credit multiplier with the default message costing 1 credit. You can view all available models and their associated costs on the [models page.](/windsurf/models) Upon using all of your credits, select premium models will no longer be accessible; however, you will still be able to use several other models that we've made available for free. ## Plans The [Free](#using-a-free-plan) plan includes: * 25 prompt credits * Unlimited Windsurf Tab The 2 week [Pro Trial](#using-a-free-pro-trial) includes: * 100 prompt credits * Unlimited Windsurf Tab The [Pro](#using-pro-plan) plan includes everything in Free, but with: * 500 prompt credits * Add-on prompt credits at \\$10/250 credits * All premium models The [Teams](#using-teams-plan) plan includes everything in Pro, but with: * 500 prompt credits/user/month * Add-on prompt credits at \\$40/1000 credits * Centralized billing * Admin dashboard with analytics * Priority support * Access control features available to add The [Enterprise](#using-enterprise-plan) plan includes everything in Teams, but with: * 1000 prompt credits/user/month * Add-on prompt credits at \\$40/1000 credits * Role-Based Access Control (RBAC) * SSO & SCIM * Highest priority support * Longer context If you run out of credits on any paid plan, you will have the option of [purchasing additional credits](#purchasing-additional-credits) or setting up [Automatic Credit Refills](#automatic-credit-refills). After upgrading, your paid plan will start immediately and you'll have access to premium models again. To learn more about the quotas and features per pricing plan, [click here](https://codeium.com/pricing). ## Errors If a user message is unsuccessful, prompt credits will not be consumed. For example, if Cascade attempts to write to a file but that file has unsaved changes, the operation will fail and it will not consume a credit. ## Viewing your usage There are a few ways to view your usage. Go to the Cascade usage directly by clicking on the overflow menu, and then selecting \"Cascade Usage\". <Frame> <img style={{ maxHeight: \"300px\" }} src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/plan-info/usage-entry-cascade.png\" /> </Frame> View the settings panel by clicking on \"Windsurf Settings\" on the status bar, followed by selecting the \"Plan Info\" tab. You can also view it on your plan page at [codeium.com/plan](https://codeium.com/plan) after you're authenticated. ## Upgrading to a paid plan To learn more about paid features or to upgrade to a paid plan, [click here](https://codeium.com/plan). Paid plans include Pro for individuals, Teams for organizations, and Enterprise for larger companies. We accept all major credit cards, Apple Pay, Cash App Pay, Google Pay, Link, WeChat Pay, and Alipay. If you have a payment method not listed, please reach out to us at [support](https://codeium.com/support). You may need to disable your VPN to view the relevant payment methods for your region. ## What happens when you run out of prompt credits? If you no longer have prompt credits, you have two options: * You can purchase additional prompt credits to continue using premium models * You can use Write or Chat mode with the models that cost 0 credits! ## Automatic Credit Refills We've introduced Automatic Credit Refills so that you no longer need to manually purchase additional credits. Under your plan settings page on the Windsurf website, you can specify a maximum amount of credits and other refill settings. The system will automatically \"top-up\" your credits as you start running low (below 15 credits). Automatic Credit Refills are purchased in configurable increments (multiples of $10 for Pro and $40 for Teams) and subject to maximum monthly budget caps ($50 by default for Pro users and $160 for Teams users). This ensures you won't lose access to Cascade during critical work. ## Purchasing additional credits If you run out of prompt credits, you can purchase additional credits in the [billing website](https://codeium.com/plan). Additional prompt credits can be purchased at a rate of \\$10 for 250 credits for Pro users. For Team and Enterprise plans, additional credits are purchased within and treated as a pool amongst all members of the team at a rate of \\$40 for 1000 pooled credits. Please contact your Teams admin to purchase more credits if you're on a team plan. ## Usage examples To explain how credits work, here's a simple example: When you send a message to Cascade with a premium model, 1 prompt credit is consumed. It doesn't matter how many actions Cascade takes to fulfill your request - whether it searches your codebase, analyzes files, or makes edits - you only pay for the initial prompt. This simplified system makes it much easier to predict and manage your usage. No more complicated calculations of flow actions or different credit types. ## Plan Usage ### Using a Free Pro Trial The Pro Trial lasts for 2 weeks and includes unlimited Windsurf Tab, 100 prompt credits, Previews, and Deploys. When you're on a Pro Trial, you'll have access to premium features! To get started, ask Cascade a question. In Write and Chat mode, Cascade is optimized to fully understand your codebase and leverages tool calls to assist you. By default, all of your requests will use premium models until you run out of credits. After your trial period ends, you'll need to upgrade to a paid plan to continue using premium models. If you don't upgrade during the Free Trial period, you'll be downgraded to our Free plan which includes 25 prompt credits per month. ### Using Pro Plan The Pro plan costs \\$15/month and includes: * 500 prompt credits/month * All premium models * Previews * App Deploys Additional prompt credits can be purchased at a rate of \\$10 for 250 credits. While on Pro, you'll have access to a monthly quota of prompt credits. You can view how many credits you have remaining in the Windsurf Settings panel that's accessible in the status bar. If you're running low on credits, Cascade will notify you so that you can purchase additional credits or enable Automatic Credit Refills. To purchase additional credits, visit the billing website and select \"Purchase credits\". The credits purchased will rollover to the following usage month if there are any remaining. If you want to reduce your consumption of prompt credits, there are several available models that cost 0 credits! In addition to prompt credits, Pro comes with unlimited Fast Autocomplete and unlimited premium model requests with Command. ### Using Teams Plan The Teams plan costs \\$30/user/month (up to 200 users) and includes: * 500 prompt credits/user/month * Everything in Pro, plus: * Centralized billing * Admin dashboard with analytics * Priority support Additional prompt credits can be purchased at a rate of \\$40 for 1000 pooled credits. The Teams plan has a seat cap of 200 users. Coming soon, there will be an option to add Access Control features for +\\$10/user/month. While on the Teams plan, each user will have access to a monthly quota of prompt credits. Unlike the previous system, base prompt credits are not pooled - each user has their own credit limit. However, purchased add-on prompt credits are pooled across the organization. You can view how many credits your team has remaining in the Windsurf Settings panel. If your team is running low on credits, your administrator can purchase additional credits or enable Automatic Credit Refills. These add-on prompt credits purchased will rollover to the following usage month if there are any remaining. ### Using Enterprise Plan The Enterprise plan costs \\$60/user/month (up to 200 users) and includes everything in Teams plus: * 1000 prompt credits/user/month * Role-Based Access Control (RBAC) * SSO & SCIM (included) * Longer model context lengths * Highest priority support Additional prompt credits can be purchased at a rate of \\$40 for 1000 pooled credits. Coming soon, Enterprise will be self-serviceable with month-to-month pricing. The Enterprise plan includes self-serve SSO integration and enhanced security features. For enterprise support, account management, and more involved deployments such as Hybrid or FedRAMP under an annual commitment, contact our enterprise team at [trust.windsurf.com](https://trust.windsurf.com) for any standard security collateral. ### Using a Free plan The Free plan comes with: * 25 prompt credits/month * Unlimited Windsurf Tab Windsurf can still be used for free after your credits are exhausted! There are several models available that cost 0 credits to use. When editing code, you'll have access to unlimited Tab completions and AI command instructions. To learn more about features in Free and in paid tiers, [click here](https://codeium.com/pricing). ## Canceling your paid plan To cancel your paid plan, visit the billing website. Upon canceling your paid plan, you'll still have access to all of your credits from your monthly quota and add-on prompt credits until the end of the usage month. After the usage month, all add-on prompt credits will expire and you'll be downgraded to the Free plan where you'll be provided a limited number of prompt credits. If you change your mind and decide not to cancel before the end of the usage month, you can renew your plan by visiting the billing page. # Overview Source: https://docs.windsurf.com/plugins/cascade/cascade-overview Windsurf's Cascade brings the best of agentic coding to the JetBrains suite. To open Cascade, press `Cmd/Ctrl+L` or click the Cascade icon. # Model selection Select your desired model from the selection menu below the Cascade conversation input box. Click below too see the full breakdown of the available models and their availability across different plans, pricing, and their ability to accept image upload. <Card title=\"Models\" icon=\"gear-code\" href=\"/windsurf/models\" horizontal={true}> Model availability in Windsurf. </Card> # Write/Chat Modes Cascade comes in two modes: **Write** and **Chat**. Write mode allows Cascade to create and make modifications to your codebase, while Chat mode is optimized for questions around your codebase or general coding principles. <video autoPlay muted loop playsInline className=\"w-full aspect-video\" src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/jetbrains-cascade-modes.mp4\" /> # Access to Tools Cascade has a variety of tools at its disposal, such as Search, Analyze, [Web Search](/windsurf/web-search), and the [terminal](/windsurf/terminal). It can detect which packages and tools that you're using, which ones need to be installed, and even install them for you. Just ask Cascade how to run your project and press Accept. <Note>Cascade can make up to 25 tool calls per prompt. If the trajectory stops, simply type in `continue` and Cascade will resume from where it left off. Each `continue` will count as a new prompt. </Note> # Revert to previous steps You have the ability to revert changes that Cascade has made if you want to. Simply hover your mouse over the original prompt and click on the revert arrow on the right, or revert directly from the table of contents. This will revert all code changes back to the state of your codebase at the desired step. <Warning>Reverts are currently irreversible, so be careful!</Warning> <video autoPlay controls muted loop playsInline className=\"w-full aspect-video\" src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/cascade-revert.mp4\" /> # Real-time collaboration A unique capability of Cascade is that it is aware of your real-time actions. You no longer necessarily need to prompt with context on your prior actions, as Cascade is already aware. Try making a manual change in the code editor, and then prompt Cascade to \"continue my work\"! # Ignoring files If you'd like Cascade to ignore files, you can add your files to `.codeiumignore` at the root of your workspace. This will prevent Cascade from viewing, editing or creating files inside of the paths designated. You can declare the file paths in a format similar to `.gitignore`. # Model Context Protocol (MCP) Source: https://docs.windsurf.com/plugins/cascade/mcp **MCP (Model Context Protocol)** is a protocol that enables LLMs to access custom tools and services. An MCP client (Cascade, in this case) can make requests to MCP servers to access tools that they provide. Cascade now natively integrates with MCP, allowing you to bring your own selection of MCP servers for Cascade to use. See the [official MCP docs](https://modelcontextprotocol.io/) for more information. <Note>Enterprise users must manually turn this on via settings</Note> ## Adding a new MCP plugin New MCP plugins can be added by going to the `Settings` > `Tools` > `Windsurf Settings` > `Add Server` section. If you cannot find your desired MCP plugin, you can add it manually by clicking `View Raw Config` button and editing the raw `mcp_config.json` file. When you click on an MCP server, simply click `+ Add Server` to expose the server and its tools to Cascade. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/plugins/mcp-server-templates.jpg\" /> </Frame> Cascade supports two [transport types](https://modelcontextprotocol.io/docs/concepts/transports) for MCP servers: `stdio` and `/sse`. For `/sse` servers, the URL should reflect that of the endpoint and resemble `https://<your-server-url>/sse`. <Note>Make sure to press the refresh button after you add a new MCP plugin.</Note> ## mcp\\_config.json The `~/.codeium/mcp_config.json` file is a JSON file that contains a list of servers that Cascade can connect to. The JSON should follow the same schema as the config file for Claude Desktop. Here's an example configuration, which sets up a single server for GitHub: ```json { \"mcpServers\": { \"github\": { \"command\": \"npx\", \"args\": [ \"-y\", \"@modelcontextprotocol/server-github\" ], \"env\": { \"GITHUB_PERSONAL_ACCESS_TOKEN\": \"<YOUR_PERSONAL_ACCESS_TOKEN>\" } } } } ``` It's important to note that for SSE servers, the configuration is slightly different and requires a `serverUrl` field. Here's an example configuration for a SSE server: ```json { \"mcpServers\": { \"figma\": { \"serverUrl\": \"<your-server-url>/sse\" } } } ``` Be sure to provide the required arguments and environment variables for the servers that you want to use. See the [official MCP server reference repository](https://github.com/modelcontextprotocol/servers) or [OpenTools](https://opentools.com/) for some example servers. ## Admin Controls (Teams & Enterprises) Team admins can toggle MCP access for their team, as well as whitelist approved MCP servers for their team to use: <Card title=\"MCP Team Settings\" horizontal={true} icon=\"hammer\" href=\"https://windsurf.com/team/team_settings/windsurf_settings/mcp\"> Configurable MCP settings for your team. </Card> <Warning>The above link will only work if you have admin privileges for your team.</Warning> By default, users within a team will be able to configure their own MCP servers. By whitelisting any MCP servers, admins are electing to configure the entirety of the MCP experience for their team. Once even a single MCP server is whitelisted for the team, all other MCP servers will be blacklisted. To whitelist an MCP server, admins must input the desired `Server ID` and `Server Config (JSON)`. The `Server Config (JSON)` payload inputed here should exactly match the payload that would be inputed into the `mcp_config.json` file. For example: <Tabs> <Tab title=\"Github (stdio)\"> `Server ID` = github-mcp-server ```json { \"command\": \"docker\", \"args\": [ \"run\", \"-i\", \"--rm\", \"-e\", \"GITHUB_PERSONAL_ACCESS_TOKEN\", \"ghcr.io/github/github-mcp-server\" ], \"env\": { \"GITHUB_PERSONAL_ACCESS_TOKEN\": \"\" } } ``` </Tab> <Tab title=\"Custom MCP Server (sse)\"> `Server ID` = custom-mcp-server-sse ```json { \"type\": \"sse\", \"url\": \"http://localhost:8080/sse\", \"headers\": { \"Authorization\": \"none\", \"Content-Type\": \"application/json\", \"VERSION\": \"1.0\" } } ``` </Tab> </Tabs> ## Notes * Since MCP tool calls can invoke code written by arbitrary server implementers, we do not assume liability for MCP tool call failures. To reiterate: * We currently support an MCP server's [tools](https://modelcontextprotocol.io/docs/concepts/tools) and [resources](https://modelcontextprotocol.io/docs/concepts/resources), not [prompts](https://modelcontextprotocol.io/docs/concepts/prompts). # Memories & Rules Source: https://docs.windsurf.com/plugins/cascade/memories `Memories` is the system for sharing and persisting context across conversations. There are two mechanisms for this in Cascade: Memories, which can be automatically generated by Cascade, and rules, which are manually defined by the user at both the local and global levels. ## How to Manage Memories Memories and Rules can be accessed and configured at any time by clicking on the `Customizations` icon in the top right slider menu in Cascade. To edit an existing memory, simply click into it and then click the `Edit` button. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/managing-memories-jb.gif\" /> </Frame> ## Memories During conversation, Cascade can automatically generate and store memories if it encounters context that it believes is useful to remember. Additionally, you can ask Cascade to create a memory at any time. Just prompt Cascade to \"create a memory of ...\". Cascade's autogenerated memories are associated with the workspace that they were created in and Cascade will retrieve them when it believes that they are relevant. Memories generated in one workspace will not be available in another. <Tip>Creating and using auto-generated memories do NOT consume credits</Tip> ## Rules Users can explicitly define their own rules for Cascade to follow. Rules can be defined at either the global level or the workspace level. `global_rules.md` - rules applied across all workspaces `.windsurfrules` - workspace level repo containing rules that are tied to globs or natural language descriptions. To get started with Rules, click on the `Customizations` icon in the top right slider menu in Cascade, then navigate to the `Rules` panel. Here, you can click on the `+ Global` or `+ Workspace` button to create new rules at either the global or workspace level, respectively. <Tip>You can find example rule templates curated by the Windsurf team at [https://windsurf.com/editor/directory](https://windsurf.com/editor/directory) to help you get started.</Tip> Rules files are limited to 12000 characters each. ### Best Practices To help Cascade follow your rules effectively, follow these best practices: * Keep rules simple, concise, and specific. Rules that are too long or vague may confuse Cascade. * There's no need to add generic rules (e.g. \"write good code\"), as these are already baked into Cascade's training data. * Format your rules using bullet points, numbered lists, and markdown. These are easier for Cascade to follow compared to a long paragraph. For example: ``` # Coding Guidelines - My project's programming language is python - Use early returns when possible - Always add documentation when creating new functions and classes ``` * XML tags can be an effective way to communicate and group similar rules together. For example: ``` <coding_guidelines> - My project's programming language is python - Use early returns when possible - Always add documentation when creating new functions and classes </coding_guidelines> ``` # Models Source: https://docs.windsurf.com/plugins/cascade/models In the Cascade panel `Ctrl/⌘ + L`, you can easily switch between different models of your choosing. Depending on the model you select, each of your input prompts will consume a different number of [prompt credits](/plugins/cascade/usage). Under the text input box, you will see a model selection dropdown menu. You will see the following models available: | Model | Prompt credits | Free | Pro/Trial | Teams | Enterprise | Images? | | :--------------------------- | :----------------------------------------------------------------------------------: | :--: | :-----------------: | :---: | :--------: | :-----: | | SWE-1 | 0<sup>1</sup> | ✓ | ✓ | ✓ | ✓ | `true` | | SWE-1-lite | 0 | ✓ | ✓ | ✓ | ✓ | | | GPT-4o | 1 | ✓ | ✓ | ✓ | ✓ | `true` | | GPT-4.1 | 0.25<sup>1</sup> | ✓ | ✓ | ✓ | ✓ | `true` | | o3 | 1 | ✓ | ✓ | ✓ | ✓ | ✓ | | o3 (high reasoning) | 1 | ✓ | ✓ | ✓ | ✓ | ✓ | | o3-mini (medium reasoning) | 1 | | ✓ | ✓ | ✓ | | | o4-mini (medium reasoning) | 0.25<sup>1</sup> | ✓ | ✓ | ✓ | ✓ | `true` | | o4-mini (high reasoning) | 0.25<sup>1</sup> | ✓ | ✓ | ✓ | ✓ | `true` | | Claude 3.5 Sonnet | 1 | 🗝 | ✓ Pro<br />🗝 Trial | ✓ | ✓ | `true` | | Claude 3.7 Sonnet | 1 | 🗝 | ✓ Pro<br />🗝 Trial | ✓ | ✓ | `true` | | Claude 3.7 Sonnet (Thinking) | 1.25 | 🗝 | ✓ Pro<br />🗝 Trial | ✓ | ✓ | `true` | | Claude Sonnet 4 | [🗝](/windsurf/models#bring-your-own-key-byok) or [🪙](/windsurf/models#api-pricing) | 🗝 | 🗝 or 🪙 | 🪙 | 🪙 | `true` | | Claude Sonnet 4 (Thinking) | [🗝](/windsurf/models#bring-your-own-key-byok) or [🪙](/windsurf/models#api-pricing) | 🗝 | 🗝 or 🪙 | 🪙 | 🪙 | `true` | | Claude 4 Opus | [🗝](/windsurf/models#bring-your-own-key-byok) | 🗝 | 🗝 | | | `true` | | Claude 4 Opus (Thinking) | [🗝](/windsurf/models#bring-your-own-key-byok) | 🗝 | 🗝 | | | `true` | | DeepSeek-V3-0324 | 0 | | ✓ | | | | | DeepSeek-R1 | 0.5 | | ✓ | | | | | Gemini 2.0 Flash | 0.25 | | ✓ | ✓ | ✓ | | | Gemini 2.5 Flash | 0.1 | | ✓ | ✓ | ✓ | `true` | | Gemini 2.5 Flash (Thinking) | 0.15 | | ✓ | ✓ | ✓ | `true` | | Gemini 2.5 Pro | 0.75<sup>1</sup> | ✓ | ✓ | ✓ | ✓ | `true` | | xAI Grok-3 | 1 | | ✓ | | | | | xAI Grok-3 mini (Thinking) | 0.125 | | ✓ | | | | <sub>✓ Available via flat credit pricing</sub> <br /> <sub>🗝 Available via [BYOK](/windsurf/models#bring-your-own-key-byok)</sub> <br /> <sub>🪙 Available via [API Pricing](/windsurf/models#api-pricing)</sub> <br /> <sub><sup>1</sup> Promo pricing only available for a limited time</sub> # SWE-1 SWE-1 is our family of in-house frontier models built specifically for software engineering tasks. Based on our internal evals, it has performance nearing that of frontier models from the foundation labs. * SWE-1: High-reasoning, tool-capable, and Cascade-optimized. Claude 3.5-level performance at a fraction of the cost. * <Tooltip tip=\"Built with Qwen\">[SWE-1-lite](https://huggingface.co/Qwen/Qwen2.5-72B-Instruct/blob/main/LICENSE)</Tooltip>: Replaces Cascade Base — faster, better, and free for all. * SWE-1-mini: Powers passive suggestions in Windsurf Tab, optimized for real-time latency. # Bring your own key (BYOK) <Warning>This is only available to free and paid individual users.</Warning> For certain models, we allow users to bring their own API keys. In the model dropdown menu, individual users will see models labled with `BYOK`. Note that this is different from [API Pricing](/windsurf/models#api-pricing). To input your API key, navigate to [this page](https://windsurf.com/subscription/provider-api-keys) in the subscription settings and add your key. If you have not configured your API key, it will return an error if you try to use the BYOK model. Currently, we only support BYOK for these models: * `Claude 4 Sonnet` * `Claude 4 Sonnet (Thinking)` * `Claude 4 Opus` * `Claude 4 Opus (Thinking)` # API Pricing Unlike flat rate pricing, where a fixed number of credits are used for each user prompt, API pricing charges a fixed number of credits per token processed (i.e. proportional to compute). The number of credits per token processed is variable based on the model selected. Both API pricing and flat rate pricing consume the same pool of credits. Models with API pricing are clearly marked in the model selector. We charge the model’s API price plus a 20% margin. Each credit corresponds to \\$0.04. <Note>We utilize the same tokenizers as the model providers (Anthropic’s for Claude models, OpenAI’s for GPT models, etc) to ensure accurate and consistent token counting and pricing. View [OpenAI's tokenizer demo](https://platform.openai.com/tokenizer)</Note> API pricing charges for all tokens processed from your prompts, automatically retrieved context, tool calls, past conversation history, etc. Since token processing costs from model providers differ between input and output tokens, cached or non-cached, the number of credits consumed for the same overall number of tokens can differ given different distributions of these token types. Reasoning tokens from \"thinking\" models are charged as output tokens. Windsurf balances the context length with costs for prompt cache reads by summarizing the conversation when it gets too long; the resulting summary would be charged as non-cache input tokens. Fractional credit usage is rounded up to the nearest hundredth of a credit. Note that API pricing is separate from [BYOK](/windsurf/models#bring-your-own-key-byok) (bring-your-own-key). With BYOK all usage goes through your own API key, so Windsurf does not charge any credits. Here is the pricing for models that are available via API pricing in various plans: | Model | Plans with API Pricing | Input Tokens (Credits / Million Tokens)<sup>1</sup> | Cache Read Tokens (Credits / Million Tokens)<sup>2</sup> | Output Tokens (Credits / Million Tokens) | | :------------------------- | :------------------------------------------------------------------------------------- | :-------------------------------------------------: | :------------------------------------------------------: | :--------------------------------------: | | Claude Sonnet 4 | - Pro <br /> - Teams <br /> - Enterprise (contracted) <br /> - Enterprise (self-serve) | 90 | 9 | 450 | | Claude Sonnet 4 (Thinking) | - Pro <br /> - Teams <br /> - Enterprise (contracted) <br /> - Enterprise (self-serve) | 90 | 9 | 450 | <sub><sup>1</sup> For Anthropic models, prompt cache writes cost an extra 25% compared to uncached input. Most input tokens into Windsurf are written into the prompt cache for subsequent steps. Output tokens are written into the prompt cache for no extra cost. See Anthropic's API pricing for details.</sub> <br /> <sub><sup>2</sup> The prompt cache has a limited TTL (time-to-live) determined by the model provider (eg. approximately 5 minutes on Anthropic). Even within the TTL, the prompt cache is not guaranteed to hit. Prompt cache misses are charged as input tokens.</sub> ### Example Conversation To show how API pricing works in practice, let us walk through an example conversation with Cascade using Claude Sonnet 4 directly. | Role | Message | Tokens | Note | Cost per message | | :---------- | :------------------------------------------------------------------------------------------- | :------- | :------------------------------------------------------------------------------------- | :---------------- | | User | Refactor @my\\_function | 20k | Input (cache write). Note: Incl. full shared timeline, editor context & system prompt. | 2.25 Credits | | Windsurf | Let me first analyze my\\_function to come up with a plan to refactor it. | 1k | Output tokens. | 0.45 Credits | | `tool_call` | Analyze my\\_function | 23k | Input (cache read) + Input (cache write). | 0.42 Credits | | Windsurf | Here is a plan to refactor my\\_function \\[...] do you want me to continue with implementing? | 2k | Output tokens. | 0.90 Credits | | User | Yes, continue. | 46k | Input (cache read) + Input (cache write). | 0.52 Credits | | `tool_call` | Edit foo.py | 50k | Input (cache read) + Output tokens. | 2.22 Credits | | `tool_call` | Add bar.py | 56k | Input (cache read) + Output tokens. | 3.15 Credits | | Windsurf | I am done refactoring my\\_function. Here is a summary of my changes: \\[...] | 2k | Output tokens. | 0.90 Credits | | **Total** | | **200k** | | **10.81 Credits** | # Web and Docs Search Source: https://docs.windsurf.com/plugins/cascade/web-search Cascade can now intuitively parse through and chunk up web pages and documentation, providing realtime context to the models. The key way to understand this feature is that Cascade will browse the Internet as a human would. Our web tools are designed in such a way that gets only the information that is necessary in order to efficiently use your credits. ## Overview To help you better understand how Web Search works, we've recorded a short video covering the key concepts and best practices. <iframe width=\"560\" height=\"315\" src=\"https://www.youtube.com/embed/moIySJ4d0UY\" title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen /> ### Quick Start The fastest way to get started is to activate web search in your Windsurf Settings in the bottom right corner of the editor. You can activate it a couple of different ways: 1. Ask a question that probably needs the Internet (ie. \"What's new in the latest version of React?\"). 2. Use `@web` to force a docs search. 3. Use `@docs` to query over a list of docs that we are confident we can read with high quality. 4. Paste a URL into your message. ## Search the web Cascade can deduce that certain prompts from the user may require a real-time web search to provide the optimal response. In these cases, Cascade will perform a web search and provide the results to the user. This can happen automatically or manually using the `@web` mention. <Frame style={{ border: \"none\", background: \"none\" }}> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/cascade-search-web.png\" /> </Frame> ## Reading Pages Cascade can read individual pages for things like documentation, blog posts, and GitHub files. The page reads happen entirely on your device within your network so if you're using a VPN you shouldn't have any problems. Pages are picked up either from web search results, inferred based on the conversation, or from URLs pasted directly into your message. We break pages up into multiple chunks, very similar to how a human would read a page: for a long page we skim to the section we want then read the text that's relevant. This is how Cascade operates as well. <Frame style={{ border: \"none\", background: \"none\" }}> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/windsurf/cascade/cascade-parse-url.png\" /> </Frame> It's worth noting that not all pages can be parsed. We are actively working on improving the quality of our website reading. If you have specific sites you'd like us to handle better, feel free to file a feature request! # Compatibility Source: https://docs.windsurf.com/plugins/compatibility Visit our [download page](https://windsurf.com/download) for a list of supported IDEs and installation instructions. If you are a Windsurf Enterprise user, visit your enterprise portal URL for download and installation instructions. Contact your internal Windsurf administrator if you have questions. # Supported IDEs and Versions **VS Code**: Version 1.89+ **JetBrains IDEs**: Version 2022.3+ Note: JetBrains IDEs with remote SSH support require versions 2023.3+. **Visual Studio**: 17.5.5+ **NeoVim**: Version 0.6+ **Vim**: 9.0.0185+ **Emacs**: All versions compiled with lbxml **Xcode**: All versions **Sublime Text**: Version 3+ **Eclipse**: Version 4.25+ (2022-09+) # Getting Started Source: https://docs.windsurf.com/plugins/getting-started Welcome to Windsurf **Windsurf** is an AI toolkit that empowers developers to dream bigger and write more code using tools like Cascade, Autocomplete, Chat, Command, and more. Our models and features have been optimized to build a deep understanding of your codebase in order to provide the highest quality code suggestions. ## Plugin Set Up Our plugins for Visual Studio Code and JetBrains are our most popular plugins. The installation steps for these two are given below. For other IDEs and editors like Eclipse, Visual Studio, Neovim, Google Colab, and more, visit [our download page](https://windsurf.com/download) to get started. <Note> These steps do not apply for enterprises on a self-hosted plan. If you are an enterprise user, please refer to the instructions in your enterprise portal. </Note> <Tabs> <Tab title=\"JetBrains\"> <Steps> <Step title=\"Install Plugin\"> Open the `Plugins` menu in your JetBrains IDE. The shortcut for this is `⌘+,` on Mac and `Ctrl+,` on Linux/Windows. It is also accessible from the settings menu. Search for the Windsurf plugin, and install it. The plugin loader will prompt you to restart the IDE. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/jetbrains_plugin_install.png\" /> </Frame> </Step> <Step title=\"Authorize\"> Open a project. Windsurf should prompt you to log in with a notification popup at the bottom right linking you to an online login page. Equivalently, click the widget at the right of the bottom status bar and select the login option there. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/jetbrains_login_widget.png\" /> </Frame> If you do not have an account or otherwise are not already logged in online, you will be prompted to login. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/login_prompt_webpage.png\" /> </Frame> Once you have logged in online, the webpage will indicate that you can return to your IDE. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/login_successful_webpage.png\" /> </Frame> </Step> <Step title=\"Wait for Language Server\"> Upon successful login, Windsurf will begin downloading a language server. This is the program that communicates with our APIs to let you use Windsurf's AI features. The download usually takes ten to twenty seconds, but the download speed may depend on your internet connection. In the meantime, you are free to use your IDE as usual. You should see a notification on the bottom right to indicate the progress of the download. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/jetbrains_ls_download_bar.png\" /> </Frame> </Step> <Step title=\"All Done!\"> You can now enjoy Windsurf's rich AI featureset: Autocomplete, Chat, Command, and more. At any point, you can check your status by clicking the status bar widget at the bottom right. If logged in, you will have access to your Windsurf settings and other controls. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/jetbrains_status_bar.png\" /> </Frame> </Step> </Steps> </Tab> <Tab title=\"Visual Studio Code\"> <Steps> <Step title=\"Install Plugin\"> Find the Windsurf Plugin (formerly Codeium) in the VS Code Marketplace and install it. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/vscode_extension_page.png\" /> </Frame> </Step> <Step title=\"Authorize\"> After installation, VS Code with prompt you with a notification in the bottom right corner to log in to Windsurf. Equivalently, you can log in to Windsurf via the profile icon at the bottom of the left sidebar. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/vscode_login_init_left.png\" /> </Frame> <Note>If you get an error message indicating that the browser cannot open a link from Visual Studio Code, you may need to update your browser and restart the authorization flow.</Note> If you do not have an account or otherwise are not already logged in online, you will be prompted to create an account or login. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/login_prompt_webpage.png\" /> </Frame> Once you sign in, you will be redirected back to Visual Studio Code via pop-up. <Note>If you are using a browser-based VS Code IDE like GitPod or Codespaces, you will be routed to instructions on how to complete authentication by providing an access token.</Note> </Step> <Step title=\"Wait for Language Server\"> Once you are signed in, Windsurf will start downloading a language server. This is the program that communicates with our APIs to let you use Windsurf's AI features. The download usually takes ten to twenty seconds, but the download speed may depend on your internet connection. In the meantime, you are free to use VS Code as usual. </Step> <Step title=\"All Done!\"> You can now enjoy Windsurf's rich AI featureset: Autocomplete, Chat, Command, and more. </Step> </Steps> </Tab> <Tab title=\"Vim / Neovim\"> ## Extension Installation <Steps> <Step title=\"Install Plugin\"> Follow the **Get Started** instructions in the public [`codeium.vim` repo](https://github.com/Exafunction/codeium.vim). That’s it! </Step> </Steps> ## Using Windsurf Plugin <Steps> <Step title=\"Setup\"> While Windsurf supports many languages, we’ll demonstrate with Python. Create a new file `test.py`. </Step> <Step title=\"From Code\"> Windsurf can suggest multiple lines of code from a partial function header: <CodeSnippet language=\"python\"> {`def fib(n):`} </CodeSnippet> <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/vim_tutorial/snippet_one.png\" alt=\"Snippet one\" /> </Frame> </Step> <Step title=\"Accept Suggestion\"> Press **Tab** to accept. </Step> <Step title=\"From Comments\"> Windsurf also understands comments: <CodeSnippet language=\"python\"> {`# Nth Fibonacci number\\ndef `} </CodeSnippet> <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/vim_tutorial/snippet_two.png\" alt=\"Snippet two\" /> </Frame> </Step> </Steps> </Tab> <Tab title=\"Visual Studio\"> ## Extension Installation <Steps> <Step title=\"Open Extension Marketplace\"> In the Visual Studio menu bar, click **Extensions → Manage Extensions**. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/visual_studio_tutorial/manage_extensions.png\" alt=\"Manage Extensions\" /> </Frame> </Step> <Step title=\"Install Windsurf Plugin\"> In **Manage Extensions**, click **Visual Studio Marketplace**, search for **Windsurf**, then click **Download**. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/visual_studio_tutorial/install.png\" alt=\"Install plugin\" /> </Frame> </Step> <Step title=\"Relaunch Visual Studio\"> Close the window and relaunch Visual Studio. </Step> <Step title=\"Sign in to Windsurf Plugin\"> Open or create a project. A browser window will open and prompt you to sign in. </Step> <Step title=\"Create Account\"> If you don’t have an account yet, you’ll be redirected to create one. </Step> <Step title=\"All Done!\"> After signing in, you’ll be automatically logged in to Windsurf Plugin in Visual Studio. </Step> </Steps> ## Using Windsurf Plugin <Steps> <Step title=\"Setup\"> While Windsurf supports many languages, we’ll demonstrate with C#. Create or open a C# file. </Step> <Step title=\"From Code\"> Windsurf can suggest multiple lines of code from a partial function signature: <CodeSnippet language=\"c#\"> {`using System;\\n\\npublic class Class1\\n{\\n public Class1()\\n {\\n int CalculateNthFibonacciNumber(int n)\\n }\\n}`} </CodeSnippet> <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/visual_studio_tutorial/suggestion.png\" alt=\"Suggestion example\" /> </Frame> </Step> <Step title=\"Accept Suggestion\"> Press **Tab** to accept. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/visual_studio_tutorial/post_accept.png\" alt=\"After accept\" /> </Frame> </Step> </Steps> </Tab> <Tab title=\"Jupyter Notebook\"> ## Install Windsurf Plugin <Steps> <Step title=\"Install Jupyter Extension\"> Open a new Jupyter Lab session. In a cell, paste and run (<kbd>Shift</kbd>+<kbd>Enter</kbd>) the following: <CodeSnippet language=\"python\"> {`import sys\\n!{sys.executable} -m pip install -U pip --user\\n!{sys.executable} -m pip install -U codeium-jupyter --user`} </CodeSnippet> <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/jupyter_tutorial/install_commands.png\" alt=\"Install commands\" /> </Frame> If you’re inside a virtual environment, run: <CodeSnippet language=\"python\"> {`import sys\\n!{sys.executable} -m pip install -U pip\\n!{sys.executable} -m pip install -U codeium-jupyter`} </CodeSnippet> When the commands finish, close the notebook and stop the Jupyter server. </Step> <Step title=\"Launch Jupyter\"> Relaunch Jupyter and open a notebook. Open the settings (<kbd>Ctrl</kbd> + <kbd>,</kbd>) and navigate to the **Windsurf** section. You’ll see fields for an enterprise URL and a token. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/jupyter_tutorial/codeium_settings.png\" alt=\"Settings UI\" /> </Frame> Click **Get Windsurf Authentication Token** and follow the link. Paste the token back into the settings dialog. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/jupyter_tutorial/settings_menu.png\" alt=\"Settings menu\" /> </Frame> <Note>If you can’t find the Windsurf settings, you likely didn’t restart Jupyter. Stop the server (Ctrl+C) and start it again with <code>jupyter lab</code>.</Note> </Step> <Step title=\"Create Account\"> If you don’t have a Windsurf account, you’ll be prompted to create one. </Step> <Step title=\"Authenticate\"> After signing in, copy the token and paste it into the settings dialog. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/jupyter_tutorial/auth_token_setting.png\" alt=\"Auth token field\" /> </Frame> </Step> <Step title=\"All Done!\"> You’re all set to use Windsurf Plugin in Jupyter! </Step> </Steps> ## Using Windsurf Plugin <Steps> <Step title=\"From Code\"> Windsurf can suggest multiple lines of code from a partial function header: <CodeSnippet language=\"python\"> {`def fib(n):`} </CodeSnippet> <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/jupyter_tutorial/snippet_one.png\" alt=\"Snippet one\" /> </Frame> </Step> <Step title=\"Accept Suggestion\">Press **Tab** to accept.</Step> <Step title=\"From Comments\"> Windsurf also understands comments: <CodeSnippet language=\"python\"> {`# Nth Fibonacci number\\ndef `} </CodeSnippet> <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/jupyter_tutorial/snippet_two.png\" alt=\"Snippet two\" /> </Frame> </Step> </Steps> </Tab> <Tab title=\"Chrome\"> ## Install Windsurf <Steps> <Step title=\"Install Chrome Extension\"> Visit the [Chrome Web Store page](https://chrome.google.com/webstore/detail/codeium/hobjkcpmjhlegmobgonaagepfckjkceh) and click **Add to Chrome**. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/chrome_tutorial/chrome_web_store.png\" alt=\"Chrome Web Store\" /> </Frame> </Step> <Step title=\"Pin Extension\"> Open the extensions dropdown and click the **Pin** icon so the Windsurf icon stays visible. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/chrome_tutorial/pin_extension.png\" alt=\"Pin extension\" /> </Frame> </Step> <Step title=\"Sign In\"> The extension opens a sign-in page automatically. If not, click the extension icon and follow the link. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/chrome_tutorial/sign_in.png\" alt=\"Sign in\" /> </Frame> </Step> <Step title=\"All Done!\"> After signing in, the icon turns normal and you’re ready to code. Try [creating a new Colab notebook](https://colab.research.google.com/#create=true). <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/chrome_tutorial/signed_in.png\" alt=\"Signed in\" /> </Frame> </Step> </Steps> ## Using Windsurf <Steps> <Step title=\"From Code\"> Windsurf can suggest multiple lines of code from a partial function header: <CodeSnippet language=\"python\"> {`def fib(n):`} </CodeSnippet> <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/chrome_tutorial/snippet_one.png\" alt=\"Snippet one\" /> </Frame> </Step> <Step title=\"Accept Suggestion\">Press **Tab** to accept.</Step> <Step title=\"From Comments\"> Windsurf also understands comments: <CodeSnippet language=\"python\"> {`# Nth Fibonacci number\\ndef `} </CodeSnippet> <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/chrome_tutorial/snippet_two.png\" alt=\"Snippet two\" /> </Frame> </Step> </Steps> </Tab> <Tab title=\"Eclipse\"> ## Extension Installation <Steps> <Step title=\"Drag the Install button\"> Visit the [Windsurf Plugin page on Eclipse Marketplace](https://marketplace.eclipse.org/content/codeium) and drag the **Install** button to the Eclipse toolbar. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/eclipse_tutorial/drag.png\" alt=\"Drag Install button\" /> </Frame> </Step> <Step title=\"Confirm Selected Features\"> In the **Confirm Selected Features** prompt, click **Confirm**. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/eclipse_tutorial/confirm.png\" alt=\"Confirm features\" /> </Frame> </Step> <Step title=\"Trust Unsigned Content\"> In the **Trust Artifacts** prompt, select **Unsigned** and click **Trust**. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/eclipse_tutorial/trust.png\" alt=\"Trust unsigned\" /> </Frame> </Step> <Step title=\"Restart Eclipse\"> When prompted, restart Eclipse to complete the installation. <Frame> <img src=\"https://mintlify.s3.us-west-1.amazonaws.com/codeium/assets/eclipse_tutorial/restart.png\" alt=\"Restart Eclipse\" /> </Frame> </Step> <Step title=\"Create / Sign In\"> When the browser opens, sign in or create a Windsurf account, then return to Eclipse. </Step> <Step title=\"All Done!\">You’re ready to use Windsurf in Eclipse.</Step> </Steps> ## Using Windsurf <Steps> <Step title=\"Setup\"> While Windsurf supports many languages, we’ll demonstrate with Java. Create a new file `Fib.java`. </Step> <Step title=\"From Code\"> Windsurf can suggest multiple lines of code from a partial function header: <CodeSnippet language=\"java\"> {`package test;\\n\\npublic class Fib {\\n\\n public int fib(int n) {\\n }\\n\\n}`} </CodeSnippet> </Step> <Step title=\"Accept Suggestion\">Press **Tab** to accept.</Step> </Steps> </Tab> </Tabs> # Reporting Security Concerns Source: https://docs.windsurf.com/security/reporting Windsurf takes the security of our products and services seriously. If you believe you have found a security vulnerability in any Windsurf-owned services, please report it to us as described below. ## Reporting Security Issues **Please do not report security vulnerabilities through public GitHub issues.** Instead, please report them via email to [security@windsurf.com](mailto:security@windsurf.com) Please include the following information in your report including a