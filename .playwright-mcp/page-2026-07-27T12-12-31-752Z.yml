                        - generic [ref=f74e292]:
                          - generic [ref=f74e293]:
                            - paragraph [ref=f74e294]: Thanks for the detailed report, and sorry for the frustration. Two things are combining here.
                            - paragraph [ref=f74e295]: 1. The window is smaller than 1M unless Max Mode is on**.** The 1M figure only applies when you select Max Mode plus the 1M context variant in the model picker. Otherwise frontier models run on their standard window (200k-300k tokens), and Composer 2.5 runs on 200k token context window. Summarization fires near the top of whatever window is active, so it’s not possible to use, for example, 199k tokens in practice on Composer 2.5 because self-summarization will fire before that.
                            - paragraph [ref=f74e296]: "2. The bigger driver: searches are pulling in huge amounts of output. Looking at your recent sessions, the context is filling from tool output, not documents. Several searches walked environment and library folders (for example conda/miniforge environments and Python virtualenvs) and a single search returned over a million characters. One result like that fills a large chunk of the window in one step, which is why usage jumps to 50% “within seconds” and the agent then summarizes and seems to forget."
                            - paragraph [ref=f74e297]:
                              - text: The change that helps most is keeping those folders out of search. Add a
                              - code [ref=f74e298]: .cursorignore
                              - text: "at your project root, for example:"
                            - code [ref=f74e301]: "**/miniforge/** **/miniconda/** **/.venv*/** **/venv/** **/node_modules/** **/build/** **/*.so"
                            - paragraph [ref=f74e302]: "You can also have the UI build your .cursorignore for you by going to Cursor Settings → Indexing and Docs and then Editing the list here:"
                            - paragraph
                            - link "Screenshot 2026-06-22 at 5.10.50 PM Screenshot 2026-06-22 at 5.10.50 PM 2036×158 12.4 KB" [ref=f74e304] [cursor=pointer]:
                              - /url: https://us1.discourse-cdn.com/cursor1/original/3X/7/e/7ef039a1b4c22521424a29853205eebb54f84dcf.png
                              - img "Screenshot 2026-06-22 at 5.10.50 PM" [ref=f74e305]
                              - generic [ref=f74e306]:
                                - generic [ref=f74e308]: Screenshot 2026-06-22 at 5.10.50 PM
                                - generic [ref=f74e309]: 2036×158 12.4 KB
                            - paragraph
                            - paragraph [ref=f74e311]:
                              - text: Try the
                              - code [ref=f74e312]: .cursorignore
                              - text: first, since it’s almost certainly the largest contributor.
