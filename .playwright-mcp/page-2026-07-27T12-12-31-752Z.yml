                              - text: Where does the bug appear (feature/product)?
                            - paragraph [ref=f74e234]: Cursor IDE
                            - heading "Heading linkDescribe the Bug" [level=3] [ref=f74e235]:
                              - link "Heading link":
                                - /url: "#p-431692-describe-the-bug-2"
                              - text: Describe the Bug
                            - paragraph [ref=f74e236]: "ultra user here: every time I try loading any model, give it a prompt, and have it execute on the prompt, agent is only able to get past ~10% of context window before summarizing context (in the case of using GPT 5.5, context usage explodes to 50% of total window despite not having analyzed any bulky docs, and this burns API tokens), seemingly forgetting what it just read, and then it gets stuck in this loop. have tried with several different frontier models + composer 2.5 + plan/agent/debug/multi-task mode. is this a widespread issue or any experience with this issue?"
                            - heading "Heading linkSteps to Reproduce" [level=3] [ref=f74e237]:
                              - link "Heading link":
                                - /url: "#p-431692-steps-to-reproduce-3"
                              - text: Steps to Reproduce
                            - paragraph [ref=f74e238]: on any new conversation, this bug will arise once roughly ~20% context has been reached.
                            - heading "Heading linkExpected Behavior" [level=3] [ref=f74e239]:
                              - link "Heading link":
                                - /url: "#p-431692-expected-behavior-4"
                              - text: Expected Behavior
                            - paragraph [ref=f74e240]: We want to be able to reach full context window usage + not catastrophically forgetting prior context after “summarizing chat context” fires + no context explosions with frontier models.
                            - heading "Heading linkScreenshots / Screen Recordings" [level=3] [ref=f74e241]:
