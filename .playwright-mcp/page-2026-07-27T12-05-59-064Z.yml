        - generic [ref=f30e48]:
          - time [ref=f30e50]: Mar 17, 2026
          - heading "Training Composer for longer horizons" [level=1] [ref=f30e51]
          - generic [ref=f30e60]:
            - text: Federico Cassano & Sasha Rush
            - generic [ref=f30e61]: · 7 min read
        - generic [ref=f30e67]:
          - navigation [ref=f30e68]:
            - button [expanded] [ref=f30e69]:
              - heading "Table of Contents" [level=3] [ref=f30e70]
              - generic [ref=f30e71]: ↑
            - list [ref=f30e73]:
              - listitem [ref=f30e74]:
                - link "The limits of compaction techniques" [ref=f30e75] [cursor=pointer]:
                  - /url: "#the-limits-of-compaction-techniques"
              - listitem [ref=f30e76]:
                - link "Self-summarization as a trained behavior" [ref=f30e77] [cursor=pointer]:
                  - /url: "#self-summarization-as-a-trained-behavior"
              - listitem [ref=f30e78]:
                - link "Token-efficient compaction" [ref=f30e79] [cursor=pointer]:
                  - /url: "#token-efficient-compaction"
              - listitem [ref=f30e80]:
                - link "Solving hard problems" [ref=f30e81] [cursor=pointer]:
                  - /url: "#solving-hard-problems"
              - listitem [ref=f30e82]:
                - link "Toward a long-horizon future" [ref=f30e83] [cursor=pointer]:
                  - /url: "#toward-a-long-horizon-future"
          - generic [ref=f30e84]:
            - paragraph [ref=f30e85]: We train Composer for long-horizon tasks through a reinforcement learning process called self-summarization. By making self-summarization part of Composer's training, we can get training signal from trajectories much longer than the model's max context window. This translates into Composer being able to learn to work on challenging coding tasks requiring hundreds of actions.
            - heading [level=2] [ref=f30e86]:
              - link "Link to this section" [ref=f30e87] [cursor=pointer]:
                - /url: "#the-limits-of-compaction-techniques"
                - text: "#"
              - text: The limits of compaction techniques
            - paragraph [ref=f30e88]:
              - text: In
              - link "CursorBench" [ref=f30e89] [cursor=pointer]:
                - /url: https://cursor.com/blog/cursorbench
              - text: ", our internal benchmark suite, we observe that better performance on challenging real-world coding tasks is directly correlated with more thinking and codebase exploration. As users work with agents to take on harder and more ambitious tasks, we expect the returns on thinking and exploration to increase further."
            - paragraph [ref=f30e90]: A primary challenge, though, is that agent trajectories are expanding faster than the context length of models. Many agent harnesses attempt to get around this by using compaction as an intermediate step in the agent's workflow. When an agent hits its context limit, the harness transforms the context to a shorter length and continues the agent's generation where it left off.
            - paragraph [ref=f30e91]:
              - text: "In practice, compaction is typically handled by the harness in one of two ways: either in text space through a prompted summarization model, or through a sliding context window where the model drops older context. Researchers have also begun to explore compaction methods in"
              - link "latent" [ref=f30e92] [cursor=pointer]:
                - /url: https://arxiv.org/abs/2602.16284
              - link "space" [ref=f30e93] [cursor=pointer]:
                - /url: https://arxiv.org/abs/2506.06266
              - text: ", where the model remembers context as vectors rather than text, although currently these approaches are much slower than text-based methods."
            - paragraph [ref=f30e94]: These approaches to compaction share the downside that they can cause the model to forget critical information from the context, reducing its efficacy as it advances through long-running tasks.
            - heading [level=2] [ref=f30e95]:
              - link "Link to this section" [ref=f30e96] [cursor=pointer]:
                - /url: "#self-summarization-as-a-trained-behavior"
                - text: "#"
              - text: Self-summarization as a trained behavior
            - figure [ref=f30e97]:
              - img "Self-summarization diagram showing the compaction-in-the-loop training process" [ref=f30e99]
            - paragraph [ref=f30e100]: Composer is a specialized model designed for agentic coding and trained through reinforcement learning in the Cursor agent harness. This enables it to be trained with compaction-in-the-loop, improving its ability to determine the most critical information to summarize and preserve.
            - paragraph [ref=f30e101]: "As Composer works through a task, it approaches a fixed context-length trigger, where it pauses to summarize its own context before continuing. More precisely, the self-summarization process works like this:"
            - list [ref=f30e102]:
              - listitem [ref=f30e103]:
                - paragraph [ref=f30e104]: Composer generates from a prompt until a fixed token-length trigger is reached.
              - listitem [ref=f30e105]:
                - paragraph [ref=f30e106]: We insert a synthetic query asking the model to summarize the current context.
              - listitem [ref=f30e107]:
                - paragraph [ref=f30e108]: The model is given scratch space to think about the best summary and then generates a condensed context.
              - listitem [ref=f30e109]:
                - paragraph [ref=f30e110]: Composer loops back to step 1 with the condensed context, which includes the summary plus conversation state (plan state, remaining tasks, number of prior summarizations, etc).
            - paragraph [ref=f30e111]: To enable Composer to do this well at inference time, we incorporate the same summarization procedure into training. Each training rollout can involve multiple generations chained together by summaries, rather than a single prompt–response pair. This means the self-summaries themselves are part of what gets rewarded.
            - paragraph [ref=f30e112]: From a technical perspective, this does not require significant changes to training. We use the final reward for all tokens produced by the model in the chain. This upweights both the agent responses in good trajectories, and also the self-summarizations that made them work. At the same time, poor summaries that lost critical information are downweighted. As Composer trains, it learns to use this self-summary process to build longer context. For hard examples, it often self-summarizes multiple times.
            - heading [level=2] [ref=f30e113]:
              - link "Link to this section" [ref=f30e114] [cursor=pointer]:
                - /url: "#token-efficient-compaction"
                - text: "#"
              - text: Token-efficient compaction
            - paragraph [ref=f30e115]: To test self-summarization, we compare it with a highly tuned prompt-based compaction baseline. We study the problem on a set of hard software engineering tasks while varying the compaction trigger.
            - paragraph [ref=f30e116]: In the baseline compaction approach, the summarization prompt is thousands of tokens and includes nearly a dozen carefully worded sections describing the content that should be preserved in summary. The output compacted context is also on average more than 5,000 tokens and contains many structured sections describing critical information from the context.
            - paragraph [ref=f30e117]: In contrast, since Composer is trained to self-summarize, it requires a very short prompt which contains not much more content than, "Please summarize the conversation". The summaries it outputs are on average only around 1,000 tokens since it learns contextually to decide on the high-value information to retain.
            - paragraph [ref=f30e118]: We test Composer in two context-constrained test environments to measure the impact of self-summary, one with an 80k token trigger and another with a 40k trigger (meaning more frequent summaries). In both scenarios, self-summary produces significantly better results on CursorBench with much more token-efficient compactions. Self-summary consistently reduces the error from compaction by 50%, even compared to the targeted baseline approach, while using one-fifth of the tokens and reusing the KV cache (the stored intermediate computations from prior tokens).
            - figure [ref=f30e119]:
              - img "Self-summarization chart showing CursorBench performance" [ref=f30e121]
            - heading [level=2] [ref=f30e122]:
              - link "Link to this section" [ref=f30e123] [cursor=pointer]:
                - /url: "#solving-hard-problems"
                - text: "#"
              - text: Solving hard problems
            - paragraph [ref=f30e124]:
              - text: The larger promise of compaction is to allow models to one-shot hard problems that require long reasoning chains. In our current training of Composer 2, we often see this happen. As a case study, we consider a problem from Terminal-Bench 2.0 known as
              - link [ref=f30e125] [cursor=pointer]:
                - /url: https://www.tbench.ai/benchmarks/terminal-bench-2/make-doom-for-mips
                - strong [ref=f30e126]: make-doom-for-mips
              - text: ". The problem is as concise as it is challenging:"
            - blockquote [ref=f30e127]:
              - paragraph [ref=f30e128]: I have provided /app/doomgeneric/, the source code to doom. I've also wrote a special doomgeneric_img.c that I want you to use which will write each drawn frame to /tmp/frame.bmp. I've finally provided vm.js that will expect a file called doomgeneric_mips and will run it. Please figure out the rest…
            - paragraph [ref=f30e129]: While easy enough to describe, this problem is challenging enough that several powerful models are unable to get it correct in the official reported numbers.
            - paragraph [ref=f30e130]: "When testing an early research checkpoint of Composer, we found that it was able to solve this problem correctly. The solution required engineering and testing a significant amount of code, as well as exploring some alternative implementations. Here's an image rendered in the course of solving the problem:"
            - figure [ref=f30e131]:
              - img "Terminal Bench V2 make-doom-for-mips problem" [ref=f30e133]
            - paragraph [ref=f30e134]: "All in all, Composer worked for 170 turns to find an exact solution, along the way creating self-summaries in a compact, human-readable and structured form. It self-summarized more than 100,000 tokens down to the 1,000 it believed would most help it solve the problem:"
            - generic [ref=f30e136]:
              - heading [level=3] [ref=f30e137]:
                - button [ref=f30e138] [cursor=pointer]:
                  - text: Composer's self-summary
                  - generic [ref=f30e139]: ↓
              - region "Composer's self-summary"
            - heading [level=2] [ref=f30e141]:
              - link "Link to this section" [ref=f30e142] [cursor=pointer]:
                - /url: "#toward-a-long-horizon-future"
                - text: "#"
              - text: Toward a long-horizon future
            - paragraph [ref=f30e143]: By folding compaction into the training loop, Composer learns an explicit mechanism for efficiently carrying critical information forward, and becomes more capable at challenging tasks. Our work on self-summarization is a step toward our broader goal of training Composer over even longer, more complex processes such as multi-agent coordination. We continue to see better model training as improving the scope and intelligence of these agentic systems.
            - paragraph [ref=f30e144]: We'll also be sharing more about the next version of Composer shortly. ■
          - generic [ref=f30e145]:
