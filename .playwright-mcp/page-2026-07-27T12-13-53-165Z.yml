                - text: Custom slash commands
              - paragraph [ref=f76e54]:
                - text: You can now create reusable prompts and quickly share them with your team.
                - link "Commands" [ref=f76e55] [cursor=pointer]:
                  - /url: https://cursor.com/docs/agent/chat/commands
                - text: are stored in
                - code [ref=f76e56]: .cursor/commands/[command].md
                - text: . Run them by typing
                - code [ref=f76e57]: /
                - text: in the Agent input and selecting the command from the dropdown menu.
              - paragraph [ref=f76e58]: We've been using them for running linters, fixing compile errors, and creating PRs with detailed descriptions and conventional commits.
              - figure [ref=f76e59]
              - heading [level=3] [ref=f76e62]:
                - link "Link to this section" [ref=f76e63] [cursor=pointer]:
                  - /url: "#summarization-triggers"
                  - text: "#"
                - text: Summarization triggers
              - paragraph [ref=f76e64]:
                - text: Cursor automatically summarizes long conversation for you when reaching the context window limit. You can now summarize context on-demand with the
                - code [ref=f76e65]: /summarize
                - text: slash command. This can be useful when you don't want to create a new chat, but want to free up space in the context window.
              - figure [ref=f76e66]
              - heading [level=3] [ref=f76e69]:
                - link "Link to this section" [ref=f76e70] [cursor=pointer]:
                  - /url: "#mcp-resources-support"
                  - text: "#"
                - text: MCP Resources support
              - paragraph [ref=f76e71]:
                - text: We've added support for MCP Resources.
                - link "Resources" [ref=f76e72] [cursor=pointer]:
                  - /url: https://modelcontextprotocol.io/specification/2025-06-18/server/resources
                - text: allow servers to share data that provides context to language models, such as files, database schemas, or application-specific information.
              - paragraph [ref=f76e73]: Additionally, interpolated variables are now supported for MCP. This enables using environment variables in strings when defining configuration for MCP servers.
              - figure [ref=f76e74]
              - heading [level=3] [ref=f76e76]:
                - link "Link to this section" [ref=f76e77] [cursor=pointer]:
                  - /url: "#improved-terminal-for-agent"
                  - text: "#"
                - text: Improved terminal for Agent
              - paragraph [ref=f76e78]: When Agent decides to create a terminal to run shell commands, we've dramatically improved the stability and reliability of the environment.
              - paragraph [ref=f76e79]: This solves known issues around terminal commands hanging and not properly exiting when completing tasks, as well as improving the SSH experience.
              - paragraph [ref=f76e80]: We've also polished the terminal UI, made it faster to run, and added OS notifications when shell commands require user approval.
              - figure [ref=f76e81]
