          - heading "より長いホライズンに向けた Composer の学習" [level=1] [ref=f27e49]
          - generic [ref=f27e58]:
            - text: Federico Cassano & Sasha Rush
            - generic [ref=f27e59]: · 読了時間 2分
        - generic [ref=f27e65]:
          - navigation [ref=f27e66]:
            - button [expanded] [ref=f27e67]:
              - heading "目次" [level=3] [ref=f27e68]
              - generic [ref=f27e69]: ↑
            - list [ref=f27e71]:
              - listitem [ref=f27e72]:
                - link "コンパクション手法の限界" [ref=f27e73] [cursor=pointer]:
                  - /url: "#"
              - listitem [ref=f27e74]:
                - link "学習された挙動としての自己要約" [ref=f27e75] [cursor=pointer]:
                  - /url: "#"
              - listitem [ref=f27e76]:
                - link "トークン効率の高い圧縮" [ref=f27e77] [cursor=pointer]:
                  - /url: "#"
              - listitem [ref=f27e78]:
                - link "難しい問題を解く" [ref=f27e79] [cursor=pointer]:
                  - /url: "#"
              - listitem [ref=f27e80]:
                - link "長いホライズンの未来に向けて" [ref=f27e81] [cursor=pointer]:
                  - /url: "#"
          - generic [ref=f27e82]:
            - paragraph [ref=f27e83]: 私たちは、自己要約と呼ばれる強化学習プロセスを通じて、長いホライズンのタスクに対応できるよう Composer を学習させています。自己要約を Composer の学習に組み込むことで、モデルの最大コンテキストウィンドウを大幅に超える軌跡から学習シグナルを得られます。これにより、Composer は数百回のアクションを要する困難なコーディングタスクにも取り組めるようになります。
            - heading [level=2] [ref=f27e84]:
              - link "Link to this section" [ref=f27e85] [cursor=pointer]:
                - /url: "#"
                - text: "#"
              - text: コンパクション手法の限界
            - paragraph [ref=f27e86]:
              - text: 社内ベンチマークスイートである
              - link "CursorBench" [ref=f27e87] [cursor=pointer]:
                - /url: https://cursor.com/blog/cursorbench
              - text: において、私たちは、難易度の高い実世界のタスクでのより高い性能が、より多くの思考とコードベースの探索に直接相関していることを確認しています。ユーザーがエージェントと協力して、より難しく、より意欲的なタスクに取り組むようになるほど、思考と探索の効果はさらに高まると考えられます。
            - paragraph [ref=f27e88]: ただし、主な課題は、エージェントの軌跡がモデルのコンテキスト長よりも速いペースで拡大していることです。多くのエージェントハーネスは、エージェントのワークフローにおける中間ステップとしてコンパクションを使うことで、これに対処しようとしています。エージェントがコンテキスト制限に達すると、ハーネスはコンテキストをより短く変換し、中断した地点からエージェントの生成を続けます。
            - paragraph [ref=f27e89]:
              - text: 実際には、コンパクションは通常、ハーネスによって次の2つの方法のいずれかで処理されます。1つは、プロンプトで要約を行うモデルを使ってテキスト空間で処理する方法、もう1つは、モデルが古いコンテキストを削除するスライディングコンテキストウィンドウによる方法です。研究者たちは、
              - link "潜在" [ref=f27e90] [cursor=pointer]:
                - /url: https://arxiv.org/abs/2602.16284
              - link "空間" [ref=f27e91] [cursor=pointer]:
                - /url: https://arxiv.org/abs/2506.06266
              - text: におけるコンパクション手法の探究も始めています。これは、モデルがコンテキストをテキストではなくベクトルとして記憶する方法ですが、現時点ではこうしたアプローチはテキストベースの手法よりも大幅に低速です。
            - paragraph [ref=f27e92]: こうしたコンパクション手法に共通する欠点は、コンテキスト内の重要な情報をモデルが忘れてしまう可能性があり、その結果、長時間にわたるタスクを進めるにつれて有効性が低下することです。
            - heading [level=2] [ref=f27e93]:
              - link "Link to this section" [ref=f27e94] [cursor=pointer]:
                - /url: "#-1"
                - text: "#"
              - text: 学習された挙動としての自己要約
            - figure [ref=f27e95]:
              - img "compaction-in-the-loop の学習プロセスを示す自己要約の図" [ref=f27e97]
            - paragraph [ref=f27e98]: Composer は、エージェント型コーディング向けに設計された特化型のモデルで、Cursor のエージェントハーネス内で強化学習によって学習されています。これにより、compaction-in-the-loop を組み込んだ形で学習でき、要約して保持すべき最も重要な情報を見極める能力が向上します。
            - paragraph [ref=f27e99]: Composer はタスクを進める中で、固定のコンテキスト長のしきい値に近づくと、一度処理を止めて自身のコンテキストを要約してから続行します。より正確には、自己要約のプロセスは次のように機能します。
            - list [ref=f27e100]:
              - listitem [ref=f27e101]:
                - paragraph [ref=f27e102]: Composer は、固定のトークン長のしきい値に達するまで、プロンプトから生成を行います。
              - listitem [ref=f27e103]:
                - paragraph [ref=f27e104]: モデルに現在のコンテキストを要約するよう求める合成クエリを挿入します。
              - listitem [ref=f27e105]:
                - paragraph [ref=f27e106]: モデルには最適な要約を考えるための思考用スペースが与えられ、その後、要約されたコンテキストを生成します。
              - listitem [ref=f27e107]:
                - paragraph [ref=f27e108]: Composer は、要約に加えて会話の状態 (プランの状態、残りのタスク、これまでの要約回数など) を含む要約済みコンテキストを使って、手順 1 に戻ります。
            - paragraph [ref=f27e109]: Composer が推論時にもこれをうまく実行できるようにするため、学習にも同じ要約手順を組み込んでいます。各学習ロールアウトには、単一のプロンプトと応答のペアではなく、要約でつながれた複数の生成が含まれることがあります。つまり、自己要約そのものも報酬の対象になります。
            - paragraph [ref=f27e110]: 技術的な観点では、これにあたって学習に大きな変更は必要ありません。連鎖内でモデルが生成したすべてのトークンに対して、最終報酬を適用します。これにより、良い軌跡におけるエージェントの応答だけでなく、それを成立させた自己要約にもより大きな重みが与えられます。同時に、重要な情報を落としてしまった不十分な要約の重みは下げられます。Composer は学習が進むにつれて、この自己要約プロセスを使ってより長いコンテキストを構築することを学びます。難しい例では、複数回にわたって自己要約することもよくあります。
            - heading [level=2] [ref=f27e111]:
              - link "Link to this section" [ref=f27e112] [cursor=pointer]:
                - /url: "#-2"
                - text: "#"
              - text: トークン効率の高い圧縮
            - paragraph [ref=f27e113]: 自己要約を検証するために、これを高度に調整されたプロンプトベースの圧縮ベースラインと比較します。圧縮のトリガーを変化させながら、難易度の高いソフトウェアエンジニアリングのタスク群でこの問題を検証します。
            - paragraph [ref=f27e114]: ベースラインの圧縮手法では、要約用プロンプトは数千トークンに及び、要約に保持すべき内容を説明する、慎重に設計された10近いセクションが含まれています。出力される圧縮済みコンテキストも平均で5,000トークンを超え、コンテキスト内の重要な情報を説明する構造化されたセクションを多数含みます。
            - paragraph [ref=f27e115]: 一方、Composer は自己要約するように訓練されているため、必要なのは「会話を要約してください」という内容を少し超える程度の、ごく短いプロンプトだけです。出力される要約は平均で約1,000トークンにとどまります。これは、残すべき価値の高い情報を文脈に応じて判断することを学習しているためです。
            - paragraph [ref=f27e116]: 自己要約の影響を測定するために、Composer をコンテキスト制約のある2つのテスト環境で検証しました。1つは80kトークンでトリガーされる環境、もう1つは40kトークンでトリガーされる環境です (こちらは要約がより頻繁に行われることを意味します) 。どちらのシナリオでも、自己要約は、はるかにトークン効率の高い圧縮によって、CursorBench において大幅に優れた結果を生み出します。対象を絞ったベースライン手法と比べても、圧縮による誤差を一貫して50%削減しながら、トークン使用量は5分の1で済み、KVキャッシュ (以前のトークンから保存された中間計算結果) も再利用できます。
            - figure [ref=f27e117]:
              - img "CursorBench のパフォーマンスを示す自己要約のグラフ" [ref=f27e119]
            - heading [level=2] [ref=f27e120]:
              - link "Link to this section" [ref=f27e121] [cursor=pointer]:
                - /url: "#-3"
                - text: "#"
              - text: 難しい問題を解く
            - paragraph [ref=f27e122]:
              - text: コンパクションのより大きな可能性は、長い推論チェーンを必要とする難問をモデルが一発で解けるようにすることです。現在の Composer 2 の学習では、それがしばしば起きるのを確認しています。ケーススタディとして、Terminal-Bench 2.0 の
              - link [ref=f27e123] [cursor=pointer]:
                - /url: https://www.tbench.ai/benchmarks/terminal-bench-2/make-doom-for-mips
                - strong [ref=f27e124]: make-doom-for-mips
              - text: として知られる問題を取り上げます。この問題は簡潔でありながら、非常に難しいものです。
            - blockquote [ref=f27e125]:
              - paragraph [ref=f27e126]: /app/doomgeneric/ に doom のソースコードを用意してあります。さらに、描画された各フレームを /tmp/frame.bmp に書き出す、使ってほしい特別な doomgeneric_img.c も作成してあります。最後に、doomgeneric_mips という名前のファイルを想定して実行する vm.js も用意しました。あとは残りを何とかしてください……
            - paragraph [ref=f27e127]: 説明するのは簡単ですが、この問題は非常に難しく、強力なモデルのいくつかでも、公式に報告されている結果では正しく解けていません。
            - paragraph [ref=f27e128]: Composer の初期研究チェックポイントをテストしたところ、この問題を正しく解けることがわかりました。その解法には、かなりの量のコードを実装してテストすることに加え、いくつかの代替実装を試すことも必要でした。以下は、この問題を解く過程でレンダリングされた画像です。
            - figure [ref=f27e129]:
              - img "Terminal Bench V2 make-doom-for-mips problem" [ref=f27e131]
            - paragraph [ref=f27e132]: 最終的に、Composer は正確な解法を見つけるまでに 170 ターン費やし、その過程で簡潔で、人間が読める構造化された形式の自己要約を作成しました。10 万を超えるトークンを、問題解決に最も役立つと判断した 1,000 トークンまで自己要約しました。
            - heading [level=3] [ref=f27e135]:
              - button [ref=f27e136] [cursor=pointer]:
                - text: Composerによる自己概要
                - generic [ref=f27e137]: ↓
            - heading [level=2] [ref=f27e139]:
              - link "Link to this section" [ref=f27e140] [cursor=pointer]:
                - /url: "#-4"
                - text: "#"
              - text: 長いホライズンの未来に向けて
            - paragraph [ref=f27e141]: コンパクションを学習ループに組み込むことで、Composerは重要な情報を効率的に先へ引き継ぐための明示的な仕組みを学習し、困難なタスクに対してより高い能力を発揮できるようになります。自己要約に関する私たちの取り組みは、マルチエージェント連携のような、さらに長く複雑なプロセスでもComposerを学習させるという、より大きな目標に向けた一歩です。より優れたモデルの学習は、これらのエージェント型システムの適用範囲と知能を向上させるものだと、私たちは引き続き考えています。
            - paragraph [ref=f27e142]: Composerの次のバージョンについても、まもなくさらに詳しくお伝えします。 ■
          - generic [ref=f27e143]:
