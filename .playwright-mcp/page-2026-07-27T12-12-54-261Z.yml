- generic [active] [ref=f75e1]: "{\"post_stream\":{\"posts\":[{\"id\":431692,\"name\":\"\",\"username\":\"context_is_broken\",\"avatar_template\":\"https://avatars.discourse-cdn.com/v4/letter/c/6de8d8/{size}.png\",\"created_at\":\"2026-06-22T22:03:56.295Z\",\"cooked\":\"\\u003ch3\\u003e\\u003ca name=\\\"p-431692-where-does-the-bug-appear-featureproduct-1\\\" class=\\\"anchor\\\" href=\\\"#p-431692-where-does-the-bug-appear-featureproduct-1\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eWhere does the bug appear (feature/product)?\\u003c/h3\\u003e\\n\\u003cp\\u003eCursor IDE\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-431692-describe-the-bug-2\\\" class=\\\"anchor\\\" href=\\\"#p-431692-describe-the-bug-2\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eDescribe the Bug\\u003c/h3\\u003e\\n\\u003cp\\u003eultra user here: every time I try loading any model, give it a prompt, and have it execute on the prompt, agent is only able to get past ~10% of context window before summarizing context (in the case of using GPT 5.5, context usage explodes to 50% of total window despite not having analyzed any bulky docs, and this burns API tokens), seemingly forgetting what it just read, and then it gets stuck in this loop. have tried with several different frontier models + composer 2.5 + plan/agent/debug/multi-task mode. is this a widespread issue or any experience with this issue?\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-431692-steps-to-reproduce-3\\\" class=\\\"anchor\\\" href=\\\"#p-431692-steps-to-reproduce-3\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eSteps to Reproduce\\u003c/h3\\u003e\\n\\u003cp\\u003eon any new conversation, this bug will arise once roughly ~20% context has been reached.\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-431692-expected-behavior-4\\\" class=\\\"anchor\\\" href=\\\"#p-431692-expected-behavior-4\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eExpected Behavior\\u003c/h3\\u003e\\n\\u003cp\\u003eWe want to be able to reach full context window usage + not catastrophically forgetting prior context after “summarizing chat context” fires + no context explosions with frontier models.\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-431692-screenshots-screen-recordings-5\\\" class=\\\"anchor\\\" href=\\\"#p-431692-screenshots-screen-recordings-5\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eScreenshots / Screen Recordings\\u003c/h3\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\"lightbox-wrapper\\\"\\u003e\\u003ca class=\\\"lightbox\\\" href=\\\"https://us1.discourse-cdn.com/cursor1/original/3X/b/c/bc0daa9ac5b9978ef0eba61e80b3f57e8aac0974.jpeg\\\" data-download-href=\\\"/uploads/short-url/qPB2LwVVAFlbpYsHylMfMjAkfqI.jpeg?dl=1\\\" title=\\\"Screenshot 2026-06-22 175552-imageonline.co-merged.png\\\" rel=\\\"noopener nofollow ugc\\\"\\u003e\\u003cimg src=\\\"https://us1.discourse-cdn.com/cursor1/optimized/3X/b/c/bc0daa9ac5b9978ef0eba61e80b3f57e8aac0974_2_690x200.jpeg\\\" alt=\\\"Screenshot 2026-06-22 175552-imageonline.co-merged.png\\\" data-base62-sha1=\\\"qPB2LwVVAFlbpYsHylMfMjAkfqI\\\" width=\\\"690\\\" height=\\\"200\\\" srcset=\\\"https://us1.discourse-cdn.com/cursor1/optimized/3X/b/c/bc0daa9ac5b9978ef0eba61e80b3f57e8aac0974_2_690x200.jpeg, https://us1.discourse-cdn.com/cursor1/optimized/3X/b/c/bc0daa9ac5b9978ef0eba61e80b3f57e8aac0974_2_1035x300.jpeg 1.5x, https://us1.discourse-cdn.com/cursor1/optimized/3X/b/c/bc0daa9ac5b9978ef0eba61e80b3f57e8aac0974_2_1380x400.jpeg 2x\\\" data-dominant-color=\\\"0F0F0F\\\"\\u003e\\u003cdiv class=\\\"meta\\\"\\u003e\\u003csvg class=\\\"fa d-icon d-icon-far-image svg-icon\\\" aria-hidden=\\\"true\\\"\\u003e\\u003cuse href=\\\"#far-image\\\"\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\"filename\\\"\\u003eScreenshot 2026-06-22 175552-imageonline.co-merged.png\\u003c/span\\u003e\\u003cspan class=\\\"informations\\\"\\u003e3860×1124 363 KB\\u003c/span\\u003e\\u003csvg class=\\\"fa d-icon d-icon-discourse-expand svg-icon\\\" aria-hidden=\\\"true\\\"\\u003e\\u003cuse href=\\\"#discourse-expand\\\"\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-431692-operating-system-6\\\" class=\\\"anchor\\\" href=\\\"#p-431692-operating-system-6\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eOperating System\\u003c/h3\\u003e\\n\\u003cp\\u003eWindows 10/11\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-431692-version-information-7\\\" class=\\\"anchor\\\" href=\\\"#p-431692-version-information-7\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eVersion Information\\u003c/h3\\u003e\\n\\u003cp\\u003eVersion: 3.8.11 (user setup)\\u003cbr\\u003e\\nVS Code Extension API: 1.105.1\\u003cbr\\u003e\\nCommit: e56ad3440df06d22ca7501e65fd518e905486ef0\\u003cbr\\u003e\\nDate: 2026-06-18T01:40:18.333Z\\u003cbr\\u003e\\nLayout: editor\\u003cbr\\u003e\\nBuild Type: Stable\\u003cbr\\u003e\\nRelease Track: Default\\u003cbr\\u003e\\nElectron: 40.10.3\\u003cbr\\u003e\\nChromium: 144.0.7559.236\\u003cbr\\u003e\\nNode.js: 24.15.0\\u003cbr\\u003e\\nV8: 14.4.258.32-electron.0\\u003cbr\\u003e\\nxterm.js: 6.1.0-beta.256\\u003cbr\\u003e\\nOS: Windows_NT x64 10.0.26200\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-431692-for-ai-issues-which-model-did-you-use-8\\\" class=\\\"anchor\\\" href=\\\"#p-431692-for-ai-issues-which-model-did-you-use-8\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eFor AI issues: which model did you use?\\u003c/h3\\u003e\\n\\u003cp\\u003eComposer 2.5, GPT 5.5 1M Extra High (keeps exploding from 5% context usage to 50% usage within seconds without having analyzed any documents), Opus 4.8 1M Max\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-431692-does-this-stop-you-from-using-cursor-9\\\" class=\\\"anchor\\\" href=\\\"#p-431692-does-this-stop-you-from-using-cursor-9\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eDoes this stop you from using Cursor\\u003c/h3\\u003e\\n\\u003cp\\u003eYes - Cursor is unusable\\u003c/p\\u003e\",\"post_number\":1,\"post_type\":1,\"posts_count\":2,\"updated_at\":\"2026-06-22T22:04:04.649Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":14,\"reads\":6,\"readers_count\":5,\"score\":56.2,\"yours\":false,\"topic_id\":163850,\"topic_slug\":\"context-keeps-summarizing-at-10-20-of-total-context-window\",\"display_username\":\"\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":2,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":null,\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":123196,\"hidden\":false,\"trust_level\":0,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":false,\"wiki\":false,\"post_url\":\"/t/context-keeps-summarizing-at-10-20-of-total-context-window/163850/1\",\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null,\"can_vote\":false},{\"id\":431707,\"name\":\"Kevin Neilson\",\"username\":\"kevinn\",\"avatar_template\":\"/user_avatar/forum.cursor.com/kevinn/{size}/101206_2.png\",\"created_at\":\"2026-06-23T00:11:37.627Z\",\"cooked\":\"\\u003cp\\u003eThanks for the detailed report, and sorry for the frustration. Two things are combining here.\\u003c/p\\u003e\\n\\u003cp\\u003e1. The window is smaller than 1M unless Max Mode is on**.** The 1M figure only applies when you select Max Mode plus the 1M context variant in the model picker. Otherwise frontier models run on their standard window (200k-300k tokens), and Composer 2.5 runs on 200k token context window. Summarization fires near the top of whatever window is active, so it’s not possible to use, for example, 199k tokens in practice on Composer 2.5 because self-summarization will fire before that.\\u003c/p\\u003e\\n\\u003cp\\u003e2. The bigger driver: searches are pulling in huge amounts of output. Looking at your recent sessions, the context is filling from tool output, not documents. Several searches walked environment and library folders (for example conda/miniforge environments and Python virtualenvs) and a single search returned over a million characters. One result like that fills a large chunk of the window in one step, which is why usage jumps to 50% “within seconds” and the agent then summarizes and seems to forget.\\u003c/p\\u003e\\n\\u003cp\\u003eThe change that helps most is keeping those folders out of search. Add a \\u003ccode\\u003e.cursorignore\\u003c/code\\u003e at your project root, for example:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\"lang-auto\\\"\\u003e**/miniforge/**\\n**/miniconda/**\\n**/.venv*/**\\n**/venv/**\\n**/node_modules/**\\n**/build/**\\n**/*.so\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eYou can also have the UI build your .cursorignore for you by going to Cursor Settings → Indexing and Docs and then Editing the list here:\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\"lightbox-wrapper\\\"\\u003e\\u003ca class=\\\"lightbox\\\" href=\\\"https://us1.discourse-cdn.com/cursor1/original/3X/7/e/7ef039a1b4c22521424a29853205eebb54f84dcf.png\\\" data-download-href=\\\"/uploads/short-url/i6WQ9GL8fjujj8SHtVgwIqt7wkv.png?dl=1\\\" title=\\\"Screenshot 2026-06-22 at 5.10.50 PM\\\"\\u003e\\u003cimg src=\\\"https://us1.discourse-cdn.com/cursor1/optimized/3X/7/e/7ef039a1b4c22521424a29853205eebb54f84dcf_2_690x53.png\\\" alt=\\\"Screenshot 2026-06-22 at 5.10.50 PM\\\" data-base62-sha1=\\\"i6WQ9GL8fjujj8SHtVgwIqt7wkv\\\" width=\\\"690\\\" height=\\\"53\\\" srcset=\\\"https://us1.discourse-cdn.com/cursor1/optimized/3X/7/e/7ef039a1b4c22521424a29853205eebb54f84dcf_2_690x53.png, https://us1.discourse-cdn.com/cursor1/optimized/3X/7/e/7ef039a1b4c22521424a29853205eebb54f84dcf_2_1035x79.png 1.5x, https://us1.discourse-cdn.com/cursor1/optimized/3X/7/e/7ef039a1b4c22521424a29853205eebb54f84dcf_2_1380x106.png 2x\\\" data-dominant-color=\\\"292929\\\"\\u003e\\u003cdiv class=\\\"meta\\\"\\u003e\\u003csvg class=\\\"fa d-icon d-icon-far-image svg-icon\\\" aria-hidden=\\\"true\\\"\\u003e\\u003cuse href=\\\"#far-image\\\"\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\"filename\\\"\\u003eScreenshot 2026-06-22 at 5.10.50 PM\\u003c/span\\u003e\\u003cspan class=\\\"informations\\\"\\u003e2036×158 12.4 KB\\u003c/span\\u003e\\u003csvg class=\\\"fa d-icon d-icon-discourse-expand svg-icon\\\" aria-hidden=\\\"true\\\"\\u003e\\u003cuse href=\\\"#discourse-expand\\\"\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eTry the \\u003ccode\\u003e.cursorignore\\u003c/code\\u003e first, since it’s almost certainly the largest contributor.\\u003c/p\\u003e\",\"post_number\":7,\"post_type\":1,\"posts_count\":2,\"updated_at\":\"2026-06-23T00:11:37.627Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":6,\"reads\":4,\"readers_count\":3,\"score\":15.8,\"yours\":false,\"topic_id\":163850,\"topic_slug\":\"context-keeps-summarizing-at-10-20-of-total-context-window\",\"display_username\":\"Kevin Neilson\",\"primary_group_name\":\"CursorStaff\",\"flair_name\":\"CursorStaff\",\"flair_url\":\"https://us1.discourse-cdn.com/cursor1/original/3X/a/d/ad08adc640929ae1e98be69dab1ad0844cee99a0.png\",\"flair_bg_color\":\"\",\"flair_color\":\"\",\"flair_group_id\":42,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"