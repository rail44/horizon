# Compiler-level caching across every worktree of this repo (main checkout,
# `git worktree` clones, `.claude/worktrees/*` workers, `.horizon/worktrees/*`
# agent sessions). This file is tracked, so every worktree checks it out and
# gets the same setting with no per-shell exports.
#
# Each worktree builds into its own default `target/` — nothing is shared
# at the artifact level, so cross-worktree correctness is trivial: there is
# no file two checkouts could both claim. What IS shared is the compiler
# work, through sccache (`build.rustc-wrapper`): dependency crates compile
# to identical inputs in every worktree, so after one worktree has built
# them, every other worktree's build is cache hits plus its own workspace
# members. sccache keys on compiler inputs (never mtimes), carries its own
# size-bounded LRU cache (`~/.config/sccache/config`), and passes
# incremental units through uncached — which lands exactly right here:
# cargo compiles workspace members incrementally (worktree-local by nature)
# and dependencies non-incrementally (the shareable part).
#
# Garbage collection is automatic by construction: removing a worktree
# removes its `target/`, and sccache's LRU bounds the shared cache.
#
# History (2026-07-30 → 2026-08-02): the previous scheme shared one
# `build.build-dir` across worktrees and keyed workspace-member artifacts
# per worktree by hashing a tracked `rustc-workspace-wrapper` path into
# their metadata (cargo's only member-gated hash input — an implementation
# detail, not a documented guarantee). It fixed the last-writer-wins
# corruption (backlog 43/66) but left ~260GB of unreclaimable orphans:
# artifact hashes cannot be mapped back to worktrees, removed worktrees'
# member sets and their per-worktree clippy build-dirs (needed because
# `cargo clippy` overrides the workspace wrapper via env) accumulated
# forever. Retired in favor of this scheme once merged-session worktrees
# started being terminated (and thus cleaned) routinely.
#
# Requires `sccache` on PATH (`cargo install sccache`, or a distro
# package). See AGENTS.md "Build setup".
[build]
rustc-wrapper = "sccache"
