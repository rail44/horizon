# Every worktree of this repo (main checkout, `git worktree` clones,
# `.claude/worktrees/*` workers, `.horizon/worktrees/*` agent sessions)
# builds into its own default `target/` — nothing is shared at the
# artifact level, so cross-worktree correctness is trivial: there is no
# file two checkouts could both claim.
#
# Fresh worktrees are fast through kache, installed per machine with its
# `rustc-wrapper` in `~/.cargo/config.toml`, not here: it restores
# compiler outputs by their inputs into each worktree's own `target/`.
# See AGENTS.md "Build setup".
#
# History, for whoever is tempted to reintroduce sharing here:
# - 2026-07-30: a shared `build.build-dir` + a per-worktree
#   `rustc-workspace-wrapper` hash key fixed cross-worktree artifact
#   corruption (backlog 43/66) but leaked ~260GB of unmappable orphans
#   in three days, plus a per-worktree clippy build-dir side channel.
# - 2026-08-02 (morning): sccache as `build.rustc-wrapper`. Correct, but
#   its cache keys for build-script crates are worktree-path-dependent
#   (verified empirically: stable within a worktree, split across
#   worktrees), and the expensive units — gpui, arrow, aws-lc-sys — are
#   all in that class, so fresh worktrees stayed ~11-minute builds.
# - 2026-08-02 (evening): both removed in favor of a reflink seed hook
#   (`hooks/post-checkout`): it copied the main checkout's `target/` into
#   a new worktree and stripped the members (owner decision).
# - 2026-11-21: the seed hook removed for kache (owner decision). The
#   main checkout's `target/` only ever held what running Horizon
#   builds, so clippy re-checked ~720 crates and the test build rebuilt
#   ~120 dependency units in every worktree; kache hit ~95-99% of them
#   across worktrees at different paths, build-script crates included,
#   and a member changed in one worktree did not reach another.
#
# It carries this history, holds no artifact-sharing setting, and is the
# place a build knob every checkout needs goes.

[env]
# The terminal engine (libghostty-vt, built by Zig from its -sys crate's
# build script) is built optimized in every profile. Its build script
# would build a debug profile's in Zig's `Debug` mode, which takes in a
# program's output about a thousand times slower (926 ms against 0.7-1 ms
# for 117 KB, docs/research/libghostty-vt-engine-spike-2026-11-19.md), and
# the view runs that engine on the UI thread
# (docs/terminal-stream-design.md). The cost: no stepping into the engine
# in a debugger.
LIBGHOSTTY_VT_SYS_OPTIMIZE = "ReleaseFast"
