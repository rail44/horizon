# Every worktree of this repo (main checkout, `git worktree` clones,
# `.claude/worktrees/*` workers, `.horizon/worktrees/*` agent sessions)
# builds into its own default `target/` — nothing is shared at the
# artifact level, so cross-worktree correctness is trivial: there is no
# file two checkouts could both claim.
#
# Fresh worktrees are fast anyway: `git worktree add` runs
# `hooks/post-checkout`, which reflinks the main checkout's `target/`
# into the new worktree (btrfs copy-on-write) and strips
# workspace-member artifacts so the worktree always rebuilds its own
# code but never the dependency graph. See that hook and AGENTS.md
# "Build setup".
#
# History, for whoever is tempted to reintroduce sharing here:
# - 2026-07-30: a shared `build.build-dir` + a per-worktree
#   `rustc-workspace-wrapper` hash key fixed cross-worktree artifact
#   corruption (backlog 43/66) but leaked ~260GB of unmappable orphans
#   in three days, plus a per-worktree clippy build-dir side channel.
# - 2026-08-02 (morning): sccache as `build.rustc-wrapper`. Correct, but
#   its cache keys for build-script crates are worktree-path-dependent
#   (verified empirically: stable within a worktree, split across
#   worktrees), and the expensive units — gpui, arrow, aws-lc-sys — are
#   all in that class, so fresh worktrees stayed ~11-minute builds.
# - 2026-08-02 (evening): both removed in favor of the reflink seed
#   hook, which delivers ~5s worktree creation + ~33s member-only
#   builds with no compiler-level sharing at all (owner decision).
#
# This file is deliberately config-free today; it exists to carry this
# history and to be the place a future build knob would go.
