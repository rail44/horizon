[workspace]
members = [
    ".",
    "crates/horizon-acp",
    "crates/horizon-agent",
    "crates/horizon-agent-display",
    "crates/horizon-board-view",
    "crates/horizon-agentd",
    "crates/horizon-daemon-testkit",
    "crates/horizon-shell-runtime",
    "crates/horizon-terminald",
    "crates/horizon-theme",
    "crates/horizon-control",
    "crates/horizon-cli",
    "crates/horizon-terminal-core",
    "crates/horizon-wire",
    "crates/horizon-config",
    "crates/horizon-workspace",
    "crates/horizon-sandbox",
    "crates/horizon-sandbox-runtime",
    "crates/horizon-sandbox-proxy",
    "crates/horizon-board",
    "crates/horizon-logd",
    "crates/horizon-wiki",
    "crates/horizon-ui",
    "crates/horizon-ui-macros",
    "crates/horizon-theme-css",
    "preview-plugin",
]
resolver = "3"
# The DuckDB extensions are a sub-workspace (pinned to DuckDB's unstable C
# API v2 and its own libduckdb-sys features; see duckdb-ext/README.md).
exclude = ["duckdb-ext"]

# The one workspace-wide remoc pin (docs/remoc-adoption-design.md §1,
# "remoc version policy"): exact version (`=`), reviewed against the remoc
# CHANGELOG for chmux/codec changes before any bump, and default features
# OFF so no `default-codec-*` feature is ever enabled -- naming
# `codec::Default` then fails to compile, which is the adoption decision's
# countermeasure to the 0.18.0 silent default-codec change (JSON ->
# Postbag). Every use names `codec::Postbag` explicitly (via
# `horizon_wire::WireCodec`). `rtc` pulls in `rch` + the
# derive macro; `codec-postbag` is the only codec compiled in. (The
# vocabularies' JSON payloads travel as `contract::JsonValue` -- JSON text
# on this binary wire -- precisely so no second, self-describing codec is
# ever needed.)
[workspace.dependencies]
remoc = { version = "=0.18.3", default-features = false, features = ["rtc", "codec-postbag"] }
# The ACP SDK and its schema crate: exact pins, upgraded together
# (docs/acp-agentd-implementation-plan.md).
agent-client-protocol = { version = "=2.2.0", features = ["unstable_protocol_v2"] }
agent-client-protocol-schema = { version = "=1.9.1", features = ["unstable_protocol_v2"] }
# The UI stack (`docs/ui-foundation-migration-design.md`): Blitz is a beta,
# pinned to one release and patched below past it.
blitz-dom = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
blitz-paint = { version = "=0.3.0-beta.4", features = ["custom-widget"] }
blitz-shell = "=0.3.0-beta.4"
reactive_graph = { version = "0.2", features = ["effects"] }
any_spawner = { version = "0.3", features = ["futures-executor"] }

# Blitz at the head of upstream's fix for hit testing through a clip
# (DioxusLabs/blitz#1324, 58 commits past 0.3.0-beta.4): content scrolled
# out of a box does not take the clicks meant for what is drawn over it.
# `blitz-shell` is Horizon's own copy of that revision's, changed where
# marked.
[patch.crates-io]
blitz-shell = { path = "vendor/blitz-shell" }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "bf5813a1c042c2dad5b80e36f6a612b85adb85dd" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "bf5813a1c042c2dad5b80e36f6a612b85adb85dd" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "bf5813a1c042c2dad5b80e36f6a612b85adb85dd" }
# winit at upstream's fix for Wayland clipboard text (rust-windowing/winit
# db09864, "winit-wayland: fix some text not being copied due to missing
# mime types"), not in a release yet. 0.31.0-beta.4 offers copied text as
# `text/plain; charset=utf-8` and `text/plain` only, without the standard
# `text/plain;charset=utf-8` or `UTF8_STRING`, so an application that reads
# one of those pastes nothing of what Horizon copied. The crates move
# together: winit-wayland alone leaves two winit-cores in the graph. Drop
# these once a release has the fix.
winit = { git = "https://github.com/rust-windowing/winit", rev = "db098642637c7e073327c298831678f46a1bb5ed" }
winit-core = { git = "https://github.com/rust-windowing/winit", rev = "db098642637c7e073327c298831678f46a1bb5ed" }
winit-common = { git = "https://github.com/rust-windowing/winit", rev = "db098642637c7e073327c298831678f46a1bb5ed" }
winit-wayland = { git = "https://github.com/rust-windowing/winit", rev = "db098642637c7e073327c298831678f46a1bb5ed" }
winit-x11 = { git = "https://github.com/rust-windowing/winit", rev = "db098642637c7e073327c298831678f46a1bb5ed" }

[package]
name = "horizon"
description = "Horizon: the shell's window and the control plane's client."
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
horizon-ui = { path = "crates/horizon-ui" }
horizon-board = { path = "crates/horizon-board" }
horizon-board-view = { path = "crates/horizon-board-view" }
horizon-workspace = { path = "crates/horizon-workspace" }
keyboard-types = "0.8"

# What a view built into a preview plugin (`preview-plugin`, wasm) does
# not have: the modules that need these are native-only in `src/lib.rs`.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
horizon-theme-css = { path = "crates/horizon-theme-css" }
horizon-acp = { path = "crates/horizon-acp" }
horizon-agent = { path = "crates/horizon-agent" }
horizon-agent-display = { path = "crates/horizon-agent-display" }
horizon-config = { path = "crates/horizon-config" }
horizon-cli = { path = "crates/horizon-cli" }
horizon-control = { path = "crates/horizon-control" }
horizon-wire = { path = "crates/horizon-wire" }
horizon-theme = { path = "crates/horizon-theme" }
horizon-shell-runtime = { path = "crates/horizon-shell-runtime" }
horizon-terminal-core = { path = "crates/horizon-terminal-core" }
horizon-wiki = { path = "crates/horizon-wiki" }
anyrender = "0.14"
anyrender_vello = "0.15"
# The terminal's screen is a widget that paints itself: both crates draw
# one only with this feature on.
blitz-paint = { workspace = true }
blitz-shell = { workspace = true, features = ["custom-widget"] }
crossbeam-channel = "0.5"
futures = "0.3"
kurbo = "0.13"
# The parser `horizon-wiki` reads a page with: a wiki page is drawn from the
# same syntax tree its comments are anchored in.
markdown = "=1.0.0"
notify = "8"
# `complex-scripts`: the word breaker with its dictionary for Chinese and
# Japanese. Without it a debug build writes a warning to stderr for each
# such run of text it shapes.
parley = { version = "0.12", features = ["complex-scripts"] }
peniko = "0.6"
pulldown-cmark = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["rt", "net", "time", "macros", "io-util", "sync"] }
termwiz = { version = "0.23.3", features = ["use_serde"] }
unicode-width = "0.2"
uuid = { version = "1.18", features = ["v4"] }
# The desktop's notification service (`src/desktop_notify.rs`).
notify-rust = "4"
# The runtime a preview's plugin runs in (`src/preview.rs`).
wasmtime = { version = "50", default-features = false, features = [
    "async",
    "demangle",
    "runtime",
    "cranelift",
    "component-model",
    "parallel-compilation",
] }
wasmtime-wasi = "50"

[dev-dependencies]
# The terminal view's tests run the terminal core over a PTY of their own.
portable-pty = "0.9.0"
# The view painted into pixels, with no window and no GPU.
anyrender_vello_cpu = "0.18"
# The scenarios' window (`benches/scenarios/window.rs`) pumps the event
# loop itself: the version `vendor/blitz-shell` is built on.
winit = "=0.31.0-beta.4"

# Scenarios that time the views a frame at a time, with no window
# (`docs/performance-scenarios.md`). Not a test and not in the gate.
[[bench]]
name = "scenarios"
path = "benches/scenarios/main.rs"
harness = false

[lints.clippy]
all = { level = "warn", priority = -1 }

# Debug-build CPU profiles show the hot code lives almost entirely in
# dependencies (layout, shaping and rasterizing), so optimize external crates even in dev builds.
# The `"*"` wildcard does not match workspace members, which keep the
# default dev opt-level for debuggability and fast incremental builds.
[profile.dev.package."*"]
opt-level = 3
