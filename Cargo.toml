[workspace]
members = [
    ".",
    "crates/horizon-agent",
    "crates/horizon-agentd",
    "crates/horizon-daemon-testkit",
    "crates/horizon-terminald",
    "crates/horizon-control",
    "crates/horizon-cli",
    "crates/horizon-terminal-core",
    "crates/horizon-wire",
    "crates/horizon-config",
    "crates/horizon-workspace",
    "crates/horizon-sandbox",
    "crates/horizon-sandbox-runtime",
    "crates/horizon-sandbox-proxy",
    "crates/horizon-board",
    "crates/horizon-logd",
]
# The preview plugin is a `wasm32-wasip2` cdylib with its own sub-workspace
# and its own lockfile; it depends on the root package by path, so cargo
# would otherwise pull it into this workspace and build it for the host.
exclude = ["preview-plugin"]

# The one workspace-wide remoc pin (docs/remoc-adoption-design.md §1,
# "remoc version policy"): exact version (`=`), reviewed against the remoc
# CHANGELOG for chmux/codec changes before any bump, and default features
# OFF so no `default-codec-*` feature is ever enabled -- naming
# `codec::Default` then fails to compile, which is the adoption decision's
# countermeasure to the 0.18.0 silent default-codec change (JSON ->
# Postbag). Every use names `codec::Postbag` explicitly (via
# `horizon_wire::WireCodec`). `rtc` pulls in `rch` + the
# derive macro; `codec-postbag` is the only codec compiled in. (The
# vocabularies' JSON payloads travel as `contract::JsonValue` -- JSON text
# on this binary wire -- precisely so no second, self-describing codec is
# ever needed.)
[workspace.dependencies]
remoc = { version = "=0.18.3", default-features = false, features = ["rtc", "codec-postbag"] }

[package]
name = "horizon"
version = "0.1.0"
edition = "2021"

# Every dependency here must also build for `wasm32-wasip2`: the library
# target is compiled for that target so a preview-pane plugin view can
# import from it (`scripts/check-preview-wasm.sh`). Everything else lives
# in the native-only section below.
[dependencies]
# GPUI running inside a wasm component, replayed by the native host: the
# mechanism behind `src/preview/`. Compiled for both targets -- the host
# runtime (wasmtime) on native, the guest platform on `wasm32-wasip2` --
# because `preview::schema` and `preview::registry` are shared vocabulary.
# It depends on the same crates.io `gpui-pre` family as this crate, so the
# graph keeps one gpui.
embedded_gpui = { git = "https://github.com/rail44/embedded_gpui", rev = "73858e5530433049b043f19676beea398a6b22d3" }
# gpui ships to crates.io as the `gpui-pre` family -- the packaging the
# gpui-component v0.6 workspace itself is developed against (`gpui-pre`,
# `gpui-pre-platform`, `gpui-pre-macros`, `gpui-pre-sum-tree`, ...). The
# package renames keep our `use gpui::*` imports unchanged. This retires the
# old floating-git-pin fragility (the committed lockfile used to be the only
# pin, because a rev-pinned gpui edge next to gpui-component's floating one
# split the graph into two incompatible `gpui` instances and a `[patch]`
# was rejected by cargo): these are now ordinary crates.io requirements
# resolved once into the committed lock like every other dependency.
# `gpui-pre-platform` (the OS backend) is native-only, below.
gpui = { package = "gpui-pre", version = "0.3.1" }
# gpui-component (v0.6 workspace: crates/component) and the bundled icon
# SVGs now ship as `gpui-kit-assets` (formerly gpui-component-assets); the
# repository was renamed longbridge/gpui-component -> longbridge/gpui-kit.
# Nothing else in the graph depends on them, so they carry an explicit rev
# pin. Bump deliberately: update the rev here and on the two gpui-kit
# crates in the native-only section (all three share one rev), then
# `cargo update -p gpui-base -p gpui-component -p gpui-kit-assets`.
gpui-component = { git = "https://github.com/longbridge/gpui-kit", rev = "36b51819deb52c947a79f8de29e0e9175eda7464" }
# `preview::sample` bundles icon SVGs with `icon_assets!`, which the preview
# guest hands to its runtime as the plugin's `AssetSource` -- the crate's
# default wasm asset source fetches over HTTP, which a WASI guest cannot do.
gpui-kit-assets = { git = "https://github.com/longbridge/gpui-kit", rev = "36b51819deb52c947a79f8de29e0e9175eda7464" }
horizon-config = { path = "crates/horizon-config" }
# The board pane is previewable (`src/board_pane/previews.rs`), so its two
# model crates compile for the plugin target as well. `horizon-board`'s
# queries and its in-memory store source build anywhere; reaching the event
# file, the git root and the logd socket is gated inside that crate.
# `horizon-workspace` is framework-free (serde/serde_json/uuid).
horizon-board = { path = "crates/horizon-board" }
horizon-workspace = { path = "crates/horizon-workspace" }
# `theme::gpui_component` builds gpui-component's `ThemeConfig` as JSON and
# deserializes it, so serde_json is on the wasm side of the split too.
serde_json = "1.0"
# Board items carry their bound session ids as text; parsing one into a
# `horizon_workspace::SessionId` happens in the shared half of the board
# pane. Already in the graph via `horizon-workspace`.
uuid = { version = "1.18", features = ["v4", "serde"] }

# Native-only: each of these either reaches the host (sockets, PTYs, the
# daemon clients, the OS window/renderer backend) or is used exclusively by
# a module gated `#[cfg(not(target_family = "wasm"))]` in src/lib.rs.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
alacritty_terminal = "0.26.0"
crossbeam-channel = "0.5"
futures = "0.3"
# The OS event loop, renderer, IME integration, and frame scheduling
# (`lib.rs`'s `build_application`). Same `gpui-pre` family and version as
# `gpui` above.
gpui_platform = { package = "gpui-pre-platform", version = "0.3.1", features = [
    "font-kit",
    "wayland",
    "x11",
] }
# `TextSelection` (the window text-selection queries) lives in `gpui-base`,
# gpui-component's foundation crate -- `WindowExt::selected_text` is now just
# a deprecated wrapper around it. Same rev pin as gpui-component above; bump
# all three gpui-kit crates together.
gpui-base = { git = "https://github.com/longbridge/gpui-kit", rev = "36b51819deb52c947a79f8de29e0e9175eda7464" }
horizon-agent = { path = "crates/horizon-agent" }
horizon-cli = { path = "crates/horizon-cli" }
horizon-control = { path = "crates/horizon-control" }
horizon-terminal-core = { path = "crates/horizon-terminal-core" }
horizon-wire = { path = "crates/horizon-wire" }
# The `log` facade backend lives in the shell library (`lib.rs`'s
# StderrLogger): gpui and its platform crates — including the
# system-notification stack — report diagnostics through `log`, and with
# no backend installed they all vanish. Already in the graph via gpui, so
# this adds no transitive dependencies.
log = "0.4"
# The preview pane watches its `.wasm` artifact for changes. cargo unlinks
# and relinks the file rather than rewriting it in place, so the watch is on
# the containing directory and the events are debounced (`preview::watch`).
notify = "7"
remoc = { workspace = true }
termwiz = "0.23.3"
tokio = { version = "1.52", features = ["rt", "net", "io-util", "time", "macros"] }
# The theme settings view's explicit-Save writer (`src/theme_settings/save.rs`):
# edits only the `[theme]`/`[theme.ansi]` seed keys in the user's config
# file, preserving every other section, comment, and ordering byte-for-byte
# -- a plain `toml`-crate round trip (parse to a Rust struct, reserialize)
# would lose exactly that. Default features (`display`+`parse`) are enough;
# no `serde` feature needed since the writer edits the `DocumentMut` tree
# directly rather than (de)serializing a typed struct through it.
toml_edit = "0.25"
unicode-width = "0.2"

# Desktop notifications (`src/desktop_notify.rs`, fed by OSC 9/777 via
# horizon-terminal-core) go through gpui's unified system-notification
# API (`App::show_system_notification` / `on_system_notification_response`)
# — macOS via UNUserNotificationCenter, Linux via
# org.freedesktop.Notifications (gpui's notify-rust/zbus backend). No
# per-platform dependency here: both backends ship inside the gpui-pre
# platform crates already in the graph, and both report failures through
# the `log` facade (see entry.rs's StderrLogger). macOS still only
# delivers from a bundled, (ad-hoc) code-signed .app (`just dev-bundle`);
# gpui's bundle guard degrades to a log line instead of crashing.

# The preview pane's end-to-end test drives a real wasmtime store through
# GPUI's deterministic test executor (`preview::e2e`), which needs gpui's
# `test-support` feature and `anyhow` for the `PlatformTextSystem` the test
# substitutes.
[dev-dependencies]
anyhow = "1.0"
gpui = { package = "gpui-pre", version = "0.3.1", features = ["test-support"] }

[lints.clippy]
all = { level = "warn", priority = -1 }

# Debug-build CPU profiles show the hot code lives almost entirely in
# dependencies (gpui's Scene::push_layer/BoundsTree comparisons ~31%,
# taffy layout ~16%), so optimize external crates even in dev builds.
# The `"*"` wildcard does not match workspace members, which keep the
# default dev opt-level for debuggability and fast incremental builds.
[profile.dev.package."*"]
opt-level = 3
