[workspace]
members = [
    ".",
    "crates/horizon-agent",
    "crates/horizon-agentd",
    "crates/horizon-daemon-testkit",
    "crates/horizon-terminald",
    "crates/horizon-control",
    "crates/horizon-cli",
    "crates/horizon-terminal-core",
    "crates/horizon-wire",
    "crates/horizon-config",
    "crates/horizon-workspace",
    "crates/horizon-sandbox",
    "crates/horizon-sandbox-runtime",
    "crates/horizon-sandbox-proxy",
    "crates/horizon-board",
    "crates/horizon-logd",
]

# The one workspace-wide remoc pin (docs/remoc-adoption-design.md §1,
# "remoc version policy"): exact version (`=`), reviewed against the remoc
# CHANGELOG for chmux/codec changes before any bump, and default features
# OFF so no `default-codec-*` feature is ever enabled -- naming
# `codec::Default` then fails to compile, which is the adoption decision's
# countermeasure to the 0.18.0 silent default-codec change (JSON ->
# Postbag). Every use names `codec::Postbag` explicitly (via
# `horizon_wire::WireCodec`). `rtc` pulls in `rch` + the
# derive macro; `codec-postbag` is the only codec compiled in. (The
# vocabularies' JSON payloads travel as `contract::JsonValue` -- JSON text
# on this binary wire -- precisely so no second, self-describing codec is
# ever needed.)
[workspace.dependencies]
remoc = { version = "=0.18.3", default-features = false, features = ["rtc", "codec-postbag"] }

[package]
name = "horizon"
version = "0.1.0"
edition = "2021"

[dependencies]
alacritty_terminal = "0.26.0"
crossbeam-channel = "0.5"
futures = "0.3"
# gpui ships to crates.io as the `gpui-pre` family -- the packaging the
# gpui-component v0.6 workspace itself is developed against (`gpui-pre`,
# `gpui-pre-platform`, `gpui-pre-macros`, `gpui-pre-sum-tree`, ...). The
# package renames keep our `use gpui::*` imports unchanged. This retires the
# old floating-git-pin fragility (the committed lockfile used to be the only
# pin, because a rev-pinned gpui edge next to gpui-component's floating one
# split the graph into two incompatible `gpui` instances and a `[patch]`
# was rejected by cargo): these are now ordinary crates.io requirements
# resolved once into the committed lock like every other dependency.
gpui = { package = "gpui-pre", version = "0.3.1" }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.1", features = [
    "font-kit",
    "wayland",
    "x11",
] }
# gpui-component (v0.6 workspace: crates/component) and the bundled icon
# SVGs now ship as `gpui-kit-assets` (formerly gpui-component-assets); the
# repository was renamed longbridge/gpui-component -> longbridge/gpui-kit.
# Nothing else in the graph depends on them, so they carry an explicit rev
# pin. Bump deliberately: update the rev below, then
# `cargo update -p gpui-component -p gpui-kit-assets`.
# `TextSelection` (the window text-selection queries) lives in `gpui-base`,
# gpui-component's foundation crate -- `WindowExt::selected_text` is now just
# a deprecated wrapper around it. Same rev pin as gpui-component above; bump
# the two together.
gpui-base = { git = "https://github.com/longbridge/gpui-kit", rev = "36b51819deb52c947a79f8de29e0e9175eda7464" }
gpui-component = { git = "https://github.com/longbridge/gpui-kit", rev = "36b51819deb52c947a79f8de29e0e9175eda7464" }
gpui-kit-assets = { git = "https://github.com/longbridge/gpui-kit", rev = "36b51819deb52c947a79f8de29e0e9175eda7464" }
horizon-agent = { path = "crates/horizon-agent" }
horizon-board = { path = "crates/horizon-board" }
horizon-cli = { path = "crates/horizon-cli" }
horizon-config = { path = "crates/horizon-config" }
horizon-control = { path = "crates/horizon-control" }
horizon-terminal-core = { path = "crates/horizon-terminal-core" }
horizon-wire = { path = "crates/horizon-wire" }
horizon-workspace = { path = "crates/horizon-workspace" }
remoc = { workspace = true }
serde_json = "1.0"
termwiz = "0.23.3"
tokio = { version = "1.52", features = ["rt", "net", "io-util", "time", "macros"] }
# The theme settings view's explicit-Save writer (`src/theme_settings/save.rs`):
# edits only the `[theme]`/`[theme.ansi]` seed keys in the user's config
# file, preserving every other section, comment, and ordering byte-for-byte
# -- a plain `toml`-crate round trip (parse to a Rust struct, reserialize)
# would lose exactly that. Default features (`display`+`parse`) are enough;
# no `serde` feature needed since the writer edits the `DocumentMut` tree
# directly rather than (de)serializing a typed struct through it.
toml_edit = "0.25"
unicode-width = "0.2"
uuid = { version = "1.18", features = ["v4", "serde"] }

[lints.clippy]
all = { level = "warn", priority = -1 }

# Debug-build CPU profiles show the hot code lives almost entirely in
# dependencies (gpui's Scene::push_layer/BoundsTree comparisons ~31%,
# taffy layout ~16%), so optimize external crates even in dev builds.
# The `"*"` wildcard does not match workspace members, which keep the
# default dev opt-level for debuggability and fast incremental builds.
[profile.dev.package."*"]
opt-level = 3
