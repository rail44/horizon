[workspace]
members = [
    ".",
    "crates/horizon-agent",
    "crates/horizon-agent-acp",
    "crates/horizon-agent-host",
    "crates/horizon-board-flow",
    "crates/horizon-wiki-flow",
    "crates/horizon-agent-probe",
    "crates/horizon-daemon-testkit",
    "crates/horizon-shell-runtime",
    "crates/horizon-terminald",
    "crates/horizon-theme",
    "crates/horizon-control",
    "crates/horizon-cli",
    "crates/horizon-terminal-core",
    "crates/horizon-wire",
    "crates/horizon-config",
    "crates/horizon-workspace",
    "crates/horizon-markdown",
    "crates/horizon-sandbox",
    "crates/horizon-board",
    "crates/horizon-logd",
    "crates/horizon-wiki",
    "crates/horizon-ui",
    "crates/horizon-components",
    "crates/horizon-ui-macros",
    "crates/horizon-theme-css",
    "plugins/markdown",
    "plugins/theme-settings",
    "plugins/wiki",
    "plugins/sessions",
    "plugins/image",
    "plugins/status-bar",
    "plugins/gallery",
    "plugins/fixture",
]
resolver = "3"
# The DuckDB extensions are a sub-workspace (pinned to DuckDB's unstable C
# API v2 and its own libduckdb-sys features; see duckdb-ext/README.md).
exclude = ["duckdb-ext"]

# The one workspace-wide remoc pin (docs/remoc-adoption-design.md §1,
# "remoc version policy"): exact version (`=`), reviewed against the remoc
# changes for chmux/codec before any bump, and default features OFF so no
# `default-codec-*` feature is ever enabled. Every use names
# `codec::Postbag` explicitly (via `horizon_wire::WireCodec`), never
# `codec::Default`: the countermeasure to 0.18.0's silent change of the
# default (JSON -> Postbag). `rtc` pulls in `rch` + the derive macro;
# Postbag is the one codec compiled in (from 0.20 it is part of `serde`,
# with no feature of its own). (The vocabularies' JSON payloads travel as
# `contract::JsonValue` -- JSON text on this binary wire -- precisely so
# no second, self-describing codec is ever needed.)
# Every member takes these (`[lints] workspace = true`).
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# A dependency a member declares and does not use. The gate has warnings
# as errors (`scripts/gate.sh`).
[workspace.lints.cargo]
unused_dependencies = "warn"

[workspace.dependencies]
remoc = { version = "=0.20.6", default-features = false, features = ["rtc"] }
# The ACP SDK: an exact pin (docs/acp-agentd-implementation-plan.md). The
# shell and horizon-agent-acp are built with it from this workspace; what
# they compare is ACP's own protocol version.
agent-client-protocol = { version = "=5.4.0", features = ["unstable_protocol_v2", "unstable_session_fork", "unstable_session_cursors", "unstable_session_options"] }
# The UI stack (`docs/ui-foundation-migration-design.md`): Blitz is a beta,
# pinned to one release and patched below past it.
blitz-dom = "=0.3.0-beta.5"
blitz-traits = "=0.3.0-beta.5"
blitz-paint = { version = "=0.3.0-beta.5", features = ["custom-widget"] }
blitz-shell = "=0.3.0-beta.5"
# The layout engine blitz-dom lays out with, at the version the Blitz
# revision below takes: `horizon-ui` rounds its layout again with it
# (`crates/horizon-ui/src/display_scale.rs`), so moving Blitz moves this too.
taffy = { version = "0.16.0", default-features = false, features = ["std", "content_size"] }
reactive_graph = { version = "0.2", features = ["effects"] }
any_spawner = { version = "0.3", features = ["futures-executor"] }

# Blitz at upstream's main (2026-11-24), past its handling of a cancelled
# `pointerdown` (DioxusLabs/blitz#1641): a press whose default a handler
# prevents is still recorded, so the click that follows is dispatched. It
# is also past 0.3.0-beta.5 with upstream's fix for a resize of the window
# between an element's creation and its first style (DioxusLabs/blitz#1751),
# which panicked over an element sized by the viewport (the image viewer's).
# Upstream's fix for hit testing through a clip (DioxusLabs/blitz#1324)
# is not in main: until it is, rows scrolled out of a list take the clicks
# meant for what is drawn over them.
# What Horizon needs of the window beyond blitz-shell is done around it,
# in `src/application.rs`, which also holds copies of blitz-shell's
# `View::redraw` and `View::complete_resume` at this revision: moving the
# revision means comparing those copies with the new one's, and moving
# `taffy` above to the version the new one takes. Once upstream's own rounding to the display's
# pixels is in (DioxusLabs/blitz#902), `crates/horizon-ui/src/display_scale.rs`
# rounds no more.
[patch.crates-io]
blitz-shell = { git = "https://github.com/DioxusLabs/blitz", rev = "084aa573539a4e099fbca852c6e5874e65371938" }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "084aa573539a4e099fbca852c6e5874e65371938" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "084aa573539a4e099fbca852c6e5874e65371938" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "084aa573539a4e099fbca852c6e5874e65371938" }
# winit at upstream's fix for Wayland clipboard text (rust-windowing/winit
# db09864, "winit-wayland: fix some text not being copied due to missing
# mime types"), not in a release yet. 0.31.0-beta.4 offers copied text as
# `text/plain; charset=utf-8` and `text/plain` only, without the standard
# `text/plain;charset=utf-8` or `UTF8_STRING`, so an application that reads
# one of those pastes nothing of what Horizon copied. The crates move
# together: winit-wayland alone leaves two winit-cores in the graph. Drop
# these once a release has the fix.
winit = { git = "https://github.com/rust-windowing/winit", rev = "db098642637c7e073327c298831678f46a1bb5ed" }
winit-core = { git = "https://github.com/rust-windowing/winit", rev = "db098642637c7e073327c298831678f46a1bb5ed" }
winit-common = { git = "https://github.com/rust-windowing/winit", rev = "db098642637c7e073327c298831678f46a1bb5ed" }
winit-wayland = { git = "https://github.com/rust-windowing/winit", rev = "db098642637c7e073327c298831678f46a1bb5ed" }
winit-x11 = { git = "https://github.com/rust-windowing/winit", rev = "db098642637c7e073327c298831678f46a1bb5ed" }

[package]
name = "horizon"
description = "Horizon: the shell's window and the control plane's client."
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
horizon-ui = { path = "crates/horizon-ui" }
horizon-components = { path = "crates/horizon-components" }
horizon-board = { path = "crates/horizon-board" }
horizon-workspace = { path = "crates/horizon-workspace" }
keyboard-types = "0.8"
pulldown-cmark = "0.13"
horizon-theme-css = { path = "crates/horizon-theme-css" }
horizon-config = { path = "crates/horizon-config" }
horizon-cli = { path = "crates/horizon-cli" }
horizon-control = { path = "crates/horizon-control" }
horizon-wire = { path = "crates/horizon-wire" }
horizon-theme = { path = "crates/horizon-theme" }
horizon-shell-runtime = { path = "crates/horizon-shell-runtime" }
horizon-terminal-core = { path = "crates/horizon-terminal-core" }
anyrender = "0.15"
anyrender_vello = "0.16"
# A terminal draws the rows it keeps as pixels with Vello itself, on the
# window's device (`src/terminal/store.rs`).
vello = "0.12"
# The hash a terminal's row store finds rows by (`src/terminal/slots.rs`).
foldhash = "0.2"
# The terminal's screen is a widget that paints itself: both crates draw
# one only with this feature on.
blitz-dom = { workspace = true }
blitz-paint = { workspace = true }
blitz-shell = { workspace = true, features = ["custom-widget"] }
blitz-traits = { workspace = true }
# The window's event loop around blitz-shell's (`src/application.rs`).
winit = "=0.31.0-beta.4"
crossbeam-channel = "0.5"
ignore = "0.4"
# Whether a `file://` link names a file on this machine (`src/workspace/links.rs`).
gethostname = "1"
# A file's media type from its name (`src/media_type.rs`).
mime_guess = { version = "2", default-features = false }
nucleo = "0.5"
# Reads an extension's manifest out of its component: the version
# wasmtime itself is built on.
wasmparser = "0.263"
futures = "0.3"
kurbo = "0.13"
notify = "9"
# `complex-scripts`: the word breaker with its dictionary for Chinese and
# Japanese. Without it a debug build writes a warning to stderr for each
# such run of text it shapes.
parley = { version = "0.13", features = ["complex-scripts"] }
peniko = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["rt", "net", "time", "macros", "io-util", "sync"] }
termwiz = { version = "0.23.3", features = ["use_serde"] }
unicode-width = "0.2"
toml_edit = "0.25"
uuid = { version = "1.18", features = ["v4"] }
# The desktop's notification service (`src/desktop_notify.rs`).
notify-rust = "4"
# The runtime a preview's plugin runs in (`src/preview.rs`).
wasmtime = { version = "51", default-features = false, features = [
    "async",
    "cache",
    "demangle",
    "runtime",
    "cranelift",
    "component-model",
    "parallel-compilation",
    "wave",
] }
wasmtime-wasi = "51"

[dev-dependencies]
# The terminal view's tests run the terminal core over a PTY of their own.
portable-pty = "0.9.0"
# The view painted into pixels, with no window and no GPU.
anyrender_vello_cpu = "0.19"
# The wiki a test of the wiki's extension is shown over.
horizon-wiki = { path = "crates/horizon-wiki" }
# An image larger than the window, written for the image viewer's test.
png = "0.18"
# A component written as text, for what the host says of one it cannot
# take (`src/plugin_host.rs`).
wat = "1"

# Scenarios that time the views a frame at a time, with no window
# (`docs/performance-scenarios.md`). Not a test and not in the gate.
[[bench]]
name = "scenarios"
path = "benches/scenarios/main.rs"
harness = false

[lints]
workspace = true

# A dependency's generic code is compiled in the crate that instantiates
# it, at that crate's opt-level: the painting and text code a view runs
# (blitz-paint, parley) is emitted in the workspace members, not in the
# dependencies. At opt-level 0 the scenarios' frames
# (`docs/performance-scenarios.md`, run with `--profile dev`) took about
# twice as long as at 1. The cost is in the first build after a member
# changes: about twice as long for the root package (12 s against 23 s,
# measured 2026-11-27); the incremental builds after it took the same
# time at either level.
#
# A dev build carries the line tables a backtrace names files and lines
# with, for the members only: the dependencies' were most of every
# binary's size (the `horizon` binary 508 MiB against 209 MiB without
# them, the test binaries 11.0 GiB against 3.9 GiB, measured
# 2026-11-27), and a frame in a dependency still has its function's
# name. A `rustflags` entry that sets `-C debuginfo` (a
# `~/.cargo/config.toml` of the machine's) comes after these and
# overrides them.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Layout, shaping and rasterizing run in the dependencies, so they are
# optimized fully even in dev builds. The `"*"` wildcard matches every
# package that is not a workspace member.
[profile.dev.package."*"]
opt-level = 3
debug = false

# A build a debugger can show the variables of:
# `cargo build --profile debugging`, into `target/debugging`.
[profile.debugging]
inherits = "dev"
opt-level = 0
debug = true

[profile.debugging.package."*"]
debug = true
