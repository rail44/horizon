# Horizon configuration (example / template).
#
# Location: Horizon reads exactly one config file, from exactly one place —
# there is no layered system/user/project merge.
#
#     $XDG_CONFIG_HOME/horizon/config.toml
#     (falls back to ~/.config/horizon/config.toml if XDG_CONFIG_HOME is unset)
#
# Copy this file there to start customizing Horizon, or point HORIZON_CONFIG
# at a file anywhere else (mainly useful for testing, or for running more
# than one Horizon configuration side by side):
#
#     HORIZON_CONFIG=/path/to/my-config.toml horizon
#
# Precedence: environment variable > this file > built-in default. Existing
# env vars (OPENAI_API_KEY, EXA_API_KEY, OPENAI_BASE_URL, ...) keep winning
# over whatever is set below.
#
# Models are chosen by three top-level { provider, model } pairs:
# default_model for conversation sessions, small_model for AI titles (and
# approval judgments when no decision model is available), and
# decision_model for automatic approval judgments and turn-continuation
# checks. [[providers]] entries describe endpoints and
# credentials only. See docs/provider-configuration.md. Without provider
# entries, the built-in OpenAI-compatible endpoint entry "default" is used;
# there is no built-in model.
#
# Everything
# this file used to also cover -- the whole former [agent] section (bash/fs
# tool caps, turn-loop guard thresholds, event/state DB paths, stream-flush
# cadence, history/instructions budgets), [provider] temperature/max_tokens,
# [terminal] line_height/term/shell/shell_args/scrollback_lines, [ui]
# window_width/window_height -- is now a fixed built-in default or constant;
# there is no file key for any of it any more. A handful of those retired
# knobs still have an environment-variable-only override (no file key at
# all) -- see "Environment-only overrides" near the bottom.
#
# Reload Config applies theme, keybindings, and provider configuration live.
# Provider changes affect new sessions and future title calls. Existing sessions
# keep their conversation and decision connections; an explicit model switch can
# select a newly configured conversation provider. [terminal]/[ui] need a restart,
# except the runtime-only font zoom commands.
#
# Secrets never go here. OPENAI_API_KEY and the web-search adapter's
# EXA_API_KEY are environment-only; there is no field for either in this file.
# The same rule covers [[providers]]: its api_key_env records the environment
# variable's *name* only (per provider), never a value.
#
# Setting a key this file used to support (a "retired" key) gets the same
# "probable typo" treatment as any other unrecognized key at the top level or in a known
# section: warned about on stderr, naming the key, and ignored -- it never
# crashes startup. The same "never fail startup" policy applies to this
# whole file: if it fails to parse, Horizon logs a warning and falls back
# to built-in defaults everywhere.

# ---------------------------------------------------------------------------
# default_model / small_model / decision_model — which model runs when
# nothing else chose one.
#
# All three are TOP-LEVEL keys, so they go before any table header. Each is an
# inline table with exactly two keys: provider (a [[providers]] entry name)
# and model (the model id, written out).
#
# - default_model: what a conversation session runs until you switch models.
#   Unset, or naming no [[providers]] entry: there is no model at all —
#   startup warns naming the key, and sessions start in the deterministic
#   fallback (no provider is called) with a first message saying so.
# - small_model: the model AI titles run on, and automatic approval
#   judgments when no decision model is available. Its provider must be an
#   openai-compatible entry, whose base_url and api_key_env serve it. Unset
#   or invalid (warned at startup), or its key variable unset: tabs keep
#   their raw titles and that fallback judge is off; it never borrows
#   another entry's credentials.
# - decision_model: the decision model (System One API, POST
#   {base_url}/systemone) automatic approval judgments and turn-continuation
#   checks ask. Its provider must be an openai-compatible entry whose
#   base_url serves the System One route, e.g. an entry with base_url
#   "https://ollama.com/v1" and model "clef:cloud"; that entry's
#   api_key_env serves it. Unset or invalid, or its key variable unset:
#   startup warns naming the key, automatic approval judgments fall back to
#   small_model (approval stays with you when that is unavailable too), and
#   turn-continuation checks are off. Ollama cloud needs a paid plan or credits.
#
# default_model  = { provider = "synthetic", model = "hf:deepseek-ai/DeepSeek-V4.1-Flash" }
# small_model    = { provider = "synthetic", model = "syn:small:text" }
# decision_model = { provider = "ollama", model = "clef:cloud" }

# ---------------------------------------------------------------------------
# [[providers]] — endpoints and credentials, one entry per provider.
#
# - Entries are listed in the order written; the picker shows them in that
#   same file order. Commented out below: both fall back per the rules noted.
# - kind: "openai-compatible" (default — any endpoint speaking OpenAI's
#   chat-completions wire) or "anthropic". rig-core bundles both; no feature
#   gates.
# - api_key_env: the environment variable's *name* the entry's API key is
#   read from — never a value (see the header's secrets rule). Unset means
#   the kind's own variable name: OPENAI_API_KEY for openai-compatible,
#   ANTHROPIC_API_KEY for anthropic. An entry whose variable is not set is
#   registered but unavailable (grayed out, not hidden); sessions on it run
#   the ordinary deterministic fallback instead of calling the provider.
# - base_url: unset means rig's own default endpoint for the kind
#   (https://api.openai.com/v1 / https://api.anthropic.com); env
#   OPENAI_BASE_URL / ANTHROPIC_BASE_URL win when set.
# - There is no model here: the picker's candidates are whatever the
#   provider's own GET /models listing answers (fetched when you drill into
#   the entry), and default_model / small_model / decision_model above name
#   the models that
#   run when nothing else chose one.
#
# [[providers]]
# name = "synthetic"
# base_url = "https://api.synthetic.new/openai/v1"
# api_key_env = "SYNTHETIC_API_KEY"
#
# [[providers]]
# name = "claude"
# kind = "anthropic"
# api_key_env = "ANTHROPIC_API_KEY"

# ---------------------------------------------------------------------------
# [terminal] — cell rendering metrics for the spawned shell.
#
# Everything this section used to also cover is fixed now: line height is
# always font_size * 18/13 (not independently settable), TERM is always
# "xterm-256color" (paired with a COLORTERM=truecolor injection so truecolor
# detection works), the spawned shell is always $SHELL (falling back to
# /bin/sh) with no extra argv, and scrollback is always 10000 lines.
# ---------------------------------------------------------------------------
[terminal]
# The app-wide font size (px), despite living in this section: terminal
# cells, the agent transcript, and the task board are all drawn from it
# (the board's type scale and spacing scale with it). The Increase / Decrease
# / Reset Font Size commands move it live for all of them; Reset returns to
# this value. Active below because it's the current production default,
# shown as a live, editable reference — not because you need to set it.
font_size = 13.0

# ---------------------------------------------------------------------------
# [ui] — the app-wide font family, shared by the terminal, agent transcript,
# and workspace agent controls. The app-wide font size is [terminal]
# font_size above (terminal, agent transcript, board), moved live by the
# font-size commands. The window's initial size is fixed now (1100x720),
# not configurable.
# ---------------------------------------------------------------------------
[ui]
# Comma-separated font stack: the first entry is the primary family, the
# rest are fallbacks tried in glyph order (e.g. CJK falling through to the
# primary monospace font). Entries are matched by exact family name, the
# same way `fc-list` reports them -- fontconfig generic aliases like
# "monospace" are not resolved the way `fc-match` resolves them and will
# simply be skipped if no installed font is literally named that. Commented
# out: the built-in default is platform-specific ("Menlo" on macOS,
# "DejaVu Sans Mono" elsewhere), not a single literal worth showing as live.
# font_family = "Iosevka Nerd Font Mono, Noto Sans Mono CJK JP, monospace"

# ---------------------------------------------------------------------------
# [keybindings] — key chord string -> command id, layered on top of
# Horizon's built-in default bindings (overriding a default bound to the
# same chord, or adding a new one).
#
# Chord syntax: modifiers joined with `+`, ending in the key itself —
# `ctrl`/`control`, `shift`, `alt`/`option`, `meta`/`cmd`/`command`/`super`/
# `win`, then a single character (`t`, `1`, ...) or a named key (`enter`,
# `escape`, `tab`, `space`, `backspace`, `delete`, `up`/`arrowup`, `down`,
# `left`, `right`, `home`, `end`, `pageup`, `pagedown`). Case-insensitive.
#
# Command ids (see `crates/horizon-workspace/src/commands.rs`'s `CommandId`):
# split-right (opens the palette's view chooser to split the active pane
# horizontally), split-down (same chooser, but vertically), new-tab (opens the
# chooser to open a new tab), focus-next-pane, close-active-pane,
# close-active-tab, terminate-active-session, terminate-all-detached-sessions,
# approve-tool-call, deny-tool-call, cancel-agent-turn, continue-agent-turn,
# switch-model, reload-agent-runtime, reload-terminal-runtime (restarts horizon-terminald --
# destructive: every terminal session ends), reload-config, manage-sessions
# (opens the session manager modal), open-terminal-in-session-directory,
# open-board, toggle-board-expansion, toggle-board-finished-band,
# open-board-organizer, open-board-task-session, open-board-related-item,
# back-board-list, add-board-task, post-board-message, move-board-task-up,
# move-board-task-down, reorder-board-task, save-board-state,
# toggle-board-closed,
# reload-preview (reload the active preview pane's plugin from disk),
# increase-font-size / decrease-font-size / reset-font-size (move the live
# app-wide font size: terminal, agent transcript, board; already bound by default to the platform-standard zoom
# chords -- cmd+= / cmd+- / cmd+0 on macOS, ctrl+= / ctrl+- / ctrl+0 on
# Linux/Windows (one built-in set spelled via gpui's `secondary` modifier), so
# an entry here overrides that default). The reserved pseudo-command
# `open-palette` is also accepted here — it isn't a real `CommandId` (opening
# the palette isn't an operation the palette itself can list or run), and
# overrides the chord that opens the command palette. Unbound by default:
# the palette is a workspace-mode resident (`:` inside the mode, see below)
# rather than a global shortcut, so this only matters if you want one back.
#
# Likewise, the reserved pseudo-command `workspace-mode` overrides the
# chord that enters workspace mode (`ctrl+'` by default -- see
# `docs/workspace-mode-design.md`).
#
# An unparsable chord or an unrecognized command id is warned about on
# stderr and skipped — never a startup failure.
# ---------------------------------------------------------------------------
[keybindings]
# "ctrl+shift+t" = "new-tab"
# "ctrl+shift+p" = "open-palette"
# "ctrl+'" = "workspace-mode"
# "ctrl+." = "cancel-agent-turn"
# Font-size example: rebind zoom-in from its built-in default chord
# (cmd+= on macOS, ctrl+= on Linux/Windows).
# "alt+=" = "increase-font-size"

# ---------------------------------------------------------------------------
# [theme] — the app's one color scheme. Since 2026-07-16
# (docs/theme-design.md's "config surface narrowed to the seed" decision)
# this section is EXACTLY the seed: three keys here plus the six normal
# [theme.ansi] hue slots below. Every other role -- text colors, semantic
# colors, surfaces, borders, diff colors, the terminal's own
# foreground/background/cursor, the ANSI black/white/bright_* slots -- is
# derived from the seed; none of them are independently settable any more.
# If you don't like a derived value, tune the seed (or the derivation
# itself, in `src/theme/scheme.rs`) rather than looking for a per-role override --
# that escape hatch is gone by design (an interactive settings view is the
# planned way to explore this without editing files by hand).
#
#   surface_base — the seed's anchor, a hex color. Its own lightness
#     decides the scheme's polarity (dark vs. light) automatically; no
#     separate switch.
#   accent — the app's one focus/selection accent. Either a hex value OR
#     one of the six [theme.ansi] hue names below ("red"/"green"/"yellow"/
#     "blue"/"magenta"/"cyan") as a slot reference -- e.g. `accent = "blue"`
#     resolves to [theme.ansi]'s blue (after any override), and every
#     downstream accent derivation is identical either way.
#   text_contrast — the one continuous knob: the WCAG contrast ratio the
#     derived foreground text targets against surface_base. A number,
#     clamped to [4.5, 21.0]; defaults to 15 (the built-in dark scheme's
#     own measured ratio, so leaving this unset keeps today's look).
#     Unparsable values (including a non-numeric TOML type) fall back to
#     the default silently.
#
# Setting any of the ~20 role keys this section used to document directly
# (text_primary, text_muted, text_subtle, danger, warning, success, info,
# surface_panel, surface_raised, surface_chrome, surface_selected,
# border_default, border_subtle, diff_added_surface, diff_added_text,
# diff_removed_surface, diff_removed_text, terminal_foreground,
# terminal_background, terminal_cursor, cursor_accent) is warned about on
# stderr as an unrecognized key and ignored -- same for any other
# unrecognized name or an unparsable hex value, which fall back to the
# built-in/derived default as before.
# ---------------------------------------------------------------------------
[theme]
# surface_base = "#f6f6f6"
# accent = "#84dcc6"
# accent = "blue"        # equivalent to [theme.ansi]'s blue, see above
# text_contrast = 15

# ---------------------------------------------------------------------------
# [theme.ansi] — the seed's hue set: the six normal ANSI colors
# (red/green/yellow/blue/magenta/cyan), as `#rrggbb`/`#rgb` hex strings.
# Used by the terminal verbatim (never auto-adjusted, even though the
# UI-side color derived from the same hue, e.g. `danger` from `red`, is
# contrast-snapped for readability) and doubles as the seed's own hue set
# above `[theme]`'s `text_contrast`/`surface_base` derive against.
#
# Active (uncommented) below because these are the current production
# defaults, shown here as a live, editable reference — not because you need
# to set them, matching [terminal] above. An unparsable hex value is warned
# about on stderr and skipped, leaving that one slot at its built-in
# default.
#
# black, white, and the eight bright_* slots are no longer independently
# configurable (2026-07-16, docs/theme-design.md) -- they derive from the
# seed too (`black`/`white` track the resolved background/foreground;
# `bright_black` tracks text_subtle; the six colored `bright_*` hues and
# `bright_white` are a fixed lightness push off their normal counterpart).
# Setting any of them here is warned about on stderr as no longer
# configurable and ignored.
# ---------------------------------------------------------------------------
[theme.ansi]
red = "#e06c75"
green = "#98c379"
yellow = "#e5c07b"
blue = "#61afef"
magenta = "#c678dd"
cyan = "#56b6c2"

# ---------------------------------------------------------------------------
# [grants] — per-project filesystem trees and network destinations agent
# sessions start with.
#
# An agent session's `bash` runs sandboxed: its own isolated worktree is
# writable and everything else is not. That is right for the session's own
# edits, but a build toolchain reaches well outside it on essentially every
# invocation (package caches, lock files, shared build directories), and
# those paths differ from run to run — so a session that has to ask for each
# one stalls unpredictably instead of finishing.
#
# A [[grants.project]] entry says, once, which directories developing THIS
# project legitimately writes to. Sessions of that project start with those
# trees already writable, so reaching them is no longer a boundary crossing
# and never produces an approval prompt.
#
#   root  — the project's main-repository toplevel (the directory `git
#           rev-parse --show-toplevel` reports). A session working in an
#           isolated worktree Horizon created under `.horizon/worktrees/`
#           resolves back to this same root, so isolated sessions inherit
#           the project's grants automatically. Matched exactly: naming a
#           parent directory does NOT cover the projects beneath it.
#   trees — directories granted read-write, recursively. A leading "~/" is
#           expanded against $HOME.
#   network — network destinations a sandboxed session of this project may
#           reach beyond the empty runtime-approval default, dispatched by
#           shape (owner decision 2026-08-02, replacing the short-lived
#           loopback_connect key with no compatibility alias):
#             - An entry that parses as "ip:port" (e.g. "127.0.0.1:4226") is
#               a direct-connect endpoint, alongside the session's own
#               domain proxy. Matched by full ip:port equality (never a
#               looser is_loopback rule), so a same-port decoy on another
#               loopback address stays denied. Only IPv4 loopback
#               (127.0.0.0/8) with a non-zero port is accepted; IPv6 and
#               non-loopback ip:port entries are refused. The connect is
#               performed by the unsandboxed supervisor on a duplicated
#               child socket (TOCTOU-safe): granting an endpoint means the
#               session talks to that host-local service outside its own
#               containment -- an explicit decision, not an accident.
#               (A compile-cache daemon on 127.0.0.1:4226 was the original
#               motivating use; the mechanism is service-agnostic.)
#             - Anything else is a domain name, pre-seeded into the
#               session's network-proxy allowlist so a sandboxed `bash` call
#               reaching it is never a boundary crossing either -- no
#               judge/approval round trip needed. The runtime
#               approve-on-denial flow still applies for any domain not
#               listed here.
#
# Refused with a warning on stderr (and ignored): a tree that is $HOME
# itself, "/", or a system directory such as /usr, /etc, /var, /tmp; a
# network entry shaped like "ip:port" that is not an IPv4 loopback address
# with a non-zero port; or a network entry that looks like a URL, contains
# "/", or contains whitespace. Those would put the sandbox's whole purpose
# inside the grant, or silently fail to mean the domain name it looks like.
#
# This lives here, in YOUR config file, and deliberately not in the
# repository: a tracked project file would let a repository you cloned widen
# its own authority the moment you opened an agent session in it. Nothing in
# Horizon writes this section for you — the approval flow can add a grant to
# a running session, but only you can make one persistent. Keep the list
# short and deliberate; a tree grant includes any tool configuration living
# inside it, which can influence later runs of that tool.
#
# Applied at session spawn only. Existing sessions keep the grants they
# started with; "Reload Agent Runtime" picks changes up for new ones —
# same lifecycle as [provider].
#
# Commented out: there is no built-in default, and an active entry here
# would grant real access to anyone who copied this file verbatim.
# [[grants.project]]
# root    = "/home/you/src/github.com/you/your-project"
# trees   = ["~/.cargo"]
# network = ["127.0.0.1:4226"]

# ---------------------------------------------------------------------------
# trusted_projects — repository trust gate (owner decision 2026-08-05).
#
# A top-level array of absolute repository toplevels. An agent session whose
# project root is NOT listed here gets embedded skills only (no .horizon/skills/
# repository skills) and no AGENTS.md/CLAUDE.md repository instructions in its
# system prompt. A session whose project root IS listed here gets both, as
# before. Behavioral defense (sandbox, approval) is unaffected either way — an
# untrusted session still runs, just without repository-authored prompt
# content.
#
# Each entry is a project's main-repository toplevel (the directory `git
# rev-parse --show-toplevel` reports) — the same semantics as [[grants.project]]
# `root`. A session in an isolated worktree under .horizon/worktrees/ resolves
# back to this root, so isolated sessions inherit the project's trust. Matched
# exactly: naming a parent directory does NOT cover the projects beneath it.
# A leading "~/" is expanded against $HOME.
#
# This lives here, in YOUR config file, for the same reason [grants] does: a
# tracked project file would let a cloned repository inject its own
# instructions and skills into the prompt the moment an agent session opened
# it — the classic prompt-injection surface. The unconditional acceptance of
# that surface (recorded 2026-07-07) is replaced by this explicit, user-owned,
# per-project decision.
#
# Applied at session spawn only. Existing sessions keep the trust they started
# with; "Reload Agent Runtime" picks changes up for new ones — same lifecycle
# as [grants].
#
# Commented out: an empty list (the default) means every project is untrusted,
# including this one — no AGENTS.md or repository skills load until you add an
# entry. Add your own repository toplevel below to trust it.
# trusted_projects = ["/home/you/src/github.com/you/your-project"]

# ---------------------------------------------------------------------------
# Environment-only overrides — no [agent] file key exists for any of these
# any more (the whole section retired 2026-07-18), but the event log's and
# DuckDB projection's paths are still relocatable via env var:
#
#   HORIZON_AGENT_EVENT_LOG   overrides the agent event log (JSONL) path
#                             (default: $XDG_DATA_HOME/horizon/agent-events.jsonl,
#                             falling back to ~/.local/share/horizon/agent-events.jsonl)
#   HORIZON_AGENT_STATE_DB    overrides the DuckDB projection database path
#                             (default: $XDG_DATA_HOME/horizon/agent-state.duckdb,
#                             same fallback as above)
#   HORIZON_MODEL_CATALOG_URL overrides where the model catalog (context
#                             windows for providers whose /models listing
#                             declares none) is fetched from
#                             (default: https://models.dev/api.json)
#   HORIZON_MODEL_CATALOG_CACHE overrides the catalog's cached copy
#                             (default: $XDG_CACHE_HOME/horizon/models-dev-api.json,
#                             falling back to ~/.cache/horizon/...)
#
# A leading "~/" in either is expanded against $HOME. Every other former
# [agent] knob (bash/fs tool caps, the turn-loop guard's iteration cap and
# doom-loop window, stream-flush cadence, history/instructions budgets) has
# no override path left at all -- fixed built-in constants in
# `crates/horizon-agent/src/config.rs`.
# ---------------------------------------------------------------------------
