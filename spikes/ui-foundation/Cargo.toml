[package]
name = "ui-foundation-spike"
description = "Spike: run-once components over signals, writing a blitz-dom document."
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace: nothing here is part of Horizon's build or its gate.
[workspace]

[dependencies]
blitz-dom = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
reactive_graph = { version = "0.2", features = ["effects"] }
any_spawner = { version = "0.3", features = ["futures-executor"] }
blitz-paint = { version = "=0.3.0-beta.4", features = ["custom-widget"] }
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
png = "0.17"
kurbo = "0.13"
peniko = "0.6"
blitz-shell = "=0.3.0-beta.4"
anyrender_vello = "0.15"
parley = "0.12"
wgpu = "30"
pollster = "0.4"
pulldown-cmark = "0.13"
keyboard-types = "0.8"

[profile.release]
opt-level = 3

# blitz-shell with one change, marked in `vendor/blitz-shell/src/lib.rs`:
# the input method is enabled with its cursor area.
[patch.crates-io]
blitz-shell = { path = "vendor/blitz-shell" }
# Blitz at the head of upstream's fix for hit testing through a clip
# (DioxusLabs/blitz#1324, 58 commits past 0.3.0-beta.4, not merged when this
# was written): content scrolled out of a box no longer takes the clicks
# meant for what is drawn over it.
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "bf5813a1c042c2dad5b80e36f6a612b85adb85dd" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "bf5813a1c042c2dad5b80e36f6a612b85adb85dd" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "bf5813a1c042c2dad5b80e36f6a612b85adb85dd" }
