[package]
name = "horizon-status-bar-plugin"
description = "The status bar at the bottom of the window: the keys of where the keys are, each with what it does."
version = "0.1.0"
edition = "2024"
publish = false

# Built for `wasm32-wasip2` (`scripts/extensions.sh`); for any other
# target the crate is empty.
[lib]
crate-type = ["cdylib"]

[target.'cfg(target_family = "wasm")'.dependencies]
horizon-ui = { path = "../../crates/horizon-ui" }
wit-bindgen = { version = "0.63", features = ["async", "async-spawn", "inter-task-wakeup"] }

[lints]
workspace = true
