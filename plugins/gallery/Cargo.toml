[package]
name = "horizon-gallery-plugin"
description = "The components in every kind they have, on one page: an extension to look at them in, not one the shell comes with."
version = "0.1.0"
edition = "2024"
publish = false

# Built for `wasm32-wasip2` (`scripts/extensions.sh`); for any other
# target the crate is empty.
[lib]
crate-type = ["cdylib"]

[target.'cfg(target_family = "wasm")'.dependencies]
horizon-ui = { path = "../../crates/horizon-ui" }
horizon-components = { path = "../../crates/horizon-components" }
wit-bindgen = { version = "0.63", features = ["async", "async-spawn", "inter-task-wakeup"] }

[lints]
workspace = true
