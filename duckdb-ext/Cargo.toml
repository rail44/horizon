[workspace]
members = ["git-history", "git-history-core", "scip-index", "scip-index-core", "scip-probe"]
# A host of the extension, kept out so its libduckdb-sys features stay apart.
exclude = ["host-check"]
resolver = "3"

[workspace.package]
edition = "2024"

[profile.release]
lto = true
strip = true
