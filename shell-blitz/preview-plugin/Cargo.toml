[package]
name = "horizon-blitz-preview-plugin"
description = "The Blitz shell's views as a wasm plugin a preview pane loads."
version = "0.1.0"
edition = "2024"
publish = false

# Built for `wasm32-wasip2` (`scripts/check-preview.sh`); for any other
# target the crate is empty.
[lib]
crate-type = ["cdylib"]

[target.'cfg(target_family = "wasm")'.dependencies]
horizon-ui = { path = "../ui" }
horizon-blitz = { path = "../app" }
horizon-board = { path = "../../crates/horizon-board" }

[lints.clippy]
all = { level = "warn", priority = -1 }
