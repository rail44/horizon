# What the agent's `bash` tool is contained by
# (`docs/sandbox-runtime-design.md`): the seam to an off-the-shelf sandbox
# runtime, with Fence behind it, and the filesystem grants a contained call
# may use beyond its workspace.
[package]
name = "horizon-sandbox"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
# The settings file of one contained call (`runtime::fence`).
tempfile = "3"

[dev-dependencies]
# `tests/fence.rs` ends a contained command's process group.
libc = "0.2"

[lints]
workspace = true
