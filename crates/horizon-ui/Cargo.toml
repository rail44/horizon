[package]
name = "horizon-ui"
description = "Horizon's layer between signals and a blitz-dom document."
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
blitz-traits = { workspace = true }
reactive_graph = { workspace = true }
any_spawner = { workspace = true }

# The document is the host's: a view built into a wasm plugin reaches it
# over `wit/plugin.wit` (`src/guest.rs`).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
blitz-dom = { workspace = true }
# Stylo's switches, to turn `@scope` on (`src/sheet.rs`): the copy Blitz's
# Stylo reads, so the revision Blitz pins. A Blitz bump moves it.
stylo_static_prefs = { git = "https://github.com/servo/stylo", rev = "cd230184a620c3e6c0f25faa07838fddcefec32d" }

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.41"
keyboard-types = "0.8"

[dev-dependencies]
keyboard-types = "0.8"

[lints.clippy]
all = { level = "warn", priority = -1 }
