[package]
name = "horizon-wiki"
version = "0.1.0"
edition = "2021"

# The project wiki as an extension package (docs/project-wiki-design.md):
# its store, pages, concept file, comment threads anchored with a subset of
# W3C Web Annotation, and the skill that maintains it. Depends on neither
# horizon-agent nor gpui; horizon-agentd and the shell compose it.
[dependencies]
# The front matter a page's view model splits off the body.
horizon-workspace = { path = "../horizon-workspace" }
libc = "0.2"
# The parser gpui-component's TextView renders Markdown with, so the logical
# text built here and the view's rendering read the same syntax tree.
markdown = "=1.0.0"
# The page tools' result types derive their schemas, from which the agent
# catalog renders each tool's field legend (horizon-agent's output_legend).
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "v5", "serde"] }

[dev-dependencies]
# Validates generated annotations against the W3C test suite's draft-04
# schemas (tests/wpt). No network or file resolution: every schema is
# registered from the vendored copies.
jsonschema = { version = "0.61", default-features = false }
tempfile = "3"

[lints.clippy]
all = { level = "warn", priority = -1 }
