[package]
name = "horizon-wiki"
version = "0.1.0"
edition = "2021"

# The project wiki (docs/project-wiki-design.md): its store, pages,
# concept file, and comment threads anchored with a subset of W3C Web
# Annotation. No UI and nothing of an agent's: the wiki's view
# (`plugins/wiki`, a wasm guest) and `horizon-wiki-agent` are over it.
[dependencies]
# The front matter a page's view model splits off the body.
horizon-markdown = { path = "../horizon-markdown" }
libc = "0.2"
# The parser gpui-component's TextView renders Markdown with, so the logical
# text built here and the view's rendering read the same syntax tree.
markdown = "=1.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]
# Validates generated annotations against the W3C test suite's draft-04
# schemas (tests/wpt). No network or file resolution: every schema is
# registered from the vendored copies.
jsonschema = { version = "0.61", default-features = false }
tempfile = "3"

[lints.clippy]
all = { level = "warn", priority = -1 }
