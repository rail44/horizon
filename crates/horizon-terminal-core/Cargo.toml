[package]
name = "horizon-terminal-core"
version = "0.1.0"
edition = "2021"

# `docs/session-daemon-design.md` decision 9: the terminal's byte-driven
# brain (VT emulation + the 16ms-coalescing/sync-failsafe session loop),
# extracted headless -- no `floem`/`ui` dependency, mirroring
# `crates/horizon-agent`. PTY ownership (`portable-pty`, threads,
# environment) stays in the `horizon` binary; this crate only ever sees
# bytes in and commands/updates out over plain channels.
[dependencies]
alacritty_terminal = "0.26.0"
crossbeam-channel = "0.5"
# The `wire` module only (docs/runtime-crate-alignment-design.md judgment
# 3): the domain-free negotiation/codec/caps foundation, and the remoc rtc
# trait plus channel halves this runtime's hub is made of. Nothing else in
# this crate touches either.
horizon-wire = { path = "../horizon-wire" }
remoc = { workspace = true }
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1.0", features = ["derive"] }
# Real (non-dev) dependency since the schemars derives name
# `serde_json::Value` as the schema stand-in for termwiz-owned key types.
serde_json = "1.0"
termwiz = { version = "0.23.3", features = ["use_serde"] }
# Observation facade for the session loop's internal transition points.
# No subscriber is wired up in production (`horizon-terminald` never installs
# one), so these events are no-ops at runtime; tests install a per-test
# in-memory capture layer (see `tests` module) to assert on loop behavior by
# event order instead of wall-clock waits (board #9, docs/issues/015).
# `max_level_debug` is required for `debug!` macros to compile in at all
# (without it, tracing's compile-time filter strips them to no-ops).
tracing = { version = "0.1", features = ["max_level_debug"] }
unicode-width = "0.2"
uuid = { version = "1.18", features = ["serde"] }

[dev-dependencies]
# Only used to build OSC 52 clipboard-write test fixtures, same as the
# pre-extraction `horizon` crate's dev-dependency this one replaces.
base64 = "0.22"
serde_json = "1.0"
# The session-loop tests' in-memory event-capture subscriber (board #9).
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }
# The live-connection wire tests (`tests/frame_watch.rs`,
# `tests/limits.rs`), which host both ends of a real remoc connection over
# a `UnixStream` pair.
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
