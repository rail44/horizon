[package]
name = "horizon-board"
version = "0.1.0"
edition = "2021"

[dependencies]
horizon-wire = { path = "../horizon-wire" }
libc = "0.2"
remoc = { workspace = true }
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# The write path is now a socket client of `horizon-logd`: each write method
# spins up a current-thread runtime, connect-or-spawns the daemon, and makes
# one `ingest` rtc call. Reads stay synchronous file folds.
tokio = { version = "1.52", features = ["rt", "net", "time", "macros"] }

[dev-dependencies]
# The write-path tests spawn a real `horizon-logd` binary; the testkit owns
# the binary-resolution + scratch-socket + DaemonProcess contract.
horizon-daemon-testkit = { path = "../horizon-daemon-testkit" }

[lints.clippy]
all = { level = "warn", priority = -1 }
