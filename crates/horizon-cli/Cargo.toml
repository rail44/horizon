[package]
name = "horizon-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
horizon-board = { path = "../horizon-board" }
horizon-control = { path = "../horizon-control" }
# `wiki` resolves the caller's project wiki and page file itself, so the
# shell is handed a path as `markdown` hands it one.
# Not a "new" dependency in spirit: `horizon-control::contract::{Invoke,
# Query}::args`/`what` are typed as `serde_json::Value`, and Rust's extern
# prelude only makes a *direct* dependency's items nameable -- so building
# an `Invoke`/`Query` payload at all requires this crate directly, even
# though it never appears in horizon-cli's own public surface. Already a
# workspace dependency (`horizon-control`, `horizon-agent`, `horizon` all
# use it), so this pulls in nothing new to the dependency graph.
serde_json = "1.0"
# The board subcommands make async rtc calls to `horizon-logd` (via
# `horizon-board::Store`'s async write methods). The CLI is a plain
# synchronous process, so `run_board` owns the one tokio runtime.
tokio = { version = "1.52", features = ["rt", "net", "time"] }
# `horizon mcp board` serves the board's tools to an agent session as an MCP
# server over stdio.
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-io"] }

[dev-dependencies]
# The board MCP server's test speaks to it as an agent's client does.
rmcp = { version = "3.9.0", default-features = false, features = ["client"] }
tempfile = "3"

[lints]
workspace = true
