[package]
name = "horizon-wiki-flow"
version = "0.1.0"
edition = "2024"

[dependencies]
horizon-agent = { path = "../horizon-agent" }
horizon-agent-host = { path = "../horizon-agent-host" }
horizon-wiki = { path = "../horizon-wiki" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
crossbeam-channel = "0.5"
horizon-agent-host = { path = "../horizon-agent-host", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1.52", features = ["rt", "macros", "time"] }

[lints]
workspace = true
