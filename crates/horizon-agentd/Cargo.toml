[package]
name = "horizon-agentd"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
horizon-agent = { path = "../horizon-agent" }
horizon-config = { path = "../horizon-config" }
horizon-sandbox = { path = "../horizon-sandbox" }
horizon-wire = { path = "../horizon-wire" }
remoc = { workspace = true }
serde_json = "1.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
# No terminal crate here, not even as a dev-dependency
# (docs/runtime-crate-alignment-design.md phase 2 acceptance): the union
# wire-schema artifact that used to force one is now two artifacts, each
# generated beside the runtime crate that owns its hub. `schemars` and
# `termwiz` left with that generator -- nothing else here used them.
tempfile = "3"
# Enables the `mock.approval_required` / `mock.boundary_crossing` test
# fixtures in `horizon-agent`'s tool catalog so agentd's own unit tests
# and the e2e integration suite can exercise approval/boundary-crossing
# paths without those tools ever being advertised to a real provider.
horizon-agent = { path = "../horizon-agent", features = ["test-fixtures"] }
# The shared daemon-process helpers `tests/e2e.rs` uses -- binary
# resolution, spawn-with-retry, and the one definition of this daemon's
# hermetic-spawn contract that terminald's suite also spawns through.
horizon-daemon-testkit = { path = "../horizon-daemon-testkit" }

[lints.clippy]
all = { level = "warn", priority = -1 }
