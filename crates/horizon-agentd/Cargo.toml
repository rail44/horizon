[package]
name = "horizon-agentd"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
horizon-agent = { path = "../horizon-agent" }
horizon-config = { path = "../horizon-config" }
horizon-sandbox = { path = "../horizon-sandbox" }
horizon-session-protocol = { path = "../horizon-session-protocol" }
remoc = { workspace = true }
serde_json = "1.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
# The wire-schema artifact generator/drift test (`tests/wire_schema.rs`).
# It documents *both* daemons' hubs in one artifact, so it still needs the
# terminal vocabulary even though this crate stopped hosting terminals in
# v17 (`docs/terminald-split-design.md`) -- a dev-dependency, so the shipped
# `horizon-agentd` binary links none of it.
horizon-terminal-core = { path = "../horizon-terminal-core" }
schemars = { version = "1", features = ["uuid1"] }
tempfile = "3"
termwiz = { version = "0.23.3", features = ["use_serde"] }
# Enables the `mock.approval_required` / `mock.boundary_crossing` test
# fixtures in `horizon-agent`'s tool catalog so sessiond's own unit tests
# and the e2e integration suite can exercise approval/boundary-crossing
# paths without those tools ever being advertised to a real provider.
horizon-agent = { path = "../horizon-agent", features = ["test-fixtures"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
