# Horizon's config-file loader (config.toml: agent, provider, terminal,
# theme, keybindings), extracted framework-free so both shells share one
# loader — see docs/gpui-migration-design.md (the M5 config port).
[package]
name = "horizon-config"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# `preserve_order`: `[[providers]]` entries (and their `models`) are read in
# the file's own order, and the model picker shows model ids in listed order.
# `models` is a plain array now, so TOML keeps document order natively and
# the flag is no longer load-bearing for it; it stays until its remaining
# users are audited. indexmap is already in the dependency graph.
toml = { version = "1", features = ["preserve_order"] }
# `[grants]` validation only: the "which absolute paths are too broad to
# hand out as a writable tree" rule is one security predicate, and the
# sandbox crate that enforces it at spawn time owns it
# (`horizon_sandbox::is_overbroad_tree`). Duplicating the list here so this
# crate could stay dependency-free would let the file-validation and
# enforcement halves drift apart silently. No sandbox type appears in this
# crate's own public surface -- see `grants`' module doc.
horizon-sandbox = { path = "../horizon-sandbox" }

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
uuid = { version = "1.18", features = ["v4"] }
