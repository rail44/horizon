# What the wiki gives agents (docs/project-wiki-design.md): the page
# tools, the role a comment thread's session runs with, the input that
# hands a comment to it, the ids that tie a thread to its session, and the
# skill that maintains the wiki. Plain data and functions over
# `horizon-wiki`, which a composition root wraps: `horizon-agentd`
# registers them with `horizon-agent`. Apart from the wiki itself, so that
# what only reads and draws a page (the wiki's view) has none of it.
[package]
name = "horizon-wiki-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
horizon-wiki = { path = "../horizon-wiki" }
# The page tools' result types derive their schemas, from which the agent
# catalog renders each tool's field legend (horizon-agent's output_legend).
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4", "v5", "serde"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = { level = "warn", priority = -1 }
