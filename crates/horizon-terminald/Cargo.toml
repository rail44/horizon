[package]
name = "horizon-terminald"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
# This daemon's whole wire -- the `TerminalHub` rtc trait, its version
# pair, and the vocabularies its channels carry -- lives in the runtime
# crate it belongs to (docs/runtime-crate-alignment-design.md judgment 3),
# so there is no union protocol crate dragging the agent graph in behind it.
horizon-terminal-core = { path = "../horizon-terminal-core" }
# The domain-free foundation: codec pin, size caps, negotiation, the shared
# `HubError`, and the socket-path convention that used to be parked in
# `horizon-agent` -- which is why no agent crate is named here (see this
# crate's `main` module doc's dependency-graph note).
horizon-wire = { path = "../horizon-wire" }
portable-pty = "0.9.0"
remoc = { workspace = true }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
# The shared daemon-process helpers both test binaries here use. Crucially it
# also owns `horizon-agentd`'s hermetic-spawn contract, so the acceptance
# test's agentd is spawned by the same definition agentd's own suite uses
# rather than a copy that can silently fall behind it.
horizon-daemon-testkit = { path = "../horizon-daemon-testkit" }
termwiz = { version = "0.23.3", features = ["use_serde"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
