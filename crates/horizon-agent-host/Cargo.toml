[package]
name = "horizon-agent-host"
version = "0.1.0"
edition = "2024"

[features]
# Fixtures the composed extensions' own tests build their host state with.
test-support = []

[dependencies]
rmcp = { version = "3.9.0", default-features = false, features = ["client", "transport-child-process"] }
agent-client-protocol = { workspace = true }
anyhow = "1.0"
crossbeam-channel = "0.5"
horizon-agent = { path = "../horizon-agent" }
horizon-config = { path = "../horizon-config" }
horizon-control = { path = "../horizon-control" }
horizon-sandbox = { path = "../horizon-sandbox" }
notify = "8"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
# Enables the `mock_approval_required` / `mock_boundary_crossing` test
# fixtures in `horizon-agent`'s tool catalog so the host's unit tests can
# exercise approval/boundary-crossing paths without those tools ever being
# advertised to a real provider.
horizon-agent = { path = "../horizon-agent", features = ["test-fixtures"] }

[lints]
workspace = true
