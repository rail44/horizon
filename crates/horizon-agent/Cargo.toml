[package]
name = "horizon-agent"
version = "0.1.0"
edition = "2021"

[features]
# Compile DuckDB from source instead of dynamically linking a prebuilt
# libduckdb. Slow (DuckDB is the single largest compile unit in this
# workspace) but needs no system library — use on machines without a
# prebuilt/distro libduckdb. See AGENTS.md "Build setup".
bundled-duckdb = ["duckdb/bundled"]
# Exposes the `mock.approval_required` and `mock.boundary_crossing` test
# fixtures in `tools::catalog::definitions`. Off in production builds so
# these tools are never advertised to a real model provider. Tests inside
# `horizon-agent` get them automatically via `cfg(test)`; downstream crates
# that need them for integration tests can enable this feature in their
# dev-dependencies.
test-fixtures = []

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
crossbeam-channel = "0.5"
dom_smoothie = "0.18"
duckdb = { version = "1" }
futures-util = "0.3"
globset = "0.4"
horizon-sandbox = { path = "../horizon-sandbox" }
horizon-sandbox-proxy = { path = "../horizon-sandbox-proxy" }
# `contract::SessionId` re-exports `horizon_wire::SessionId`; the socket-path
# conventions this crate used to host live there now too
# (docs/runtime-crate-alignment-design.md judgment 2).
horizon-wire = { path = "../horizon-wire" }
ignore = "0.4"
libc = "0.2"
regex = "1"
# The `wire::hub` module only: the `SessionHub` rtc trait and the channel
# halves its replies carry (docs/runtime-crate-alignment-design.md judgment
# 3 -- the hub lives with the runtime that owns it). The vocabulary types
# themselves stay serde-plain and remoc-free.
remoc = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rig-core = "0.39.0"
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "signal", "time"] }
tokio-util = "0.7"
tracing = "0.1"
toml = "0.8"
uuid = { version = "1.18", features = ["v4", "serde"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
