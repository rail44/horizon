# nextest configuration -- see https://nexte.st/docs/configuration for the
# full schema.

# The two daemon `e2e` integration test binaries
# (crates/horizon-agentd/tests/e2e.rs, crates/horizon-terminald/tests/e2e.rs)
# spawn a real daemon child process per test -- terminald's spawn real PTYs
# backed by a real shell, and its acceptance test spawns *both* daemons. Under
# nextest's default per-binary parallelism, that means dozens of real
# processes (and, in the terminal tests, real PTYs) all competing for CPU at
# once, racing wall-clock timeouts against both each other *and* whatever
# else happens to be running on the machine (a concurrent `cargo build`, a
# sibling worker's own gate run, ...). This tripped the merge gate at least
# 6 times on 2026-07-12 alone (`docs/tasks/backlog.md` #27, #28: an empty
# `session_load` replay racing a resumed session's own startup work, and a
# real-PTY terminal test's fixed timeout). Real per-test fixes (generous
# poll ceilings instead of tight fixed timeouts, a production timeout bump)
# landed alongside this config, but given the repeated merge-tax history
# this test-group is deliberate belt-and-braces on top of those: serializing
# the binary's tests against *each other* removes self-contention entirely
# as a variable, even though it can't do anything about contention from
# processes outside this nextest invocation.
# One shared group across both binaries, deliberately: they contend for the
# same CPU and (in the acceptance test) for each other's daemons, so
# serializing them against each other -- not just within each binary -- is
# what removes self-contention as a variable.
[[profile.default.overrides]]
filter = 'binary_id(horizon-agentd::e2e) + binary_id(horizon-terminald::e2e) + binary_id(horizon-logd::e2e)'
test-group = 'daemon-e2e'

[test-groups.daemon-e2e]
max-threads = 1

# `sandboxed` -- the profile an agent session running inside Horizon's own
# sandbox can honestly run (`cargo nextest run --profile sandboxed
# --workspace --locked`). It excludes exactly the tests whose *subject
# matter* is the host boundary the sandbox exists to enforce: they bind
# real sockets, write to literal `/tmp`, need directories outside any
# repository, or spawn a real `horizon-agentd`. Under containment those
# cannot pass, and making them pass would mean removing the containment
# they verify -- so a sandboxed session skips them and the integrator's
# full gate (`profile.default`) runs them (`docs/issues/010`).
#
# `binary_id(horizon-terminald::e2e)` joins that list for the same reason as
# agentd's: it binds real sockets under /tmp and spawns real daemon
# processes (its acceptance test spawns both daemons and drains one), none of
# which a contained session can do.
#
# Filed from session aa95e066 (2026-07-28), which spent 92 rounds -- 21.6%
# of the run -- growing a hand-rolled 30-term exclusion list one failure at
# a time before the operator stopped it
# (`docs/research/agent-harness-findings-97-2026-07-28.md`).
#
# Deliberately NOT excluded: anything that merely *failed* in that session.
# Several failures there were the shared-build-dir stale-artifact problem
# (backlog 43/66), not containment; excluding those would hide real
# regressions. If a test outside this list fails in a sandboxed session,
# it is a finding, not noise.
#
# --- 2026-08 expansion: 33 failures observed running the sandboxed profile
# inside containment. Each is the host boundary the sandbox enforces; the
# integrator's full gate runs all of them outside containment. Grouped by
# mechanism with the observed failure mode, so the next reader can tell
# signal from noise.
#
# Control-plane Unix-socket IPC -- `binary_id(horizon-cli::integration)` and
# `test(/^host::listener::tests::/)`. The CLI integration tests bind a stub
# `UnixListener` speaking `horizon_control::wire`, and the listener tests bind
# the real listener -- both at `std::env::temp_dir()`. Under containment
# $TMPDIR is provisioned under this session's (deep) worktree, so the socket
# path exceeds SUN_LEN and `bind()` fails with `InvalidInput` ("path must be
# shorter than SUN_LEN") before the sandbox even sees the call. Outside
# containment all pass. (Two `horizon-cli::integration` cases --
# `a_socket_with_no_listener_is_a_clear_connection_error_not_a_panic` and
# `usage_error_exits_with_code_two` -- don't bind and would pass, but ride along
# with the whole integration binary; the full gate covers them.)
#
# Linux helper authenticated-report transport --
# `(binary_id(horizon-sandbox-runtime) & test(/^report::tests::/))`. Both tests
# create the production `SOCK_SEQPACKET` Unix socketpair used between Horizon
# and the sandbox helper. The outer sandbox refuses that `socketpair` with
# EPERM; the integrator's full gate exercises the credential-authenticated
# round trip outside containment.
#
# The sandbox's own boundary enforcer -- `binary_id(horizon-sandbox::linux_supervised_helper)`
# and `(binary_id(horizon-sandbox-proxy) & test(/^tests::/))`.
# `linux_supervised_helper` spawns a real `horizon-sandbox-helper` that installs
# a combined seccomp listener -- under the outer sandbox that fails with EBUSY
# (a sandbox cannot nest another sandbox under itself); several cases
# additionally bind a TCP proxy endpoint the sandbox refuses.
# `horizon-sandbox-proxy` `tests::*` bind a real loopback TCP origin/proxy the
# sandbox denies (Permission denied on `127.0.0.1:0`). Scoped to `tests::*`
# because the crate's `allowlist::tests`/`handler::tests` are pure logic and
# pass under containment.
#
# Exa adapter loopback mock -- `test(/exa_adapter_uses_the_fixed_post_contract_and_normalizes_results$/)`. Spawns a loopback TCP mock server (`127.0.0.1:0`) for the
# adapter to talk to; the sandbox denies loopback binds, so it fails at
# `TcpListener::bind` (Permission denied) before any adapter logic runs. Not a
# real Exa network call -- a localhost mock stopped by the loopback bind denial.
#
# agentd's SIGTERM flush test --
# `(binary_id(horizon-agentd::bin/horizon-agentd) & test(/^tests::sigterm_/))`.
# It drives the real `run` accept loop, so it binds a real `UnixListener`
# under `std::env::temp_dir()` -- the same SUN_LEN mechanism that excludes
# `host::listener::tests` above: containment provisions $TMPDIR under this
# session's (deep) worktree and `bind()` fails with `InvalidInput` before the
# sandbox is even consulted. Raising SIGTERM at itself is fine under
# containment; only the socket is.
#
# `suggest_grants` system-root assumption --
# `test(/attempts_with_nothing_in_common_fall_back_to_per_attempt_grants/)`. Relies on two `temp_dir` siblings sharing only a system root as their common
# ancestor (so no honest shared tree exists and per-attempt grants are
# returned). Under containment $TMPDIR lives under the workspace, so the
# siblings' common ancestor is a normal directory and `suggest_grants`
# (correctly) offers it as one shared `DirectoryTree` grant -- the
# `grants.len() >= 2` assertion then fails. The logic is right; the test needs
# $TMPDIR to be /tmp (system-rooted), which containment cannot provide. Same
# family as the `outside_a_*_repository` skips (needs a dir outside the repo).
#
# `loopback_connect` boundary tests -- `test(/^loopback_connect_grant_/)` in
# `binary_id(horizon-sandbox::linux_supervised_helper)`. These spawn a real
# sandboxed helper, bind real loopback TCP listeners, and assert the
# seccomp-notify enforcement layer connects to the granted endpoint while
# denying non-granted ports and all binds. Under containment the sandbox
# cannot nest another sandbox (EBUSY) and the loopback binds are refused --
# the integrator's full gate runs them outside containment.
#
# macOS setuid-exec denial --
# `test(/bash_child_runs_at_the_configured_niceness_or_falls_back_gracefully$/)`.
# Reads the child's nice value back via `/bin/ps`, which is setuid on macOS
# (`-rwsr-xr-x`), and the Seatbelt profile denies exec'ing setuid binaries:
# the child dies with `bash: /bin/ps: Operation not permitted` (exit 126)
# before the assertion even runs. Reproduced with the workspace's changes
# stashed (2026-09-07), so it is the containment boundary, not a regression.
# The nice-value behavior itself is covered by the integrator's full gate.
#
# The macOS unified-log denial collector's sampler data source --
# `test(/process_table_snapshot_is_available$/)` (2026-09-10,
# `docs/macos-containment-denial-reporting-design.md`). The sampler shells
# out to `/bin/ps` for the pid/pgid table; under containment that read is
# refused (process-table visibility is exactly a host boundary the sandbox
# enforces), so the collector's own soft-degrade path ("nothing new this
# tick") is what runs, and the snapshot assertion cannot pass. The other
# `macos::denials` tests are pure parsing/mapping logic and stay in.
#
# milestone::git fixture commits through the proto git shim --
# `(binary_id(horizon-agentd::bin/horizon-agentd) & test(/^milestone::git::tests::(actual_changed_paths_must_fit_the_declared_scope|dirty_main_and_changed_candidates_are_preserved|main_advancing_requires_new_combined_verification_and_merge_is_recoverable)$/))`
# (2026-09-16). These build a fixture repo and run a real `git commit`; on
# this machine `git` is wrapped by the proto toolchain shim, which fetches
# `https://nodejs.org/download/release/index.json` and writes
# `~/.proto/cache/requests-v2/content-v2/...` during the commit. Containment
# denies both (the run's denial log shows the proxy/DNS refusals and the
# cache-build failure), so fixture setup dies before any assertion runs.
# Only the three commit-flavored tests fail; the module's other tests are
# pure logic and stay in. The integrator's full gate runs them outside
# containment.
#
# Provider adapter contract tests bind a loopback HTTP/SSE mock and run in
# the default profile; containment denies the listener.
#
# The cap-summary request test also binds a loopback mock provider to inspect
# the actual tools sent over HTTP. It runs in the default profile.
#
# `/models` limit-discovery loopback mock --
# `test(/^providers::rig::model_limits::tests::(the_entrys_own_key_variable_authenticates_the_lookup|entries_differing_only_by_key_variable_do_not_share_an_answer|the_cached_answer_is_reused_for_the_same_entry|the_default_single_provider_setup_still_reads_openai_api_key|an_anthropic_entry_is_never_asked_for_an_openai_listing)$/)`
# (2026-09-20). Same mechanism as the Exa adapter mock above: each spawns a
# loopback `/models` server on `127.0.0.1:0` so the lookup's real request
# (and the API-key variable it authenticates with) can be inspected, and the
# sandbox denies loopback binds. No real provider call -- a localhost mock
# stopped at `TcpListener::bind`. The module's parsing tests are pure logic
# and stay in.
#
# `horizon`'s `runtime::tests::` -- the root package's test binary has the
# bare id `horizon` (its lib and bin share the name), NOT
# `horizon::bin/horizon`. That term matched no tests at all, so these
# socket-binding tests were never actually skipped and failed under
# containment with the SUN_LEN `InvalidInput` bind error at the
# $TMPDIR-under-the-worktree path (the same mechanism as
# `host::listener::tests` above). Corrected 2026-09-21 -- AGENTS.md's
# "the skip set is not self-maintaining".
# The auxiliary-client routing test binds two real HTTP listeners to check
# endpoint, key-variable, and reload behavior for both titles and judgments.
[profile.sandboxed]
default-filter = '''
    not (
        binary_id(horizon-agent::tier1_network_containment)
        + binary_id(horizon-agentd::e2e)
        + binary_id(horizon-terminald::e2e)
        + binary_id(horizon-logd::e2e)
        + (binary_id(horizon) & test(/^runtime::tests::/))
        + test(/^tools::network::/)
        + test(/^tools::tests::bash_auto_executes_sandboxed/)
        + test(/^tools::tests::tier1_sandboxed_bash/)
        + test(/^tools::tests::a_configured_grant_makes_an_out_of_workspace_write/)
        + test(/^tools::tests::approved_git_commit_writes_linked_metadata/)
        + test(/^tools::tests::judge_approved_filesystem_retry_reruns_sandboxed/)
        + test(/^tools::tests::an_approved_filesystem_retry_closes_the_abandoned_attempt_as_superseded/)
        + test(/^session::setup::tests::isolation_announcement::/)
        + test(/^worktree::tests::create_isolated_worktree_branches/)
        + test(/outside_a_git_repository$/)
        + test(/outside_any_repository_is_none$/)
        + binary_id(horizon-cli::integration)
        + test(/^host::listener::tests::/)
        + (binary_id(horizon-sandbox-runtime) & test(/^report::tests::/))
        + binary_id(horizon-sandbox::linux_supervised_helper)
        + (binary_id(horizon-sandbox-proxy) & test(/^tests::/))
        + test(/exa_adapter_uses_the_fixed_post_contract_and_normalizes_results$/)
        + test(/^providers::rig::completion::tests::provider_wire_contract_covers_both_adapters_and_rejections$/)
        + test(/^judge::client::tests::auxiliary_clients_keep_their_selected_endpoint_and_credentials$/)
        + test(/^providers::rig::session::turn::tests::cap_summary_request_disables_tools_without_changing_session_config$/)
        + test(/^providers::rig::model_limits::tests::(the_entrys_own_key_variable_authenticates_the_lookup|entries_differing_only_by_key_variable_do_not_share_an_answer|the_cached_answer_is_reused_for_the_same_entry|the_default_single_provider_setup_still_reads_openai_api_key|an_anthropic_entry_is_never_asked_for_an_openai_listing)$/)
        + test(/attempts_with_nothing_in_common_fall_back_to_per_attempt_grants$/)
        + test(/process_table_snapshot_is_available$/)
        + (binary_id(horizon-agentd::bin/horizon-agentd) & test(/^tests::sigterm_/))
        + (binary_id(horizon-sandbox::linux_supervised_helper) & test(/^loopback_connect_grant_/))
        + test(/bash_child_runs_at_the_configured_niceness_or_falls_back_gracefully$/)
        + (binary_id(horizon-agentd::bin/horizon-agentd) & test(/^milestone::git::tests::(actual_changed_paths_must_fit_the_declared_scope|dirty_main_and_changed_candidates_are_preserved|main_advancing_requires_new_combined_verification_and_merge_is_recoverable)$/))
    )
'''
