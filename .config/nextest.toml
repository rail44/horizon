# nextest configuration -- see https://nexte.st/docs/configuration for the
# full schema.

# The two daemon `e2e` integration test binaries
# (crates/horizon-agent-acp/tests/e2e.rs, crates/horizon-terminald/tests/e2e.rs)
# spawn a real daemon child process per test -- terminald's spawn real PTYs
# backed by a real shell, and its acceptance test spawns *both* daemons. Under
# nextest's default per-binary parallelism, that means dozens of real
# processes (and, in the terminal tests, real PTYs) all competing for CPU at
# once, racing wall-clock timeouts against both each other *and* whatever
# else happens to be running on the machine (a concurrent `cargo build`, a
# sibling worker's own gate run, ...). This tripped the merge gate at least
# 6 times on 2026-07-12 alone (`docs/tasks/backlog.md` #27, #28: an empty
# `session_load` replay racing a resumed session's own startup work, and a
# real-PTY terminal test's fixed timeout). Real per-test fixes (generous
# poll ceilings instead of tight fixed timeouts, a production timeout bump)
# landed alongside this config, but given the repeated merge-tax history
# this test-group is deliberate belt-and-braces on top of those: serializing
# the binary's tests against *each other* removes self-contention entirely
# as a variable, even though it can't do anything about contention from
# processes outside this nextest invocation.
# One shared group across both binaries, deliberately: they contend for the
# same CPU and (in the acceptance test) for each other's daemons, so
# serializing them against each other -- not just within each binary -- is
# what removes self-contention as a variable.
[[profile.default.overrides]]
# The shell's own tests over real daemons (`tests/terminald.rs`,
# `tests/agent_acp.rs`, `tests/board_logd.rs`) are in the group for the same
# reason: each starts a daemon and waits on it against a wall clock.
filter = 'binary_id(horizon-agent-acp::e2e) + binary_id(horizon-terminald::e2e) + binary_id(horizon-logd::e2e) + binary_id(horizon::terminald) + binary_id(horizon::agent_acp) + binary_id(horizon::board_logd)'
test-group = 'daemon-e2e'

# Three at once, not one (2026-11-19): one at a time, the group's 53 tests
# ran 36-37 s in sequence, and that sequence was what a full run took
# however many other tests ran beside it (about 38 s). At 2 a full run took
# 28-29 s, at 3 about 25 s, and at 4 or 6 no less; the group's slowest test
# took 10-12 s at 1, 2 or 3, far from the waits it races, and nothing
# failed. At 6 under a loaded machine the contention came back (the
# group's tests 107 s in all, its slowest 17 s, the run 46 s).
[test-groups.daemon-e2e]
max-threads = 3

# The shell's tests with wasm guests in them -- the extensions it comes with
# (`tests/extension.rs`, `tests/sessions.rs`, `tests/wiki.rs`,
# `tests/status_bar.rs`, `tests/image.rs`) and the
# preview's fixture (`tests/preview.rs`) -- each run 30 to 60 threads of
# their own: wasmtime compiles a component on a rayon pool, and
# wasmtime-wasi runs a tokio runtime of its own, each one thread per core.
# Many of them at once oversubscribe the machine: measured on 24 cores
# (2026-11-19), one such test takes about 1 s alone and 9-13 s among a full
# run, against its 20 s wait for the extensions, and the tests beside it
# slow down with it. The group lets only a few run at once.
[[profile.default.overrides]]
filter = 'binary_id(horizon::extension) + binary_id(horizon::sessions) + binary_id(horizon::wiki) + binary_id(horizon::preview) + binary_id(horizon::status_bar) + binary_id(horizon::image)'
test-group = 'wasm-guests'

[test-groups.wasm-guests]
max-threads = 4

# The preview's windowless checks (`tests/preview.rs`) run a real wasm
# guest, one of whose views never comes back on purpose. A guest that
# never comes back keeps the call into it from returning, so no in-test
# budget can catch it. A wall-clock kill is what turns that into a red test
# instead of a run that never finishes.
[[profile.default.overrides]]
filter = 'binary_id(horizon::preview)'
slow-timeout = { period = "60s", terminate-after = 3 }

# `sandboxed` -- the profile an agent session running inside Horizon's own
# sandbox can honestly run (`cargo nextest run --profile sandboxed
# --workspace --locked`). It excludes exactly the tests whose *subject
# matter* is the host boundary the sandbox exists to enforce: they bind
# real sockets, write to literal `/tmp`, need directories outside any
# repository, or spawn a real `horizon-agent-acp` (`tests/e2e.rs`: the
# tests about its process; how it behaves is `tests/agent.rs`, in the
# test's own process). Under containment those
# cannot pass, and making them pass would mean removing the containment
# they verify -- so a sandboxed session skips them and the integrator's
# full gate (`profile.default`) runs them (`docs/issues/010`).
#
# `binary_id(horizon-terminald::e2e)` joins that list for the same reason as
# the agent's: it binds real sockets under /tmp and spawns real
# processes (its acceptance test spawns terminald and the agent and restarts the agent), none of
# which a contained session can do.
#
# Filed from session aa95e066 (2026-07-28), which spent 92 rounds -- 21.6%
# of the run -- growing a hand-rolled 30-term exclusion list one failure at
# a time before the operator stopped it
# (`docs/research/agent-harness-findings-97-2026-07-28.md`).
#
# Deliberately NOT excluded: anything that merely *failed* in that session.
# Several failures there were the shared-build-dir stale-artifact problem
# (backlog 43/66), not containment; excluding those would hide real
# regressions. If a test outside this list fails in a sandboxed session,
# it is a finding, not noise.
#
# --- 2026-08 expansion: 33 failures observed running the sandboxed profile
# inside containment. Each is the host boundary the sandbox enforces; the
# integrator's full gate runs all of them outside containment. Grouped by
# mechanism with the observed failure mode, so the next reader can tell
# signal from noise.
#
# Control-plane Unix-socket IPC -- `binary_id(horizon-cli::integration)` and
# `test(/^host::listener::tests::/)`. The CLI integration tests bind a stub
# `UnixListener` speaking `horizon_control::wire`, and the listener tests bind
# the real listener -- both at `std::env::temp_dir()`. Under containment
# $TMPDIR is provisioned under this session's (deep) worktree, so the socket
# path exceeds SUN_LEN and `bind()` fails with `InvalidInput` ("path must be
# shorter than SUN_LEN") before the sandbox even sees the call. Outside
# containment all pass. (Two `horizon-cli::integration` cases --
# `a_socket_with_no_listener_is_a_clear_connection_error_not_a_panic` and
# `usage_error_exits_with_code_two` -- don't bind and would pass, but ride along
# with the whole integration binary; the full gate covers them.)
#
# The sandbox runtime -- `binary_id(horizon-sandbox::fence)`,
# `test(/^tools::tests::bash_auto_executes_sandboxed/)` and
# `test(/^tools::bash::tests::a_contained_call_reports_the_directory_it_moved_to$/)`
# start the real `fence` binary, whose bubblewrap cannot create its
# namespaces inside another sandbox.
#
# Exa adapter loopback mock -- `test(/exa_adapter_uses_the_fixed_post_contract_and_normalizes_results$/)`. Spawns a loopback TCP mock server (`127.0.0.1:0`) for the
# adapter to talk to; the sandbox denies loopback binds, so it fails at
# `TcpListener::bind` (Permission denied) before any adapter logic runs. Not a
# real Exa network call -- a localhost mock stopped by the loopback bind denial.
#
# macOS setuid-exec denial --
# `test(/bash_child_runs_at_the_configured_niceness_or_falls_back_gracefully$/)`.
# Reads the child's nice value back via `/bin/ps`, which is setuid on macOS
# (`-rwsr-xr-x`), and the Seatbelt profile denies exec'ing setuid binaries:
# the child dies with `bash: /bin/ps: Operation not permitted` (exit 126)
# before the assertion even runs. Reproduced with the workspace's changes
# stashed (2026-09-07), so it is the containment boundary, not a regression.
# The nice-value behavior itself is covered by the integrator's full gate.
#
# The macOS unified-log denial collector's sampler data source --
# `test(/process_table_snapshot_is_available$/)` (2026-09-10,
# `docs/macos-containment-denial-reporting-design.md`). The sampler shells
# out to `/bin/ps` for the pid/pgid table; under containment that read is
# refused (process-table visibility is exactly a host boundary the sandbox
# enforces), so the collector's own soft-degrade path ("nothing new this
# tick") is what runs, and the snapshot assertion cannot pass. The other
# `macos::denials` tests are pure parsing/mapping logic and stay in.
#
# Provider adapter contract tests bind a loopback HTTP/SSE mock and run in
# the default profile; containment denies the listener.
#
# The cap-summary request test also binds a loopback mock provider to inspect
# the actual tools sent over HTTP. It runs in the default profile.
#
# `/models` limit-discovery loopback mock --
# `test(/^providers::rig::model_limits::tests::(the_entrys_own_key_variable_authenticates_the_lookup|entries_differing_only_by_key_variable_do_not_share_an_answer|the_cached_answer_is_reused_for_the_same_entry|the_default_single_provider_setup_still_reads_openai_api_key|an_anthropic_entry_is_never_asked_for_an_openai_listing|a_listing_without_limits_defers_to_the_catalog)$/)`
# (2026-09-20). Same mechanism as the Exa adapter mock above: each spawns a
# loopback `/models` server on `127.0.0.1:0` so the lookup's real request
# (and the API-key variable it authenticates with) can be inspected, and the
# sandbox denies loopback binds. No real provider call -- a localhost mock
# stopped at `TcpListener::bind`. The module's parsing tests are pure logic
# and stay in.
#
# The shell's tests over real daemons -- `binary_id(horizon::terminald)`,
# `binary_id(horizon::agent_acp)`, `binary_id(horizon::board_logd)`. Each binds
# sockets under /tmp and spawns a real daemon (and `agent_acp` a loopback mock
# provider), as the daemons' own `e2e` binaries do.
#
# `horizon-shell-runtime`'s `tests::` -- the runtime clients' tests bind
# sockets, and fail under containment with the SUN_LEN `InvalidInput` bind
# error at the $TMPDIR-under-the-worktree path (the same mechanism as
# `host::listener::tests` above). They were the root package's
# `runtime::tests::` until the clients moved to a crate of their own.
# The auxiliary-client routing test binds two real HTTP listeners to check
# endpoint, key-variable, and reload behavior for both titles and judgments.
# Provider HTTP/SSE lifecycle tests (provider_wire_ prefix) bind loopback listeners
# for both adapters, including disconnect, timeout, retry and parallel calls.
# The decision client's loopback tests (`decision::client::tests::loopback_`)
# bind a `127.0.0.1:0` System One mock to inspect the real POST; the sandbox
# denies loopback binds.
# `worktree::tests::a_session_commits_in_its_own_worktree_and_reaches_no_hook_or_config`
# runs git under the real sandbox runtime to see a session commit in its own
# worktree and reach no hook or config; a sandbox cannot nest another one.
# The shell's view tests that show a terminal (`horizon::terminal`,
# `horizon::workspace`, `horizon::preview`, `horizon::extension`,
# `horizon::status_bar`) open a real PTY
# through `tests/support`'s `openpty`, which the sandbox denies before the test's
# own code runs ("failed to openpty: Operation not permitted"). They are boundary
# tests: they stay out of this profile and run in the default one.
# Continuation suite's loopback mock provider --
# `test(/^providers::rig::session::continuation::tests::(a_confident_model_answer_continues_the_turn_once_without_ending_it|continuations_stop_at_the_per_turn_cap|client_errors_and_timeouts_hand_back_with_a_fallback_reason|a_model_answer_below_the_threshold_hands_back|a_user_answer_hands_back|a_pending_stop_or_queued_addition_is_left_to_the_turn_loop|no_request_without_a_check_or_with_an_empty_reply)$/)`
# (2026-10-21). These drive a full turn against a fake SSE provider, so the
# module's `session()` helper binds a loopback listener on `127.0.0.1:0` and
# the sandbox denies the bind (Permission denied) before any turn logic runs --
# the same mechanism as the `/models` and Exa mocks above. The module's three
# remaining tests (`the_check_is_installed_only_with_a_decision_model_outside_exploration_roles`,
# `the_request_carries_the_state_and_one_choice_question`,
# `the_threshold_reads_from_its_variable_with_clamping_and_a_default`) are
# pure logic and stay in.
# `horizon-control`'s `client::tests` bind a Unix socket in the system's
# temporary directory, as `host::listener::tests` do.
# The agent's tests in the test's own process (`horizon-agent-acp::agent`)
# all run under containment: each passed (2026-11-26) under Fence with a
# session's settings, the worktree and `/tmp/horizon-sandbox/<id>` (its
# `TMPDIR`) writable and no host reachable.
[profile.sandboxed]
default-filter = '''
    not (
        binary_id(horizon-agent-acp::e2e)
        + binary_id(horizon-terminald::e2e)
        + binary_id(horizon-logd::e2e)
        + binary_id(horizon::terminald)
        + binary_id(horizon::agent_acp)
        + binary_id(horizon::board_logd)
        + (binary_id(horizon-shell-runtime) & test(/^tests::/))
        + test(/^tools::tests::bash_auto_executes_sandboxed/)
        + test(/^worktree::tests::a_session_commits_in_its_own_worktree/)
        + test(/^worktree::tests::create_isolated_worktree_branches/)
        + test(/outside_a_git_repository$/)
        + test(/outside_any_repository_is_none$/)
        + binary_id(horizon-cli::integration)
        + binary_id(horizon::terminal)
        + binary_id(horizon::workspace)
        + binary_id(horizon::preview)
        + binary_id(horizon::extension)
        + binary_id(horizon::status_bar)
        + test(/^host::listener::tests::/)
        + (binary_id(horizon-control) & test(/^client::tests::/))
        + binary_id(horizon-sandbox::fence)
        + test(/^tools::bash::tests::a_contained_call_reports_the_directory_it_moved_to$/)
        + test(/exa_adapter_uses_the_fixed_post_contract_and_normalizes_results$/)
        + test(/^providers::rig::completion::tests::provider_wire_/)
        + test(/^decision::client::tests::loopback_/)
        + test(/^judge::client::tests::auxiliary_clients_keep_their_selected_endpoint_and_credentials$/)
        + test(/^providers::rig::session::turn::tests::cap_summary_request_disables_tools_without_changing_session_config$/)
        + test(/^providers::rig::model_limits::tests::(the_entrys_own_key_variable_authenticates_the_lookup|entries_differing_only_by_key_variable_do_not_share_an_answer|the_cached_answer_is_reused_for_the_same_entry|the_default_single_provider_setup_still_reads_openai_api_key|an_anthropic_entry_is_never_asked_for_an_openai_listing|a_listing_without_limits_defers_to_the_catalog)$/)
        + test(/process_table_snapshot_is_available$/)
        + test(/bash_child_runs_at_the_configured_niceness_or_falls_back_gracefully$/)
        + test(/^providers::rig::session::continuation::tests::(a_confident_model_answer_continues_the_turn_once_without_ending_it|continuations_stop_at_the_per_turn_cap|client_errors_and_timeouts_hand_back_with_a_fallback_reason|a_model_answer_below_the_threshold_hands_back|a_user_answer_hands_back|a_pending_stop_or_queued_addition_is_left_to_the_turn_loop|no_request_without_a_check_or_with_an_empty_reply)$/)
    )
'''
