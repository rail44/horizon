[package]
name = "horizon-preview-plugin"
version = "0.1.0"
edition = "2021"
publish = false

# Its own sub-workspace: this crate is built for `wasm32-wasip2`, and the
# root workspace excludes it (`[workspace] exclude`) so a plain
# `cargo build --workspace` never tries to build it for the host.
[workspace]

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

# Everything the plugin shows lives in the shell library's `preview`
# module, which compiles for this target too; this crate is only the
# component's entry point.
[dependencies]
embedded_gpui = { git = "https://github.com/rail44/embedded_gpui", rev = "73858e5530433049b043f19676beea398a6b22d3" }
horizon = { path = ".." }

# The build profile for the edit-to-visible loop: optimized enough that
# wasmtime's compile of the component is quick (compiling it dominates the
# time from load to the first frame, and that tracks module size), without
# LTO's link cost on every rebuild. A debug component is ~370 MiB and takes
# seconds to compile in the host; an LTO release one rebuilds in ~50 s.
# `scripts/check-preview-plugin.sh` builds with `--profile quick`.
[profile.quick]
inherits = "release"
lto = false
opt-level = 2
